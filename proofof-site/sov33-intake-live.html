<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SOV33 Intake — Self-Assessment</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0e14;color:#c5cdd9;font-family:ui-monospace,SFMono-Regular,monospace;margin:0;padding:24px}h1{color:#7dd3fc;margin:0 0 4px 0}.sub{color:#9ca3af;font-size:12px;margin-bottom:24px}.q{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:10px}.q .pillar{color:#a78bfa;font-size:10px;text-transform:uppercase}.q .text{color:#c5cdd9;font-size:13px;margin:6px 0}.q .opts{display:flex;gap:6px}.q .opts button{background:#0a0e14;color:#c5cdd9;border:1px solid #1f2937;padding:6px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}.q .opts button.sel{background:#1e3a8a;color:#7dd3fc;border-color:#7dd3fc}.score{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:20px;margin-top:16px;text-align:center}.score .v{color:#7dd3fc;font-size:48px;font-weight:700}.score .g{font-size:16px;margin-top:8px;font-weight:700}.g.SOVEREIGN{color:#10b981}.g.STRONG{color:#3b82f6}.g.WORKING{color:#fbbf24}.g.DEVELOPING{color:#ef4444}</style></head><body><h1>📋 SOV33 Intake</h1><div class="sub">12-question sovereign readiness · 8 pillars · 4 grades</div><div id="qs"></div><div class="score"><div class="v" id="pct">--</div><div class="g" id="grade">AWAITING</div></div><button onclick="submit()" style="display:block;margin:16px auto;background:#1e3a8a;color:#7dd3fc;padding:10px 24px;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px">Submit → Score</button><script>let A={};const QS=[{id:'i01',p:'Honor',t:'Charter Article 0 binding?'},{id:'i02',p:'Safety',t:'Care Floor 0.95 gated?'},{id:'i03',p:'Verifiability',t:'SIGIL Ed25519 anchored?'},{id:'i04',p:'Justice',t:'BFT quorum real (not hardcoded)?'},{id:'i05',p:'Auditability',t:'No T-count aggregate claims?'},{id:'i06',p:'Safety',t:'No biometric surface?'},{id:'i07',p:'Openness',t:'4 substrates MIT/CC0/open?'},{id:'i08',p:'Transparency',t:'Honest register published?'},{id:'i09',p:'Continuity',t:'2-sentence consciousness rule?'},{id:'i10',p:'Auditability',t:'REACH framing (not params)?'},{id:'i11',p:'Resilience',t:'PDCA sandbox human-ratified?'},{id:'i12',p:'Equity',t:'Fee-for-service only?'}];document.getElementById('qs').innerHTML=QS.map(q=>`<div class="q"><div class="pillar">${q.p} · ${q.id}</div><div class="text">${q.t}</div><div class="opts">${[1,2,3,4,5].map(n=>`<button onclick="pick('${q.id}',${n})" id="${q.id}-${n}">${n}</button>`).join('')}</div></div>`).join('');function pick(id,n){A[id]=n;QS.forEach(q=>{[1,2,3,4,5].forEach(m=>document.getElementById(`${q.id}-${m}`).classList.remove('sel'));document.getElementById(`${id}-${n}`).classList.add('sel')})}async function submit(){if(Object.keys(A).length<12)return alert('Answer all 12');const r=await fetch('/api/intake/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:A})}).then(r=>r.json());document.getElementById('pct').textContent=r.pct+'%';const g=document.getElementById('grade');g.textContent=r.grade;g.className='g '+r.grade.split(' ')[0]}</script></body></html>
