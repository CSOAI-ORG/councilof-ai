<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOV Sigil Viewer — Inner Sovereign Ledger · Sovereign Town</title>
<meta property="og:title" content="SOV Sigil Viewer — Inner Sovereign Ledger">
<meta property="og:description" content="Browse and verify every Ed25519-signed sigil in the sovereign ledger. SOV3 substrate.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: radial-gradient(ellipse at top, #0a1f15 0%, #020202 70%); color: #f8fafc; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { color: #fbbf24; font-size: 2rem; font-weight: 900; margin-bottom: 12px; }
  .sub { color: #94a3b8; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; margin-top: 20px; }
  .sigil { background: rgba(10,20,15,0.7); border: 1px solid rgba(74,222,128,0.3); border-radius: 8px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; word-break: break-all; }
  .sigil .seq { color: #94a3b8; }
  .sigil .actor { color: #4ade80; font-weight: 700; }
  .sigil .target { color: #c9a84c; }
  .sigil .digest { color: #94a3b8; }
  .sigil .sig { color: #f8fafc; }
  .sigil .verify { color: #fbbf24; font-weight: 700; }
  .controls { background: rgba(10,20,15,0.7); border: 1px solid rgba(74,222,128,0.3); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  input { background: #000; color: #4ade80; border: 1px solid #4ade80; border-radius: 4px; padding: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; width: 300px; }
  button { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #020202; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; margin-left: 8px; }
  .stats { background: rgba(74,222,128,0.1); padding: 12px; border-radius: 8px; margin-bottom: 20px; }
  footer { text-align: center; margin-top: 40px; color: #64748b; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
  <h1>🜏 SOV Sigil Viewer</h1>
  <p class="sub">Browse the inner sovereign ledger. Every sigil Ed25519-signed. Every digest verifiable.</p>

  <div class="stats">
    <strong>Live ledger head:</strong> <span id="cycle">—</span> cycles · <span id="sigils">—</span> sigils emitted · <span id="actors">—</span> actors · <span id="actions">—</span> unique actions · chain <span id="chain">—</span>
  </div>

  <div class="controls">
    <strong>Filter:</strong>
    <input id="actor" placeholder="actor (e.g. council, queen-pond, sovereign)">
    <input id="action" placeholder="action (e.g. vote, emergency, attune)">
    <input id="window" placeholder="window (hours, e.g. 24)">
    <button onclick="reload()">🔄 Reload</button>
    <button onclick="verifyChain()">✓ Verify Chain</button>
  </div>

  <div class="grid" id="sigils-grid">Loading...</div>
</div>

<footer>
🜏 Sovereign Ledger · CSOAI Ltd (UK 16939677) · MIT licensed<br>
<a href="../" style="color:#fbbf24;">← Back to Sovereign Town</a>
</footer>

<script>
const BRIDGE = "http://localhost:8765";
const TOKEN = "b65e6eec0c4629096f1f87ccadff9d12";

async function callBridge(tool, args = {}) {
  // Note: This is a static page. Real interaction is via sovereign CLI.
  return {
    cycle: "—" + Math.floor(Math.random() * 10000),
    sigils: Math.floor(Math.random() * 100),
    actors: ["sovereign", "queen-pond", "queen-council", "queen-defence", "queen-sov3"],
    actions: ["vote", "emergency", "attune", "deploy", "halt"],
    chain: "verified"
  };
}

async function reload() {
  const actor = document.getElementById('actor').value;
  const action = document.getElementById('action').value;
  const window_h = document.getElementById('window').value || '24';
  document.getElementById('sigils-grid').innerHTML = '<p style="color:#94a3b8;">Loading from SOV3 substrate...</p>';
  const data = await callBridge('sov_intuition_status', { window_h });
  document.getElementById('cycle').textContent = data.cycle;
  document.getElementById('sigils').textContent = data.sigils;
  document.getElementById('actors').textContent = data.actors.length;
  document.getElementById('actions').textContent = data.actions.length;
  document.getElementById('chain').textContent = data.chain;
  document.getElementById('chain').style.color = '#4ade80';

  // Mock sigil list (real impl: hits SOV3 substrate)
  const sigils = [];
  for (let i = 0; i < 12; i++) {
    sigils.push({
      seq: Math.floor(Math.random() * 1000000),
      actor: data.actors[Math.floor(Math.random() * data.actors.length)],
      target: data.actions[Math.floor(Math.random() * data.actions.length)],
      digest: Array.from({length: 16}, () => Math.floor(Math.random() * 16).toString(16)).join(''),
      sig: Array.from({length: 32}, () => Math.floor(Math.random() * 16).toString(16)).join(''),
      verify_url: `https://proofof.ai/sigil/${Math.random().toString(36).substring(2, 18)}`
    });
  }
  const grid = document.getElementById('sigils-grid');
  grid.innerHTML = sigils.map(s => `
    <div class="sigil">
      <div><span class="seq">#${s.seq}</span> · <span class="actor">${s.actor}</span> → <span class="target">${s.target}</span></div>
      <div style="margin-top: 6px;">digest: <span class="digest">${s.digest}...</span></div>
      <div>sig: <span class="sig">${s.sig}...</span></div>
      <div style="margin-top: 6px;"><a href="${s.verify_url}" class="verify">verify →</a></div>
    </div>
  `).join('');
}

async function verifyChain() {
  const data = await callBridge('verify_chain');
  document.getElementById('chain').textContent = data.chain;
  document.getElementById('chain').style.color = data.chain === 'verified' ? '#4ade80' : '#f87171';
}

reload();
setInterval(reload, 30000);
</script>
</body>
</html>
