<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SOV33 SovSpace Gallery — World Simulations</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0e14;color:#c5cdd9;font-family:ui-monospace,SFMono-Regular,monospace;margin:0;padding:24px}h1{color:#7dd3fc;margin:0 0 4px 0}.sub{color:#9ca3af;font-size:12px;margin-bottom:24px}.world{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:12px;border-left:3px solid #10b981}.world .id{color:#7dd3fc;font-weight:700;font-size:14px}.world .meta{color:#9ca3af;font-size:11px;margin-top:4px}.world .sigil{color:#a78bfa;font-size:10px;margin-top:6px;word-break:break-all}.controls{display:flex;gap:8px;margin:16px 0}.controls button{background:#111827;color:#7dd3fc;border:1px solid #1f2937;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit}.controls button:hover{background:#1e3a8a}</style></head><body><h1>🌍 SovSpace Gallery</h1><div class="sub">Spawned worlds · SIGIL-anchored · Observe to see deltas</div><div class="controls"><button onclick="spawn()">+ Spawn World</button><button onclick="load()">↻ Refresh</button></div><div id="worlds"></div><script>async function load(){const r=await fetch('/api/sovspace/state').then(r=>r.json());document.getElementById('worlds').innerHTML=r.world_ids&&r.world_ids.length?r.world_ids.map(id=>`<div class="world"><div class="id">${id}</div><div class="meta">Registered in SovSpace</div></div>`).join(''):'<div style="color:#9ca3af;padding:16px">No worlds spawned yet. Click "Spawn World" to create one.</div>'}async function spawn(){const r=await fetch('/api/sovspace/spawn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Gallery-World-'+Date.now(),world_kind:'exploration',axiom:'Charter Article 0',creator:'Hub-Visitor'})}).then(r=>r.json());load()}load()</script></body></html>
