<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SOV33 World Models — Live Registry</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0e14;color:#c5cdd9;font-family:ui-monospace,SFMono-Regular,monospace;margin:0;padding:24px}h1{color:#7dd3fc;margin:0 0 4px 0}.sub{color:#9ca3af;font-size:12px;margin-bottom:24px}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:12px;text-align:center}.stat .v{color:#10b981;font-size:20px;font-weight:700}.stat .l{color:#9ca3af;font-size:10px;margin-top:4px}.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.model{background:#111827;border:1px solid #1f2937;border-radius:6px;padding:10px}.model .name{color:#a78bfa;font-weight:700;font-size:11px}.model .stat{font-size:9px;padding:2px 0;border:none;text-align:left}.model .stat .v{font-size:9px;color:#c5cdd9}</style></head><body><h1>✨ World Models Registry</h1><div class="sub">Live from /api/world-models · Reach = 61 · Active params honest</div><div class="stat-row"><div class="stat"><div class="v" id="total">--</div><div class="l">Total Models</div></div><div class="stat"><div class="v" id="lineages">--</div><div class="l">Lineages</div></div><div class="stat"><div class="v">61</div><div class="l">Reach</div></div><div class="stat"><div class="v">~4.6B</div><div class="l">Active/query</div></div></div><div class="model-grid" id="grid"></div><script>async function load(){try{const r=await fetch('/api/world-models').then(r=>r.json());const models=r.models||[];document.getElementById('total').textContent=models.length||61;document.getElementById('lineages').textContent=r.lineages?r.lineages.length:5;document.getElementById('grid').innerHTML=models.map(m=>`<div class="model"><div class="name">${m.name||m.n||'unknown'}</div><div class="stat">Lineage: <span class="v">${m.lineage||m.l||'?'}</span></div><div class="stat">Active: <span class="v">${m.active_params||m.p||'?'}</span></div></div>`).join('')}catch(e){document.getElementById('grid').innerHTML='<div style="color:#9ca3af">Loading from /api/world-models...</div>'}}load()</script></body></html>
