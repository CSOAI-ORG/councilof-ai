<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>BFT-33 Live — Real-Time Council Voting</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0e14;color:#c5cdd9;font-family:ui-monospace,SFMono-Regular,monospace;margin:0;padding:24px}h1{color:#7dd3fc;margin:0 0 4px 0}.sub{color:#9ca3af;font-size:12px;margin-bottom:24px}.council{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:16px 0}.voter{background:#111827;border:1px solid #1f2937;border-radius:4px;padding:6px;text-align:center;font-size:9px}.voter .n{color:#7dd3fc;font-weight:700;font-size:12px}.voter .l{color:#9ca3af;font-size:8px;margin-top:2px}.voter.Qwen{border-left:2px solid #10b981}.voter.Llama{border-left:2px solid #3b82f6}.voter.Mistral{border-left:2px solid #fbbf24}.voter.DeepSeek{border-left:2px solid #ef4444}.voter.Gemma{border-left:2px solid #a855f7}.quorum{background:#0a0e14;border:2px solid #10b981;border-radius:8px;padding:16px;margin:16px 0;text-align:center}.quorum .big{color:#10b981;font-size:36px;font-weight:700}.quorum .label{color:#9ca3af;font-size:12px}</style></head><body><h1>⚖️ BFT-33 Live</h1><div class="sub">Real-time canonical 33-voter council · 23/33 quorum · f_bft=10</div><div class="quorum"><div class="big">23 / 33</div><div class="label">Quorum threshold · derived from f_bft=(33-1)/3=10</div></div><div class="council" id="council"></div><script>const LINEAGES=["Qwen","Llama","Mistral","DeepSeek","Gemma"];const TEMPS=[0,0.3,0.7,1];document.getElementById('council').innerHTML=Array.from({length:33},(_,i)=>`<div class="voter ${LINEAGES[i%5]}"><div class="n">#${String(i+1).padStart(2,'0')}</div><div class="l">${LINEAGES[i%5]}</div><div class="l">T=${TEMPS[i%4]}</div></div>`).join('')</script></body></html>
