<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SOV33 Sovereign Checkup — Live Health</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0e14;color:#c5cdd9;font-family:ui-monospace,SFMono-Regular,monospace;margin:0;padding:24px}h1{color:#7dd3fc;margin:0 0 4px 0}.sub{color:#9ca3af;font-size:12px;margin-bottom:24px}.layers{display:grid;gap:8px}.layer{background:#111827;border-left:4px solid #1f2937;border-radius:0 8px 8px 0;padding:14px 16px;display:grid;grid-template-columns:50px 1fr 80px;gap:16px;align-items:center}.layer .n{color:#7dd3fc;font-size:18px;font-weight:700;text-align:center}.layer h3{color:#a78bfa;margin:0;font-size:13px}.layer .desc{color:#9ca3af;font-size:11px;margin-top:3px}.badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700}.badge.live{background:#064e3b;color:#10b981}.badge.partial{background:#78350f;color:#fbbf24}.l0,.l1,.l2,.l3,.l5,.l8,.l9,.l10,.l11{border-left-color:#10b981}.l4,.l6,.l7{border-left-color:#fbbf24}</style></head><body><h1>🩺 Sovereign Checkup</h1><div class="sub">Live health check · reads from all API endpoints</div><div class="layers" id="layers"></div><script>LAYERS=[{n:'L0',cls:'l0',name:'DRUM',desc:'1Hz heartbeat',ep:'/api/health'},{n:'L1',cls:'l1',name:'Care-Floor',desc:'0.95 hard gate',ep:'/api/health'},{n:'L2',cls:'l2',name:'BFT-33',desc:'33 voters, 23/33 quorum',ep:'/api/bft33'},{n:'L3',cls:'l3',name:'5x4x3',desc:'60 voters, 96% OK',ep:'/api/owem5x4x3'},{n:'L4',cls:'l4',name:'Sov-Merge',desc:'Adapter pending',ep:null},{n:'L5',cls:'l5',name:'SIGIL Chain',desc:'Ed25519 anchored',ep:'/api/health'},{n:'L6',cls:'l6',name:'PDCA',desc:'Human-ratified',ep:null},{n:'L7',cls:'l7',name:'Continual',desc:'Log/extract/pool',ep:'/api/continual/stats'},{n:'L8',cls:'l8',name:'J-Space',desc:'6 primitives',ep:'/api/jspace-instrument'},{n:'L9',cls:'l9',name:'SovSpace',desc:'World sim',ep:'/api/sovspace/state'},{n:'L10',cls:'l10',name:'Registry',desc:'61 models',ep:'/api/world-models'},{n:'L11',cls:'l11',name:'Surface',desc:'60 tabs',ep:'/api/nexus'}];async function load(){let html='';for(const l ofLAYERS){let badge='live',status='LIVE';if(!l.ep){badge='partial';status='PARTIAL'}else{try{await fetch(l.ep);status='LIVE'}catch(e){badge='partial';status='CHECK'}}html+=`<div class="layer ${l.cls}"><div class="n">${l.n}</div><div><h3>${l.name}</h3><div class="desc">${l.desc}</div></div><div><span class="badge ${badge}">${status}</span></div></div>`}document.getElementById('layers').innerHTML=html}load()</script></body></html>
