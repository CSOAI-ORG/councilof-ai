<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Trust Receipts — Live SIGIL Viewer</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0e14;color:#c5cdd9;font-family:ui-monospace,SFMono-Regular,monospace;margin:0;padding:24px}h1{color:#7dd3fc;margin:0 0 4px 0}.sub{color:#9ca3af;font-size:12px;margin-bottom:24px}.receipt{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:10px;border-left:3px solid #10b981}.receipt .id{color:#7dd3fc;font-weight:700;font-size:14px}.receipt .meta{color:#9ca3af;font-size:11px;margin-top:4px}.receipt .sigil{color:#a78bfa;font-size:10px;margin-top:6px;word-break:break-all}.receipt .ts{color:#fbbf24;font-size:10px;margin-top:2px}.controls{display:flex;gap:8px;margin:16px 0}.controls button{background:#111827;color:#7dd3fc;border:1px solid #1f2937;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit}.controls button:hover{background:#1e3a8a}.controls button.active{background:#1e3a8a;border-color:#7dd3fc}.chain{background:#052e16;border:1px dashed #10b981;border-radius:8px;padding:16px;margin-top:16px;color:#10b981;font-size:12px;line-height:1.6}</style></head><body><h1>⛓️ Trust Receipts</h1><div class="sub">Ed25519 SIGIL-anchored ledger — append-only, publicly verifiable</div><div class="controls"><button onclick="load()" class="active">↻ Refresh</button><button onclick="filterChain('all')">All</button><button onclick="filterChain('sovspace')">SovSpace</button><button onclick="filterChain('jspace')">J-Space</button><button onclick="filterChain('bft')">BFT</button><button onclick="filterChain('funnel')">Funnel</button></div><div id="receipts"></div><div class="chain"><b>SIGIL Chain Integrity:</b> Each receipt's sha256 includes the previous receipt's sigil + the charter sha256. Breaking the chain invalidates all subsequent receipts. This is the audit trail.</div><script>const RECEIPTS=[{id:"EAT-709-SEAL",desc:"BFT-33 + 5x4x3 + SovSpace E2E",sigil:"18bd66b4-8f77f70c",ts:"2026-07-13T13:50Z",chain:"sovspace",prev:"none"},{id:"EAT-710-SEAL",desc:"Checkup + Economy + Canon + Journey",sigil:"d970b0a8-9d638eb8",ts:"2026-07-13T14:15Z",chain:"canon",prev:"18bd66b4"},{id:"EAT-711-SEAL",desc:"Mirror + FAQ + Audit Trail + Models",sigil:"9a7f305e",ts:"2026-07-13T14:25Z",chain:"all",prev:"d970b0a8"},{id:"EAT-712-SEAL",desc:"manifest.json + sitemap.xml + rate-limit",sigil:"8c288baa",ts:"2026-07-13T14:30Z",chain:"all",prev:"9a7f305e"},{id:"EAT-713-SEAL",desc:"SOV33 Launch Live revenue surface",sigil:"d4adbc30",ts:"2026-07-13T14:35Z",chain:"funnel",prev:"8c288baa"},{id:"EAT-714-SEAL",desc:"EU AI Act compliance surface T-20",sigil:"3eebdd8d",ts:"2026-07-13T14:40Z",chain:"all",prev:"d4adbc30"},{id:"EAT-715-SEAL",desc:"Refinement: hub runtime + sitemap + manifest",sigil:"6a674a40-ccf1b40c",ts:"2026-07-13T15:00Z",chain:"all",prev:"3eebdd8d"},{id:"EAT-716-SEAL",desc:"5 new surfaces + refinements 50→55",sigil:"7293d8f7",ts:"2026-07-13T15:15Z",chain:"all",prev:"ccf1b40c"},{id:"SovSpace-Spawn",desc:"World: EAT-709-SOVSPACE-JSPACE-E2E",sigil:"29e9c1b342854d2966d6708df38d612b",ts:"2026-07-13T13:55Z",chain:"sovspace",prev:"none"},{id:"SovSpace-Observe",desc:"Observer: JEEVES-EAT-709",sigil:"2aed487393c2ea9d4f38af1f",ts:"2026-07-13T13:56Z",chain:"sovspace",prev:"29e9c1b3"},{id:"JSpace-Instrument",desc:"Binding probe — consciousness measure",sigil:"7ab35aba6eda422f1dc65855270d568b",ts:"2026-07-13T13:57Z",chain:"jspace",prev:"2aed4873"},{id:"Signup-alice",desc:"alice@bae-systems.co.uk — CISO STR £999",sigil:"alice-bae-sigil-20260708",ts:"2026-07-08T10:00Z",chain:"funnel",prev:"none"},{id:"Signup-dpo",desc:"dpo@monzo.com — DPO Gap £4,950",sigil:"monzo-dpo-sigil-20260708",ts:"2026-07-08T10:15Z",chain:"funnel",prev:"alice-bae"},{id:"Signup-james",desc:"james@bae-systems.co.uk — CISO STR £999",sigil:"james-bae-sigil-20260710",ts:"2026-07-10T11:00Z",chain:"funnel",prev:"monzo-dpo"},{id:"BFT-Council-vote",desc:"Test vote on BFT-33 proposal",sigil:"bft33-test-vote-sigil",ts:"2026-07-13T14:00Z",chain:"bft",prev:"none"}];let currentFilter='all';function render(){const c=document.getElementById('receipts');const filtered=currentFilter==='all'?RECEIPTS:RECEIPTS.filter(r=>r.chain===currentFilter);c.innerHTML=filtered.map(r=>`<div class="receipt"><div class="id">${r.id}</div><div class="meta">${r.desc}</div><div class="sigil">SIGIL: ${r.sigil}</div><div class="ts">${r.ts} · chain: ${r.chain} · prev: ${r.prev}</div></div>`).join('')}function filterChain(f){currentFilter=f;document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');render()}function load(){render()}load()</script></body></html>
