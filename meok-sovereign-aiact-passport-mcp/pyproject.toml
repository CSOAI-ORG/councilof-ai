[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "meok-sovereign-aiact-passport"
version = "0.1.0"
description = "Crown Jewel #1 — EU AI Act Art 6 + Annex IV signed passport MCP, wraps CSOAI live /api/assess"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Nicholas Templeman", email = "nicholas@csoai.org" },
  { name = "CSOAI Ltd", email = "crown@csoai.org" },
]
keywords = ["eu-ai-act", "compliance", "ed25519", "mcp", "sovereign", "annex-iv", "csoai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyNaCl>=1.5",
  "base58>=2.1",
]

[project.optional-dependencies]
mcp = [
  "mcp[cli]>=1.0",
  "fastmcp>=0.4",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
meok-sovereign-aiact-passport = "sovereign_aiact_passport.server:main"

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/meok-sovereign-aiact-passport"
Documentation = "https://csoai.org/meok-sovereign-aiact-passport"
"Issues" = "https://github.com/CSOAI-ORG/meok-sovereign-aiact-passport/issues"

[tool.hatch.build.targets.wheel]
packages = ["sovereign_aiact_passport"]

[tool.hatch.build.targets.sdist]
include = [
  "sovereign_aiact_passport",
  "README.md",
  "LICENSE",
  "docs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
