product_hive:
  tier: product
  inherits: keystone_m4
  fractal_replicate: true
  sub_hives: [ux, tool, content, feature]
  free_tier:
    max_mcp: 5
    model: "llama-3.1:8b"
    bft_enabled: false
  paid_tier:
    max_mcp: 313
    model: "kimi-2.7"
    bft_enabled: true
    cloud_sync: true

sync:
  protocol: sigil-v1
  mesh: tailscale
  interval_seconds: 300
  consensus: bft-pbft
  memory:
    local: lancedb
    cloud: chromadb
    product: qdrant
  security:
    master_sigil: "oowm-root-key"
    domain_sigils: "derived-per-product"
    verification: "proofof.ai"

horus:
  supreme: "Global AI news, competitors, regulatory"
  keystone: "Filesystem, git commits, decisions"
  product: "Uptime, SEO, social sentiment"
  feature: "Conversions, errors, behavior"

