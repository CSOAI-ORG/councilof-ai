<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MEOK Ouroboros — The All is One">
  <defs>
    <linearGradient id="ob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="og" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- serpent body: a near-complete ring, tapering -->
  <g fill="none" stroke="url(#ob)" stroke-linecap="round" filter="url(#og)">
    <path d="M200 70 A130 130 0 1 1 150 92" stroke-width="22"/>
    <path d="M200 70 A130 130 0 1 1 150 92" stroke-width="9" stroke="#0a0e1a" opacity="0.35"/>
  </g>
  <!-- scales -->
  <g stroke="#0a0e1a" stroke-width="2" opacity="0.5" fill="none">
    <path d="M330 200 a14 14 0 0 1 -28 0"/><path d="M315 270 a14 14 0 0 1 -26 -10"/>
    <path d="M255 320 a14 14 0 0 1 -20 -19"/><path d="M120 300 a14 14 0 0 1 -8 -26"/>
    <path d="M75 215 a14 14 0 0 1 4 -27"/><path d="M120 110 a14 14 0 0 1 24 -12"/>
  </g>
  <!-- head eating the tail, near the top -->
  <g filter="url(#og)">
    <path d="M150 92 l34 -14 l6 26 l-30 12 z" fill="url(#ob)"/>
    <circle cx="168" cy="92" r="4.5" fill="#0a0e1a"/>
  </g>
  <!-- tail tucked into the mouth -->
  <path d="M196 74 q-22 4 -40 14" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <!-- motto -->
  <text x="200" y="208" text-anchor="middle" fill="#e8edf7" font-family="Geist,Inter,system-ui,sans-serif" font-size="26" font-weight="600" letter-spacing="3">THE ALL IS ONE</text>
  <text x="200" y="234" text-anchor="middle" fill="#8a97b2" font-family="Geist,Inter,system-ui,sans-serif" font-size="14" letter-spacing="2">ἓν τὸ πᾶν · MEOK</text>
</svg>
