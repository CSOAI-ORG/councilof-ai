[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meok-sov33"
version = "0.2.0"
description = "The sovereign AI client — talk to a governed, care-floored, Ed25519-signed AI substrate from Python. SOV3 free; bring your own key for premium."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["sovereign-ai", "sov33", "meok", "governed-ai", "care-floor", "ed25519", "owem", "mcp", "ai-governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://os.meok.ai"
Documentation = "https://os.meok.ai/integrations.html"
Governance = "https://os.meok.ai/governance.html"
Topology = "https://os.meok.ai/topology.html"
Repository = "https://github.com/CSOAI-ORG/clawd-workspace"

[tool.hatch.build.targets.wheel]
packages = ["meok_sov33"]
