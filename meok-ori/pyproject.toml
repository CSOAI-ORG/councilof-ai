[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meok-ori"
version = "0.1.0"
description = "The sovereign harness — constitutional gate, BFT council vote, SIGIL receipts. Better than ori."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
keywords = ["agent", "harness", "mcp", "sovereign", "bft", "constitutional-ai"]
dependencies = []  # stdlib only — runs anywhere

[project.scripts]
meok = "meok_ori.cli:main"

[tool.setuptools.packages.find]
include = ["meok_ori*"]
