[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meok-ori"
version = "0.2.0"
description = "A local-first agent harness: backend cascade, per-run audit, keyword screen, HMAC receipt chain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
keywords = ["agent", "harness", "mcp", "local-first", "receipts"]
dependencies = []  # stdlib only — runs anywhere

[project.scripts]
meok = "meok_ori.cli:main"

[tool.setuptools.packages.find]
include = ["meok_ori*"]
