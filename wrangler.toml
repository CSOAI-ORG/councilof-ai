# Cloudflare Pages config for the councilof-ai project.
# The dashboard marks this project's bindings as wrangler.toml-managed, so
# bindings MUST live here — dashboard editing is disabled. Deploy reads this
# at `wrangler pages deploy` time (deploy.yml); keep name/output/date in sync
# with the workflow flags and the project's compatibility date.

name = "councilof-ai"
pages_build_output_dir = "dist/client"
compatibility_date = "2026-07-29"

# SOV_ARENA_STATE feeds /api/sov-arena/rounds.jsonl — live arena evidence from
# sov_arena.py (oracle-micro), synced to KV by the Mac-side cron. Same namespace
# the csoai-site project binds (created 2026-08-09, EAT lane).
[[kv_namespaces]]
binding = "SOV_ARENA_STATE"
id = "00634697bf5744edba3625905a922e96"
