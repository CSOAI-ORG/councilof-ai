   "max_runtime_s": 1800,
   "outputs": [
    "~/fleet/runpod_funding.json",
    "~/lanes/logs/runpod-balance.log"
   ],
   "portable": "funding-ro",
   "twin_period_s": 3600,
   "failover": [
    {
     "type": "hf_job",
     "name": "hf-cpu-basic",
     "flavor": "cpu-basic",
     "secrets": [
      "HF_TOKEN"
     ]
