# fleet/jobs.yaml - every scheduled job the estate runs, and how the supervisor treats it.
# Written in the JSON subset of YAML so fleet/supervisor.py reads it with the stdlib (comment lines start with #).
# Inventoried 2026-09-25 from: `crontab -l` + ~/lanes/*.sh on oracle-micro-2, scripts/pod-loops/scheduler.sh
# (3090 pod), `list_scheduled_jobs(namespace="csoai")`, .github/workflows, and the Mac's crontab + LaunchAgents.
# supervise: active  = health read every 10 min; retry once on its host, then the failover chain
#            observe = health read and recorded, never acted on (another lane's job, or known broken)
#            dormant = host is down/parked; signal not readable from Oracle (UNMEASURED, never guessed)
#            self    = the supervisors themselves (each watched by the other)
# health.type: json_field_age | file_mtime | log_last_line | hf_repo_fresh | status_json_job | pod_job | disabled | remote | none
# health.noop: {runs N, patterns|zero|same} -> NOOP (exit 0 but nothing done for N runs in a row); states OK NOOP PAUSED DISABLED are not BAD
# failover target types: hf_job | runpod_backup | kaggle | runpod_pod | proofof_twin (gates in fleetlib.target_allowed)
{
 "version": 1,
 "inventoried_at": "2026-09-25",
 "policy": {
  "primary_host": "oracle-micro-2",
  "hf_namespace": "csoai",
  "heartbeat_repo": "csoai/fleet-heartbeat",
  "control_lease_ttl_s": 1800,
  "silence_s": 1800,
  "twin_lease_ttl_s": 4500,
  "twin_schedule": "17 * * * *",
  "twin_critical": [
   "funding-watchdog",
   "hf-bundle",
   "root-check",
   "domain-watch"
  ],
  "twin_inputs": [
   "~/lanes/domains.json"
  ],
  "runpod_backup_pod": "dgj6roe9sazwsd",
  "runpod_ssh_key": "~/.ssh/fleet_runpod_ed25519",
  "retry": {
   "same_host_max": 1,
   "wait_s": 1200
  },
  "budget": {
   "funding_state": "~/fleet/runpod_funding.json",
   "funding_max_age_s": 3600,
   "runpod_requires_level": "GREEN",
   "caps_per_day": {
    "hf_jobs_cpu": 24,
    "hf_jobs_gpu": 0,
    "kaggle": 6,
    "runpod_backup": 6,
    "runpod_pod": 0,
    "proofof_twin": 0
   }
  },
  "sandbox_rule": "class experimental -> only the proofof.ai twin runner, no credentials, default-deny (owner ruling 25 Sep)"
 },
