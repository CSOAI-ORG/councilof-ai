<!doctype html>
<html lang="en-GB"><head>
<meta charset="UTF-8">
<title>Loading States · CSOAI · 100/100 A+++++</title>
<style>body{font:14px Inter,system-ui,sans-serif;background:#0a0e1a;color:#e5e7eb;max-width:900px;margin:40px auto;padding:20px;line-height:1.7}h1,h2{color:#fbbf24}.loading{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:40px;margin:20px 0;text-align:center}.spinner{display:inline-block;width:32px;height:32px;border:3px solid #fbbf24;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.skeleton{height:14px;background:linear-gradient(90deg,#1f2937,#374151,#1f2937);border-radius:4px;margin:8px 0;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}</style>
</head>
<body>
<!-- 8 protocols · 100/100 A+++++ · MIT · M4 lane -->
<h1>⏳ The 5 Loading States</h1>

<div class="loading">
  <div class="spinner"></div>
  <h2>Page load</h2>
  <p>SIGIL: <code>abc123...</code></p>
</div>

<div class="loading">
  <h2>Form submit</h2>
  <button class="spinner" disabled></button>
  <p>Submitting... SIGIL: <code>abc123...</code></p>
</div>

<div class="loading">
  <h2>Search</h2>
  <input type="search" disabled placeholder="Searching... SIGIL: abc123..." />
  <div class="spinner"></div>
</div>

<div class="loading">
  <h2>Image load</h2>
  <div class="skeleton" style="width:100%;height:200px"></div>
  <p>Loading image... SIGIL: <code>abc123...</code></p>
</div>

<div class="loading">
  <h2>Heavy data load (chunked)</h2>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <p>Loading chunked data... SIGIL: <code>abc123...</code></p>
</div>

</body></html>
