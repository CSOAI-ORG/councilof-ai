# MEOK OS — pytest configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short --color=yes -p no:cacheprovider
markers =
    api: tests that talk to the FastAPI backend (httpx)
    ui: tests that drive a real browser (playwright)
    smoke: critical-path smoke tests run on every deploy
    slow: tests that take >2s each; excluded from quick runs
    integration: end-to-end integration suite (signup → ichar → council → sigil → pwa)
    sigstore: SIGIL chain audit trail checks
    x402: x402 paywall pricing-band checks
    pwa: progressive web app + service worker checks
filterwarnings =
    ignore::DeprecationWarning
