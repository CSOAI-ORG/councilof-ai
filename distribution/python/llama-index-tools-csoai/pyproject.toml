[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-tools-csoai"
version = "0.1.3"
description = "LlamaIndex tool spec for the Council of AI GSPC measurement board (wraps csoai-gspc)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "CSOAI Ltd", email = "nicholas@csoai.org" }]
keywords = ["csoai", "gspc", "layer0", "measurement", "llama-index", "llamaindex"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["csoai-gspc>=0.2.20261007.1", "llama-index-core>=0.12"]

[project.urls]
Homepage = "https://councilof.ai"
Board = "https://councilof.ai/api/gspc"
Doctrine = "https://councilof.ai/doctrine/"

[tool.setuptools]
packages = ["llama_index.tools.csoai"]

