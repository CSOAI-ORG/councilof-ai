identity:
  name: get_axis
  author: csoai
  label:
    en_US: "One GSPC board axis"
description:
  human:
    en_US: "Read one live board dimension by its axis id."
  llm: "Read one live board dimension by its axis id. Prefer this when a dimension is supplied or selected at runtime; axis_* tools select one fixed dimension with no arguments. Use board_totals for the overview. Returns applicable metrics, original evidence dates and links; a leader is named only when SEPARATED. UNMEASURED is not zero or pass/fail; BAD_INPUT, NOT_ON_BOARD and UNREACHABLE remain distinct. Check the referenced method before comparing results. Measurement, not certification or permission."
parameters:
  - name: axis
    type: string
    required: true
    label:
      en_US: "axis"
    human_description:
      en_US: "The axis name as it appears on the board, e.g. governance, safety, jail, provenance-controls. Case-insensitive. An unknown name returns the list of names the board actually carries."
    llm_description: "The axis name as it appears on the board, e.g. governance, safety, jail, provenance-controls. Case-insensitive. An unknown name returns the list of names the board actually carries."
    form: llm
extra:
  python:
    source: tools/get_axis.py
