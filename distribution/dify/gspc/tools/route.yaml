identity:
  name: route
  author: csoai
  label:
    en_US: "GSPC Route: decide a path under your policy (free, decide-only)"
description:
  human:
    en_US: "GSPC Route (free, decide-only)."
  llm: "GSPC Route (free, decide-only). Applies YOUR policy and the fixed GSPC floor to a candidate set and returns the chosen candidate, the basis of the choice and an unsigned route record (csoai.evidence-event/0.1, profile csoai.route-evidence/0.1). Candidates are the GSPC MCP tools by default, or ones you declare: your models, your local GPU, MCP tools, A2A agents, x402 resources. Policy is Cedar: presets read-only, local-only, eu-only, no-unmeasured, plus forbid_providers and allow_kinds; anything the router does not understand grants nothing. For the quality axis you name it reads the live board (https://councilof.ai/api/gspc). Routing is not ranking: a choice is called a separated leader only when the board separated that comparison; otherwise it is TIE or UNTESTED and your tie_break decides. A candidate the board holds no number for is UNTESTED, never 0. Sponsor, bid and placement fields are ignored. The task text is hashed, never stored. Nothing is executed, called or charged; mode execute answers NOT_ENABLED. Measurement, not certification."
parameters:
  - name: task
    type: string
    required: false
    label:
      en_US: "task"
    human_description:
      en_US: "The task. Hashed (sha256) and never stored or echoed."
    llm_description: "The task. Hashed (sha256) and never stored or echoed."
    form: llm
  - name: task_sha256
    type: string
    required: false
    label:
      en_US: "task_sha256"
    human_description:
      en_US: "Alternative to task: its sha256."
    llm_description: "Alternative to task: its sha256."
    form: llm
  - name: data_class
    type: select
    required: false
    label:
      en_US: "data_class"
    human_description:
      en_US: "Default public. A non-public class is routed only to candidates that declare it in data_class_allowed."
    llm_description: "Default public. A non-public class is routed only to candidates that declare it in data_class_allowed."
    form: llm
    options:
      - value: "public"
        label:
          en_US: "public"
      - value: "internal"
        label:
          en_US: "internal"
      - value: "confidential"
        label:
          en_US: "confidential"
      - value: "pii"
        label:
          en_US: "pii"
  - name: needs_write
    type: boolean
    required: false
    label:
      en_US: "needs_write"
    human_description:
      en_US: "needs_write"
    llm_description: "needs_write"
    form: llm
  - name: candidates
    type: string
    required: false
    label:
      en_US: "candidates"
    human_description:
      en_US: "Omit to route among the GSPC MCP tools. A candidate field the router does not know makes that candidate UNCHECKABLE (never permitted); sponsor/bid/placement fields are ignored."
    llm_description: "Omit to route among the GSPC MCP tools. A candidate field the router does not know makes that candidate UNCHECKABLE (never permitted); sponsor/bid/placement fields are ignored."
    form: llm
  - name: policy
    type: string
    required: false
    label:
      en_US: "policy"
    human_description:
      en_US: "presets [read-only, local-only, eu-only, no-unmeasured], forbid_providers [..], allow_kinds [..], confirm_destructive, caller_wallet. Unknown keys grant nothing."
    llm_description: "presets [read-only, local-only, eu-only, no-unmeasured], forbid_providers [..], allow_kinds [..], confirm_destructive, caller_wallet. Unknown keys grant nothing."
    form: llm
  - name: objective
    type: string
    required: false
    label:
      en_US: "objective"
    human_description:
      en_US: "objective"
    llm_description: "objective"
    form: llm
  - name: mode
    type: select
    required: false
    label:
      en_US: "mode"
    human_description:
      en_US: "decide (default). execute is not enabled and answers NOT_ENABLED."
    llm_description: "decide (default). execute is not enabled and answers NOT_ENABLED."
    form: llm
    options:
      - value: "decide"
        label:
          en_US: "decide"
      - value: "execute"
        label:
          en_US: "execute"
extra:
  python:
    source: tools/route.py
