identity:
  name: quote_dataset_version
  author: csoai
  label:
    en_US: "Dataset version quote (data/v1)"
description:
  human:
    en_US: "Quote one published data/v1 dataset version from https://councilof.ai/data/v1/: version (YYYY-MM-DD, default latest), card_count, merkle_root, the snapshot file URLs with their sha256, the manifest's sha256 (published value and the value recomputed here over the served bytes), the citation exactly as published (doi null until one is minted) and the data licence (CC-BY-4.0)."
  llm: "Quote one published data/v1 dataset version from https://councilof.ai/data/v1/: version (YYYY-MM-DD, default latest), card_count, merkle_root, the snapshot file URLs with their sha256, the manifest's sha256 (published value and the value recomputed here over the served bytes), the citation exactly as published (doi null until one is minted) and the data licence (CC-BY-4.0). Read-only; free. States only: measurement, not endorsement; no verdict, score or ranking. NOT_PUBLISHED when the version is not in latest.json or CHANGELOG.json; UNREACHABLE when the source could not be fetched."
parameters:
  - name: version
    type: string
    required: false
    label:
      en_US: "version"
    human_description:
      en_US: "Snapshot version, YYYY-MM-DD, or \"latest\" (default)."
    llm_description: "Snapshot version, YYYY-MM-DD, or \"latest\" (default)."
    form: llm
extra:
  python:
    source: tools/quote_dataset_version.py
