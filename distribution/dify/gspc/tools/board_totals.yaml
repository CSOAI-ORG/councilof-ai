identity:
  name: board_totals
  author: csoai
  label:
    en_US: "Live GSPC board totals"
description:
  human:
    en_US: "Read the live GSPC board overview."
  llm: "Read the live GSPC board overview. Use this for declared, measured and unmeasured counts; use get_axis for one dimension and verify_card for one signed record. The default summary includes distinct count kinds, separation (TIE and UNTESTED are not wins) and source dates. detail=\"full\" adds count grammar, family totals and the full measured_on block, preserving the legacy full payload. Fetch failure is UNREACHABLE, never a cached live result. Measurement, not certification or authority to act."
parameters:
  - name: detail
    type: select
    required: false
    label:
      en_US: "detail"
    human_description:
      en_US: "summary (default): counts, public_count, the separation line, dates and source. full: also count_grammar, by_family and the board's measured_on block."
    llm_description: "summary (default): counts, public_count, the separation line, dates and source. full: also count_grammar, by_family and the board's measured_on block."
    form: llm
    options:
      - value: "summary"
        label:
          en_US: "summary"
      - value: "full"
        label:
          en_US: "full"
extra:
  python:
    source: tools/board_totals.py
