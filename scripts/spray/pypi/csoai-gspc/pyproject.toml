[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csoai-gspc"
version = "0.2.20260930.1"
description = "Read the live GSPC AI-governance board and verify its Ed25519-signed measurement cards. Three states only: VALID, INVALID, UNCHECKABLE."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "CSOAI Ltd", email = "nicholas@csoai.org" }]
keywords = ["ai-governance", "eu-ai-act", "ai-safety", "benchmark", "attestation",
            "ed25519", "provenance", "measurement", "transparency", "llm-evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
verify = ["cryptography>=42"]

[project.urls]
Homepage = "https://councilof.ai/api/gspc"
Source = "https://huggingface.co/datasets/csoai/councilof-ai-mirror"
"Board mirror" = "https://huggingface.co/datasets/csoai/gspc-board"
Methodology = "https://councilof.ai/methodology/"
Corrections = "https://councilof.ai/corrections/"
"Verify a card" = "https://councilof.ai/gspc-verify"
"How to verify" = "https://councilof.ai/signed/HOW-TO-VERIFY.md"
"Frozen banks" = "https://huggingface.co/csoai"

[project.scripts]
csoai-gspc = "csoai_gspc.cli:main"

[tool.setuptools]
packages = ["csoai_gspc"]

[tool.setuptools.package-data]
csoai_gspc = ["snapshot/*.json", "axis_aliases.json"]
