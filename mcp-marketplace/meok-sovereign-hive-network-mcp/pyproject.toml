[project]
name = "meok-sovereign-hive-network-mcp"
version = "1.0.0"
description = "Sovereign Hive Network MCP - 33 hives across 5 continents + 8 BIG BRAIM winners (1.39 TB) + auto-routing by query keywords. The geographic distribution layer of the sovereign substrate."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]