[build-system]
requires = ["hatchling"]

[project]
name = "meek_design_tool_orchestrator_mcp"
version = "1.0.0"
description = "MEEK Design Tool Orchestrator MCP — finds the best CAD + slicer + EDA + simulation tool for the job. CRITICAL for the prototype pipeline. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "design", "manufacturing", "3d-printing", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-design-tool-orchestrator-mcp"

[project.scripts]
meek-design-tool-orchestrator-mcp = "meek_design_tool_orchestrator_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_design_tool_orchestrator_mcp"]
