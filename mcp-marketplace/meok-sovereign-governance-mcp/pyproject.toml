[project]
name = "meok-sovereign-governance-mcp"
version = "0.1.0"
description = "Sovereign Governance Engine MCP — policy enforcement + zero-trust identity + sandboxing + SRE for autonomous AI agents. Wraps microsoft/agent-governance-toolkit (AGT, 4.5K stars, MIT, PyPI+npm+NuGet) + ATF (Agentic Trust Framework) patterns with CSOAI sovereign substrate (Ed25519, BFT council, Maternal Covenant, proofof.ai)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "governance", "zero-trust", "agent",
    "policy-engine", "opa", "rego", "atf", "aarm",
    "ed25519", "mcp", "csai", "meok", "owasp-agentic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
