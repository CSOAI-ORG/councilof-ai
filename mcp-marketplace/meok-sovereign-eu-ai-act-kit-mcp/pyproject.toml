[project]
name = "meok-sovereign-eu-ai-act-kit-mcp"
version = "0.1.0"
description = "Sovereign EU AI Act Kit MCP — the August 2nd Survival Kit. Auto-audit any AI system against EU AI Act Art. 9/10/12/14/50 + Annex IV. Wraps AIR Blackbox + Venturalitica SDK + Giskard patterns. Generate signed compliance evidence for EU AI Office submissions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "eu-ai-act", "compliance", "august-2",
    "art-9", "art-10", "art-12", "art-14", "art-50", "annex-iv",
    "air-blackbox", "venturalitica", "giskard",
    "ed25519", "mcp", "csai", "meok", "survival-kit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
