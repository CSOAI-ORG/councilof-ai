[build-system]
requires = ["hatchling"]

[project]
name = "meek_wow_bot_mcp"
version = "1.0.0"
description = "MEEK WoW Bot MCP — healer follower + 24/7 farmer + anti-detection for sovereign WoW play. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "wow", "bot", "gaming", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/gaming"
Repository = "https://github.com/CSOAI-ORG/meek-wow-bot-mcp"

[project.scripts]
meek-wow-bot-mcp = "meek_wow_bot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_wow_bot_mcp"]
