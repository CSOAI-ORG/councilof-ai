[project]
name = "meok-sovereign-backup-mcp"
version = "1.0.0"
description = "Sovereign Backup MCP - snapshot + restore + delta tracking. Sigil-signed snapshots. BFT 3-voter restore."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]