[build-system]
requires = ["hatchling"]

[project]
name = "meek_dual_brain_mcp"
version = "1.0.0"
description = "MEEK Dual-Brain MCP — left brain (Mamba-2 SSD online on SOV3 VM) + right brain (DeepSeek V4 MoE offline on Coral Edge TPU). CRITICAL. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "emergence", "pdca", "dual-brain", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-dual-brain-mcp"

[project.scripts]
meek-dual-brain-mcp = "meek_dual_brain_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_dual_brain_mcp"]
