[build-system]
requires = ["hatchling"]

[project]
name = "meek_defoneos_ue5_mcp"
version = "1.0.0"
description = "MEEK DEFONEOS UE5 MCP — the Unreal Engine 5 sovereign world with SOV3 100% integrated. 8 products. 5-radio orbs. 4VF circulatory. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "unreal-engine-5", "ue5", "sov3", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://defoneos.com"
Repository = "https://github.com/CSOAI-ORG/meek-defoneos-ue5-mcp"

[project.scripts]
meek-defoneos-ue5-mcp = "meek_defoneos_ue5_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_defoneos_ue5_mcp"]
