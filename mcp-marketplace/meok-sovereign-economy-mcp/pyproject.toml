[project]
name = "meok-sovereign-economy-mcp"
version = "1.0.0"
description = "Sovereign Economy MCP - x402 invoices + payments + receipts. 4 tiers (free/pro/governance/enterprise) + 15 services + $10K starting balance. Sigil every invoice + receipt."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]