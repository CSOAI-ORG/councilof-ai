[project]
name = "meok-sovereign-core-mcp"
version = "1.0.0"
description = "Sovereign Core MCP - the AB Uno substrate. The 1 origin that holds everything together: 5D Hive + 12 Sephiroth + 12 Generals + Defensive Doctrine. The master substrate of the sovereign empire."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]