[project]
name = "meok-sovereign-identity-mcp"
version = "1.0.0"
description = "Sovereign Identity MCP - W3C DID + Ed25519 JWT + auth. Each agent/org has a DID + signing key per the W3C DID standard."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]