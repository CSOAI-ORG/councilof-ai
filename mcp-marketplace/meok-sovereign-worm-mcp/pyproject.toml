[project]
name = "meok-sovereign-worm-mcp"
version = "0.1.0"
description = "MEOK WORM MCP — Morris-II self-replicating-prompt defense + protocol tunnel registry + WORM (Write-Once-Read-Many) storage + sigil-signed audit. Defensive-only doctrine: detects worm propagation, never propagates itself."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "worm", "morris-ii", "self-replicating",
    "prompt-injection", "tunnel", "protocol", "worm-storage",
    "audit", "sigil", "ed25519", "defensive",
    "mcp", "csai", "meok",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
