[build-system]
requires = ["hatchling"]

[project]
name = "meek_sov3_oowm_mcp"
version = "1.0.0"
description = "MEEK SOV3 OOWM MCP — the Open Open World Model with Traibgle voting (GOOD/BAD/NEUTRAL). CRITICAL for the sovereign world model."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "sov3", "oowm", "open-open-world-model", "traibgle", "voting", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/meek-sov3-oowm-mcp"

[project.scripts]
meek-sov3-oowm-mcp = "meek_sov3_oowm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_sov3_oowm_mcp"]
