[build-system]
requires = ["hatchling"]

[project]
name = "meek_antenna_triangle_mcp"
version = "1.0.0"
description = "MEEK Antenna Triangle MCP — the 3 brand layers as 3 vertices of a triangle, the sovereign at the centroid. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "antenna", "triangle", "sovereign", "centroid", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/meek-antenna-triangle-mcp"

[project.scripts]
meek-antenna-triangle-mcp = "meek_antenna_triangle_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_antenna_triangle_mcp"]
