[build-system]
requires = ["hatchling"]

[project]
name = "meek_stone_soup_mcp"
version = "1.0.0"
description = "DARPA Stone Soup multi-target tracking + Julia Dynamics agent-based modeling for DEFONEOS SPEAR arm. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "sovereign", "uk", "open-source", "mit-licensed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-stone-soup-mcp"

[project.scripts]
meek-stone-soup-mcp = "meek_stone_soup_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_stone_soup_mcp"]
