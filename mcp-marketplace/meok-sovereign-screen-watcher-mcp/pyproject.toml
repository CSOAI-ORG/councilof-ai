[project]
name = "meok-sovereign-screen-watcher-mcp"
version = "1.0.0"
description = "Sovereign Screen-Watcher MCP - SOV33 watches the screen, learns, suggests, helps. Detects blocking windows."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
