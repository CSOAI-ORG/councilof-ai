[project]
name = "meok-sovereign-revise-mcp"
version = "1.0.0"
description = "Sovereign Revision MCP - 5-tier revision schedule (daily/weekly/monthly/quarterly/annual) + 5 trigger conditions."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
