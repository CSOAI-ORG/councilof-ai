[project]
name = "meok-sovereign-secret-mcp"
version = "1.0.0"
description = "Sovereign Secret MCP - AES-256 sim secret storage, rotation, deletion. BFT 3-voter for sensitive ops. Sigil-signed."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]