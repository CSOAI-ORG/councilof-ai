[build-system]
requires = ["hatchling"]

[project]
name = "meek_world_data_mcp"
version = "1.0.0"
description = "MEEK World Data MCP — REAL world data overlay engine (uses 49G government + 25G Wikipedia + 2G OSM + 9.1M names + 380K EU data from /data/hive-data). MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "world-data", "cesium", "sov-os", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org/sov-space"
Repository = "https://github.com/CSOAI-ORG/meek-world-data-mcp"

[project.scripts]
meek-world-data-mcp = "meek_world_data_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_world_data_mcp"]
