[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meok-sovereign-drone-mcp"
version = "1.0.0"
description = "MEOK Sovereign Drone MCP — ArduPilot/PX4 MAVLink bridge for the SOV3 sovereign substrate"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "labs@meok.ai"}]
keywords = ["mcp", "drone", "uav", "ardupilot", "px4", "mavlink", "sovereign", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Aerospace",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/meok-sovereign-drone-mcp"
Repository = "https://github.com/CSOAI-ORG/meok-sovereign-drone-mcp"

[tool.setuptools.packages.find]
where = ["."]
