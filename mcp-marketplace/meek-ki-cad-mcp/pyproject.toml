[build-system]
requires = ["hatchling"]

[project]
name = "meek_ki_cad_mcp"
version = "1.0.0"
description = "meek-ki-cad-mcp - MEOK science MCP for Project AURUM. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MEOK AI Labs", email = "nicholas@csoai.org"},
]
keywords = ["mcp", "science", "meek", "defoneos", "project-aurum", "sovereign", "uk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-ki-cad-mcp"

[project.scripts]
meek_-ki-cad-mcp = "meek_ki_cad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_ki_cad_mcp"]
