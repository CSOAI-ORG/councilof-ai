[build-system]
requires = ["hatchling"]

[project]
name = "meek_circulatory_capillary_mcp"
version = "1.0.0"
description = "MEEK Circulatory Capillary MCP — the living fluid network (heart + arteries + veins + capillaries + valves + working fluid). CRITICAL for the sovereign body. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "circulatory", "4vf", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-circulatory-capillary-mcp"

[project.scripts]
meek-circulatory-capillary-mcp = "meek_circulatory_capillary_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_circulatory_capillary_mcp"]
