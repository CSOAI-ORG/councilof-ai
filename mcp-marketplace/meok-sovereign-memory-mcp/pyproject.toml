[project]
name = "meok-sovereign-memory-mcp"
version = "0.1.0"
description = "Sovereign Memory MCP — long-term episodic memory + temporal knowledge graph + hybrid retrieval. Wraps cognee (23K stars, Apache 2.0) + memvid (15K stars, MIT) + supermemoryai/openclaw-supermemory patterns."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "memory", "episodic", "knowledge-graph",
    "temporal", "cognee", "memvid", "long-term", "retrieval",
    "ed25519", "mcp", "csai", "meok",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
