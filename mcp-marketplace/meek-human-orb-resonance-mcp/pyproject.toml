[build-system]
requires = ["hatchling"]

[project]
name = "meek_human_orb_resonance_mcp"
version = "1.0.0"
description = "MEEK Human-Orb Resonance MCP — the bond strength + trust + companionship metrics. CRITICAL for the human-orb connection. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "intuitive-frequency", "bond", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-human-orb-resonance-mcp"

[project.scripts]
meek-human-orb-resonance-mcp = "meek_human_orb_resonance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_human_orb_resonance_mcp"]
