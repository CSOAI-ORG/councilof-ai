[project]
name = "meok-sovereign-training-data-mcp"
version = "1.0.0"
description = "Sovereign Training Data MCP - CC0 training corpus. 11 public domain sources. JSONL/CSV export. For sovereign ML training."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "CC0 1.0"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
