[project]
name = "meok-sovereign-scenario-mcp"
version = "1.0.0"
description = "Sovereign Scenario MCP - 10 real-world scenarios (drone rescue, fire, flood, missing person, etc). The future of abundance."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT + CC0 1.0"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
