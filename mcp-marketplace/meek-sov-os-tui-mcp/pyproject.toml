[build-system]
requires = ["hatchling"]

[project]
name = "meek_sov_os_tui_mcp"
version = "1.0.0"
description = "MEEK SOV OS TUI MCP — terminal-based sovereign OS for PC + mobile. CRITICAL. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "sov-space", "sovereign", "temple", "globe", "tui", "digital-twin", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org/sov-space"
Repository = "https://github.com/CSOAI-ORG/meek-sov-os-tui-mcp"

[project.scripts]
meek-sov-os-tui-mcp = "meek_sov_os_tui_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_sov_os_tui_mcp"]
