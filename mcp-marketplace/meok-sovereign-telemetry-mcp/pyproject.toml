[project]
name = "meok-sovereign-telemetry-mcp"
version = "1.0.0"
description = "Sovereign Telemetry MCP - live event log + care floor + BFT + sigil telemetry. Master observability layer for the 12 Generals + care floor probes + BFT votes + sigil emissions."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]