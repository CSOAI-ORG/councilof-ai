[build-system]
requires = ["hatchling"]

[project]
name = "meek_sov3_orchestrator_mcp"
version = "1.0.0"
description = "SOV3 sovereign intelligence orchestrator (Mamba-2 + 64-MoE + 33-BFT + Sigil) for the orb mesh. UK sovereign only. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "sovereign", "uk", "open-source", "mit-licensed"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-sov3-orchestrator-mcp"

[project.scripts]
meek-sov3-orchestrator-mcp = "meek_sov3_orchestrator_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_sov3_orchestrator_mcp"]
