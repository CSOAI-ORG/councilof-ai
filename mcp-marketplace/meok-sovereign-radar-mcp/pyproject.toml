[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meok-sovereign-radar-mcp"
version = "1.0.0"
description = "MEOK Sovereign Radar MCP — mmWave radar sensor integration for the SOV3 sovereign substrate"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "labs@meok.ai"}]
keywords = ["mcp", "radar", "mmwave", "sovereign", "sensor", "esp32", "presence-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/meok-sovereign-radar-mcp"
Repository = "https://github.com/CSOAI-ORG/meok-sovereign-radar-mcp"

[tool.setuptools.packages.find]
where = ["."]
