[project]
name = "meok-sovereign-translate-mcp"
version = "1.0.0"
description = "Sovereign Translation MCP - i18n runtime + 6 locales + voice + TTS. Translates between EN/FR/DE/ES/JA/ZH + locale-aware number/currency formatting."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]