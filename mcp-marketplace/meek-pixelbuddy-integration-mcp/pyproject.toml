[build-system]
requires = ["hatchling"]

[project]
name = "meek_pixelbuddy_integration_mcp"
version = "1.0.0"
description = "MEEK PixelBuddy Integration MCP — the bridge from PixelBuddy (QuasarGingerbread.exe) to MEOK-SOV3. The user has BOTH: pixel-based detection + sovereign integration. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "pixelbuddy", "quasar-gingerbread", "wow", "bot", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org/pixelbuddy"
Repository = "https://github.com/CSOAI-ORG/meek-pixelbuddy-integration-mcp"

[project.scripts]
meek-pixelbuddy-integration-mcp = "meek_pixelbuddy_integration_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_pixelbuddy_integration_mcp"]
