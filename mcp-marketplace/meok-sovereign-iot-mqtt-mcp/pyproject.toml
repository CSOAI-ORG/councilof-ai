[project]
name = "meok-sovereign-iot-mqtt-mcp"
version = "1.0.0"
description = "Sovereign IoT MQTT MCP - iOK Farm IoT bridge. 9 sensor topics (pH, DO, temp, humidity, ammonia, fish activity, filter, light, feed). Care floor + alerts integrated with the sovereign substrate."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]