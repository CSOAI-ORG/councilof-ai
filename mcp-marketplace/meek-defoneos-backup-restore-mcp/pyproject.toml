[build-system]
requires = ["hatchling"]

[project]
name = "meek_defoneos_backup_restore_mcp"
version = "1.0.0"
description = "MEEK DEFONEOS Backup/Restore MCP — the production backup/restore system for the sovereign stack. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "vercel", "pypi", "smithery", "pagerduty", "backup", "production", "sovereign", "uk"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://defoneos.com"
Repository = "https://github.com/CSOAI-ORG/meek-defoneos-backup-restore-mcp"

[project.scripts]
meek-defoneos-backup-restore-mcp = "meek_defoneos_backup_restore_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_defoneos_backup_restore_mcp"]
