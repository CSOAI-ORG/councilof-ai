[build-system]
requires = ["hatchling"]

[project]
name = "meek_sacred_geometry_mcp"
version = "1.0.0"
description = "MEEK Sacred Geometry MCP — silver/gold triangle connectors + Traibgle voting geometry + 5-radio per vertex. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "sacred-geometry", "triangle", "tetrahedron", "octahedron", "icosahedron", "traibgle", "voting", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/meek-sacred-geometry-mcp"

[project.scripts]
meek-sacred-geometry-mcp = "meek_sacred_geometry_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_sacred_geometry_mcp"]
