[build-system]
requires = ["hatchling"]

[project]
name = "meek_humanoid_mcp"
version = "1.0.0"
description = "Capillary humanoid body orchestrator (200 muscle groups + 4 sensor orbs + 1 brain orb + spine bus + full-body kinematics) for the AURUM-III sovereign humanoid. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "capillary-humanoid", "sovereign", "uk", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-humanoid-mcp"

[project.scripts]
meek-humanoid-mcp = "meek_humanoid_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_humanoid_mcp"]
