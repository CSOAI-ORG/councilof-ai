[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meok-sovereign-osint-bridge-mcp"
version = "1.0.0"
description = "MEOK Sovereign OSINT Bridge MCP — ethical, consent-gated OSINT (Sherlock, Maigret, OpenALPR, InsightFace, SpiderFoot, theHarvester, holehe)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "labs@meok.ai"}]
keywords = ["mcp", "osint", "sherlock", "maigret", "openalpr", "insightface", "spiderfoot", "sovereign", "ethical-osint", "consent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/meok-sovereign-osint-bridge-mcp"
Repository = "https://github.com/CSOAI-ORG/meok-sovereign-osint-bridge-mcp"

[tool.setuptools.packages.find]
where = ["."]