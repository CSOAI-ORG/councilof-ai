[project]
name = "meok-sovereign-tenant-mcp"
version = "1.0.0"
description = "Sovereign Tenant MCP - multi-tenant isolation with namespaces. BFT 3-voter approve for sensitive ops. Sigil-signed."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]