[build-system]
requires = ["hatchling"]

[project]
name = "meek_shipped_status_mcp"
version = "1.0.0"
description = "MEEK Shipped Status MCP — what's actually shipped (MCPs, docs, seals, commits, tests). CRITICAL for transparency. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "truth", "honest", "daily", "shipped", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/meek-shipped-status-mcp"

[project.scripts]
meek-shipped-status-mcp = "meek_shipped_status_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_shipped_status_mcp"]
