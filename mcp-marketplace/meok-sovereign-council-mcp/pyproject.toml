[project]
name = "meok-sovereign-council-mcp"
version = "0.1.0"
description = "Sovereign Council MCP — BFT-style council voting + ratification for the 12-around-1 sovereign governance. Wraps gordian-engine/gordian (BFT consensus, MIT) + CSOAI Charter (52 articles)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "council", "bft", "voting", "governance",
    "12-around-1", "gordian", "consensus", "ratification",
    "csai", "meok", "charter", "ed25519", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
