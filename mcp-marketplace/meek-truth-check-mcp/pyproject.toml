[build-system]
requires = ["hatchling"]

[project]
name = "meek_truth_check_mcp"
version = "1.0.0"
description = "MEEK Truth Check MCP — the honest inventory (real test count, real MCP count, real git commits, fabrication check). CRITICAL for honest work. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "truth", "honest", "daily", "shipped", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/meek-truth-check-mcp"

[project.scripts]
meek-truth-check-mcp = "meek_truth_check_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_truth_check_mcp"]
