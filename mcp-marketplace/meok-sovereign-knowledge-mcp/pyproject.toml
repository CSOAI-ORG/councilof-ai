[project]
name = "meok-sovereign-knowledge-mcp"
version = "1.0.0"
description = "Sovereign Knowledge MCP - CC0 1.0 public domain knowledge graph. Ed25519-signed. Wikidata/Wikipedia/Project Gutenberg/NASA/UN/UK Crown sources."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "CC0 1.0"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
