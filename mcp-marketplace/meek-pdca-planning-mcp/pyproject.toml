[build-system]
requires = ["hatchling"]

[project]
name = "meek_pdca_planning_mcp"
version = "1.0.0"
description = "MEEK PDCA Planning MCP — Plan-Do-Check-Act loop with digital twin simulation. CRITICAL for the sovereign body's speed. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "emergence", "pdca", "dual-brain", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-pdca-planning-mcp"

[project.scripts]
meek-pdca-planning-mcp = "meek_pdca_planning_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_pdca_planning_mcp"]
