[project]
name = "meok-sovereign-watchdog-mcp"
version = "1.0.0"
description = "Sovereign Watchdog MCP - public watchdog for humans/agents/systems/humanoids. Global heatmap + friend/foe signals + humanoid route simulation."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT + CC0 1.0"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
