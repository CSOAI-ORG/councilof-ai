[build-system]
requires = ["hatchling"]

[project]
name = "meek_orb_mesh_mcp"
version = "1.0.0"
description = "Multi-frequency orb mesh (LoRa + WiFi + BLE + Sigil + UWB) for the sovereign orb network. CRITICAL. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "sovereign", "uk", "open-source", "mit-licensed"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-orb-mesh-mcp"

[project.scripts]
meek-orb-mesh-mcp = "meek_orb_mesh_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_orb_mesh_mcp"]
