[project]
name = "meok-sovereign-skills-mcp"
version = "0.1.0"
description = "Sovereign Skills MCP — lifecycle governance of agent skills. Wraps MemTensor/skills-vote (1.68M SKILL.md files indexed, arXiv 2605.18401) + smixs/skill-conductor (CREATE→EVAL→EDIT→REVIEW→PACKAGE) patterns."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "skills", "agent-skills", "lifecycle",
    "skills-vote", "skill-conductor", "attribution",
    "ed25519", "mcp", "csai", "meok",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
