[project]
name = "meok-sovereign-pqc-mcp"
version = "1.0.0"
description = "Sovereign PQC MCP - Post-Quantum Cryptography: ML-DSA-65 (Dilithium) + ML-KEM-768 (Kyber) + Ed25519."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
