[build-system]
requires = ["hatchling"]

[project]
name = "meek_capillary_actuator_mcp"
version = "1.0.0"
description = "MCMB capillary muscle actuator (PVA/PDMS bladder + 1000 capillaries + electroosmotic control) for the AURUM-III capillary humanoid. CRITICAL. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "capillary-humanoid", "sovereign", "uk", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-capillary-actuator-mcp"

[project.scripts]
meek-capillary-actuator-mcp = "meek_capillary_actuator_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_capillary_actuator_mcp"]
