[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optical-care-home-bridge-mcp"
version = "1.0.4"
readme = "README.md"
description = "Bridge between domiciliary optometry visits + care-home governance. Handles consent capacity (Mental Capacity Act), GOS 6 eligibility, post-visit care plan update sync."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "hello@meok.ai"}]
keywords = ["domiciliary-optometry", "care-home", "mental-capacity", "gos-6", "consent", "uk", "mcp", "mcp-server", "model-context-protocol", "uk-compliance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.28.0"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/optical-care-home-bridge-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
optical-care-home-bridge-mcp = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_Configs = true
disallow_untyped_defs = true

