[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meok-sovereign-owem-bridge-mcp"
version = "1.0.0"
description = "MEOK Sovereign OWEM Bridge MCP — Own-Weights Emergent Model integration (frozen-base accretion substrate)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "labs@meok.ai"}]
keywords = ["mcp", "owem", "emergent", "frozen-weights", "accretion", "sov33", "sovereign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["mcp>=1.0.0", "pydantic>=2.0.0"]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/meok-sovereign-owem-bridge-mcp"

[tool.setuptools.packages.find]
where = ["."]