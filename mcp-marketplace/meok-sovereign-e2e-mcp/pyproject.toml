[project]
name = "meok-sovereign-e2e-mcp"
version = "1.0.0"
description = "Sovereign E2E MCP - audit the sovereign substrate. 21 doctrine elements, 8 layers, 79 MCPs, 1,592+ tests."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
