[project]
name = "meok-sovereign-webhook-mcp"
version = "1.0.0"
description = "Sovereign Webhook MCP - incoming + outgoing webhooks. Subscribe to 8 event topics, publish events, list subscribers, history."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]