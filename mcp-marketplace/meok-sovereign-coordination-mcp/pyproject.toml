[project]
name = "meok-sovereign-coordination-mcp"
version = "1.0.0"
description = "Sovereign Coordination MCP - cross-General task management. When 2+ Generals need to work together, this orchestrates them with BFT + care-floor consideration."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]