[project]
name = "meok-sovereign-guardrails-mcp"
version = "0.1.0"
description = "Sovereign Guardrails MCP — Ed25519-signed prompt injection defense + PII/secrets redaction + repo poisoning scanner. Wraps superagent-ai/superagent patterns with CSOAI sovereign substrate (Maternal Covenant, BFT council, proofof.ai verify)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "guardrails", "safety", "prompt-injection",
    "redaction", "pii", "secrets", "scanning", "ed25519", "mcp",
    "csai", "meok", "owasp", "genai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://csoai.org"
Documentation = "https://csoai.org/guardrails"
"Superagent SDK" = "https://github.com/superagent-ai/superagent"
