[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meok-sovereign-training-mcp"
version = "1.0.0"
description = "Free UK training certification, BFT-issued SIGIL certs. White-label partner cohorts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@templeman-opticians.com"}]
keywords = ["mcp", "training", "certification", "sovereign", "ed25519", "bft", "free", "white-label"]

[project.scripts]
meok-sovereign-training-mcp = "server:main"

[tool.setuptools]
packages = ["meok_sovereign_training_mcp"]
