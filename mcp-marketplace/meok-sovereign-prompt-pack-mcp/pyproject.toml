[project]
name = "meok-sovereign-prompt-pack-mcp"
version = "1.0.0"
description = "Sovereign Prompt Pack MCP - 12 General personalities (system prompts). Argus/Scribe/Shield/Builder/Abacus/Lex/Scale/Crow/Gear/Voice/Owl/Dragon. Each with unique voice + tonality + role."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]