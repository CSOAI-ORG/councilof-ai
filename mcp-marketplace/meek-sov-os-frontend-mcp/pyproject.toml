[build-system]
requires = ["hatchling"]

[project]
name = "meek_sov_os_frontend_mcp"
version = "1.0.0"
description = "MEEK SOV OS Frontend MCP — the actual Cesium + R H bar + L H side + center chat frontend (HTML/CSS/JS). MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "sov-os", "frontend", "workflow", "permission", "gamification", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://csoai.org/sov-space"
Repository = "https://github.com/CSOAI-ORG/meek-sov-os-frontend-mcp"

[project.scripts]
meek-sov-os-frontend-mcp = "meek_sov_os_frontend_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_sov_os_frontend_mcp"]
