[build-system]
requires = ["hatchling"]

[project]
name = "meek_defoneos_uk_pilots_tracker_mcp"
version = "1.0.0"
description = "MEEK DEFONEOS UK Pilots Tracker MCP — the 7 UK prime outreach tracker. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "cold-email", "pricing", "seal", "uk-pilots", "knowledge-pack", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://defoneos.com"
Repository = "https://github.com/CSOAI-ORG/meek-defoneos-uk-pilots-tracker-mcp"

[project.scripts]
meek-defoneos-uk-pilots-tracker-mcp = "meek_defoneos_uk_pilots_tracker_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_defoneos_uk_pilots_tracker_mcp"]
