[build-system]
requires = ["hatchling"]

[project]
name = "meek_daily_plan_mcp"
version = "1.0.0"
description = "MEEK Daily Plan MCP — the daily orchestration (today priorities, this week sprints, blockers, decisions, progress). CRITICAL for non-stop work. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "truth", "honest", "daily", "shipped", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/meek-daily-plan-mcp"

[project.scripts]
meek-daily-plan-mcp = "meek_daily_plan_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_daily_plan_mcp"]
