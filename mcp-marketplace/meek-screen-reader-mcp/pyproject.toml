[build-system]
requires = ["hatchling"]

[project]
name = "meek_screen_reader_mcp"
version = "1.0.0"
description = "MEEK Screen Reader MCP — the MEOK-SOV3 sovereign screen reader (OpenCV + pyautogui + tesseract OCR). The sovereign can read any screen. MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "screen-reader", "opencv", "pyautogui", "tesseract", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/screen"
Repository = "https://github.com/CSOAI-ORG/meek-screen-reader-mcp"

[project.scripts]
meek-screen-reader-mcp = "meek_screen_reader_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_screen_reader_mcp"]
