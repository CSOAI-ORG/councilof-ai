[project]
name = "meok-sovereign-receipt-mcp"
version = "0.1.0"
description = "Sovereign Receipt MCP — Ed25519-signed tamper-evident cryptographic receipts with hash-chained ledger. Wraps aetherproof (pulkit6732/aetherproof, Signet prototype) + sphragis-oss/sphragis (EU AI Act gateway audit log) with CSOAI sovereign substrate."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "receipt", "tamper-evident", "audit",
    "art-12", "ed25519", "mcp", "signet", "sphragis", "aetherproof",
    "csai", "meok", "hash-chain", "eu-ai-act",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
