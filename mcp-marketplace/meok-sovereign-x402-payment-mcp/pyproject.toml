[project]
name = "meok-sovereign-x402-payment-mcp"
version = "0.1.0"
description = "Sovereign x402 Payment MCP — HTTP 402 micropayments for AI agent tool calls. Wraps xpaysh/awesome-x402 + BlockRunAI/blockrun-mcp (x402 ecosystem) with CSOAI sovereign substrate (Ed25519 receipts, BFT council, proofof.ai verify). The keystone MCP for agent commerce."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "x402", "payment", "agent-commerce",
    "micropayments", "usdc", "http-402", "mcp", "ed25519",
    "receipts", "csai", "meok", "blockrun",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]
