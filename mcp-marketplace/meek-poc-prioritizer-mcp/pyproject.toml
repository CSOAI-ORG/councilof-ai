[build-system]
requires = ["hatchling"]

[project]
name = "meek_poc_prioritizer_mcp"
version = "1.0.0"
description = "MEEK POC Prioritizer MCP — the TOP 10 most feasible findings + the CHEAPEST bootstrap path ($0 to £1K). CRITICAL for the POC roadmap."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "defoneos", "project-aurum", "poc", "prioritizer", "cheapest", "bootstrap", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/os"
Repository = "https://github.com/CSOAI-ORG/meek-poc-prioritizer-mcp"

[project.scripts]
meek-poc-prioritizer-mcp = "meek_poc_prioritizer_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_poc_prioritizer_mcp"]
