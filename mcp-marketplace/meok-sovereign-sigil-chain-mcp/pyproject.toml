[project]
name = "meok-sovereign-sigil-chain-mcp"
version = "1.0.0"
description = "Sovereign Sigil Chain MCP - Ed25519 sigil every hop + hash-chained + Bitcoin-anchored. Every event is signed, verifiable, and traceable back to the chain origin."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]