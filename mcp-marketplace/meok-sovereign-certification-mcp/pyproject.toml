[project]
name = "meok-sovereign-certification-mcp"
version = "1.0.0"
description = "Sovereign Certification MCP - W3C Verifiable Credentials + Ed25519 signatures + credential chain. 12-industry templates."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]