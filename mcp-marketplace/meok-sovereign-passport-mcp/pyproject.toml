[project]
name = "meok-sovereign-passport-mcp"
version = "0.1.0"
description = "Sovereign Agent Passport MCP — Ed25519-signed agent identity, delegation with narrowing invariant, gateway enforcement with signed receipts. Wraps APS protocol primitives with CSOAI sovereign substrate (BFT council, Maternal Covenant, proofof.ai verify)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nicholas Templeman", email = "nicholas@csoai.org" }]
requires-python = ">=3.10"
keywords = [
    "sovereign", "agent", "passport", "identity", "delegation",
    "ed25519", "mcp", "bft", "audit", "receipt",
    "sovereign-ai", "csai", "meok", "narrowing-invariant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://csoai.org"
Documentation = "https://proofof.ai/passport"
"APS" = "https://github.com/aeoess/agent-passport-system"
"APS-MCP" = "https://github.com/aeoess/agent-passport-mcp"
