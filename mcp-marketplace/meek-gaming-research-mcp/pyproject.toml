[build-system]
requires = ["hatchling"]

[project]
name = "meek_gaming_research_mcp"
version = "1.0.0"
description = "MEEK Gaming Research MCP — the WoW bot ecosystem research (10+ projects, 4 detection methods, 7 anti-detection techniques). MIT-licensed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@csoai.org"}]
keywords = ["mcp", "meek", "wow", "bot", "gaming", "sovereign", "uk", "open-source"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.0.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://meok.ai/gaming"
Repository = "https://github.com/CSOAI-ORG/meek-gaming-research-mcp"

[project.scripts]
meek-gaming-research-mcp = "meek_gaming_research_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["meek_gaming_research_mcp"]
