version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 6
  - package-ecosystem: "pip"
    directory: "/harness"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 4
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 4
