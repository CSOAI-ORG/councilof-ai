name: csoai-site deploy — full static site from csoai-static-deploy2 main

# THE ONE DEPLOYER for the Pages project csoai-site (owns csoai.org + www).
# Source of truth: CSOAI-ORG/csoai-static-deploy2 main (allowlist build).
# Replaces apex-redirect.yml (2-file bundle) — that deployer clobbered the
# full site (incl. the did:web trust root) whenever it ran; two repos must
# never deploy one Pages project. 2026-08-19: live apex served an orphan
# did.json while main held the real keys — this workflow ends that class.
#
# 2026-08-21: the kid-exists gate was too weak. A rollback to the 19 Aug
# three-key document (still advertising #mcp) still passed because both
# copies carry #site-release-1 and #estate-chain-1. Fail closed if the
# built or live document advertises MCPMeasurementServer, or if
# #card-attestation-1 is missing.
#
# 2026-08-31: deploy2 ca44ae1 allowlists root.json + schema/card-v0.json so csoai.org/root.json twins councilof.ai.
# 2026-08-31 leftover: GHA copies living cards+proofs from councilof.ai onto _site
# (root+schema+cards+proofs only; never SPA). Not wrangler from agents.
# 2026-09-01 leftover: fleet A100 dark + cite harvest promote (no agent wrangler).
# Push on this file starts a deploy.
# 2026-09-01 leftover: strip cwd functions before pages deploy (fix #55 308) 1808Z.
# 2026-09-01 leftover: drop functions so #55 _redirects 308 (#57) fire 1803Z.
# this token does not have it. Merging a change to this workflow is the
# agent-reachable path to refresh did:web:csoai.org.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 7 * * *'   # daily re-sync after the guards run
  push:
    branches: [master]
    paths:
      - '.github/workflows/csoai-site-deploy.yml'

concurrency: { group: csoai-site-deploy, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch source of truth (csoai-static-deploy2 main)
        run: git clone --depth 1 https://github.com/CSOAI-ORG/csoai-static-deploy2.git src
      - name: Build allowlisted _site
        working-directory: src
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          python3 build_site.py
          test -f _site/.well-known/did.json || { echo "FATAL: build lacks did.json"; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open('_site/.well-known/did.json'))
          kids = [m['id'] for m in d['verificationMethod']]
          required = [
              'did:web:csoai.org#site-release-1',
              'did:web:csoai.org#estate-chain-1',
              'did:web:csoai.org#card-attestation-1',
          ]
          missing = [k for k in required if k not in kids]
          assert not missing, ('missing kids', missing, kids)
          types = [s.get('type') for s in d.get('service') or []]
          assert 'MCPMeasurementServer' not in types, types
          print('did.json kids OK:', kids)
          print('did.json services OK:', types)
          PY
      - name: Twin living cards+proofs from councilof.ai (not SPA)
        working-directory: src
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = json.loads(pathlib.Path('_site/root.json').read_text())
          print('twin as_of', root.get('as_of'), 'merkle', root.get('merkle_root'), 'n', root.get('card_count'))
          for dname in ('cards', 'proofs'):
              pathlib.Path('_site', dname).mkdir(parents=True, exist_ok=True)
          for sha in root['card_sha256']:
              s16 = sha[:16]
              for kind in ('cards', 'proofs'):
                  url = f'https://councilof.ai/{kind}/{s16}.json'
                  dest = pathlib.Path('_site') / kind / f'{s16}.json'
                  subprocess.check_call(['curl', '-sS', '-f', '--max-time', '25', '-A', 'csoai-site-deploy', '-o', str(dest), url])
                  print(kind, s16, dest.stat().st_size)
          print('twinned cards+proofs only; no SPA')
          PY
      - name: Drop repo-root functions so _redirects can win
        working-directory: src
        run: |
          # wrangler pages deploy _site still bundles cwd/functions/ even when
          # build_site omittted functions from _site (see #55/#57). Pages
          # Functions override _redirects — remove before upload.
          rm -rf functions _site/functions
          test ! -d functions
          test -f _site/_redirects
          echo "functions stripped; _redirects present"
      - name: Deploy to csoai-site production
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
        run: npx wrangler pages deploy _site --project-name=csoai-site --branch=main --commit-dirty=true
      - name: Verify trust root live on the apex
        run: |
          # www lags apex by up to ~a minute of edge propagation — retry before failing
          python3 - <<'PY'
          import json, subprocess, sys, time
          required = {'site-release-1', 'estate-chain-1', 'card-attestation-1'}
          # Apex is the DID. www HTTPS is a known ghost (HTTP 302 only) —
          # a TLS timeout there is PARTIAL, not a failed apex.
          for host, must in (('csoai.org', True), ('www.csoai.org', False)):
              ok = False
              last = ''
              for i in range(1, 7):
                  time.sleep(10)
                  try:
                      raw = subprocess.check_output(
                          ['curl', '-sS', '--max-time', '20', f'https://{host}/.well-known/did.json', '-H', 'Cache-Control: no-cache'],
                          text=True,
                      )
                  except subprocess.CalledProcessError as e:
                      last = f'curl exit {e.returncode}'
                      print(f'{host} attempt {i}: {last}')
                      if not must:
                          print(f'PARTIAL: {host} HTTPS ghost — apex is the DID')
                          ok = True
                          break
                      continue
                  try:
                      d = json.loads(raw)
                  except json.JSONDecodeError:
                      print(f'{host} attempt {i}: not JSON')
                      continue
                  kids = sorted(m['id'].split('#')[-1] for m in d.get('verificationMethod') or [])
                  types = [s.get('type') for s in d.get('service') or []]
                  last = f'kids={kids} services={types}'
                  print(f'{host} attempt {i} {last}')
                  if required.issubset(kids) and 'MCPMeasurementServer' not in types:
                      ok = True
                      break
              if not ok:
                  print(f'FAIL: {host} did.json still stale after 6 attempts ({last})')
                  sys.exit(1)
          PY
          curl -s -o /dev/null -w "redirect: %{http_code} -> %{redirect_url}\n" https://csoai.org/some-page
          python3 - <<'PY'
          import json, subprocess, sys
          root = json.loads(subprocess.check_output(['curl','-sS','--max-time','20','https://csoai.org/root.json'], text=True))
          merkle = root['merkle_root']
          sha16 = root['card_sha256'][0][:16]
          card = subprocess.check_output(['curl','-sS','-o','/tmp/csoai-card.json','-w','%{http_code}','--max-time','20', f'https://csoai.org/cards/{sha16}.json'], text=True)
          proof = subprocess.check_output(['curl','-sS','-o','/tmp/csoai-proof.json','-w','%{http_code}','--max-time','20', f'https://csoai.org/proofs/{sha16}.json'], text=True)
          print('live merkle', merkle, 'card', card, 'proof', proof, 'sha16', sha16)
          if card != '200' or proof != '200':
              print('WAIT GHA: cards/proofs not live yet')
              sys.exit(1)
          PY
