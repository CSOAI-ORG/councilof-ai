name: csoai-site deploy — full static site from csoai-static-deploy2 main

# THE ONE DEPLOYER for the Pages project csoai-site (owns csoai.org + www).
# Source of truth: CSOAI-ORG/csoai-static-deploy2 main (allowlist build).
# Replaces apex-redirect.yml (2-file bundle) — that deployer clobbered the
# full site (incl. the did:web trust root) whenever it ran; two repos must
# never deploy one Pages project. 2026-08-19: live apex served an orphan
# did.json while main held the real keys — this workflow ends that class.
#
# 2026-08-21: the kid-exists gate was too weak. A rollback to the 19 Aug
# three-key document (still advertising #mcp) still passed because both
# copies carry #site-release-1 and #estate-chain-1. Fail closed if the
# built or live document advertises MCPMeasurementServer, or if
# #card-attestation-1 is missing.
#
# 2026-08-31: deploy2 ca44ae1 allowlists root.json + schema/card-v0.json so csoai.org/root.json twins councilof.ai.
# 2026-08-31 leftover: GHA copies living cards+proofs from councilof.ai onto _site
# (root+schema+cards+proofs only; never SPA). Not wrangler from agents.
# 2026-09-01 leftover: fleet A100 dark + cite harvest promote (no agent wrangler).
# Push on this file starts a deploy.
# 2026-09-01 leftover: strip cwd functions before pages deploy (fix #55 308) 1808Z.
# 2026-09-01 leftover: drop functions so #55 _redirects 308 (#57) fire 1803Z.
# 2026-09-01: Advanced Mode ignores _redirects — inject redirect-only
# functions/_middleware.js (keep /.well-known for did:web).
# 2026-09-11 (TUI-1): byte-serving parity at /root.json was tried and
# REVERTED the same day — the apex deploys daily while the root republishes
# hourly, so static apex bytes go stale within the hour and turn the
# public-root-watcher permanently red. The 2 Sep owner ruling stands:
# 308 IS the parity mechanism for the hourly-moving surface; the watcher
# follows it and compares post-redirect bytes. Only slow-moving content
# (/.well-known/* incl. scitt-keys) is twinned as bytes.
# this token does not have it. Merging a change to this workflow is the
# agent-reachable path to refresh did:web:csoai.org.
#
# 2026-10-13: the agent card is twinned from councilof.ai as bytes, like scitt-keys.
# csoai-static-deploy2 main still holds the 0.1.0 card (2 skills, signed under the
# card's own rule with #site-release-1, then edited on 23 Sep without re-signing), so
# every build from it puts back the card that corrections entry C-2026-0927-05 says
# csoai.org no longer serves. The card has one producer (councilof-ai:
# scripts/agent-card-extensions.mjs + scripts/adapters/agent_card_jws.py). The apex
# copies the bytes that producer serves, and refuses a copy that presents a signature
# which does not verify under the DID document shipped in the same deploy.
# The last step proves the apex serves those bytes. Read on 13 Oct, it would not have:
# since 6 Oct the deploy step prints "Deployment alias URL: https://main.csoai-site.pages.dev"
# (the 14 Sep run did not), and what these runs upload is served there and not on
# csoai.org or csoai-site.pages.dev. That is what a PREVIEW deployment looks like. The
# Pages project's production-branch setting was not read; it is the first thing to check.
#
# 2026-11-17: read through the Pages API. csoai-site's production branch is `master`, so every
# `--branch=main` run since early October made a preview (main.csoai-site.pages.dev), and
# csoai.org kept serving a hand upload from 3 Oct (deployment 8c45f262). This workflow now
# deploys to `master`. Before the switch the build was compared with that deployment, file by
# file: every /.well-known file and the fallback page are the same bytes, except four on
# purpose. did.json adds #layer0-attestation-1, the key councilof.ai /api/a2a/route signs with.
# agent-card.json and agent.json are twinned from councilof.ai, because the 0.1.0 card live
# there fails its own #site-release-1 signature. scitt-keys is twinned because live has none.
# Two defects were fixed on the way:
# - The middleware built its target with new URL(path, 'https://councilof.ai'). That resolves
#   //evil.com to https://evil.com/, an open redirect, and the main preview served it. Now the
#   target is the fixed origin plus the path, joined as strings, as in the 28 Sep live fix,
#   and a probe refuses to deploy a middleware that sends any path off-site.
# - Cards and proofs are no longer twinned. The middleware 308s /cards and /proofs, so those
#   files were never served. Fetching about 600 of them reset the connection and stopped
#   every run before the deploy step.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 7 * * *'   # daily re-sync after the guards run
  push:
    branches: [master]
    paths:
      - '.github/workflows/csoai-site-deploy.yml'

concurrency: { group: csoai-site-deploy, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch source of truth (csoai-static-deploy2 main)
        run: git clone --depth 1 https://github.com/CSOAI-ORG/csoai-static-deploy2.git src
      - name: Build allowlisted _site
        working-directory: src
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          python3 build_site.py
          test -f _site/.well-known/did.json || { echo "FATAL: build lacks did.json"; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open('_site/.well-known/did.json'))
          kids = [m['id'] for m in d['verificationMethod']]
          required = [
              'did:web:csoai.org#site-release-1',
              'did:web:csoai.org#estate-chain-1',
              'did:web:csoai.org#card-attestation-1',
              'did:web:csoai.org#layer0-attestation-1',
          ]
          missing = [k for k in required if k not in kids]
          assert not missing, ('missing kids', missing, kids)
          types = [s.get('type') for s in d.get('service') or []]
          assert 'MCPMeasurementServer' not in types, types
          print('did.json kids OK:', kids)
          print('did.json services OK:', types)
          PY
      - name: Twin scitt-keys from councilof.ai (key discovery, bytes)
        working-directory: src
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, time
          # 2026-09-11: twin the SCITT key-discovery doc (public key material only, never a
          # transparency-service claim). Retry: this workflow races the main deploy when both
          # fire off the same merge. Cards and proofs are not twinned: the middleware 308s
          # /cards and /proofs to councilof.ai, so those files were never served (2026-11-17).
          sk = pathlib.Path('_site/.well-known')
          sk.mkdir(parents=True, exist_ok=True)
          for _try in range(1, 7):
              rc = subprocess.call(['curl', '-sS', '-f', '--max-time', '25', '-A', 'csoai-site-deploy',
                                    '-o', str(sk / 'scitt-keys'),
                                    'https://councilof.ai/.well-known/scitt-keys'])
              if rc == 0:
                  break
              print(f'scitt-keys fetch attempt {_try} failed (rc={rc}); waiting for the main deploy')
              time.sleep(20)
          else:
              raise SystemExit('scitt-keys never became fetchable on councilof.ai')
          jsk = json.loads((sk / 'scitt-keys').read_text())
          assert jsk.get('we_operate_a_ts') is False and jsk.get('keys'), 'scitt-keys malformed'
          print('twinned scitt-keys', (sk / 'scitt-keys').stat().st_size, 'bytes,', len(jsk['keys']), 'keys')
          PY
      - name: Fetch the independent agent-card verifier (this repository)
        uses: actions/checkout@v4
        with:
          path: canon
          sparse-checkout: |
            scripts/verify_agent_card_jws.py
            scripts/custody-wording-guard.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The DID this deploy ships makes no uncorrected split-custody claim (C-2026-0925-01)
        run: |
          # This repo's custody wording guard covers public/.well-known/did.json. Nothing covered
          # the apex copy, so csoai.org kept the "3-party cb-mpc" wording for six weeks after the
          # correction. Same rule and same code (scanText), applied to the DID this deploy ships.
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { scanText } = await import(`file://${process.cwd()}/canon/scripts/custody-wording-guard.mjs`);
          const hits = scanText(readFileSync('src/_site/.well-known/did.json', 'utf8'));
          for (const h of hits) console.error(`did.json:${h.line}: "${h.match}" with no correction context: ${h.excerpt}`);
          if (hits.length) {
            console.error('::error::the DID this deploy ships makes the split-custody claim C-2026-0925-01 withdrew; correct .well-known/did.json in csoai-static-deploy2');
            process.exit(1);
          }
          console.log('did.json: no uncorrected split-custody claim');
          JS
      - name: Twin the agent card from councilof.ai (bytes, verified against the DID this deploy ships)
        run: |
          # One producer, two origins. Overwrites the 0.1.0 card that build_site.py copied
          # from csoai-static-deploy2. Exit codes of the verifier: 0 VALID, 1 INVALID,
          # 2 UNSIGNED, 4 tamper control failed. VALID ships. UNSIGNED ships with a warning
          # (an unsigned card claims nothing, and parity is the point). Anything else stops
          # the deploy: the apex never serves a card whose signature does not verify under
          # the DID document served beside it.
          python3 -m pip install --quiet --disable-pip-version-check "cryptography>=42"
          wk=src/_site/.well-known
          test -f "$wk/did.json"
          for f in agent-card.json agent.json; do
            curl -sS -f --retry 5 --retry-delay 20 --max-time 25 \
              -A csoai-site-deploy -o "$wk/$f" "https://councilof.ai/.well-known/$f"
            rc=0
            python3 canon/scripts/verify_agent_card_jws.py --card "$wk/$f" --did "$wk/did.json" --tamper-control || rc=$?
            case "$rc" in
              0) echo "$f: VALID under the DID document this deploy ships" ;;
              2) echo "::warning::councilof.ai serves $f UNSIGNED; twinned unsigned" ;;
              *) echo "::error::councilof.ai $f does not verify under the DID document this deploy ships (verifier rc=$rc); refusing to publish it on csoai.org"
                 exit 1 ;;
            esac
          done
          sha256sum "$wk/agent-card.json" "$wk/agent.json"
      - name: Inject redirect-only middleware (OWNER one-site)
        working-directory: src
        run: |
          # Advanced Mode ignores _redirects. Old API functions overrode
          # redirects; bare strip left sticky 200 HTML. Ship ONLY a
          # middleware that 308s everything except /.well-known/* (did:web).
          rm -rf functions _site/functions
          mkdir -p functions
          cat > functions/_middleware.js <<'JS'
          export async function onRequest(context) {
            const url = new URL(context.request.url);
            const p = url.pathname;
            // 308 everything except /.well-known/* (did:web + scitt-keys key
            // discovery — slow-moving, safe to twin as bytes). The hourly-moving
            // trust surface (root.json, cards, proofs, schema) redirects to the
            // canonical host; verifiers follow the 308 to identical bytes.
            if (p.startsWith('/.well-known/')) {
              return context.next();
            }
            // The target is the fixed origin plus the path, joined as strings. Never
            // new URL(path, base): a path such as //evil.com resolves against any base
            // to https://evil.com/, an open redirect. Leading / and \ are stripped too,
            // so councilof.ai never receives a path a browser could read as a host.
            const rest = (p + url.search).replace(/^[\/\\]+/, '');
            return Response.redirect('https://councilof.ai/' + rest, 308);
          }
          JS
          test -f functions/_middleware.js
          test -f _site/.well-known/did.json
          # Probe the middleware before it ships: /.well-known/* is served, everything else
          # 308s to councilof.ai, and no path (//x, /\x, ///x) may leave councilof.ai.
          cp functions/_middleware.js "$RUNNER_TEMP/csoai-middleware.mjs"
          node --input-type=module - <<'JS'
          const { onRequest } = await import(`file://${process.env.RUNNER_TEMP}/csoai-middleware.mjs`);
          const wrong = [];
          for (const p of ['/', '/x?y=1', '//evil.com', '//evil.com/x', '/\\evil.com', '///evil.com',
                           '/\\/evil.com', '/.well-known', '/.well-known/did.json', '/.well-known/../root.json']) {
            const r = await onRequest({ request: new Request('https://csoai.org' + p), next: async () => new Response('static') });
            const loc = r.headers.get('location');
            const served = new URL('https://csoai.org' + p).pathname.startsWith('/.well-known/');
            const ok = served ? r.status === 200 && !loc : r.status === 308 && new URL(loc).host === 'councilof.ai';
            console.log(JSON.stringify(p), r.status, loc || '(served)', ok ? 'ok' : 'WRONG');
            if (!ok) wrong.push(p);
          }
          if (wrong.length) { console.error('::error::the middleware misroutes', wrong); process.exit(1); }
          JS
          echo "redirect-only middleware ready"
      - name: Deploy to csoai-site production
        id: deploy
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
        run: npx wrangler pages deploy _site --project-name=csoai-site --branch=master --commit-dirty=true
      - name: Verify trust root live on the apex
        run: |
          # www lags apex by up to ~a minute of edge propagation — retry before failing
          python3 - <<'PY'
          import json, subprocess, sys, time
          required = {'site-release-1', 'estate-chain-1', 'card-attestation-1', 'layer0-attestation-1'}
          APEX_DID = 'https://csoai.org/.well-known/did.json'
          # Apex is the DID: it must answer 200 itself, with no redirect. www may redirect, but
          # only to the apex DID. It is fetched with -L, and the final URL must be APEX_DID with
          # the same key set. Since 17 Nov 2026, www answers 308 to APEX_DID; reading that empty
          # 308 body as "not JSON" failed run 44006964706 after a good deploy. A TLS failure on
          # www is still PARTIAL (the old HTTPS ghost), not a failed apex.
          for host, must in (('csoai.org', True), ('www.csoai.org', False)):
              ok = False
              last = ''
              for i in range(1, 7):
                  time.sleep(10)
                  cmd = ['curl', '-sS', '--max-time', '20', '-H', 'Cache-Control: no-cache',
                         '-w', '\n%{http_code} %{url_effective}', f'https://{host}/.well-known/did.json']
                  if not must:
                      cmd.insert(1, '-L')
                  try:
                      out = subprocess.check_output(cmd, text=True)
                  except subprocess.CalledProcessError as e:
                      last = f'curl exit {e.returncode}'
                      print(f'{host} attempt {i}: {last}')
                      if not must:
                          print(f'PARTIAL: {host} HTTPS ghost — apex is the DID')
                          ok = True
                          break
                      continue
                  raw, _, status = out.rpartition('\n')
                  code, _, final = status.partition(' ')
                  if code != '200' or final != APEX_DID:
                      last = f'HTTP {code} at {final}'
                      print(f'{host} attempt {i}: {last}; want 200 at {APEX_DID}')
                      continue
                  try:
                      d = json.loads(raw)
                  except json.JSONDecodeError:
                      print(f'{host} attempt {i}: not JSON')
                      continue
                  kids = sorted(m['id'].split('#')[-1] for m in d.get('verificationMethod') or [])
                  types = [s.get('type') for s in d.get('service') or []]
                  last = f'kids={kids} services={types}'
                  print(f'{host} attempt {i} {last}')
                  if required.issubset(kids) and 'MCPMeasurementServer' not in types:
                      ok = True
                      break
              if not ok:
                  print(f'FAIL: {host} did.json still stale after 6 attempts ({last})')
                  sys.exit(1)
          PY
          # 2026-09-11 (TUI-1): redirect-parity at the trust surface —
          # csoai.org/root.json 308s to the canonical host; following the
          # redirect must yield the identical document. scitt-keys is served
          # as bytes on the apex (well-known exemption) and must be well-formed.
          python3 - <<'PY'
          import json, subprocess, sys, time
          def fetch(url, follow=False):
              args = ['curl', '-sS', '--max-time', '20', url, '-H', 'Cache-Control: no-cache']
              if follow:
                  args.insert(1, '-L')
              return subprocess.check_output(args)
          for i in range(1, 7):
              try:
                  apex = json.loads(fetch('https://csoai.org/root.json', follow=True))
                  canon = json.loads(fetch('https://councilof.ai/root.json'))
                  jsk = json.loads(fetch('https://csoai.org/.well-known/scitt-keys'))
                  assert apex.get('merkle_root') == canon.get('merkle_root'), 'merkle differs after redirect'
                  assert apex.get('as_of') == canon.get('as_of'), 'as_of differs after redirect'
                  assert jsk.get('we_operate_a_ts') is False and jsk.get('keys'), 'scitt-keys malformed'
                  print(f'parity OK on attempt {i}: merkle {canon["merkle_root"][:16]}… (apex 308→identical), scitt-keys kids {len(jsk["keys"])}')
                  sys.exit(0)
              except Exception as e:
                  print(f'parity attempt {i}: {type(e).__name__} {e}')
                  time.sleep(10)
          print('FAIL: apex trust-surface parity not achieved')
          sys.exit(1)
          PY
          # Prove OWNER one-site redirect (not twin HTML)
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -I https://csoai.org/)
          loc=$(curl -sS -o /dev/null -w "%{redirect_url}" --max-time 20 -I https://csoai.org/)
          echo "apex / : $code -> $loc"
          echo "$code" | grep -q '^308$' || { echo "FAIL: expected 308 on /"; exit 1; }
          echo "$loc" | grep -q 'councilof.ai' || { echo "FAIL: Location must be councilof.ai"; exit 1; }
          curl -s -o /dev/null -w "redirect-path: %{http_code} -> %{redirect_url}\n" https://csoai.org/some-page
          # No open redirect: a path that starts with // or /\ stays on councilof.ai.
          for p in '//evil.com' '/\evil.com' '///evil.com'; do
            loc=$(curl -sS -o /dev/null -w "%{redirect_url}" --max-time 20 --path-as-is "https://csoai.org$p")
            echo "apex $p -> $loc"
            case "$loc" in https://councilof.ai/*) ;; *) echo "FAIL: $p redirects off councilof.ai ($loc)"; exit 1 ;; esac
          done
          # The key councilof.ai /api/a2a/route signs with must be the one this DID publishes,
          # so a stranger can verify a route envelope from published bytes alone.
          python3 - <<'PY'
          import base64, json, subprocess, sys, time
          def get(url):
              return json.loads(subprocess.check_output(
                  ['curl', '-sS', '-f', '--max-time', '20', '-H', 'Cache-Control: no-cache', url]))
          for i in range(1, 7):
              try:
                  did = get('https://csoai.org/.well-known/did.json')
                  key = get('https://councilof.ai/api/a2a/key')
                  der = base64.b64decode(key['publicKey'])
                  assert der[:12].hex() == '302a300506032b6570032100', 'not an Ed25519 SPKI'
                  x = base64.urlsafe_b64encode(der[12:]).rstrip(b'=').decode()
                  vm = {m['id']: m for m in did['verificationMethod']}.get(key['kid'])
                  assert vm, f"the DID does not list {key['kid']}"
                  assert vm['publicKeyJwk']['x'] == x, f"DID x {vm['publicKeyJwk']['x']} != /api/a2a/key x {x}"
                  assert key['kid'] in did.get('assertionMethod', []), f"{key['kid']} is not an assertionMethod"
                  print(f"{key['kid']} published in the DID: x {x}")
                  sys.exit(0)
              except Exception as e:
                  print(f'layer0 key attempt {i}: {type(e).__name__} {e}')
                  time.sleep(10)
          print('FAIL: the live DID does not publish the key /api/a2a/route signs with')
          sys.exit(1)
          PY
      - name: Verify the agent card on the apex (the bytes this run twinned)
        # Reports whether or not the step above passed, so each red step names its own fact.
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          wk=src/_site/.well-known
          for i in 1 2 3 4 5 6; do
            sleep 10
            ok=1
            for f in agent-card.json agent.json; do
              curl -sS -f --max-time 20 -H 'Cache-Control: no-cache' -o "apex-$f" "https://csoai.org/.well-known/$f" || { ok=0; continue; }
              cmp -s "apex-$f" "$wk/$f" || ok=0
            done
            if [ "$ok" = 1 ]; then
              echo "csoai.org serves the twinned agent card on attempt $i"
              sha256sum apex-agent-card.json apex-agent.json
              exit 0
            fi
            echo "attempt $i: csoai.org does not serve the twinned bytes"
          done
          sha256sum "$wk/agent-card.json" "$wk/agent.json" apex-agent-card.json apex-agent.json || true
          echo "::error::csoai.org does not serve the agent card this run deployed. If the deploy step printed 'Deployment alias URL', this run made a PREVIEW deployment: the Pages project's production branch is not 'main', and csoai.org was not updated."
          exit 1
