name: deepseek-identity-probe

# A receipt of what DeepSeek's API says it served, around the announced 2026-09-14 04:00 UTC
# reroute of V4-Pro traffic to V4.1-Flash. Three runs bracket the hour; the workflow_dispatch
# is for a baseline or a re-check. It commits the JSON receipts to a branch and opens a PR —
# it never writes master, never grades, never says which model is better.
#
# Needs the DEEPSEEK_API_KEY repo secret. Without it the job records REFUSED (no key) and
# exits 0: a missing key is a fact to show, not a red run to hide.

on:
  # The 14 Sep 2026 04:00Z reroute window has passed. The date-pinned crons had no year field
  # (cron has none), so they would have fired again every 14 September; GitHub also throttled
  # the 03:45 slot to 09:15Z on the day itself. Dispatch only from here on.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: { group: deepseek-identity-probe, cancel-in-progress: false }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/probes
            public/interop/deepseek-identity
          sparse-checkout-cone-mode: true

      - name: Probe (receipt only)
        id: probe
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p public/interop/deepseek-identity
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            printf '{"schema":"csoai.model-identity-probe/0.1","provider":"deepseek","probed_at":"%s","state":"REFUSED","reason":"DEEPSEEK_API_KEY secret absent — nothing probed, nothing inferred"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "public/interop/deepseek-identity/deepseek-identity-$ts.json"
            echo "no key — recorded REFUSED"
          else
            python3 scripts/probes/deepseek-identity-probe.py --out public/interop/deepseek-identity
          fi

      - name: Open a PR with the receipt (never push master)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "csoai-identity-probe"
          git config user.email "nicholas@csoai.org"
          br="probe/deepseek-identity-$(date -u +%Y%m%dT%H%M)"
          git checkout -b "$br"
          git add public/interop/deepseek-identity
          git commit -m "probe: DeepSeek identity receipt $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          git push -u origin "$br"
          gh pr create --base master --head "$br" --title "probe: DeepSeek API outcome receipt $(date -u +%Y-%m-%dT%H:%MZ)" --body "Records the API catalogue and per-request outcomes during DeepSeek's announced V4-Pro → V4.1-Flash reroute window. A served-model identity is observed only when a request responds and reports it; refusals remain refusals. This is a receipt, not a grade or quality claim. Human review before merge." || true
