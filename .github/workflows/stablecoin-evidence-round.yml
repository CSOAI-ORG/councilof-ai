name: stablecoin-evidence-round

# Daily, zero-inference stablecoin evidence round.
#
# Network work is limited to the 19 registered issuer/auditor pages in the
# frozen top-20 queue. Every response is archived with its digest. The derived
# 425-row promotion queue names the next evidence-producing action for every
# asset. INDEXED, DEEP_PROBED and MEASURED remain separate states.
#
# The workflow updates one rolling branch and one PR. It never pushes master
# directly; required gates review the exact generated bytes before auto-merge.
# The hourly public-root writer then signs new deep-probe cards and gives the
# exact resulting root its normal Rekor/OpenTimestamps lifecycle.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: stablecoin-evidence-round
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the full-universe source registry (weekly, keyless)
        # Sundays only (or manual dispatch): re-fetches the keyless DefiLlama
        # per-asset detail `url` for all 425 identities and re-registers issuer
        # sites. Daily rounds reuse the committed registry and never refetch it.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            python3 scripts/build_stablecoin_source_registry.py
          else
            python3 scripts/build_stablecoin_source_registry.py --offline
          fi
      - name: Fetch and archive registered primary evidence
        run: python3 scripts/build_stablecoin_deep.py
      - name: Rebuild the executable 425-asset promotion queue
        run: python3 scripts/build_stablecoin_promotion_queue.py
      - name: Prove the reader and queue contracts
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_stablecoin_deep_adapter.py \
            scripts/test_stablecoin_promotion_queue.py
          python3 scripts/build_stablecoin_promotion_queue.py --check
      - name: Land one reviewed rolling update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "csoai-stablecoin-evidence"
          git config user.email "evidence@csoai.org"
          git add -- \
            public/interop/stablecoin-deep-2026-09/deep.json \
            public/interop/stablecoin-deep-2026-09/artefact-manifest.json \
            public/interop/stablecoin-deep-2026-09/mirrors \
            public/interop/stablecoin-deep-2026-09/sources.json \
            public/interop/stablecoin-deep-2026-09/source-detail-cache.json \
            public/interop/stablecoin-universe-2026-09/promotion-queue.json
          if git diff --cached --quiet; then
            echo "no evidence change — nothing to land"
            exit 0
          fi
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          branch="measurement/stablecoin-evidence-round"
          git checkout -B "$branch"
          git commit -m "stablecoins: primary-evidence round (${stamp})"
          git push --force origin "HEAD:refs/heads/${branch}"
          url=$(gh pr list --head "$branch" --base master --state open --json url --jq '.[0].url')
          if [ -z "${url:-}" ]; then
            url=$(gh pr create --base master --head "$branch" \
              --title "stablecoins: daily primary-evidence round" \
              --body "Machine-generated daily round. Archives registered issuer/auditor bytes and hashes, refreshes the top-20 deep probe, and rebuilds the complete 425-row evidence-promotion queue. No inference spend. DEEP_PROBED is not MEASURED; payments never promote evidence state.")
          fi
          gh pr merge "$url" --squash --auto || echo "auto-merge unavailable; exact generated PR remains open for review: $url"
          echo "rolling evidence PR: $url"
