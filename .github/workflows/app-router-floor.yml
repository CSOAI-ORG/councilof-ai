name: app-router-floor

# This job reads exactly one file: client/src/App.tsx. It fired on every push to
# master and every pull_request regardless, which is a whole runner spent to `wc -c`
# a file the push never touched. Path-filtered 2026-08-26 to cut per-push fan-out.
# Nothing about the check itself changed — it still blocks a truncated router.
on:
  push:
    branches: [master, main]
    paths:
      - 'client/src/App.tsx'
      - 'scripts/resolve-app-tsx.mjs'
      - '.github/workflows/app-router-floor.yml'
  pull_request:
    paths:
      - 'client/src/App.tsx'
      - 'scripts/resolve-app-tsx.mjs'
      - '.github/workflows/app-router-floor.yml'
jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: App.tsx must carry the full router (block truncation)
        run: |
          set -euo pipefail
          f=client/src/App.tsx
          bytes=$(wc -c < "$f")
          [ "$bytes" -ge 40000 ] || { echo "FAIL: $f is $bytes bytes (<40000) — router truncated"; exit 1; }
          grep -q "<Switch>" "$f" || { echo "FAIL: $f lost its <Switch>"; exit 1; }
          grep -q "export default App" "$f" || { echo "FAIL: $f lost 'export default App'"; exit 1; }
          echo "OK: $f $bytes bytes, Switch + export present"
