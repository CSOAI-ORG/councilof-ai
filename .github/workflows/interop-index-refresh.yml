name: interop-index-refresh
on:
  schedule:
    - cron: "43 */6 * * *"   # every 6h, staggered off the drift reporter's 05:41 and off :17 / :23 / :29
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: interop-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WHY THIS EXISTS. public/interop/file-index.json is a MEASUREMENT of the corpus it
      # names: every path under /interop/, with its size, its sha256 and how it is served. Its
      # promise is that a reader can fetch a path, hash it, and get what the estate published.
      #
      # Two things make it drift. The corpus carries auto-generated daily snapshots (watchdog-
      # intake, x402-trust, mcp-trust/latest.json, hf-census, the stablecoin-deep mirrors), so
      # it moves on almost every merge — measured at about 6.5 rows an hour, 128 rows in
      # 19.8 hours. And nothing enforced the builder's own rule, "regenerate and commit the
      # index in the SAME pull request that changes the corpus", because no pull request can
      # carry a re-measurement of 16,000 files.
      #
      # .github/workflows/interop-index-drift.yml REPORTS the drift every night, into one issue,
      # so the estate can see it. It does not repair it. This job is the repair: it re-measures
      # and lands the result, the same way catalog-trust-round.yml and census-delta.yml do.
      #
      # IT IS NOT A PULL-REQUEST GATE. A rule that fails when the corpus moved would be red on
      # master constantly, because the corpus churns on almost every merge, and a gate that
      # cries wolf protects nothing. The schedule is the repair; the nightly reporter is the
      # alarm. Whether each daily round should instead carry a 16k-row index diff is the
      # owner's ruling, not this workflow's.
      #
      # THE DIGESTS ARE TAKEN OVER THE SERVED BYTES. The build injects the Council OS launcher
      # into every HTML document it serves, so the tree's bytes are not what a reader fetches.
      # The producer therefore needs the BUILT tree (--served-root dist/client), and this job
      # builds it — which is also why the digests cannot be compared without one: the producer
      # reports those rows as UNCHECKABLE, and uncheckable is not drift.

      - name: Build the tree the digests are taken over
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:client

      - name: Has the measurement moved?
        id: moved
        run: |
          set -uo pipefail
          python3 scripts/build-interop-file-index.py \
            public/interop public/interop/file-index.json scripts/deploy-exclusions.json "$GITHUB_SHA" \
            --served-root dist/client --check
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::the interop index could not be measured (the corpus, the exclusions manifest or the built tree is unreadable). The index is not being kept current, and this is not the same as 'no drift'."
            exit 1
          fi
          echo "changed=$rc" >> "$GITHUB_OUTPUT"

      - name: Re-measure the corpus, and the llms views that quote it
        if: steps.moved.outputs.changed == '1'
        run: |
          set -euo pipefail
          python3 scripts/build-interop-file-index.py \
            public/interop public/interop/file-index.json scripts/deploy-exclusions.json "$GITHUB_SHA" \
            --served-root dist/client
          # The llms views quote the index's as_of, so they are regenerated with it. They are a
          # PAIR: a moved index with a stale llms view publishes two surfaces that disagree
          # about the same measurement.
          node scripts/llms-txt.mjs

      - name: land the measurement (via PR — master is GH006-protected)
        if: steps.moved.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN || secrets.GITHUB_TOKEN }}  # SNAPSHOT_PR_TOKEN: a PR opened with it fires pull_request checks; GITHUB_TOKEN cannot
        run: |
          set -euo pipefail
          git config user.name "csoai-interop-index"
          git config user.email "index@csoai.org"
          git add public/interop/file-index.json public/llms.txt public/llms-full.txt
          if git diff --cached --quiet; then
            echo "no measurement change — nothing to land"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          BR="interop/index-refresh-${STAMP}"
          git checkout -b "$BR"
          git commit -m "interop-index: re-measure the published interop tree (${STAMP})"
          git push origin "HEAD:$BR"
          URL=$(gh pr create --base master --head "$BR" \
            --title "interop-index: re-measure the published interop tree (${STAMP})" \
            --body "Machine-produced re-measurement of the published interop tree (.github/workflows/interop-index-refresh.yml). The index lists every path under /interop/ with its size, its sha256 and how it is served; a reader can fetch a path and hash it and get what the estate published. It drifts with every merge, because the corpus moves daily and no pull request can carry a re-measurement of 16,000 files, so it is re-measured here on a schedule. The digests are taken over the BUILT tree, because the build injects the Council OS launcher into the HTML it serves. The llms views are regenerated with it: they quote the index's as_of, and the two are a PAIR. Lands via PR because master push is GH006-protected.")
          gh workflow run pr-gates.yml --repo "$GITHUB_REPOSITORY" --ref "$BR"
          gh pr merge "$URL" --repo "$GITHUB_REPOSITORY" --squash --auto
          echo "landed branch=$BR"
