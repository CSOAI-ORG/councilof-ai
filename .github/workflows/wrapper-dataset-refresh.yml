name: wrapper-dataset-refresh

# Auto-refresh the wrapped-asset-parity Hugging Face dataset whenever the
# source file changes on master. Keeps HF in parity with the live site.
#
# Trigger: push to master touching public/interop/wrapped-asset-parity-latest.json
# Action:  upload to csoai/wrapped-asset-parity on Hugging Face via hf

on:
  push:
    branches: [master]
    paths:
      - 'public/interop/wrapped-asset-parity-latest.json'
      - 'public/interop/wrapped-asset-parity-2026-09/**'
      - '.github/workflows/wrapper-dataset-refresh.yml'
      - 'scripts/test_wrapper_dataset_refresh.py'
  workflow_dispatch:

concurrency:
  group: wrapper-dataset-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Upload to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/interop/wrapped-asset-parity-latest.json
            public/interop/wrapped-asset-parity-2026-09
            .github/workflows/wrapper-dataset-refresh.yml
            scripts/test_wrapper_dataset_refresh.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "huggingface_hub>=1,<2"

      - name: Validate exporter
        run: python3 scripts/test_wrapper_dataset_refresh.py

      - name: Upload to HF dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          SRC_DIR="public/interop"
          HF_DATASET="csoai/wrapped-asset-parity"

          mkdir -p /tmp/wrapper-upload

          # Copy the primary JSON
          cp "$SRC_DIR/wrapped-asset-parity-latest.json" /tmp/wrapper-upload/wrapped-asset-parity.json

          # Keep historical unsigned atoms separate from the dated ledger rows.
          if [ -d "$SRC_DIR/wrapped-asset-parity-2026-09" ]; then
            cp -r "$SRC_DIR/wrapped-asset-parity-2026-09" /tmp/wrapper-upload/
          fi

          # Preserve the published flat columns and exact source JSON; check export bytes.
          python3 - <<'PYEOF'
          import hashlib, json, pathlib
          
          def export_records(source, target):
              src = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
              records = src.get("records")
              if not isinstance(records, list) or not records:
                  raise ValueError("records must be a non-empty array, never the attests description")
              if not isinstance(src.get("as_of"), str) or not src["as_of"]:
                  raise ValueError("source observation date is required")
              states = {"ESCROW_PARITY_READ", "UNCHECKABLE_NATIVE_ISSUANCE", "INDEXED_CUSTODIAL", "UNMEASURED"}
              seen, rows = set(), []
              for r in records:
                  if not isinstance(r, dict) or not isinstance(r.get("id"), str) or not r["id"]:
                      raise ValueError("each record must be an object with an id")
                  if r["id"] in seen or r.get("state") not in states:
                      raise ValueError("duplicate id or unknown state")
                  seen.add(r["id"])
                  w, c, reads = r["wrapped"], r["canonical"], r.get("reads") or {}
                  rows.append({
                      "id": r["id"],
                      "wrapped_chain": w["chain"], "wrapped_symbol": w["symbol"], "wrapped_address": w["address"],
                      "canonical_chain": c["chain"], "canonical_symbol": c["symbol"],
                      "backing_model": r["backing_model"], "escrow": r.get("escrow"), "state": r["state"],
                      "wrapped_total_supply": (reads.get("wrapped_total_supply") or {}).get("normalized"),
                      "escrow_balance": (reads.get("escrow_balance") or {}).get("normalized"),
                      "escrow_over_wrapped": r.get("escrow_over_wrapped"),
                      "wrapped_block": (w.get("block") or {}).get("number"),
                      "canonical_block": (c.get("block") or {}).get("number"),
                      "as_of": src["as_of"], "note": r.get("note"),
                  })
              expected = src.get("counts")
              if not isinstance(expected, dict) or any(type(v) is not int or v < 0 for v in expected.values()) or sum(expected.values()) != len(rows):
                  raise ValueError("source counts do not match the records")
              if any(expected.get(state, 0) != sum(r["state"] == state for r in records) for state in states):
                  raise ValueError("source state counts do not match the records")
              text = "".join(json.dumps(row, ensure_ascii=False, separators=(",", ":")) + "\n" for row in rows)
              pathlib.Path(target).write_text(text, encoding="utf-8")
              return len(rows)
          
          def write_checksums(directory):
              root = pathlib.Path(directory)
              files = sorted(p for p in root.rglob("*") if p.is_file() and p.name != "wrapped-asset-parity.sha256")
              lines = [hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.relative_to(root).as_posix() for p in files]
              manifest = root / "wrapped-asset-parity.sha256"
              manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
              for line in lines:
                  digest, name = line.split("  ", 1)
                  if hashlib.sha256((root / name).read_bytes()).hexdigest() != digest:
                      raise ValueError("export checksum mismatch")
              return len(lines)
          
          count = export_records("/tmp/wrapper-upload/wrapped-asset-parity.json", "/tmp/wrapper-upload/records.jsonl")
          print(f"wrote {count} canonical records to records.jsonl; observation time retained")
          print(f"verified {write_checksums('/tmp/wrapper-upload')} exported file checksums; no signature or freshness upgrade")
          PYEOF

          # Retain the existing HF README and its independently maintained rubric.
          # This producer updates data files only, never a second description writer.

          # Verify we have content
          echo "Files to upload:"
          ls -la /tmp/wrapper-upload/

          # Upload through the existing dataset producer; preserve unrelated remote files.
          hf upload \
            --repo-type dataset \
            "$HF_DATASET" \
            /tmp/wrapper-upload/ \
            . \
            --commit-message "Refresh wrapped-asset-parity from councilof.ai $(date -u +%FT%TZ)"

          echo "✅ Upload to $HF_DATASET complete"
