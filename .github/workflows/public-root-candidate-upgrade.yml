name: public-root-candidate-upgrade

# Maintain the exact candidate banked by public-root.yml. A pending proof must be
# upgraded in place; generating a new root would change the digest and restart the
# Bitcoin clock. Promotion happens only after the proof bytes themselves contain a
# Bitcoin attestation, the full candidate release gate passes, and pr-gates has passed on
# the exact head commit being merged (single writer: master changes only through a gated PR).
on:
  schedule:
    - cron: "17,32,47,2 * * * *"
  workflow_dispatch: {}

concurrency:
  group: public-root-candidate-upgrade
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    # 15 minutes of upgrade/witness work plus up to 50 waiting for pr-gates on the exact head.
    timeout-minutes: 70
    steps:
      # A confirmed candidate lands by auto-merge, and a merge made on behalf of GITHUB_TOKEN
      # triggers no push workflow, so deploy.yml never runs for it. Measured 2026-09-14:
      # #2443 merged at 18:12Z (it changes public/root.json) with zero deploy runs, and the
      # 3-hourly deploy cron skipped its 15:20 and 18:20 slots, so a verified, Bitcoin-
      # anchored root sat unpublished. public-root.yml already dispatches deploy.yml for its
      # direct-push path (2026-09-03); this covers the pull-request path. It runs before the
      # candidate lookup because after a merge there is no open candidate and every later
      # step is skipped. workflow_dispatch is GitHub's documented exception to GITHUB_TOKEN
      # loop-prevention; deploy.yml serialises (cancel-in-progress: false).
      - name: Publish a merged root that production is not serving
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Hash FILES, never a $(…) capture. Command substitution strips trailing newlines and
          # root.json ends with one, so a captured-and-reprinted copy can never equal master:
          # the first version of this step (#2452) logged LAG_DISPATCHED with master == live
          # (run 34885044795 → deploy 34885068158, 2026-09-14 19:08Z).
          master_file="$RUNNER_TEMP/master-root.json"
          live_file="$RUNNER_TEMP/live-root.json"
          gh api "repos/$REPO/contents/public/root.json?ref=master" -H 'Accept: application/vnd.github.raw' > "$master_file"
          if ! curl -fsS --max-time 30 -o "$live_file" https://councilof.ai/root.json; then
            echo "LIVE_UNREADABLE: could not fetch production root.json; an outage is not a publish lag, not dispatching."
            exit 0
          fi
          master_sha=$(sha256sum "$master_file" | cut -d' ' -f1)
          live_sha=$(sha256sum "$live_file" | cut -d' ' -f1)
          echo "master root.json sha256: $master_sha"
          echo "live   root.json sha256: $live_sha"
          if [ "$master_sha" = "$live_sha" ]; then
            echo "PUBLISHED: production serves master's root.json."
            exit 0
          fi
          runs=$(gh run list --repo "$REPO" --workflow deploy.yml --branch master --limit 20 --json status,conclusion,createdAt)
          active=$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" != "0" ]; then
            echo "LAG_DEPLOY_ALREADY_RUNNING: $active deploy run(s) queued or in progress; not dispatching another."
            exit 0
          fi
          recent_failure=$(printf '%s' "$runs" | jq --arg since "$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select(.conclusion == "failure" and .createdAt >= $since)] | length')
          if [ "$recent_failure" != "0" ]; then
            echo "LAG_DEPLOY_RECENTLY_FAILED: a deploy failed in the last 45 minutes; not re-dispatching into a red pipeline."
            exit 0
          fi
          echo "LAG_DISPATCHED: production root.json differs from master; dispatching deploy.yml."
          gh workflow run deploy.yml --repo "$REPO" --ref master

      - name: Find the one open candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url=$(gh pr list --repo "$REPO" --head public-root/pending --base master --state open --json url --jq '.[0].url // ""')
          if [ -z "$url" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pending public-root PR."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.candidate.outputs.exists == 'true'
        with:
          ref: public-root/pending
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.candidate.outputs.exists == 'true'
        with:
          python-version: "3.11"

      - name: Reconcile the rolling candidate with current master
        if: steps.candidate.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git config user.name "csoai-public-root"
          git config user.email "board@csoai.org"
          git fetch origin master
          before=$(git rev-parse HEAD)
          # A real content conflict fails the workflow closed. Never choose a
          # side automatically for root, proof, or witness bytes.
          git merge --no-edit origin/master
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            git push origin "HEAD:public-root/pending"
          fi

      - name: Install witness dependencies
        if: steps.candidate.outputs.exists == 'true'
        run: pip install -q cryptography opentimestamps-client

      - name: Upgrade the exact candidate proof
        if: steps.candidate.outputs.exists == 'true'
        id: ots
        run: |
          set -euo pipefail
          proof=$(python3 - <<'PY'
          import json, re
          from pathlib import Path
          side = json.loads(Path("public/interop/root-witness-latest.json").read_text())
          value = str(((side.get("witnesses") or {}).get("ots") or {}).get("path") or "")
          if not re.fullmatch(r"public/interop/root-[0-9a-f]{8}\.json\.ots", value):
              raise SystemExit(f"refusing unexpected candidate proof path: {value!r}")
          print(value)
          PY
          )
          if python3 scripts/ots-upgrade.py "$proof"; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "confirmed=false" >> "$GITHUB_OUTPUT"
            echo "The exact proof is still pending; candidate bytes remain untouched."
          fi

      - name: Refresh exact-root witnesses and derived views
        if: steps.ots.outputs.confirmed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/witness_public_root.py
          python3 scripts/build_stablecoin_readiness.py
          python3 scripts/build_archive_index.py
          python3 scripts/witness_public_root.py --recheck || true

      - name: Prove the candidate is publishable
        if: steps.ots.outputs.confirmed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/root-witness-release-gate.py --selftest
          python3 scripts/root-witness-release-gate.py --phase candidate
          python3 - <<'PY'
          import json
          from pathlib import Path
          side = json.loads(Path("public/interop/root-witness-latest.json").read_text())
          ots = ((side.get("witnesses") or {}).get("ots") or {})
          assert ots.get("status") == "CONFIRMED_BITCOIN", ots
          assert ots.get("bitcoin_blocks"), ots
          print("promotion state: CONFIRMED_BITCOIN", ots["bitcoin_blocks"])
          PY

      - name: Commit the upgraded proof and exact witness state
        if: steps.ots.outputs.confirmed == 'true'
        env:
          BRANCH: public-root/pending
        run: |
          set -euo pipefail
          git config user.name "csoai-public-root"
          git config user.email "board@csoai.org"
          git add public/interop/root-*.json.ots
          git add public/interop/root-witness-*.json public/interop/root-witness-pointer.json
          git add public/interop/stablecoin-universe-2026-09/readiness.json public/archive/index.json
          if ! git diff --cached --quiet; then
            git commit -m "public-root: upgrade exact candidate to Bitcoin-confirmed"
            git push origin "HEAD:$BRANCH"
          fi

      # Master's branch protection requires a pull request but no status check (read in repo
      # settings on 6 Oct 2026: "Require status checks to pass before merging" is off). So the
      # `gh pr merge --auto` this step used to run did not wait for pr-gates: on a pull request
      # with nothing required it merges at once, ungated. A pull request opened with GITHUB_TOKEN
      # also starts no pull_request workflow, so no check runs on it unless dispatched. Single
      # writer means a GATED pull request, so the gate is made binding here: run pr-gates on THIS
      # head commit, wait for it in this job, and merge only that commit and only on success.
      # Waiting in-job matters: the refresh step above re-witnesses on every confirmed tick, so the
      # head moves between ticks and a pass recorded on an older commit must never merge a newer one.
      - name: Merge only after pr-gates passed on these exact bytes
        if: steps.ots.outputs.confirmed == 'true'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          head=$(gh pr view "$URL" --repo "$REPO" --json headRefOid --jq .headRefOid)
          runs() {
            gh run list --repo "$REPO" --workflow pr-gates.yml --branch public-root/pending --limit 50 \
              --json databaseId,headSha,status,conclusion,createdAt
          }
          # Reuse a run on this exact commit that passed or is still going; a failed one is retried.
          run_id=$(runs | jq -r --arg sha "$head" \
            '[.[] | select(.headSha == $sha and (.status != "completed" or .conclusion == "success"))] | .[0].databaseId // ""')
          if [ -z "$run_id" ]; then
            since=$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run pr-gates.yml --repo "$REPO" --ref public-root/pending
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(runs | jq -r --arg sha "$head" --arg since "$since" \
                '[.[] | select(.headSha == $sha and .createdAt >= $since)] | .[0].databaseId // ""')
              [ -n "$run_id" ] && break
            done
          fi
          if [ -z "$run_id" ]; then
            echo "HALT: no pr-gates run appeared for $head; not merging" >&2
            exit 1
          fi
          echo "waiting for pr-gates run $run_id on $head"
          if ! gh run watch "$run_id" --repo "$REPO" --exit-status --interval 30 > /dev/null; then
            echo "HALT: pr-gates run $run_id did not pass on $head; not merging. The candidate stays open for a human." >&2
            exit 1
          fi
          echo "pr-gates run $run_id passed on $head; merging exactly that commit"
          gh pr merge "$URL" --repo "$REPO" --squash --match-head-commit "$head"
