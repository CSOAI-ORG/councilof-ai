name: restore-cdb-wave0
on:
  push:
    paths:
      - .github/workflows/restore-cdb-wave0.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore competitorDatabase.json from known-good commit
        run: |
          set -euo pipefail
          git checkout ba43a5a818bed3839400c3e5e2aea754de983fdc -- client/src/data/competitorDatabase.json
          python3 - <<'PY'
          import json
          p='client/src/data/competitorDatabase.json'
          d=json.load(open(p))
          assert d['recordCount']==52 and len(d['records'])==52, d.get('recordCount')
          print('ok', d['recordCount'], 'bytes', open(p).seek(0,2) or open(p).tell())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/competitorDatabase.json
          if git diff --cached --quiet; then
            echo 'already restored'
            exit 0
          fi
          git commit -m "fix: restore full competitorDatabase.json (52 records) — wave0 parity"
          git push origin HEAD:cursor/instruments-catalog-7fb8
