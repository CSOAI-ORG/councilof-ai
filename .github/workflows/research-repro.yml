# Evidence ladder L1: re-run the deterministic 25 Nov 2026 research scripts
# (PRs #4862, #4863, #4865, #4866, #4868, #4869, #4870, #4871) and fail when a
# committed result drifts. Read-only: no secrets, no signing, no publication.
# Network: the scripts fetch sha256-pinned inputs from huggingface.co and
# raw.githubusercontent.com and refuse any byte mismatch.
# Not run here (declared in the checker): the two cross-family open-LM scripts
# (recorded on CUDA, need model downloads) and the live councilof.ai probe.
# The reaction-bridge *.test.mjs files already run in reaction-bridge-offline.yml.
name: research-repro
on:
  pull_request:
    paths:
      - "harness/meok-process-lab/**"
      - "measurement/experiments/two-path-council/**"
      - "scripts/research/external-crosswalk-readback.py"
      - "scripts/research/meok-axis-cpu-engine.mjs"
      - "scripts/research/meok-reaction-federation.mjs"
      - "scripts/research/research-repro-check.py"
      - "scripts/axis-specialists.mjs"
      - ".github/workflows/research-repro.yml"
  push:
    branches: [master]
    paths:
      - "harness/meok-process-lab/**"
      - "measurement/experiments/two-path-council/**"
      - "scripts/research/external-crosswalk-readback.py"
      - "scripts/research/meok-axis-cpu-engine.mjs"
      - "scripts/research/meok-reaction-federation.mjs"
      - "scripts/research/research-repro-check.py"
      - "scripts/axis-specialists.mjs"
      - ".github/workflows/research-repro.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-repro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned numerical dependencies (versions recorded in the committed results)
        run: python -m pip install --no-cache-dir numpy==2.4.6 scikit-learn==1.9.0
      - name: Re-run research scripts and compare with committed results
        run: python scripts/research/research-repro-check.py --report research-repro-report.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-repro-report
          path: research-repro-report.json
          if-no-files-found: warn
          retention-days: 14
