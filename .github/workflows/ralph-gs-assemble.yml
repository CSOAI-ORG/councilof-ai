name: ralph-gs-assemble
on:
  push:
    paths:
      - '.ralph-restore/gs/**'
      - '.github/workflows/ralph-gs-assemble.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: Assemble GlobalSearch.tsx from b64 parts
        run: |
          mkdir -p client/src/components
          python3 - <<'PY'
          import pathlib, base64, hashlib
          parts = [pathlib.Path(f'.ralph-restore/gs/part-{i:02d}.b64') for i in range(16)]
          missing = [str(p) for p in parts if not p.exists()]
          assert not missing, f'missing {missing}'
          data = b''.join(base64.b64decode(p.read_text().strip()) for p in parts)
          out = pathlib.Path('client/src/components/GlobalSearch.tsx')
          out.write_bytes(data)
          print('wrote', out, 'bytes', len(data), 'sha256', hashlib.sha256(data).hexdigest())
          print('starts', data[:40])
          assert data.startswith(b'/**')
          assert b'PLACEHOLDER_WILL_REPLACE' not in data
          PY
      - name: Commit
        run: |
          git config user.name ralph-gs-assemble
          git config user.email ralph@csoai.org
          git add client/src/components/GlobalSearch.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Ralph overnight parity 2/10: GlobalSearch.tsx (assembled)"
          git push
