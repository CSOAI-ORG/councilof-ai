name: ralph-gs-assemble
on:
  push:
    paths:
      - '.ralph-restore/gs/**'
      - '.github/workflows/ralph-gs-assemble.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: Assemble GlobalSearch.tsx
        run: |
          mkdir -p client/src/components
          cat .ralph-restore/gs/part-*.txt > client/src/components/GlobalSearch.tsx
          wc -c client/src/components/GlobalSearch.tsx
          head -c 40 client/src/components/GlobalSearch.tsx; echo
          grep -c PLACEHOLDER_WILL_REPLACE client/src/components/GlobalSearch.tsx || true
      - name: Commit
        run: |
          git config user.name ralph-gs-assemble
          git config user.email ralph@csoai.org
          git add client/src/components/GlobalSearch.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Ralph overnight parity 2/10: GlobalSearch.tsx (assembled)"
          git push
