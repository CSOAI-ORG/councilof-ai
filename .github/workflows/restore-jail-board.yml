name: Restore GSPC jail board
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/restore-jail-board-ff6e
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore gspc.ts from pre-PR#425 commit
        run: |
          git checkout 474bf7a07c7c48947a30496b3e631c3dead0daf7 -- functions/api/gspc.ts
          git config user.name "CSOAI-ORG"
          git config user.email "nicholas@csoai.org"
          git add functions/api/gspc.ts
          git commit -m "fix(api): revert PR #425 — restore jail as slot 14 on living GSPC board (13 measured of 14)" || echo "no change"
          git push origin cursor/restore-jail-board-ff6e
