# Gate MEOK MCP → SOV3 proxy-path tests on every change.
# 16 tests: 13 unit (deterministic, mocked SOV3) + 3 live (skip if :3102 absent).
name: meok-mcp-proxy-tests

on:
  push:
    paths:
      - "meok/**"
      - "scripts/run-meok-proxy-tests.sh"
      - "scripts/install-meok-test-hooks.sh"
      - ".githooks/**"
      - ".github/workflows/meok-mcp-proxy-tests.yml"
  pull_request:
    paths:
      - "meok/**"
      - "scripts/run-meok-proxy-tests.sh"
      - "scripts/install-meok-test-hooks.sh"
      - ".githooks/**"
      - ".github/workflows/meok-mcp-proxy-tests.yml"
  workflow_dispatch:

jobs:
  proxy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx uvicorn python-multipart

      - name: Run proxy-path tests
        env:
          MEOK_MASTER_API_KEY: ci-test-key
          MEOK_TEST_UNIT_ONLY: "0"
        run: bash scripts/run-meok-proxy-tests.sh

      - name: Fail if zero tests ran
        run: |
          # Safety: the runner must execute the suite; a silent 0-test pass is a regression.
          python -m pytest meok/mcp/tests/test_proxy_path.py --collect-only -q | tee /tmp/collected.txt
          count=$(grep -c '::' /tmp/collected.txt || true)
          echo "collected=$count"
          test "$count" -ge 16
