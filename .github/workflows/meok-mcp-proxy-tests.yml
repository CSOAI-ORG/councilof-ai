# Host-independent gate for MEOK MCP → SOV3 proxy-path tests.
# Always runs on main and PRs (required status check friendly — path filters
# would leave "Expected" pending when the workflow does not start).
#
# 16 tests: 13 unit (deterministic, mocked SOV3) + 3 live (skip if :3102 absent).
name: meok-mcp-proxy-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: meok-mcp-proxy-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-path:
    name: proxy-path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx uvicorn python-multipart

      - name: Run proxy-path tests
        env:
          MEOK_MASTER_API_KEY: ci-test-key
          MEOK_TEST_UNIT_ONLY: "0"
        run: bash scripts/run-meok-proxy-tests.sh

      - name: Require at least 16 tests collected
        run: |
          set -euo pipefail
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export PYTHONPATH="$PWD"
          python -m pytest meok/mcp/tests/test_proxy_path.py --collect-only -q | tee /tmp/collected.txt
          count=$(grep -c '::' /tmp/collected.txt || true)
          echo "collected=$count"
          test "$count" -ge 16
