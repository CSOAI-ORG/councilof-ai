# Offline-only qualification for the read-only reaction experiment adapter.
# No schedule, permissions to write, external service, signing, model, or deploy.
name: reaction-bridge-offline
on:
  pull_request:
    paths:
      - "measurement/experiments/reaction-bridge/**"
      - ".github/workflows/reaction-bridge-offline.yml"
      - "client/src/components/ReactionResearchReview*"
      - "client/src/components/DashboardEvidenceLearningPane.tsx"
permissions:
  contents: read
jobs:
  node-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure deterministic negative controls
        run: node --test measurement/experiments/reaction-bridge/*.test.mjs
  react-local-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Run CouncilOS component render and user-journey controls
        run: npx vitest run client/src/components/ReactionResearchReview.test.tsx client/src/components/ReactionResearchReview.behavior.test.tsx --maxWorkers 1
      - name: Bundle browser-only research component in isolation
        run: npx esbuild client/src/components/ReactionResearchReview.tsx --bundle --platform=browser --format=esm --target=es2022 --external:react --outfile=/tmp/council-reaction-component.mjs
