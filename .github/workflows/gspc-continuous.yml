name: GSPC Continuous Measurement

# Continuous GSPC measurement engine: scheduled frontier pulse against the
# governance lane of csoai/gspc-master, artifacts + results branch + HF
# living mirror. Partial results are honest results: a provider whose
# credential is missing/invalid records BLOCKED_CREDENTIAL and the run
# continues.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Items in the pulse panel (smoke: 5, default pulse: 30, 0 = full bank)"
        required: false
        default: "30"
      lanes:
        description: "Frozen August lanes to pulse, space-separated (blank = this slot's five)"
        required: false
        default: ""
      lane_limit:
        description: "Items per lane pulse"
        required: false
        default: "10"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gspc-continuous
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run frontier pulse
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          GROK_TOKEN: ${{ secrets.GROK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LIMIT="${{ inputs.limit || '30' }}"
          python ci/frontier-runner.py --limit "$LIMIT" --out-dir out
          # The frozen August lane banks rotate five per pulse, chosen by run count, so
          # every lane is reached within two delivered runs. The clock is not used:
          # GitHub delivers only some scheduled runs (18 to 21 Nov: one near 07Z and
          # one near 19 to 20Z a day), and a slot picked from the UTC hour reached four
          # lanes and never the other six. A lane that cannot run is a visible
          # warning, never a silent skip.
          # care is absent: its gold column is a 0/1 rubric score, not a label, so the runner refuses it.
          ALL=(safety continuity provenance cross-reality detector-interop art5-safeguard conformance openness machinery-conformity affect)
          REQ="${{ inputs.lanes || '' }}"
          if [ -n "$REQ" ]; then
            read -r -a LANES <<< "$REQ"
          else
            SLOT=$(( GITHUB_RUN_NUMBER % 2 ))
            LANES=("${ALL[@]:$((SLOT * 5)):5}")
          fi
          for L in "${LANES[@]}"; do
            python ci/frontier-runner.py --lane "$L" --limit "${{ inputs.lane_limit || '10' }}" --out-dir "out-lanes/$L" \
              || echo "::warning::lane $L did not run"
          done

      - name: Upload pulse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gspc-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/rows.jsonl
            out/summary.json
            out-lanes/**
          retention-days: 90
          if-no-files-found: error

      - name: Record summary on ci-results branch
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME="gspc-continuous-bot" GIT_AUTHOR_EMAIL="actions@csoai.org"
          export GIT_COMMITTER_NAME="gspc-continuous-bot" GIT_COMMITTER_EMAIL="actions@csoai.org"
          STAMP="$(python3 -I -c "import json;print(json.load(open('out/summary.json'))['run_id'])")"
          # Pure plumbing: append results/summary-<runid>.json to the
          # ci-results branch without touching this worktree (the mirror
          # step still needs ci/hf-mirror.py).
          export GIT_INDEX_FILE="$RUNNER_TEMP/pulse-index"
          rm -f "$GIT_INDEX_FILE"
          if git ls-remote --exit-code --heads origin ci-results >/dev/null 2>&1; then
            git fetch --depth 1 origin ci-results
            BASE="$(git rev-parse FETCH_HEAD)"
            git read-tree "$BASE"
            PARENT=(-p "$BASE")
          else
            PARENT=()
          fi
          shopt -s nullglob
          for S in out/summary.json out-lanes/*/summary.json; do
            ID="$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['run_id'])" "$S")"
            BLOB="$(git hash-object -w "$S")"
            git update-index --add --cacheinfo "100644,${BLOB},results/summary-${ID}.json"
          done
          TREE="$(git write-tree)"
          COMMIT="$(printf 'gspc-pulse: %s (run %s)\n' "$STAMP" "$GITHUB_RUN_ID" | git commit-tree "$TREE" "${PARENT[@]}")"
          git push origin "${COMMIT}:refs/heads/ci-results"

      - name: Mirror pulse to HF living dataset
        if: env.HF_TOKEN != ''
        run: |
          python -m pip install --quiet huggingface_hub
          python ci/hf-mirror.py out/summary.json out/rows.jsonl
          for D in out-lanes/*/; do
            if [ -f "${D}summary.json" ]; then
              python ci/hf-mirror.py "${D}summary.json" "${D}rows.jsonl"
            fi
          done
