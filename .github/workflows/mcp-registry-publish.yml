name: Publish MCP Registry

# Manual publication of the generated GitHub-namespace manifest only.
# Domain namespaces require their separate DNS/HTTP ownership flow.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed version already rendered in the GitHub manifest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_JSON: distribution/mcp-registry/io.github.CSOAI-ORG-gspc/server.json
      EXPECTED_NAME: io.github.CSOAI-ORG/gspc
      VER: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check publisher and selected manifest before authentication
        run: |
          set -euo pipefail
          node --test scripts/mcp-registry-publish.node-test.cjs
          node scripts/mcp-registry-publish.cjs --validate

      - name: Authenticate and publish with exact readback
        shell: bash
        run: |
          set -euo pipefail
          ID_TOKEN="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fregistry.modelcontextprotocol.io" \
            | jq -er '.value | select(type == "string" and length > 0)')"
          [[ "$ID_TOKEN" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]
          echo "::add-mask::$ID_TOKEN"
          REGISTRY_JWT="$(jq -nc --arg t "$ID_TOKEN" '{oidc_token: $t}' \
            | curl --fail --silent --show-error --max-time 30 \
              -X POST https://registry.modelcontextprotocol.io/v0.1/auth/github-oidc \
              -H "Content-Type: application/json" --data-binary @- \
            | jq -er '.registry_token | select(type == "string" and length > 0)')"
          [[ "$REGISTRY_JWT" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]
          echo "::add-mask::$REGISTRY_JWT"
          TOKEN="$REGISTRY_JWT" node scripts/mcp-registry-publish.cjs --publish
