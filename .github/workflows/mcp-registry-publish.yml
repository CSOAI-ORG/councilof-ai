name: Publish MCP Registry (v1.4.2)

# Publishes the gspc MCP server to the official MCP Registry.
# Auth: GitHub Actions OIDC -> exchange for Registry JWT -> POST /v0/publish.
# No long-lived NPM_TOKEN or secrets - uses GitHub's OIDC trust.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "MCP server version to publish (must match server.json)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate version matches server.json
        working-directory: mcp/gspc-server
        run: |
          set -euo pipefail
          actual="$(node -p "require('./server.json').version")"
          test "$actual" = "${{ inputs.version }}"
          echo "server.json version: $actual"

      - name: Get GitHub OIDC id_token
        id: oidc
        run: |
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=registry.modelcontextprotocol.io" | jq -r .value)
          echo "ID_TOKEN_LENGTH=${#ID_TOKEN}"
          echo "id_token=$ID_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Exchange OIDC for Registry JWT
        id: jwt
        run: |
          REGISTRY_JWT=$(curl -sS -X POST \
            https://registry.modelcontextprotocol.io/v0/auth/github-oidc \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg t "${{ steps.oidc.outputs.id_token }}" '{oidc_token: $t}')" \
            | jq -r '.registry_token')
          echo "REGISTRY_JWT_LENGTH=${#REGISTRY_JWT}"
          echo "registry_token=$REGISTRY_JWT" >> "$GITHUB_OUTPUT"

      - name: Publish server.json to MCP Registry
        working-directory: mcp/gspc-server
        env:
          TOKEN: ${{ steps.jwt.outputs.registry_token }}
          VER: ${{ inputs.version }}
        run: node -e '
          const fs = require("fs");
          const https = require("https");
          const server = JSON.parse(fs.readFileSync("server.json"));
          const VER = process.env.VER;
          const TOKEN = process.env.TOKEN;

          function get(path) {
            return new Promise((resolve, reject) => {
              https.get("https://registry.modelcontextprotocol.io" + path, res => {
                let d = "";
                res.on("data", c => d += c);
                res.on("end", () => resolve({ status: res.statusCode, body: d }));
              }).on("error", reject);
            });
          }

          function post(path, body, headers) {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify(body);
              const req = https.request({
                hostname: "registry.modelcontextprotocol.io",
                path, method: "POST",
                headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(data), ...headers }
              }, res => {
                let d = "";
                res.on("data", c => d += c);
                res.on("end", () => resolve({ status: res.statusCode, body: d }));
              });
              req.on("error", reject);
              req.write(data);
              req.end();
            });
          }

          (async () => {
            // Check if version already exists
            const existing = await get("/v0/servers/io.github.CSOAI-ORG%2Fgspc/versions");
            if (existing.status === 200) {
              const d = JSON.parse(existing.body);
              if (d.versions && d.versions.some(v => v.version === VER)) {
                console.log(`Version ${VER} already published — skipping`);
                return;
              }
            }

            // Publish
            const resp = await post("/v0/publish", server, { "Authorization": `Bearer ${TOKEN}` });
            console.log("Response status:", resp.status);
            console.log("Response body (first 1000 chars):");
            console.log(resp.body.substring(0, 1000));
            if (resp.status >= 200 && resp.status < 300) {
              console.log("PUBLISH OK");
            } else {
              process.exit(1);
            }
          })().catch(err => {
            console.error("Error:", err.message);
            process.exit(1);
          });
          '
