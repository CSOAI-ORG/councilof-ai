name: HF evaluation contracts
on:
  pull_request:
    paths:
      - .github/workflows/hf-evaluation-contracts.yml
      - scripts/surface/build-lm-eval-tasks.mjs
      - scripts/surface/publish-hf-evaluation.py
      - scripts/surface/run-auto-measure-once.py
      - scripts/surface/test_auto_measure_archive.py
      - scripts/surface/test_lm_eval_*.py
      - public/bench/lm-eval/**
      - public/bench/axes.json
      - harness/gspc-top100/mill_hub_queue.py
      - spaces/gspc-auto-measure/**
  push:
    branches: [master]
    paths:
      - .github/workflows/hf-evaluation-contracts.yml
      - scripts/surface/build-lm-eval-tasks.mjs
      - scripts/surface/publish-hf-evaluation.py
      - scripts/surface/run-auto-measure-once.py
      - scripts/surface/test_auto_measure_archive.py
      - scripts/surface/test_lm_eval_*.py
      - public/bench/lm-eval/**
      - public/bench/axes.json
      - harness/gspc-top100/mill_hub_queue.py
      - spaces/gspc-auto-measure/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hf-evaluation-contracts-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU contract dependencies
        run: python -m pip install 'lm_eval==0.4.13' 'gradio==6.31.0' pytest
      - name: Generated bytes and canonical grader stay synchronized
        run: node scripts/surface/build-lm-eval-tasks.mjs --check
      - name: Actual framework, endpoint shape, receipts and negative controls; no models
        run: >-
          python -m pytest -q
          scripts/surface/test_lm_eval_parity.py
          scripts/surface/test_lm_eval_framework.py
          scripts/surface/test_auto_measure_archive.py
          spaces/gspc-auto-measure/test_measurement.py
