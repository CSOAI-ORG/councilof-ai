name: assemble-competitor-db
on:
  workflow_dispatch:
  push:
    paths: ['.restore-compdb/part-10.b64']
jobs:
  a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: assemble
        run: |
          set -euo pipefail
          : > /tmp/compdb.b64
          for f in .restore-compdb/part-*.b64; do cat "$f" >> /tmp/compdb.b64; done
          tr -d '\n' < /tmp/compdb.b64 | base64 -d > client/src/data/competitorDatabase.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('client/src/data/competitorDatabase.json').read_text())
          assert len(d['records']) == 52, len(d['records'])
          assert d.get('recordCount') == 52
          print('ok records', len(d['records']), 'bytes', Path('client/src/data/competitorDatabase.json').stat().st_size)
          PY
          rm -rf .restore-compdb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore competitorDatabase.json (52 records, full array)"
          git push
