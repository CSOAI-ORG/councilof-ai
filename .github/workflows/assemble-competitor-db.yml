name: assemble-competitor-db
on:
  workflow_dispatch:
  push:
    paths: ['.restore-compdb/DONE']
jobs:
  a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: assemble
        run: |
          set -euo pipefail
          : > /tmp/compdb.b64
          # Prefer monolithic part-XX.b64; else concatenate part-XX/NN.txt slices (sorted).
          for i in $(seq -w 0 31); do
            if [ -f ".restore-compdb/part-$i.b64" ]; then
              cat ".restore-compdb/part-$i.b64" >> /tmp/compdb.b64
            elif [ -d ".restore-compdb/part-$i" ]; then
              for f in $(ls ".restore-compdb/part-$i"/*.txt | sort); do cat "$f" >> /tmp/compdb.b64; done
            else
              echo "missing part $i" >&2
              exit 1
            fi
          done
          tr -d '\n' < /tmp/compdb.b64 | tr '!' 'j' | base64 -d > client/src/data/competitorDatabase.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('client/src/data/competitorDatabase.json').read_text())
          assert len(d['records']) == 52, len(d['records'])
          assert d.get('recordCount') == 52
          print('ok records', len(d['records']), 'bytes', Path('client/src/data/competitorDatabase.json').stat().st_size)
          PY
          rm -rf .restore-compdb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore competitorDatabase.json (52 records, full array)"
          git push
