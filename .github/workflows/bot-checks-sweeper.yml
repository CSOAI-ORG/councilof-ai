name: bot-checks-sweeper

# GITHUB_TOKEN-created PRs can lack native pull_request checks. Dispatch the REAL
# suite only when this head has no gates check AND no pr-gates Actions run.
# Failed, cancelled, timed-out or gate-less previous runs are not auto-retried.
# Direct pr-gates.yml workflow_dispatch remains the explicit manual retry route;
# required checks and normal branch protection still decide whether a PR can merge.
# At most three dispatches per sweep. Never comments, merges or cancels runs.

on:
  schedule:
    - cron: "9,29,49 * * * *"   # backstop only — GitHub cron drops under load (observed 2026-09-13: 4.5h silent)
  # Event triggers and the backstop share one serialized, bounded sweep.
  workflow_run:
    workflows:
      - hub-queue-land
      - art50-target-index
      - catalog-trust-round
      - census-delta
      - growth-loop
      - mcp-trust-board-round
      - "provider-watch — hash-only provider document change watcher"
      - public-root
      - "Reg-watch — regulation-change detector (living loop)"
      - stablecoin-evidence-round
      - "TUI-6 Distribution Monitoring"
      - "x402 door conformance (daily, DRY)"
    types: [completed]
  workflow_dispatch: {}


permissions:
  contents: read
  actions: write
  checks: read
  pull-requests: read

concurrency:
  group: bot-checks-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      # workflow_run carries write permissions: execute only the default branch's
      # helper, never code checked out from the triggering PR or workflow run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/bot_checks_sweeper.py
            /scripts/test_bot_checks_sweeper.py
      - name: Test bounded dispatch and refusal fixtures
        run: python3 -m unittest discover -v -s scripts -p test_bot_checks_sweeper.py
      - name: Dispatch real gates only for unattempted heads
        run: python3 scripts/bot_checks_sweeper.py
