name: bot-checks-sweeper

# 2026-09-13 (TUI-1): bot-created PRs never receive protected pull_request checks.
# GitHub rule: events produced by GITHUB_TOKEN do not trigger further workflows, so a
# PR opened by hub-queue-land / census / trust-round automation has NO `gates` context
# and can never satisfy branch protection without a human re-opening it.
#
# Least-privilege repair (no PAT, no GitHub App, no protection weakening, no fabricated
# checks): this sweeper finds open PRs whose head has no `gates` check-run and dispatches
# the REAL pr-gates suite against the PR branch for diagnosis. workflow_dispatch checks
# do not satisfy required PR checks. An authorized human must trigger eligible PR checks
# and review the latest head before a normal protected merge. Never use admin bypass.
# If dispatch fails, bank ONE explicit operator action comment; do not infer its cause.
#
# Never comments twice on the same PR (marker search). Never merges. Never skips tests.

on:
  schedule:
    - cron: "9,29,49 * * * *"   # backstop only — GitHub cron drops under load (observed 2026-09-13: 4.5h silent)
  # Primary signal: any PR-creating automation completing IS the event. Idempotent
  # sweep makes extra triggers free.
  workflow_run:
    workflows:
      - hub-queue-land
      - art50-target-index
      - catalog-trust-round
      - census-delta
      - growth-loop
      - mcp-trust-board-round
      - "provider-watch — hash-only provider document change watcher"
      - public-root
      - "Reg-watch — regulation-change detector (living loop)"
      - stablecoin-evidence-round
      - "TUI-6 Distribution Monitoring"
      - "x402 door conformance (daily, DRY)"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write        # dispatch pr-gates on the PR branch
  pull-requests: write  # one banked operator-action comment when dispatch is impossible

concurrency:
  group: bot-checks-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Find check-less open PRs and dispatch the real gates
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          REPO = os.environ["REPO"]

          def gh(args):
              return subprocess.run(["gh"] + args, capture_output=True, text=True)

          prs = json.loads(gh(["pr", "list", "--repo", REPO,
                               "--state", "open", "--limit", "100",
                               "--json", "number,headRefName,headRefOid,title,isCrossRepository"]).stdout)
          swept, dispatched, banked = [], [], []
          for pr in prs:
              n, branch, sha = pr["number"], pr["headRefName"], pr["headRefOid"]
              if pr.get("isCrossRepository"):
                  continue  # forks are out of scope for token dispatch
              cr = json.loads(gh(["api", f"repos/{REPO}/commits/{sha}/check-runs?per_page=100"]).stdout)
              all_gates = [r for r in (cr.get("check_runs") or []) if r.get("name") == "gates"]
              green_gates = [r for r in all_gates if r.get("conclusion") == "success"]
              if green_gates:
                  continue  # a passing run exists; PR merge eligibility is not inferred here
              # Failed or in-progress gates exist but none passed — re-dispatch
              # (the earlier dispatch may have failed, or a newer head invalidated it)
              swept.append(n)
              r = gh(["workflow", "run", "pr-gates.yml", "--repo", REPO,
                      "--ref", branch, "-f", f"pr={n}"])
              if r.returncode == 0:
                  dispatched.append(n)
                  print(f"dispatched pr-gates for #{n} ({branch} @ {sha[:8]})")
                  # Diagnostic dispatch is not a protected PR approval. Bank the human
                  # event/review action without suggesting a bypass of branch protection.
                  comments = gh(["pr", "view", str(n), "--repo", REPO,
                                 "--json", "comments", "-q", "[.comments[].body] | join('\n')"]).stdout
                  if "bot-checks-sweeper: protected operator action v2" not in comments:
                      body = (
                          "bot-checks-sweeper: protected operator action v2.\n\n"
                          f"No passing `gates` run was observed for head {sha[:8]}. "
                          f"The real suite was dispatched on `{branch}` for diagnosis only. "
                          "A successful workflow_dispatch run does not satisfy required PR checks.\n\n"
                          "**Authorized owner action:** trigger eligible pull_request checks, for example "
                          "by closing and reopening this PR in the web UI, then verify all required "
                          "checks on the latest PR/test-merge commit and obtain the required review. "
                          "Use the normal protected merge only after those requirements pass. "
                          "Never use admin bypass or weaken protection.\n\n"
                          "This replaces any earlier admin-merge advice from this sweeper. "
                          "Nothing was auto-merged and no check was fabricated."
                      )
                      gh(["pr", "comment", str(n), "--repo", REPO, "--body", body])
                      print(f"banked operator-action comment on #{n}")
              else:
                  # Dispatch did not complete. Bank the PR without guessing why it failed.
                  comments = gh(["pr", "view", str(n), "--repo", REPO,
                                 "--json", "comments", "-q", "[.comments[].body] | join('\n')"]).stdout
                  if "bot-checks-sweeper: protected operator action v2" not in comments:
                      body = (
                          "bot-checks-sweeper: protected operator action v2.\n\n"
                          f"No passing `gates` run was observed for head {sha[:8]}, and the diagnostic "
                          f"dispatch on `{branch}` did not complete. Required PR checks remain unconfirmed.\n\n"
                          "**Authorized owner action:** inspect the dispatch failure, trigger eligible "
                          "pull_request checks (for example by closing and reopening the PR in the web UI), "
                          "and verify every required check on the latest PR/test-merge commit. Obtain "
                          "the required review before a normal protected merge. Never use admin bypass "
                          "or weaken protection.\n\n"
                          "This replaces any earlier admin-merge advice. No checks were fabricated."
                      )
                      gh(["pr", "comment", str(n), "--repo", REPO, "--body", body])
                      banked.append(n)
                      print(f"banked #{n} with operator action")
                  else:
                      banked.append(n)
          print(json.dumps({"swept_missing_gates": swept, "dispatched": dispatched, "banked": banked}))
          PY
