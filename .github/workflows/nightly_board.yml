name: gspc-nightly-board

# DISABLED schedule. LLM-judge nightly must not rewrite GET /api/gspc.
# Overnight mill = hf-inference-mill (Inference Providers) + eat-overnight.
# KEEP 3090 (fpowppss5ngtkw) is a mill client, not a board writer.
# EXITED A100s stay EXITED.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refuse-board-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail-closed pointer
        run: |
          echo "Nightly board rewrite is retired."
          echo "Living board: GET https://councilof.ai/api/gspc"
          echo "Mill: .github/workflows/hf-inference-mill.yml (router.huggingface.co/v1)"
          echo "EAT: .github/workflows/eat-overnight.yml"
          echo "Do not invent MEASURED. Do not start EXITED A100s."
