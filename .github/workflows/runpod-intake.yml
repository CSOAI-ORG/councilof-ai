name: RunPod GSPC intake — pull, verify, stage

# The pod computes GSPC runs --forever and, until this workflow, nothing ingested them.
# Measured 2026-09-05: 112 run directories over 70 (model, axis) cells on pod fpowppss5ngtkw,
# failed_runs 0, sitting on one machine at 96% disk. This runs four times a day and does three
# things in order: pull the durable HF copy, verify each run independently, and stage the
# verified ones in the only shape sign_mill_cards.py reads.
#
# It does NOT sign, does not decide MEASURED, does not touch the pod, and deletes nothing.
# Signing stays with sign_mill_cards.py, which sets status from n (>=30 MEASURED, else
# UNMEASURED). Two places deciding that is issue #1155.

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # 4x/day, off the hour to miss the cron pile-up
  workflow_dispatch:

concurrency: { group: runpod-intake, cancel-in-progress: false }

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install the hub client only
        run: pip install --quiet "huggingface_hub>=0.25"

      - name: Selftest before trusting either script
        run: |
          python3 scripts/runpod_gspc_bridge_to_mill.py --selftest
          python3 -m unittest discover -s scripts -p test_runpod_gspc_bridge_to_mill.py
          python3 -m unittest discover -s scripts -p test_runpod_gspc_push_to_hf.py
          python3 -m unittest discover -s scripts -p test_runpod_gspc_upload_heartbeat.py
          python3 -m unittest discover -s scripts -p test_runpod_current_intake.py
          python3 -m unittest discover -s scripts -p test_intake_manifest.py
          python3 -m unittest discover -s scripts -p test_intake_snapshot.py
          python3 -m unittest discover -s scripts -p test_intake_composition.py
          python3 -m unittest discover -s scripts -p test_pod_loop_supervisor.py
          python3 -m unittest discover -s scripts -p test_runpod_signing_artifact.py
          python3 -m unittest discover -s scripts -p test_resolve_runpod_trusted_bank.py
          python3 scripts/verify_runpod_gspc_intake.py --help > /dev/null

      - name: Pull the durable intake
        id: pull
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN absent — the intake dataset is PRIVATE, so this cannot read it."
            echo "That is UNCHECKABLE, not zero runs. Failing rather than staging nothing quietly."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib
          from huggingface_hub import HfApi, snapshot_download
          info = HfApi(token=os.environ["HF_TOKEN"]).repo_info(
              "csoai/runpod-gspc-intake", repo_type="dataset")
          if info.private is not True or not info.sha:
              raise SystemExit("intake must be private and revision-pinned")
          p = snapshot_download("csoai/runpod-gspc-intake", repo_type="dataset",
                                token=os.environ["HF_TOKEN"], revision=info.sha, local_dir="intake")
          n = len(list(pathlib.Path(p).rglob("card-unsigned.json")))
          print(f"pulled {n} run cards")
          if n == 0:
              raise SystemExit("intake pulled 0 cards — refusing to proceed on an empty read")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={info.sha}\n")
          PY

      - name: Review current-run snapshots without admitting them
        continue-on-error: true
        run: |
          python3 scripts/runpod_gspc_push_to_hf.py \
            --review-current "$GITHUB_WORKSPACE/intake" \
            --review-out "$RUNNER_TEMP/current-provenance"

      - name: Retain current-run source and gate decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runpod-current-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-provenance/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stage control-plane trusted banks for --trusted-bank verification
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted-banks"
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil
          from huggingface_hub import hf_hub_download

          out_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "trusted-banks"
          repo_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          for pattern in ("gpu-offload/kaggle-gspc-batch/banks/*.jsonl", "public/interop/banks/**/*.jsonl"):
              for src in sorted(repo_root.glob(pattern)):
                  if src.is_file():
                      shutil.copy2(src, out_dir / f"{src.parent.name}__{src.name}")

          # Also pull the pinned csoai/gspc-jail-goldbank rev df16e7855ff04b90fea19aa5f11f4b86cb466a47
          jail_path = hf_hub_download(
              repo_id="csoai/gspc-jail-goldbank",
              repo_type="dataset",
              filename="test.jsonl",
              revision="df16e7855ff04b90fea19aa5f11f4b86cb466a47",
              token=os.environ.get("HF_TOKEN") or None,
          )
          jail_sha = hashlib.sha256(pathlib.Path(jail_path).read_bytes()).hexdigest()
          if jail_sha != "0b45b620f2277c364275420f812e9415698e3b8bf0b105a7bbb4c2b2627d0f4a":
              raise SystemExit(f"jail goldbank digest mismatch: {jail_sha}")
          shutil.copy2(jail_path, out_dir / "gspc-jail-goldbank__test.jsonl")
          PY
          python3 scripts/resolve_runpod_trusted_bank.py \
            --index-out "$RUNNER_TEMP/trusted-banks/index.json" \
            "$RUNNER_TEMP/trusted-banks"

      - name: Verify every run independently
        run: |
          set -euo pipefail
          ok=0; legacy=0; held_bank=0; bad=0; fatal=0
          # Every non-VERIFIED run is RECORDED (path + reason code) in intake-rejections.tsv
          # and uploaded as an artifact. A recorded per-run rejection no longer fails the job:
          # the stage step reads ONLY $GITHUB_WORKSPACE/quarantine/verified-*, which the
          # verifier writes only after a run fully verifies, so a rejected run can never be
          # staged or signed. The job still FAILS CLOSED when:
          #   - the verifier crashes or prints no "REJECT <CODE>:" line (unknown state);
          #   - the reason is environmental / caller-side (UNSAFE_PATH, IO_ERROR,
          #     BAD_ALLOWLIST) -- that would mean the check itself is not trustworthy;
          #   - nothing verified at all.
          # The walk is pinned to intake/gspc-24x7 and any path containing /quarantine/ is
          # explicitly excluded, so runs moved aside in the dataset are never re-walked.
          printf 'state\tcode\trun_dir\tdetail\n' > intake-rejections.tsv
          : > legacy-intake.txt
          : > unmatched-trusted-bank.txt
          while IFS= read -r -d '' card; do
            d=$(dirname "$card")
            case "$d" in */quarantine/*) echo "SKIP_QUARANTINED_PATH $d"; continue;; esac
            rel=${d#"$GITHUB_WORKSPACE/intake/"}
            trusted_bank=""
            trusted_bank=$(python3 scripts/resolve_runpod_trusted_bank.py \
              --index "$RUNNER_TEMP/trusted-banks/index.json" \
              --run-dir "$d" 2>/dev/null) || {
              held_bank=$((held_bank+1))
              printf '%s\n' "$d" >> unmatched-trusted-bank.txt
              printf 'HOLD_CONTROL_PLANE_BANK_ABSENT\tNO_CONTROL_PLANE_BANK\t%s\tRun bank_sha256 has no byte-identical control-plane bank in repo/HF\n' "$rel" >> intake-rejections.tsv
              continue
            }
            rc=0
            out=$(python3 scripts/verify_runpod_gspc_intake.py \
                 --run-dir "$d" \
                 --trusted-bank "$trusted_bank" \
                 --bank-allowlist "$GITHUB_WORKSPACE/scripts/runpod_gspc_bank_allowlist.current.json" \
                 --quarantine-root "$GITHUB_WORKSPACE/quarantine" 2>&1) || rc=$?
            rel=${d#"$GITHUB_WORKSPACE/intake/"}
            if [ "$rc" -eq 0 ]; then
              ok=$((ok+1)); continue
            fi
            line=$(printf '%s\n' "$out" | grep -m1 -E '^REJECT [A-Z_]+: ' || true)
            code=$(printf '%s' "$line" | sed -E 's/^REJECT ([A-Z_]+): .*/\1/')
            detail=$(printf '%s' "${line#*: }" | tr '\t\n' '  ')
            if [ "$rc" -ne 2 ] || [ -z "$code" ]; then
              fatal=$((fatal+1)); echo "FATAL_UNKNOWN rc=$rc $d :: $out"; continue
            fi
            case "$code" in
              UNSAFE_PATH|IO_ERROR|BAD_ALLOWLIST)
                fatal=$((fatal+1)); echo "FATAL_$code $d :: $out"; continue;;
            esac
            if printf '%s' "$out" | grep -q 'parse_errors_excluded'; then
              legacy=$((legacy+1)); state=LEGACY_QUARANTINED
              printf '%s\n' "$d" >> legacy-intake.txt
            else
              bad=$((bad+1)); state=REJECTED
            fi
            printf '%s\t%s\t%s\t%s\n' "$state" "$code" "$rel" "$detail" >> intake-rejections.tsv
          done < <(find "$GITHUB_WORKSPACE/intake/gspc-24x7" -name card-unsigned.json -not -path '*/quarantine/*' -print0)
          echo "VERIFIED $ok · HELD_NO_CONTROL_PLANE_BANK $held_bank · LEGACY_QUARANTINED $legacy · REJECTED $bad · FATAL $fatal"
          echo "Reasons (recorded, not staged):"; tail -n +2 intake-rejections.tsv | cut -f1,2 | sort | uniq -c || true
          echo "verified=$ok" >> "$GITHUB_OUTPUT"
          [ "$fatal" -eq 0 ] || { echo "verifier could not decide $fatal run(s) safely; failing closed"; exit 1; }
          [ "$ok" -gt 0 ] || { echo "no current-schema run verified; refusing an empty stage"; exit 1; }
          staged=$(find "$GITHUB_WORKSPACE/quarantine" -maxdepth 1 -type d -name 'verified-*' | wc -l)
          [ "$staged" -ge 1 ] && [ "$staged" -le "$ok" ] || { echo "verified output count $staged inconsistent with verified $ok; failing closed"; exit 1; }

      - name: Publish the intake rejection manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runpod-intake-rejections-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            intake-rejections.tsv
            legacy-intake.txt
            unmatched-trusted-bank.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Stage the verified runs for the signer
        env:
          INTAKE_REVISION: ${{ steps.pull.outputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/runpod_gspc_bridge_to_mill.py \
            --intake "$GITHUB_WORKSPACE/quarantine" \
            --out "$RUNNER_TEMP/runpod-signing-artifact/cards"
          python3 scripts/runpod_signing_artifact.py manifest \
            --quarantine "$GITHUB_WORKSPACE/quarantine" \
            --artifact-dir "$RUNNER_TEMP/runpod-signing-artifact" \
            --intake-revision "$INTAKE_REVISION" \
            --allowlist "$GITHUB_WORKSPACE/scripts/runpod_gspc_bank_allowlist.current.json"

      - name: Publish the staged cards as an artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: runpod-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runpod-signing-artifact/
          if-no-files-found: error
          retention-days: 14
