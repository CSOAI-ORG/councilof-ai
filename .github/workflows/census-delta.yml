name: census-delta

# B11 daily overlapping Hub listing sweep.
# Commit SUMMARY + counts-only 22-axis / org-register under
# public/interop/hf-census/. n_measured stays 0. Never listings.jsonl (1.59GB).
# Never stamp MEASURED. Never invent a 3.032M walk — baseline remains
# public/signed/hub-census-baseline.json. After SUMMARY lands, dispatch
# census-tick so public-root cites the digest in publisher-health only
# (not a new card-v0 surface). Index dump, not a probe, not a mill.
# Land on a branch + PR. Direct push to master is GH006 (required gates).

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [census-delta]

concurrency:
  group: census-delta
  cancel-in-progress: false

permissions:
  actions: write          # explicitly dispatches the required gates for the bot commit
  contents: write
  pull-requests: write

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: collect delta SUMMARY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_INFERENCE_TOKEN: ${{ secrets.HF_INFERENCE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/hub-census-delta public/interop/hf-census
          python3 scripts/census/hub_census.py collect \
            --out-dir /tmp/hub-census-delta \
            --mode delta \
            --overlap-hours 6 \
            --fresh \
            --publish-dir public/interop/hf-census
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("public/interop/hf-census")
          p = pathlib.Path("/tmp/hub-census-delta/SUMMARY.json")
          s = json.loads(p.read_text(encoding="utf-8"))
          axis = json.loads((root / "axis-sources.json").read_text(encoding="utf-8"))
          org = json.loads((root / "org-register.json").read_text(encoding="utf-8"))
          if int(s.get("n_measured") or 0) != 0:
              print("HALT: n_measured is not 0", s.get("n_measured"), file=sys.stderr)
              sys.exit(3)
          if int(axis.get("n_measured") or 0) != 0 or int(org.get("n_measured") or 0) != 0:
              print("HALT: register n_measured is not 0", file=sys.stderr)
              sys.exit(3)
          if str(s.get("status_all") or "").upper() == "MEASURED":
              print("HALT: stamped MEASURED", file=sys.stderr)
              sys.exit(3)
          if str(s.get("listing_state_all") or "").upper() == "MEASURED":
              print("HALT: listing_state MEASURED", file=sys.stderr)
              sys.exit(3)
          if len(axis.get("axes") or {}) != 22:
              print("HALT: axis-sources missing 22 buckets", file=sys.stderr)
              sys.exit(3)
          if axis.get("n") != s.get("n") or org.get("n") != s.get("n"):
              print("HALT: register n does not equal fetch n", s.get("n"), axis.get("n"), org.get("n"), file=sys.stderr)
              sys.exit(3)
          for name, document in (("SUMMARY", s), ("axis-sources", axis), ("org-register", org)):
              if document.get("mode") != "delta":
                  print("HALT:", name, "is not explicitly delta", file=sys.stderr)
                  sys.exit(3)
              if float(document.get("overlap_hours") or 0) != 6:
                  print("HALT:", name, "does not declare six-hour overlap", file=sys.stderr)
                  sys.exit(3)
              if document.get("count_semantics") != "window-delta":
                  print("HALT:", name, "could masquerade as a cumulative total", file=sys.stderr)
                  sys.exit(3)
              for field in ("window_start", "window_end", "source_as_of"):
                  if not document.get(field):
                      print("HALT:", name, "missing", field, file=sys.stderr)
                      sys.exit(3)
          print(
              "n=", s.get("n"),
              "n_measured=", s.get("n_measured"),
              "status_all=", s.get("status_all"),
              "complete_reason=", s.get("complete_reason"),
              "n_orgs=", org.get("n_orgs"),
          )
          PY
          mkdir -p public/signed scripts/census
          cp /tmp/hub-census-delta/SUMMARY.json public/signed/hub-census-delta.json
          cp /tmp/hub-census-delta/SUMMARY.json scripts/census/delta.SUMMARY.json
          # never stage listings.jsonl
          rm -f /tmp/hub-census-delta/listings.jsonl
          test ! -f public/interop/hf-census/listings.jsonl
      - name: commit SUMMARY + counts-only register
        id: land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Use GitHub's linked bot identity so the commit is attributable to the
          # workflow app rather than an unlinked, human-looking email address.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/signed/hub-census-delta.json scripts/census/delta.SUMMARY.json \
            public/interop/hf-census/SUMMARY.json \
            public/interop/hf-census/axis-sources.json \
            public/interop/hf-census/org-register.json
          git diff --cached --name-only | grep -E 'listings\.jsonl$' && {
            echo "HALT: listings.jsonl staged" >&2
            exit 3
          } || true
          if git diff --cached --quiet; then
            echo "no SUMMARY change"
            echo "landed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          BR="census/delta-${STAMP}"
          git checkout -b "$BR"
          git commit -m "census-delta: counts-only register, n_measured=0 (${STAMP})"
          git push origin "HEAD:$BR"
          URL=$(gh pr create --base master --head "$BR" \
            --title "census-delta: counts-only register, n_measured=0 (${STAMP})" \
            --body "Six-hour overlapping Hub API delta (not a cumulative total, probe, or mill). \`mode=delta\`, \`overlap_hours=6\`, and the source window are explicit. \`n_measured=0\`. Never \`listings.jsonl\`. 22-axis counts + org register under \`public/interop/hf-census/\`. A listing is DISCOVERED, not a grade.")
          # GITHUB_TOKEN pushes deliberately do not emit pull_request events. Dispatch
          # the existing full gate on this trusted internal branch instead of bypassing
          # branch protection or trying to manufacture an approval.
          gh workflow run pr-gates.yml --ref "$BR"
          gh pr merge "$URL" --squash --auto || echo "auto-merge unavailable; $URL needs a human merge"
          echo "landed=1" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
      - name: dispatch census-tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"census-tick"}'
