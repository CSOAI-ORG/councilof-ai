name: worker-health-origin-regression
on:
  pull_request:
    paths:
      - "functions/api/worker.ts"
      - "functions/api/worker.test.ts"
      - ".github/workflows/worker-health-origin-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify historic RunPod endpoint is never used by default
        run: npx vitest run functions/api/worker.test.ts
