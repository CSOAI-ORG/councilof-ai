# SPDX-License-Identifier: Apache-2.0
# Gates the evidence contract the product rests on.
#
# The contract is verified against the Pages deployment host, which serves the identical
# Functions bundle. The apex is checked too, but Cloudflare 403s datacenter IP ranges — GitHub
# runners included — so the apex leg reports UNMEASURABLE rather than failing. Measuring
# nothing and measuring a failure are different findings and are kept different here.
name: evidence-smoke

on:
  push:
    branches: [main, counter-canon-enforcement]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # needs WebCrypto Ed25519

      # Authoritative: the deployment that csoai.org serves.
      - name: Evidence contract (deployment host)
        run: node scripts/smoke-evidence.mjs https://councilof.ai

      # Informational: apex reachability. Exit 75 means edge-blocked, not broken.
      - name: Evidence contract (apex, may be edge-blocked)
        continue-on-error: true
        run: node scripts/smoke-evidence.mjs https://csoai.org
