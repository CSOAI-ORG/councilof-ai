name: Wave11 assemble card_index

on:
  push:
    branches: [master]
    paths:
      - ".wave11-staging/**"
      - ".github/workflows/wave11-assemble.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave11-assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and publish wave-11 chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, json, os, time, urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ.get("GITHUB_REPOSITORY", "CSOAI-ORG/councilof-ai")
          api = f"https://api.github.com/repos/{repo}/contents/public/signed/card_index.json"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "wave11-assemble",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_sha():
              req = urllib.request.Request(api + "?ref=master", headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read()).get("sha", "")
              except Exception as e:
                  print("get_sha failed:", e)
                  return ""

          def put_content(message, raw, sha):
              body = {
                  "message": message,
                  "content": base64.b64encode(raw).decode("ascii"),
                  "branch": "master",
              }
              if sha:
                  body["sha"] = sha
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  api,
                  data=data,
                  method="PUT",
                  headers={**headers, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as resp:
                  out = json.loads(resp.read())
              return out.get("commit", {}).get("sha"), out.get("content", {}).get("sha")

          def load_gz_b64(n, expect):
              d = Path(f".wave11-staging/step_{n}")
              meta = json.loads((d / "META.json").read_text())
              if meta.get("split"):
                  b64 = "".join((d / name).read_text().strip() for name in meta["split"])
              else:
                  b64 = (d / "content.json.gz.b64").read_text().strip()
              raw = gzip.decompress(base64.b64decode(b64))
              got = hashlib.sha256(raw).hexdigest()
              if got != expect:
                  raise SystemExit(f"hash mismatch step_{n}: got {got} want {expect}")
              return raw

          meta335 = json.loads(Path(".wave11-staging/step_335/META.json").read_text())
          raw335 = load_gz_b64(335, meta335["sha256"])
          j335 = json.loads(raw335)
          print(f"loaded 335 bytes={len(raw335)}")

          payloads = {}
          meta100 = json.loads(Path(".wave11-staging/step_100/META.json").read_text())
          payloads[100] = (meta100["message"], load_gz_b64(100, meta100["sha256"]))

          for n in [150, 200, 250, 300]:
              meta = json.loads(Path(f".wave11-staging/step_{n}/META.json").read_text())
              obj = {
                  "schema": j335["schema"],
                  "kind": j335["kind"],
                  "n_cards": n,
                  "n_cells": n,
                  "pubkey": j335["pubkey"],
                  "created": j335["created"],
                  "head": j335["head"],
                  "packaged_at": meta["packaged_at"],
                  "cards": j335["cards"][:n],
              }
              raw = json.dumps(obj, separators=(",", ":")).encode()
              got = hashlib.sha256(raw).hexdigest()
              if got != meta["sha256"]:
                  raise SystemExit(f"derived hash mismatch step_{n}: got {got} want {meta['sha256']}")
              payloads[n] = (meta["message"], raw)
              print(f"derived step_{n} bytes={len(raw)}")

          payloads[335] = (meta335["message"], raw335)

          for n in [100, 150, 200, 250, 300, 335]:
              message, raw = payloads[n]
              cur_sha = get_sha()
              commit_sha, blob_sha = put_content(message, raw, cur_sha)
              print(f"published step_{n} commit={commit_sha} blob={blob_sha}")
              time.sleep(2)

          req = urllib.request.Request(
              api + "?ref=master",
              headers={**headers, "Accept": "application/vnd.github.raw"},
          )
          with urllib.request.urlopen(req) as resp:
              tip = json.loads(resp.read())
          print("TIP_VERIFY n_cards=", tip.get("n_cards"), "cards=", len(tip.get("cards") or []))
          PY
