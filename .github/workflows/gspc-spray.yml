name: gspc-spray

# Publish the live GSPC board to every distribution surface we hold a credential for — after every
# successful site deploy, daily, and on demand.
#
# One snapshot is built from LIVE truth (GET /api/gspc, root.json, the frozen banks on the Hub) by
# scripts/spray/gspc-spray.py and pushed, unchanged, to each surface. Every number is derived at run time;
# if /api/gspc cannot be read or root.json does not verify under the live DID, the script refuses (exit 2)
# and nothing is published. Idempotent: a surface
# already carrying this as_of / content fingerprint is left alone, so a daily run that finds no change
# writes nothing anywhere.
#
# Surfaces are chosen by which write credential EXISTS in this repository. A missing secret is named in the
# log and that surface is skipped — never invented, never faked. Expected secret names are:
#   HF_TOKEN            Hugging Face, write on org csoai              → --hf
#   KAGGLE_ACCESS_TOKEN OAuth token used by Kaggle CLI 2.x             → --kaggle
#   GSPC_BOARD_TOKEN    fine-grained PAT, contents:write on CSOAI-ORG/gspc-board → --github
#                       (the default GITHUB_TOKEN cannot push to another repository)
#   ZENODO_TOKEN        personal token, deposit:write + deposit:actions → --zenodo
#   PYPI_API_TOKEN      project-scoped token for csoai-gspc            → --pypi
#   NPM_TOKEN           granular token WITH "Bypass 2FA"               → (npm stays BLOCKED until then;
#                       the account is WebAuthn, so --otp can never work)
#
# Measurement, not certification. No prices. A TIE is never a win.
#
# OWNER-GATED SURFACES (D-04, 7 Oct 2026). Run 37494301188 (6 Oct) went red on four legs no workflow
# can fix: [zenodo] HTTP 403 (the account is blocked since 29 Sep; the appeal is pending, and every
# call to it while blocked is one more call from a blocked account), [github] "Invalid username or
# token" (GSPC_BOARD_TOKEN is dead), [pypi] REFUSED (a release-order guard: the source release goes
# out first) and [npm] BLOCKED (WebAuthn account). So: Zenodo is not called unless
# functions/_lib/zenodoStatus.ts says ZENODO_ACCOUNT_STATE = "AVAILABLE"; the GitHub mirror runs
# only when its token can push to gspc-board; and that one PyPI refusal ("the source release goes out
# first") and npm BLOCKED are reported as owner-gated warnings, not failures. Any other FAILED or
# REFUSED still fails the run, including PyPI serving a source newer than master declares.

on:
  schedule:
    - cron: "40 9 * * *"   # after the 09:07 UTC public-root tick, clear of the 06:00-07:15 UTC pile-up
  workflow_run:
    # Follow what actually went live, not the clock. The spray reads the APEX (councilof.ai/root.json),
    # and the apex moves only when deploy.yml finishes — minutes to hours after public-root merges a
    # new root to master. Measured 2026-09-15: root merged at 01:10:57Z (#2459) and 01:32:17Z (#2466);
    # a spray dispatched at 01:11:06Z read the apex at 01:11:31Z and, correctly, found the root the
    # last deploy had shipped (as_of 2026-09-14T22:21:53Z). Deploys then landed at 01:37Z and 01:54Z,
    # the apex moved to 01:31:22Z (303 → 312 cards, new merkle_root), and every surface sat one tick
    # behind with nothing due to re-read it before the 09:40 cron. So: run after each successful
    # deploy and let the script's own idempotency (as_of, then content fingerprint, then byte parity)
    # turn the no-change runs into no-ops. The concurrency group below collapses deploy bursts.
    # The `name:` string below is deploy.yml's — a rename there would silently stop this trigger, so
    # scripts/spray/test_gspc_spray_skip.py pins the coupling.
    workflows:
      - "Build + deploy site (gated production branch)"
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even when only the root's clock moved (same content fingerprint)"
        type: boolean
        default: false
      dry_run:
        description: "Read live truth, build the snapshot, decide — push nothing"
        type: boolean
        default: false

concurrency:
  group: gspc-spray
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spray:
    # workflow_run fires on 'completed' regardless of conclusion; a cancelled or failed deploy moved
    # nothing at the apex, so there is nothing new to read.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/spray
            functions/_lib/zenodoStatus.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        # Pinning to 1.7.x was a workaround for the CLIENT that could not survive the SERVER
        # moving. Measured 2026-09-06 with a valid legacy key: reads succeed (HTTP 200 on
        # /api/v1/datasets/list, both www.kaggle.com and api.kaggle.com) but the WRITE path
        # answers 401 {"code":401,"message":"Unauthenticated"} on
        # blobs.BlobApiService/StartBlobUpload. Basic auth can no longer upload at all, so
        # kaggle<2 + kaggle.json cannot publish however fresh the key is.
        # The same probe with the OAuth access_token as a Bearer returns HTTP 200 — which is
        # exactly why the Mac, holding a cached access_token, publishes fine. So: unpin, and
        # give the runner the token rather than the key.
        run: pip install --quiet cryptography huggingface_hub pyarrow kaggle build twine

      # The kaggle CLI in the runner does not read KAGGLE_USERNAME/KAGGLE_KEY from the
      # environment (run 33971286898: it asked for `kaggle auth login` and the push FAILED
      # while HF, GitHub and Zenodo published). It reads ~/.kaggle/kaggle.json, so write that
      # file from the same two secrets, 0600, only when both exist. Nothing is printed.
      # The write path needs the OAuth access_token, not the legacy key — see "deps" above.
      # ~/.kaggle/access_token is the same cached-token file the Mac publishes from. Written
      # 0600, only when the secret exists, and never printed.
      - name: kaggle access_token from secrets (the legacy key cannot upload)
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_ACCESS_TOKEN:-}" ]; then echo "no Kaggle access token — upload will be skipped"; exit 0; fi
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_ACCESS_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          echo "wrote ~/.kaggle/access_token ($(wc -c < ~/.kaggle/access_token) bytes)"

      - name: kaggle.json from secrets (the CLI ignores the env vars)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          # `secrets` is not a valid context in a step `if:` (the previous revision made the whole
          # workflow unparseable: HTTP 422 on dispatch). Decide inside the step instead.
          if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then echo "no Kaggle secrets — skipped"; exit 0; fi
          mkdir -p ~/.kaggle
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path.home() / ".kaggle" / "kaggle.json"
          p.write_text(json.dumps({"username": os.environ["KAGGLE_USERNAME"], "key": os.environ["KAGGLE_KEY"]}))
          p.chmod(0o600)
          print("kaggle.json written")
          PY

      - name: choose surfaces from the secrets that exist
        id: choose
        env:
          HAS_HF: ${{ secrets.HF_TOKEN != '' }}
          HAS_KAGGLE: ${{ secrets.KAGGLE_ACCESS_TOKEN != '' }}
          HAS_GITHUB: ${{ secrets.GSPC_BOARD_TOKEN != '' }}
          HAS_ZENODO: ${{ secrets.ZENODO_TOKEN != '' }}
          HAS_PYPI: ${{ secrets.PYPI_API_TOKEN != '' }}
          HAS_NPM: ${{ secrets.NPM_TOKEN != '' }}
          GSPC_BOARD_TOKEN: ${{ secrets.GSPC_BOARD_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          flags=""
          note() { echo "::notice title=gspc-spray::$1"; }
          gated() { echo "::warning title=gspc-spray owner-gated::$1"; }
          if [ "$HAS_HF" = "true" ];     then flags="$flags --hf";     else note "HF_TOKEN missing — Hugging Face skipped"; fi
          if [ "$HAS_KAGGLE" = "true" ]; then flags="$flags --kaggle"; else note "KAGGLE_ACCESS_TOKEN missing — Kaggle skipped"; fi
          if [ "$HAS_GITHUB" = "true" ]; then
            # The secret exists; ask GitHub whether it still authenticates and may push, before cloning.
            # curl prints 000 itself when it cannot connect, and then exits non-zero: `|| true`, never
            # `|| echo 000`, or the code reads 000000 (the bug fixed in post-deploy-verify).
            gh_code=$(curl -s -o "$RUNNER_TEMP/gspc-board.json" -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $GSPC_BOARD_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/CSOAI-ORG/gspc-board || true)
            gh_code=${gh_code:-000}
            can_push=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('permissions',{}).get('push', False))" "$RUNNER_TEMP/gspc-board.json" 2>/dev/null || echo False)
            rm -f "$RUNNER_TEMP/gspc-board.json"
            if [ "$gh_code" = "200" ] && [ "$can_push" = "True" ]; then flags="$flags --github"
            else gated "GSPC_BOARD_TOKEN cannot push to CSOAI-ORG/gspc-board (HTTP $gh_code, push=$can_push) — GitHub mirror skipped. Owner: mint a fine-grained token with Contents: write on CSOAI-ORG/gspc-board and replace the GSPC_BOARD_TOKEN secret."; fi
          else note "GSPC_BOARD_TOKEN missing — GitHub mirror skipped (GITHUB_TOKEN cannot push to CSOAI-ORG/gspc-board)"; fi
          # Zenodo mints a public DOI per snapshot. The living mirrors (HF, Kaggle, GitHub) follow every
          # deploy; the DOI record keeps the daily clock and explicit dispatch, so a root that ticks
          # hourly does not become a DOI an hour. Widening this is an owner decision, not a lane's.
          # The one switch for the Zenodo account is ZENODO_ACCOUNT_STATE in functions/_lib/zenodoStatus.ts
          # (flipped only after an anonymous doi.org resolve returns 200). Anything but AVAILABLE,
          # including an unreadable file, means no request to Zenodo at all.
          zenodo_state=$(sed -n 's/^export const ZENODO_ACCOUNT_STATE[^=]*= *"\([A-Z_]*\)".*/\1/p' functions/_lib/zenodoStatus.ts 2>/dev/null | head -1 || true)
          if [ "$zenodo_state" != "AVAILABLE" ]; then
            gated "Zenodo skipped: ZENODO_ACCOUNT_STATE=${zenodo_state:-unreadable} (account blocked by Zenodo since 29 Sep 2026; appeal pending). No request is sent to Zenodo until the owner's appeal is decided and that constant is flipped."
          elif [ "$HAS_ZENODO" = "true" ]; then
            if [ "$EVENT" = "workflow_run" ]; then note "follow-the-deploy run: Zenodo stays on the daily clock (no DOI minted here)"; else flags="$flags --zenodo"; fi
          else note "ZENODO_TOKEN missing — Zenodo skipped"; fi
          if [ "$HAS_PYPI" = "true" ];   then flags="$flags --pypi";   else note "PYPI_API_TOKEN missing — PyPI skipped"; fi
          if [ "$HAS_NPM" = "true" ];    then note "NPM_TOKEN present but npm publishing is not wired in this workflow yet — report only"; else gated "npm BLOCKED: the account is WebAuthn and needs a granular token with Bypass 2FA (owner, npmjs.com → Access Tokens) stored as NPM_TOKEN"; fi
          flags="$flags --npm"   # always reports the npm blocker in the table
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          if [ "$HAS_HF" = "true" ] && [ "$HAS_KAGGLE" = "true" ]; then echo "parity=true" >> "$GITHUB_OUTPUT"; else echo "parity=false" >> "$GITHUB_OUTPUT"; fi
          echo "surfaces:$flags"

      - name: spray
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GSPC_BOARD_TOKEN: ${{ secrets.GSPC_BOARD_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          FORCE: ${{ inputs.force == true && '--force' || '' }}
          DRY: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spray"
          # Actions runs this with bash -e, so the exit code is captured, not left to stop the step.
          rc=0
          python3 scripts/spray/gspc-spray.py ${{ steps.choose.outputs.flags }} $FORCE $DRY \
            --out "$RUNNER_TEMP/spray/snapshot" --report "$RUNNER_TEMP/spray/spray-report.json" || rc=$?
          # 0 = clean, 1 = a surface FAILED or REFUSED (sorted below). Anything else, including 2 (the
          # script refused to publish: live truth unreadable or unverified), is always red.
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then exit "$rc"; fi
          if [ ! -f "$RUNNER_TEMP/spray/spray-report.json" ]; then echo "::error title=gspc-spray::no report written (exit $rc)"; exit 1; fi
          # exit 1 = some surface FAILED or REFUSED. ONE PyPI refusal is owner-gated: the snapshot version
          # sorts below the package source's own version, so the source release has to go out first
          # (distribution/SUBMIT.md); it is reported, not failed. Every other PyPI refusal stays red,
          # above all "package source declares X, older than the source PyPI already serves": code
          # that is not on master reached PyPI, which is a release-order defect, not a wait.
          python3 - "$RUNNER_TEMP/spray/spray-report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          bad = []
          for x in r["results"]:
              detail = x.get("detail") or ""
              if x["status"] == "REFUSED" and x["surface"] == "pypi" and "The source release goes out first" in detail \
                      and "older than the source PyPI already serves" not in detail:
                  print(f"::warning title=gspc-spray owner-gated::PyPI REFUSED: {detail}"[:900])
              elif x["status"] in ("FAILED", "REFUSED"):
                  bad.append(x)
          for x in bad:
              print(f"::error title=gspc-spray::{x['surface']} {x['status']}: {x.get('detail') or ''}"[:900])
          sys.exit(1 if bad else 0)
          PY

      - name: report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/spray/spray-report.json" ]; then
            python3 - "$RUNNER_TEMP/spray/spray-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"## gspc-spray — as_of `{r['as_of']}`\n\n**{r['lid']}**\n\n| surface | status | url | as_of seen |\n|---|---|---|---|")
          for x in r["results"]:
              print(f"| {x['surface']} | {x['status']} | {x['url'] or '—'} | {x['as_of_seen'] or '—'} |")
          print("\nfingerprint `" + r["fingerprint"] + "`")
          PY
          else
            echo "## gspc-spray — no report written (the script refused or crashed before building the snapshot)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: verify exact Hugging Face/Kaggle parity
        if: steps.choose.outputs.parity == 'true' && !inputs.dry_run
        # Resolve Kaggle's highest Ready version explicitly: its unversioned download pointer can
        # remain stale after a version is Ready. Wait only when that newest Ready archive is behind.
        # Keep the wait below the 30-minute job ceiling so the report artifact is still uploaded on failure.
        run: python3 scripts/spray/verify-gspc-parity.py --kaggle-wait-seconds 900 --allow-stale-live-root --report "$RUNNER_TEMP/spray/parity-report.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gspc-spray-${{ github.run_id }}
          path: ${{ runner.temp }}/spray
          if-no-files-found: ignore
          retention-days: 30
