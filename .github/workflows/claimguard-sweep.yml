name: ClaimGuard Estate Sweep
on:
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ClaimGuard estate sweep
        id: sweep
        run: |
          python3 scripts/claimguard-estate-sweep.py --json > /tmp/claimguard-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Generate issue body
        if: always()
        run: |
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/claimguard-report.json'))
          errors = [f for f in r['findings'] if f['severity'] == 'error']
          warnings = [f for f in r['findings'] if f['severity'] == 'warn']
          
          body = f'''## ClaimGuard Estate Sweep — {r['generated']}
          
          **Surfaces checked:** {r['surfaces_checked']}
          **Findings:** {r['summary']['errors']} errors, {r['summary']['warnings']} warnings
          
          '''
          
          if errors:
              body += '### ❌ Errors (trust-destroying)\n\n'
              for f in errors:
                  body += f'- **[{f[\"rule\"]}]** {f[\"surface\"]}: {f[\"detail\"]}\n'
              body += '\n'
          
          if warnings:
              body += '### ⚠️ Warnings\n\n'
              for f in warnings:
                  body += f'- **[{f[\"rule\"]}]** {f[\"surface\"]}: {f[\"detail\"]}\n'
              body += '\n'
          
          if not errors and not warnings:
              body += '### ✅ No contradictions found\n\nAll surfaces pass ClaimGuard sweep.\n'
          
          body += '\n---\n*Auto-generated by ClaimGuard Estate Sweep (weekly cron). Manual review required.*'
          
          with open('/tmp/issue-body.md', 'w') as f:
              f.write(body)
          "

      - name: Create issue if findings
        if: steps.sweep.outputs.exit_code != '0' || always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/issue-body.md', 'utf8');
            const report = JSON.parse(fs.readFileSync('/tmp/claimguard-report.json', 'utf8'));
            
            if (report.summary.errors === 0 && report.summary.warnings === 0) {
              console.log('No contradictions found — skipping issue creation.');
              return;
            }
            
            const title = `ClaimGuard: ${report.summary.errors} errors, ${report.summary.warnings} warnings — ${new Date().toISOString().split('T')[0]}`;
            
            // Check for existing open ClaimGuard issues to avoid duplicates
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'claimguard',
              state: 'open',
              per_page: 5,
            });
            
            if (issues.data.length > 0) {
              // Comment on existing issue instead of creating new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
              console.log(`Commented on existing issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['claimguard', 'automated'],
              });
              console.log(`Created issue #${issue.data.number}`);
            }
