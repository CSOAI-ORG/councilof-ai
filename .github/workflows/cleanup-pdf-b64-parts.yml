# One-shot: remove MCP-split PDF .b64.part* sidecars now that designed PDF is on tip.
name: cleanup-pdf-b64-parts

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/instruments-catalog-7fb8
    paths:
      - ".github/workflows/cleanup-pdf-b64-parts.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete b64 part sidecars + probe junk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          parts=(public/regulator-indices-one-pager.pdf.b64.part*)
          single=public/regulator-indices-one-pager.pdf.b64
          removed=0
          for f in "${parts[@]}"; do git rm -f "$f" && removed=$((removed+1)); done
          if [ -f "$single" ]; then git rm -f "$single" && removed=$((removed+1)); fi
          if [ -f docs/_mcp_push_probe.md ]; then git rm -f docs/_mcp_push_probe.md && removed=$((removed+1)); fi
          # drop this one-shot workflow after it runs
          git rm -f .github/workflows/cleanup-pdf-b64-parts.yml || true
          if [ "$removed" -eq 0 ] && git diff --staged --quiet; then
            echo "nothing to clean"
            exit 0
          fi
          git commit -m "chore(pdf): drop MCP b64 part sidecars; designed PDF stays on tip (#149)"
          git push
