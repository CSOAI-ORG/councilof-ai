name: public-root

# The only producer of the public root. It builds public/root.json + cards + proofs + publisher-health +
# public/archive (provable-archive index, EIP-1186 proof bytes, evm-events cursor), signs through the
# GitHub-OIDC relay (/api/board-sign; "public-root" is on its workflow allow-list), witnesses the exact
# bytes (Rekor + OpenTimestamps), runs the release gate, and banks the signed tree on the ONE rolling
# branch public-root/pending behind ONE pull request.
# SINGLE WRITER (owner ruling, 6 Oct 2026): GitHub master changes only through a gated pull request, and
# deploy.yml ships it. This workflow never pushes master — not the tree, not halt health. Promotion is
# public-root-candidate-upgrade.yml's job (upgrade the exact proof, re-run the gate and pr-gates, then merge).
# Does NOT prerender the site. Never wrangler. Never print the key. Never stamp MEASURED.
# If neither the OIDC relay nor BOARD_SIGN_KEY_PKCS8_B64 can sign, fail closed (exit 3). Never publish unsigned NEW leaves.

on:
  schedule:
    - cron: "7 * * * *"  # re-enabled 2026-09-13: schedule was auto-disabled after consecutive failures pre-#2071
  # Intake on merge: staged unsigned atoms land via PR merge; without a push
  # trigger the signer only sees them at the next cron tick (observed 2026-09-12:
  # merge 15:14Z, cron slots 15:07/16:07 delayed >2h by the GitHub scheduler).
  # Scoped to the staged-leaves inputs ONLY — the publisher's own commits
  # (root.json, public/cards, public/proofs, readiness.json, root-witness-*)
  # never match these paths, so this cannot self-trigger.
  push:
    branches: [master]
    paths:
      - "public/interop/xrpl-swift-eater-2026-09/**"
      - "public/interop/estate-boundary-2026-09/**"
      - "public/interop/stablecoin-cohort-2026-09/**"
      - "scripts/adapters/staged_leaves.py"
  repository_dispatch:
    types: [xrpl-tick, notice-tick, census-tick, heal]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run adapters + halts without writing"
        type: boolean
        default: true

concurrency:
  group: public-root
  cancel-in-progress: false

permissions:
  actions: write   # maintain-pending dispatches public-root-candidate-upgrade.yml
  contents: write
  id-token: write
  pull-requests: write   # the publisher opens/updates its one PR; it never pushes master (single writer)

jobs:
  # A pending candidate owns its exact OTS proof. Regenerating a fresh root on the
  # same rolling branch before that proof matures destroys the only upgrade path and
  # can leave every hourly candidate permanently pending. Preserve the open candidate;
  # the dedicated maintainer below upgrades it and promotes it once Bitcoin confirms.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - name: Is a public-root candidate already waiting?
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=$(gh pr list --repo "$REPO" --head public-root/pending --base master --state open --json number --jq 'length')
          if [ "$n" = "0" ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "An exact candidate is already waiting; preserve its bytes and proof."
          fi

  maintain-pending:
    needs: preflight
    if: needs.preflight.outputs.pending == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the candidate maintainer to upgrade, verify and promote
        env:
          GH_TOKEN: ${{ github.token }}
        # --repo is required: this job has no checkout, and `gh` infers the
        # repository from the local git dir (fatal: not a git repository).
        run: gh workflow run public-root-candidate-upgrade.yml --repo ${{ github.repository }} --ref master

  publish:
    needs: preflight
    if: needs.preflight.outputs.pending != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install cryptography
      - name: Layer 0 liveness atom (a PROBED read of the floor itself; the publisher signs it into this root)
        run: |
          set -euo pipefail
          # One atom per run: DID key, root, pointer, Rekor/OTS states as the live site serves them
          # right now. Staged under public/interop/layer0-liveness-2026-09/ (STAGED_DIRS) — the
          # publisher below admits it unsigned and signs it into the root it is about to build.
          # The release gate runs after publish, so its verdict is recorded on the NEXT tick's atom
          # only when a durable verdict exists; UNRUN is the honest default here.
          python3 scripts/readers/layer0_liveness_reader.py --stage public/interop/layer0-liveness-2026-09 --gate-result UNRUN || echo "layer0 reader failed — the root ticks without the atom (never a fake read)"
      - name: publish public root
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          BOARD_SIGN_KEY_PKCS8_B64: ${{ secrets.BOARD_SIGN_KEY_PKCS8_B64 }}
          BOARD_SIGN_URL: https://councilof.ai/api/board-sign
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_INFERENCE_TOKEN: ${{ secrets.HF_INFERENCE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          # Witness queue (/api/witness → WITNESS_KV) read over the KV REST API. All three
          # absent/empty → the adapter yields no KV leaves and never halts the root.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WITNESS_KV_NAMESPACE_ID: ${{ vars.WITNESS_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          # GHA on master only: this workflow is not registered on pull_request.
          # checkout ref is master even if a dispatch arrives with another ref.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/publish_public_root.py --dry-run
          else
            python scripts/publish_public_root.py
          fi
      - name: witness the ONE root (Rekor rekord + OpenTimestamps; public bytes only, no key)
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          pip install -q opentimestamps-client
          python scripts/witness_public_root.py
      - name: EAS on Base — attest the ONE root (fails closed without EAS_ATTESTER_PRIVATE_KEY)
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        env:
          EAS_ATTESTER_PRIVATE_KEY: ${{ secrets.EAS_ATTESTER_PRIVATE_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EAS_ATTESTER_PRIVATE_KEY:-}" ]; then
            echo "EAS key absent: record NOT_YET without loading wallet dependencies"
            node scripts/eas_attest_root.mjs
          else
            echo "EAS key present: dependency install and attestation are essential and fail closed"
            npm install --no-save --silent ethers@6 @ethereum-attestation-service/eas-sdk@2
            # eas-sdk's ESM build does `import { isEqual } from 'lodash'` - a named import
            # from a CJS package whose properties are assigned at runtime, so Node's static
            # lexer finds no named exports and the whole publish crashed (run 37717488561,
            # 2026-10-08). Rewrite any such import to a default-import destructure, then
            # functionally verify the module loads before the attester script runs. If the
            # verification fails the step fails closed exactly as designed.
            node scripts/eas_lodash_interop_patch.mjs
            node -e 'import("@ethereum-attestation-service/eas-sdk").then(m => console.log("eas-sdk import OK:", typeof m.EAS)).catch(e => { console.error(e); process.exit(1); })'
            node scripts/eas_attest_root.mjs
          fi
      - name: Refresh exact-root EAS witness metadata after the chain write
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          python scripts/witness_public_root.py --refresh-eas

      # The release gate checks every public .ots against the bytes beside it and blocks the whole
      # root on one mismatch. It did, on every run of 5-6 Oct 2026 (37376012173, 37403227482,
      # 37447955940): the EAS step rewrote eas-root-attestations.json, whose .ots still proved its
      # 30 Sep bytes. The EAS step now leaves an unchanged NOT_YET alone; when the ledger really
      # changes (an attestation is appended), this keeps the old bytes + old proof as a dated pair
      # and stamps the new bytes. Scope: the declared publisher-owned ledgers only. A dated receipt
      # whose bytes change is still blocked. Nothing changed means nothing is written.
      - name: Re-stamp a publisher-owned ledger this run changed (old bytes + old proof kept as a dated pair)
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          short=$(sha256sum public/root.json | cut -c1-8)
          python scripts/ots_restamp_ledger.py --event "root-${short}" --list-out "$RUNNER_TEMP/restamped.txt"
          if [ -s "$RUNNER_TEMP/restamped.txt" ]; then
            # The OTS manifest is generated from the proof files, and llms.txt quotes the manifest's
            # counts and as_of. Rebuild both from their producers, or pr-gates' llms.txt check goes
            # red on the candidate (it went red on master when #2816 rebuilt the manifest alone).
            python scripts/ots_manifest_rebuild.py --apply
            node scripts/llms-txt.mjs
            printf '%s\n' public/interop/ots/manifest.json public/llms.txt public/llms-full.txt >> "$RUNNER_TEMP/restamped.txt"
          fi

      # readiness.json is a derived view over root.json + root-witness-latest.json.
      # Rebuilding it before the witness steps made a newly stamped root inherit the
      # previous root's Bitcoin-confirmed state. Recompute only after all exact-root
      # witness metadata is final so the public readiness state and the gate agree.
      - name: Refresh witness-derived stablecoin readiness
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: python scripts/build_stablecoin_readiness.py
      - name: mark witnessed digests (KV entries in this root → witnessed; public mirrors; idempotent, never fails the publish)
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WITNESS_KV_NAMESPACE_ID: ${{ vars.WITNESS_KV_NAMESPACE_ID }}
        run: python scripts/adapters/witness_queue.py --mark
      - name: provable archive index (append-only; bytes from this tree + witnesses; no key, no network)
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          python scripts/build_archive_index.py
      # Re-evaluate drift against the LIVE root, and do it even when the steps above were
      # skipped or failed. The witness step only rewrites the pointer when it succeeds, so
      # between successful runs nothing was re-examining whether the pointer's claim still
      # held — and it stopped holding: on 2026-09-04 the published pointer read MATCH while
      # naming a sha256 and byte-count that had not been live for a day. This step is what
      # makes the pointer self-correct rather than sit on a stale all-clear.
      #
      # continue-on-error deliberately: --recheck exits 1 on DRIFTED, and DRIFTED is the
      # NORMAL state for the minutes between committing a new root and Pages serving it.
      # Failing the workflow on that would be a gate that cries wolf, which gets switched off
      # and then protects nothing. The honest status lands in the artefact either way, and the
      # commit step below already stages the pointer.
      - name: recheck drift against the live root (self-corrects a stale pointer)
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        continue-on-error: true
        run: python scripts/witness_public_root.py --recheck

      - name: release integrity — root, sidecar, Rekor and every public OTS file
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          python scripts/root-witness-release-gate.py --selftest
          # The candidate is not live yet, so DRIFTED is valid when it is a real,
          # internally consistent comparison with the old apex root.
          python scripts/root-witness-release-gate.py --phase candidate
      - name: Regenerate cards-bundle for the tree this run just wrote
        # /api/xrpl resolves root shas ONLY through /cards-bundle.json (one-fetch read path);
        # the bundle used to regenerate only at client build, so a fresh root shipped a stale
        # bundle, the reader counted 14 of the locked 16, /api/xrpl 404'd, pop_xrpl's honest
        # UNMEASURED sentence hit 287 chars and pr-gates' 260-char guard failed the candidate
        # (runs 37730042893/37737907167, 2026-10-08). Superset-from-disk is harmless; a subset
        # 404s a leaf (documented in generate-cards-bundle.mjs). Idempotent, no .ots involved.
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: node scripts/generate-cards-bundle.mjs
      - name: commit published tree
        id: commit_tree
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "csoai-public-root"
          git config user.email "board@csoai.org"
          git add public/root.json public/cards public/proofs public/publisher-health.json public/cards-bundle.json
          git add public/interop/stablecoin-universe-2026-09/readiness.json
          git add public/archive
          mapfile -d '' witness_files < <(find public/interop -maxdepth 1 -type f \
            \( -name 'root-witness-*.json' -o -name 'rekor-root-*.json' -o -name '*.ots' \) -print0)
          if [ "${#witness_files[@]}" -eq 0 ]; then
            echo "HALT: witness step produced no stageable witness files" >&2
            exit 1
          fi
          git add -- "${witness_files[@]}"
          git add -- public/interop/root-witness-pointer.json
          # XRPL impersonation scan snapshot + mirrors (adapter refreshes them each run)
          if [ -d public/interop/xrpl-impersonation-2026-09 ]; then
            git add -- public/interop/xrpl-impersonation-2026-09
          fi
          # XRPL 16-identity state matrix + mirrors (adapter refreshes on change)
          if [ -d public/interop/xrpl-16-state-matrix ]; then
            git add -- public/interop/xrpl-16-state-matrix
          fi
          if [ -f public/interop/eas-root-attestations.json ]; then
            git add -- public/interop/eas-root-attestations.json
          fi
          # A re-stamped ledger: its new proof, the dated pair of old bytes + old proof, the OTS
          # manifest and llms.txt rebuilt from their producers. Listed by the re-stamp step; the
          # list is absent or empty when nothing changed.
          if [ -s "$RUNNER_TEMP/restamped.txt" ]; then
            git add --pathspec-from-file="$RUNNER_TEMP/restamped.txt"
          fi
          if [ -d public/interop/witness ]; then
            mapfile -d '' digest_files < <(find public/interop/witness -maxdepth 1 -type f -name '*.json' -print0)
            if [ "${#digest_files[@]}" -gt 0 ]; then
              git add -- "${digest_files[@]}"
            fi
          fi
          if git diff --cached --quiet; then
            echo "no tree change"
            exit 0
          fi
          git commit -m "public-root: adapters → cards → merkle ($(date -u +%Y-%m-%dT%H:%MZ))"
          # SINGLE WRITER (owner ruling, 6 Oct 2026): master changes only through a gated pull
          # request, so this job never pushes master. It could not anyway: branch protection
          # answered every direct push of 5-6 Oct 2026 with "GH006: Protected branch update
          # failed ... Changes must be made through a pull request". The signed tree goes to the
          # rolling branch and its one pull request; the candidate maintainer
          # (public-root-candidate-upgrade.yml) upgrades the exact OTS proof, re-runs the release
          # gate, dispatches pr-gates on the branch and only then arms the merge.
          # ONE branch, not one per run. A timestamped branch per hour banks 24 stranded
          # branches and 24 pull requests a day, and only the newest is worth landing —
          # each tree already contains everything the previous one did. A single
          # force-updated branch always holds the LATEST signed tree, so whoever lands it
          # lands the current root, and there is exactly one thing to look at.
          branch="public-root/pending"
          if ! git push --force origin "HEAD:refs/heads/${branch}"; then
            echo "HALT: could not push the publish branch ${branch}" >&2
            exit 1
          fi
          echo "signed tree banked on ${branch} (force-updated to the latest)"
          # Reuse the open PR if there is one; the force-push already updated it in place. A newer
          # tree restarts the Bitcoin clock, so any armed merge on the old bytes is disarmed.
          existing=$(gh pr list --head "${branch}" --base master --state open --json url --jq '.[0].url // ""')
          if [ -n "${existing}" ]; then
            echo "existing publish PR updated in place: ${existing}"
            gh pr merge "${existing}" --disable-auto 2>/dev/null || true
            echo "pushed=pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(gh pr create --base master --head "${branch}" \
            --title "public-root: Bitcoin-pending signed candidate" \
            --body "Automated signed candidate from public-root.yml. Its exact bytes and OTS proof are preserved while Bitcoin confirmation matures; it must not replace the live confirmed root while pending. public-root-candidate-upgrade.yml upgrades the proof, re-runs the release gate, dispatches pr-gates on this branch and only then arms the merge. Measurement, not certification." \
            2>&1 | tail -1) || {
              # Stay RED. The tree is safe on the branch, but it is NOT on master and the
              # root is therefore NOT published. A green tick here would say "published"
              # about a root nobody can fetch — the same vacuous-check shape as a guard
              # that passes because it never looked.
              echo "HALT: tree banked on ${branch} but no pull request — gh pr create needs 'pull-requests: write' and the repository setting that lets GitHub Actions create pull requests" >&2
              echo "pushed=branch" >> "$GITHUB_OUTPUT"
              exit 1
          }
          echo "opened ${url}"
          echo "candidate stays open with no merge armed until its proof is Bitcoin-confirmed"
          echo "pushed=pr" >> "$GITHUB_OUTPUT"
          exit 0

      # Halt is fail-closed: a step above failed, so no tree is banked. The health record is the
      # evidence of the halt, but it is not a reason to write master. Every halt of 5-6 Oct 2026
      # tried a direct push to master and was refused (GH006), and under the single-writer
      # ruling a successful one would be a second writer. The record stays with the run: in the
      # run summary and as an artifact. The run stays red.
      - name: record halt health with the run (summary + artifact; never a master write)
        if: failure() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          set -euo pipefail
          {
            echo "## public-root halted: no tree banked, nothing published"
            echo
            echo "publisher-health.json at halt time (also attached as the publisher-health-halt artifact):"
            echo
            echo '```json'
            head -c 60000 public/publisher-health.json 2>/dev/null || echo '(public/publisher-health.json absent)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: keep halt health as a run artifact
        if: failure() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: publisher-health-halt
          path: public/publisher-health.json
          if-no-files-found: warn
          retention-days: 30
