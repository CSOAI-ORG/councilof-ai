name: rogue-ai-external-source-audit
on:
  pull_request:
    paths:
      - "scripts/research/audit_rogue_ai_public_archive.py"
      - "scripts/research/test_rogue_ai_public_archive_audit.py"
      - "scripts/research/rogue_ai_to_evidence_event.py"
      - "scripts/research/test_rogue_ai_to_evidence_event.py"
      - "docs/research/rogue-ai-public-archive-20261124/**"
      - ".github/workflows/rogue-ai-external-source-audit.yml"
permissions:
  contents: read
jobs:
  independent-table-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify retained exact-byte source, denominator, and claim-boundary record
        run: python3 -m unittest discover -s scripts/research -p test_rogue_ai_public_archive_audit.py -v
      - name: Verify canonical GSPC conversion of third-party observed source with no new authority
        run: python3 -m unittest discover -s scripts/research -p test_rogue_ai_to_evidence_event.py -v
      - name: Build actual unsigned PARTIAL original-source audit evidence event
        run: |
          python3 scripts/research/rogue_ai_to_evidence_event.py --output /tmp/rogue-ai-source-partial-event.json
          python3 - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('fabric','packages/evidence-fabric/event.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          d=json.load(open('/tmp/rogue-ai-source-partial-event.json'))
          assert mod.validate(d)==[]
          assert d['event_id']==mod.compute_event_id(d)
          assert d['state']=='PARTIAL' and d['value'] is None
          assert d['signature'] is None and d['anchors']['ots']=='none'
          assert d['observed']['gspc_board_admitted'] is False
          assert d['observed']['actual_model_inference_by_csoai'] is False
          assert d['observed']['external_human_receiver_accepted'] is False
          print('EXTERNAL_SOURCE_ARITHMETIC PARTIAL UNSIGNED NOT_GSPC_MEASURED')
          PY
      - name: Independently GET original upstream archive and recalculate its published rows
        run: |
          python3 scripts/research/audit_rogue_ai_public_archive.py --download --output /tmp/rogue-ai-external-reaudit.json
          python3 - <<'PY'
          import json
          old=json.load(open("docs/research/rogue-ai-public-archive-20261124/observed-audit.json"))
          new=json.load(open("/tmp/rogue-ai-external-reaudit.json"))
          for key in (
            "archive_original_bytes_sha256","table_original_bytes_sha256",
            "row_count","reported_reproduced","reported_not_reproduced",
            "archived_reported_reproduction_pct","initial_verdict_distribution",
            "initial_verdict_by_final_reproduction","authors_original_model_session_totals",
            "authors_aggregated_control_sessions","source_category_counts",
          ):
            assert new[key]==old[key], key
          assert new["original_paper_model_sessions_reexecuted"] is False
          assert new["independent_human_recipient_accepted"] is False
          print("Original-source table arithmetic reproduced on independent GitHub CI host; no frontier model was called.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rogue-ai-unsigned-source-event-${{ github.sha }}
          path: /tmp/rogue-ai-source-partial-event.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: rogue-ai-third-party-archive-source-recheck-${{ github.sha }}
          path: /tmp/rogue-ai-external-reaudit.json
          retention-days: 30
