name: MEOK partial-observation process-model reproducibility
on:
  pull_request:
    paths:
      - harness/meok-process-lab-partial-v1/**
      - .github/workflows/meok-partial-world-v1.yml
  push:
    branches: [master]
    paths:
      - harness/meok-process-lab-partial-v1/**
      - .github/workflows/meok-partial-world-v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meok-partial-world-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        working-directory: harness/meok-process-lab-partial-v1
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Regenerate source-pinned fresh episodes
        working-directory: harness/meok-process-lab-partial-v1
        run: python -B generate_episodes.py
      - name: Train candidates and compare held-out models
        working-directory: harness/meok-process-lab-partial-v1
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -B train_partial.py
      - name: Test portable inference
        working-directory: harness/meok-process-lab-partial-v1
        run: python -B -m unittest -v test_predict.py
      - name: Verify bundle hashes and feature separation
        working-directory: harness/meok-process-lab-partial-v1
        run: python -B verify_bundle.py
