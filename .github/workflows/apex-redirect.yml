name: Apex redirect — csoai.org → councilof.ai

on:
  push:
    branches: [master, main]
    paths: ['redirect-apex/**', '.github/workflows/apex-redirect.yml']
  workflow_dispatch: {}

concurrency: { group: apex-redirect, cancel-in-progress: true }

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy redirect to csoai-site production (owns csoai.org + www.csoai.org)
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
        run: |
          # Deploy from a CLEAN temp dir: the repo root carries wrangler.jsonc +
          # functions/api/og.ts (workers-og dep) which Wrangler tries to bundle
          # when the cwd is the repo. Static-only redirect needs none of that.
          mkdir -p /tmp/apex-redirect
          cp redirect-apex/_redirects /tmp/apex-redirect/_redirects
          cp redirect-apex/index.html /tmp/apex-redirect/index.html
          cd /tmp/apex-redirect
          npx wrangler pages deploy . --project-name=csoai-site --branch=main --commit-dirty=true
      - name: Verify redirect live
        run: |
          sleep 8
          for host in csoai.org www.csoai.org; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "https://$host/")
            dest=$(curl -s -o /dev/null -w "%{url_effective}" -L --max-time 15 "https://$host/")
            echo "$host -> $code -> $dest"
          done
