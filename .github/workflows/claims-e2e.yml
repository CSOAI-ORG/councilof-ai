name: Claims E2E (live truth check)

# Verifies every claim on the live site is functionally true — tools execute,
# seals are real Ed25519, counts match copy. Fails if any claim fails.
#
# TRIGGER CHANGED 2026-08-26 (push -> workflow_run). This used to fire on EVERY push
# to master, and it was wrong on its own terms as well as expensive:
#   * It checks the LIVE site, then waited a flat `sleep 90` for the deploy. The deploy
#     workflow takes 20+ minutes (playwright install, ~580-route prerender, and 230s of
#     deliberate anti-clobber sleeps). So on push this measured the PREVIOUS build and
#     called it a live truth check.
#   * It held a runner for ~5 minutes (chromium install + the sleep) per push, while the
#     deploy it was supposedly validating sat in the queue behind it. On 2026-08-26 that
#     starvation put 14 workflows in the queue with 0 running and the deploy never ran.
# Running it when deploy.yml actually COMPLETES makes it both cheaper and true.
on:
  workflow_run:
    workflows: ["Build \\+ deploy site (gated production branch)"]
    types: [completed]
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

# Collapse a burst: only the newest run of a deploy sequence needs to check live.
concurrency: { group: claims-e2e, cancel-in-progress: true }

jobs:
  verify:
    # workflow_run fires on 'completed' regardless of conclusion. Without this the
    # e2e would run against a stale site after a FAILED deploy and report a red that
    # says nothing about the code — a false alarm is a guard that trains you to ignore it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run's github.sha is the receiver's default-branch revision.
      # Validate the successful canonical deploy before checking out its source.
      - name: Validate triggering deployment identity
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ||
                "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY" ||
                "$UPSTREAM_BRANCH" != master ||
                "$UPSTREAM_PATH" != .github/workflows/deploy.yml ||
                "$UPSTREAM_CONCLUSION" != success ||
                "$UPSTREAM_RUN_URL" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID" ]]; then
            echo "::error::Missing or noncanonical successful deployment identity"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # This binds the verifier source; it does not identify the current live alias.
      - name: Record and verify checkout identity
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          printf 'VERIFICATION_EVENT=%s\nEXPECTED_CHECKOUT_SHA=%s\nCHECKOUT_SHA=%s\n' "$GITHUB_EVENT_NAME" "$EXPECTED_CHECKOUT_SHA" "$CHECKOUT_SHA"
          printf 'DEPLOY_SHA=%s\nDEPLOY_RUN_URL=%s\n' "${DEPLOY_SHA:-not-applicable}" "${DEPLOY_RUN_URL:-not-applicable}"
          if [ "$CHECKOUT_SHA" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Checkout does not match the selected verification source"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hive recon/scoring gate (deterministic · honesty invariants · no network)
        run: node scripts/hive-recon.mjs
      - name: Install Playwright (chromium)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@1.61.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      # workflow_run fires when deploy.yml has finished, so the only wait needed is
      # Cloudflare's alias propagation, not the whole build.
      - name: Let the Pages alias settle
        if: github.event_name == 'workflow_run'
        run: sleep 30
      - name: Run claims verification against live site + brain
        env:
          # Retargeted 2026-08-26. This ran against csoai-site.pages.dev, a DIFFERENT
          # Cloudflare Pages project that does not carry this repo's functions — so
          # /api/tools returned the SPA shell (404 text/html) and the 'live truth check'
          # failed against a host it could never pass on. councilof.ai is the deploy
          # target of this repo and returns 200 application/json.
          SITE: https://councilof.ai
        run: node scripts/claims-e2e.mjs
