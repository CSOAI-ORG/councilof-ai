name: Claims E2E (live truth check)

# Verifies every claim on the live site is functionally true — tools execute,
# seals are real Ed25519, counts match copy. Runs after each push to master
# (waits for Vercel deploy), nightly, and on demand. Fails if any claim fails.

on:
  push:
    branches: [master, main, counter-canon-enforcement]
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Hive recon/scoring gate (deterministic · honesty invariants · no network)
        run: node scripts/hive-recon.mjs
      - name: Install Playwright (chromium)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@1.61.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Wait for Cloudflare Pages deploy (push only)
        if: github.event_name == 'push'
        run: sleep 90
      - name: Run claims verification against live site + brain
        env:
          # Retargeted 2026-08-26. This ran against csoai-site.pages.dev, a DIFFERENT
          # Cloudflare Pages project that does not carry this repo's functions — so
          # /api/tools returned the SPA shell (404 text/html) and the 'live truth check'
          # failed against a host it could never pass on. councilof.ai is the deploy
          # target of this repo and returns 200 application/json.
          SITE: https://councilof.ai
        run: node scripts/claims-e2e.mjs
