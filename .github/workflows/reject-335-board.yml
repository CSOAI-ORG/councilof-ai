# OWNER RULING 2026-08-28: 335 verifying files is not a fabrication.
# This workflow used to auto-revert the index to 150. That war is over.
# It now only checks that signed-json-guard accepts the tree. No push.
name: reject-335-board
on:
  push:
    paths:
      - 'public/signed/card_index.json'
      - '.github/workflows/honest-board-floor.yml'
      - 'scripts/signed-json-guard.mjs'
  pull_request:
    paths:
      - 'public/signed/card_index.json'
      - '.github/workflows/honest-board-floor.yml'
      - 'scripts/signed-json-guard.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard only — do not restore 150
        run: |
          set -euo pipefail
          node scripts/signed-json-guard.mjs --selftest
          node scripts/signed-json-guard.mjs public
          python3 - <<'PY'
          import json, pathlib, sys
          j = json.loads(pathlib.Path('public/signed/card_index.json').read_bytes())
          cards = j.get('cards') if isinstance(j.get('cards'), list) else []
          n = j.get('n_cards')
          if n != len(cards):
              print('FAIL header lie', n, len(cards)); sys.exit(1)
          print('ok n_cards', n, '== rows', len(cards), '(335 is allowed when files verify)')
          PY
