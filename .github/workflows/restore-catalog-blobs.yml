name: Restore catalog blobs
on:
  workflow_dispatch:
  push:
    branches: [cursor/instruments-catalog-7fb8]
    paths: ['.restore-chunks/READY']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
          fetch-depth: 0
      - name: Assemble from base64 parts
        run: |
          set -euo pipefail
          assemble() {
            local dest="$1" expected="$2"; shift 2
            local tmp
            tmp=$(mktemp)
            : > "$tmp"
            for p in "$@"; do
              test -f ".restore-chunks/$p"
              base64 -d ".restore-chunks/$p" >> "$tmp"
            done
            local size
            size=$(wc -c < "$tmp")
            echo "$dest assembled size=$size expected=$expected"
            test "$size" -eq "$expected"
            mkdir -p "$(dirname "$dest")"
            mv "$tmp" "$dest"
          }
          assemble public/sitemap.xml 63246 \
            public__sitemap.xml.part00 public__sitemap.xml.part01 public__sitemap.xml.part02 public__sitemap.xml.part03 \
            public__sitemap.xml.part04 public__sitemap.xml.part05 public__sitemap.xml.part06 public__sitemap.xml.part07
          assemble public/ecosystem.json 83080 \
            public__ecosystem.json.part00 public__ecosystem.json.part01 public__ecosystem.json.part02 public__ecosystem.json.part03 \
            public__ecosystem.json.part04 public__ecosystem.json.part05 public__ecosystem.json.part06 public__ecosystem.json.part07 \
            public__ecosystem.json.part08 public__ecosystem.json.part09
          assemble functions/data/ecosystem.json 83080 \
            functions__data__ecosystem.json.part00 functions__data__ecosystem.json.part01 functions__data__ecosystem.json.part02 functions__data__ecosystem.json.part03 \
            functions__data__ecosystem.json.part04 functions__data__ecosystem.json.part05 functions__data__ecosystem.json.part06 functions__data__ecosystem.json.part07 \
            functions__data__ecosystem.json.part08 functions__data__ecosystem.json.part09
          rm -rf .restore-chunks
          rm -f .github/workflows/restore-catalog-blobs.yml
      - name: Commit restored blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore ecosystem.json and sitemap.xml from chunks"
          git push origin HEAD:cursor/instruments-catalog-7fb8
