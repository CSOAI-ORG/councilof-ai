name: restore-catalog-blobs

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL of the full blob
        required: true
        type: string
      dest_path:
        description: Repo path to write
        required: true
        type: string
      expected_bytes:
        description: Minimum byte size to accept
        required: false
        default: "80000"
        type: string
  push:
    branches: [cursor/instruments-catalog-7fb8]
    paths:
      - .restore-chunks/trigger.json

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit restored blob
        env:
          INPUT_URL: ${{ github.event.inputs.source_url }}
          INPUT_PATH: ${{ github.event.inputs.dest_path }}
          INPUT_MIN: ${{ github.event.inputs.expected_bytes }}
        run: |
          set -euo pipefail
          if [ -f .restore-chunks/trigger.json ]; then
            INPUT_URL=$(python3 -c "import json; print(json.load(open('.restore-chunks/trigger.json'))['url'])")
            INPUT_PATH=$(python3 -c "import json; print(json.load(open('.restore-chunks/trigger.json'))['path'])")
            INPUT_MIN=$(python3 -c "import json; print(json.load(open('.restore-chunks/trigger.json')).get('expected_bytes', 80000))")
          fi
          test -n "$INPUT_URL"
          test -n "$INPUT_PATH"
          mkdir -p "$(dirname "$INPUT_PATH")"
          curl -fsSL "$INPUT_URL" -o "$INPUT_PATH"
          SIZE=$(wc -c < "$INPUT_PATH")
          echo "restored $INPUT_PATH size=$SIZE min=$INPUT_MIN"
          test "$SIZE" -gt "$INPUT_MIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$INPUT_PATH"
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "fix: restore ${INPUT_PATH} (litterbox blob repair)"
          git push
