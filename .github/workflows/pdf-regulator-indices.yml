# NEXT_300 #149 — regenerate designed regulator PDF from print HTML (Playwright).
# Designed PDF already on tip; this keeps it in sync when HTML changes.
# Do not invent MEASURED labour scores.
name: pdf-regulator-indices

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/instruments-catalog-7fb8
      - main
      - master
    paths:
      - "public/regulator-indices-one-pager.html"
      - "scripts/pdf-regulator-indices.mjs"
      - ".github/workflows/pdf-regulator-indices.yml"

concurrency:
  group: pdf-regulator-indices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps (playwright package for pdf script)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve public + print PDF
        run: |
          python3 -m http.server 43125 --directory public &
          for i in $(seq 1 40); do
            curl -sf "http://127.0.0.1:43125/regulator-indices-one-pager.html" >/dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:43125 npm run pdf:regulator-indices
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/regulator-indices-one-pager.pdf")
          assert p.read_bytes()[:5] == b"%PDF-", p
          assert p.stat().st_size > 10000, p.stat().st_size
          print("pdf ok", p.stat().st_size)
          PY

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/regulator-indices-one-pager.pdf
          if git diff --staged --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "chore(pdf): regenerate designed regulator-indices one-pager (#149)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
