# NEXT_300 #149 — land designed regulator PDF on tip.
# Prefer decode of MCP-safe .b64 sidecar; Playwright regen is optional fallback.
name: pdf-regulator-indices

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/instruments-catalog-7fb8
      - main
      - master
    paths:
      - "public/regulator-indices-one-pager.html"
      - "public/regulator-indices-one-pager.pdf.b64"
      - "public/regulator-indices-one-pager.pdf.b64.part*"
      - "scripts/decode-regulator-pdf.mjs"
      - "scripts/pdf-regulator-indices.mjs"
      - ".github/workflows/pdf-regulator-indices.yml"

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decode MCP-safe PDF sidecar
        run: |
          if [ -f public/regulator-indices-one-pager.pdf.b64 ] || compgen -G "public/regulator-indices-one-pager.pdf.b64.part*" > /dev/null; then
            node scripts/decode-regulator-pdf.mjs
          else
            echo "No .b64 sidecar — installing Playwright for HTML print"
            npx --yes playwright install --with-deps chromium
            python3 -m http.server 43125 --directory public &
            for i in $(seq 1 40); do
              curl -sf "http://127.0.0.1:43125/regulator-indices-one-pager.html" >/dev/null && break
              sleep 1
            done
            BASE_URL=http://127.0.0.1:43125 npm run pdf:regulator-indices
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/regulator-indices-one-pager.pdf")
          assert p.read_bytes()[:5] == b"%PDF-", p
          assert p.stat().st_size > 10000, p.stat().st_size
          print("pdf ok", p.stat().st_size)
          PY

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/regulator-indices-one-pager.pdf
          if git diff --staged --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "chore(pdf): land designed regulator-indices one-pager (#149)"
            git push
          fi
