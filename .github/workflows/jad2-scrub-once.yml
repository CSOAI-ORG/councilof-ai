name: jad2-scrub-once
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/jad2-scrub-once.yml']
permissions:
  contents: write
concurrency:
  group: jad2-scrub
  cancel-in-progress: false
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrub sovereign-town from client
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("client/src/App.tsx")
          t = app.read_text()
          old = '                  <Route path="/sovereign-town">{() => <Redirect to="/gspc-arena?view=towns" />}</Route>\n'
          new = '                  {/* JA-D2: towns alias is edge-only via public/_redirects — do not embed banned slug in client bundle */}\n'
          if old in t:
              t = t.replace(old, new)
              app.write_text(t)
              print("App.tsx scrubbed")
          elif "sovereign-town" not in t:
              print("App.tsx already clean")
          else:
              raise SystemExit("App.tsx unexpected sovereign-town residual")
          rm = Path("client/src/data/route-manifest.ts")
          r = rm.read_text()
          r2 = r.replace('"path": "/sovereign-town"', '"path": "/gspc-arena?view=towns"')
          if r2 != r:
              rm.write_text(r2); print("route-manifest scrubbed")
          st = Path("client/src/pages/SovereignTown.tsx")
          before = st.read_text()
          s = before.replace("https://proofof.ai/sovereign-town", "https://proofof.ai/towns")
          if s != before:
              st.write_text(s); print("SovereignTown scrubbed")
          else:
              print("SovereignTown already clean")
          left = sum(1 for p in Path("client/src").rglob("*") if p.is_file() and "sovereign-town" in p.read_text(errors="ignore"))
          print("remaining client sovereign-town files:", left)
          PY
      - name: Commit and push
        run: |
          git config user.name "align-bot"
          git config user.email "align-bot@users.noreply.github.com"
          git add client/src/App.tsx client/src/data/route-manifest.ts client/src/pages/SovereignTown.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix(JA-D2): scrub sovereign-town from client bundle (edge redirect only)"
          git push
      - name: Remove one-shot workflow
        if: always()
        run: |
          git config user.name "align-bot"
          git config user.email "align-bot@users.noreply.github.com"
          git pull --ff-only || true
          if [ -f .github/workflows/jad2-scrub-once.yml ]; then
            rm -f .github/workflows/jad2-scrub-once.yml
            git add -A .github/workflows/jad2-scrub-once.yml
            git commit -m "chore: remove jad2-scrub-once one-shot" || true
            git push || true
          fi
