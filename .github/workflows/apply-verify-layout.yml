name: apply-verify-layout
on:
  push:
    branches: [cursor/home-sections-enhance-cd38]
    paths:
      - .github/workflows/apply-verify-layout.yml
      - scripts/_apply_verify_layout.py
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/home-sections-enhance-cd38
      - name: Patch layout and clean up
        run: |
          set -euo pipefail
          python3 scripts/_apply_verify_layout.py
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          git add client/src/components/home/LivingStages.tsx
          git commit -m "fix(home): three verify cards in a row, landscape film underneath"
          rm -f scripts/_apply_verify_layout.py .github/workflows/apply-verify-layout.yml
          git add -A scripts/_apply_verify_layout.py .github/workflows/apply-verify-layout.yml
          git commit -m "chore: remove one-shot verify-layout apply"
          git push origin cursor/home-sections-enhance-cd38
