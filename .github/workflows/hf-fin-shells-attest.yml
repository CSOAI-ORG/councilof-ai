# The file name carries "hf-fin-shells" because the board signer admits a GitHub OIDC token only
# when its job_workflow_ref contains one of four substrings, and that is one of them
# (functions/api/board-sign.ts L53-55; same convention as hf-fin-shells-measure.yml L3-4).
#
# WHAT IT DOES. Signs corrections and ruling attestations by OIDC, from master's code, and returns
# the signer's replies as a run artifact. A person or agent then applies a reply in an ordinary
# reviewed change. Nothing here writes to the repository and nothing here holds a stored credential.
#
# WHY A SEPARATE FILE. hf-fin-shells-measure.yml can write repository contents and dispatch other
# workflows, and it shares one queue with card signing. This job can read the repository and ask
# for an OIDC token. That is all it can do.
#
# DISPATCH (corrections; the script header of scripts/sign-corrections-ledger.mjs has the rest):
#   node scripts/sign-corrections-ledger.mjs --emit-payload att.json
#   gh workflow run hf-fin-shells-attest.yml -R CSOAI-ORG/councilof-ai --ref master \
#     -f kind=corrections \
#     -f payloads_b64="$(node -e 'process.stdout.write(Buffer.from(JSON.stringify([JSON.parse(require("fs").readFileSync("att.json","utf8"))])).toString("base64"))')"
#   gh run download <run id> -R CSOAI-ORG/councilof-ai -n board-sign-<run id> -D out
#
# The two inputs reach the script only as environment variables; no expression is expanded inside a
# shell line. scripts/sign-attest/kinds.json decides what may be signed, and
# scripts/sign-attest/workflow-shape.test.mjs pins the shape of this file.
name: hf-fin-shells-attest

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Which attestation shape every payload must match (scripts/sign-attest/kinds.json)"
        type: choice
        required: true
        options:
          - corrections
          - ruling
          - rulings-index
      payloads_b64:
        description: "base64 of a JSON array of 1 to 10 payload objects"
        type: string
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # A dispatch on a branch runs that branch's copy of this file, so this step stops an honest
      # mistake and nothing more. It is not a boundary: the signer does not check the ref today.
      - name: Refuse any ref but master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "refused: this workflow signs only when dispatched on refs/heads/master; got $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check every payload, then sign by OIDC
        env:
          KIND: ${{ inputs.kind }}
          PAYLOADS_B64: ${{ inputs.payloads_b64 }}
          BOARD_SIGN_URL: https://councilof.ai/api/board-sign
          OUT_DIR: ${{ runner.temp }}/board-sign-out
        run: node scripts/sign-attest/sign.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: board-sign-${{ github.run_id }}
          path: ${{ runner.temp }}/board-sign-out
          if-no-files-found: error
