name: mine harness (repo smoke)

on:
  push:
    branches: [master, main, feat/mine-harness, feat/mine-harness-rebased]
    paths: ['harness/mine/**']
  pull_request:
    paths: ['harness/mine/**']
  workflow_dispatch: {}

jobs:
  repo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install verification dependencies (mine_ci.sh verifies Ed25519 signatures)
        run: python -m pip install --disable-pip-version-check --only-binary=cryptography 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4' 'cryptography==50.0.2'
      - name: Repo assets smoke
        run: |
          cd harness/mine
          MINE_SKIP_E2E=1 python3 test_repo_assets.py
          MINE_CI_REPO_ONLY=1 bash mine_ci.sh
