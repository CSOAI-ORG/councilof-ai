name: mine harness (repo smoke)

on:
  push:
    branches: [master, main, feat/mine-harness, feat/mine-harness-rebased]
    paths: ['harness/mine/**']
  pull_request:
    paths: ['harness/mine/**']
  workflow_dispatch: {}

jobs:
  repo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Repo assets smoke
        run: |
          cd harness/mine
          MINE_SKIP_E2E=1 python3 test_repo_assets.py
          MINE_CI_REPO_ONLY=1 bash mine_ci.sh
