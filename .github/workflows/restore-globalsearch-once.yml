name: restore-globalsearch-once
on:
  push:
    paths:
      - '.restore-gs/**'
      - '.github/workflows/restore-globalsearch-once.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: Assemble and commit GlobalSearch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, glob
          parts = sorted(glob.glob('.restore-gs/part-*.b64'), key=lambda p: int(p.split('-')[-1].split('.')[0]))
          assert parts, 'no parts'
          b64 = ''.join(pathlib.Path(p).read_text() for p in parts)
          data = base64.b64decode(b64)
          assert data.startswith(b'/**'), data[:40]
          pathlib.Path('client/src/components/GlobalSearch.tsx').write_bytes(data)
          print('wrote', len(data), 'from', len(parts), 'parts')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/GlobalSearch.tsx
          if git diff --cached --quiet; then echo "already restored"; exit 0; fi
          git commit -m "Wave overnight: MCP transport, surface hits, EAT, e2e (3/5)"
          git push
          # cleanup parts in a follow-up commit
          git rm -r .restore-gs .github/workflows/restore-globalsearch-once.yml || true
          git commit -m "chore: cleanup GlobalSearch restore scaffolding" || true
          git push || true
