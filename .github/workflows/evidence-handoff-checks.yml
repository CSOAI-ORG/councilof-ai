name: evidence-handoff-checks

on:
  pull_request:
    paths:
      - 'packages/evidence-fabric/**'
      - 'harness/langchain-authority/**'
      - 'harness/authority_adapters/**'
      - 'docs/standards/osaia-safe-reverification/**'
      - '.github/workflows/evidence-handoff-checks.yml'
  push:
    branches: [master]
    paths:
      - 'packages/evidence-fabric/**'
      - 'harness/langchain-authority/**'
      - 'harness/authority_adapters/**'
      - 'docs/standards/osaia-safe-reverification/**'
      - '.github/workflows/evidence-handoff-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strands-openai-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OTEL_SDK_DISABLED: 'true'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install optional SDK qualification environment
        run: python -m pip install -r harness/authority_adapters/requirements-test.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise SDKs and retain a discriminating evidence record
        run: python harness/authority_adapters/retain_checks.py --output /tmp/authority-qualification
      - name: Retain qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authority-qualification
          path: /tmp/authority-qualification
          if-no-files-found: warn
          retention-days: 14

  langchain-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK test environment
        run: python -m pip install -r harness/langchain-authority/requirements-test.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise review, host authority, execution and effect readback
        run: python -m pytest -q harness/langchain-authority/test_authority.py

  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==9.2.0 jsonschema==4.25.1 rfc3339-validator==0.1.4
      - name: Evidence imports and exports
        run: >-
          python -m pytest -q
          packages/evidence-fabric/tests/test_cisco_mcp_in.py
          packages/evidence-fabric/tests/test_openshell_otel.py
          packages/evidence-fabric/tests/test_doctrine.py
          packages/evidence-fabric/tests/test_event.py
          packages/evidence-fabric/tests/test_verify_qualification.py
      - name: Check retained SDK evidence from the receiver side
        run: >-
          python packages/evidence-fabric/verify_qualification.py
          harness/authority_adapters/receipts/2026-10-29
          --expected-manifest-sha256 fa013956862c27a4c645cc156a8aee44296dad9a223703e5aaedbeac9b275b46
          --source-root .
      - name: Approval and discriminating controls
        working-directory: docs/standards/osaia-safe-reverification
        run: |
          python test_hitl_authority_effect.py
          python test_hitl_authority_effect_v0_2.py
          python test_approval_dependency_binding.py
          python test_discriminating_power.py
