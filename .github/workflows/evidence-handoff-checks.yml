name: evidence-handoff-checks

on:
  pull_request:
    paths:
      - 'packages/evidence-fabric/**'
      - 'scripts/build-daily-*.mjs'
      - 'scripts/daily-maintenance-*.mjs'
      - 'scripts/build-axis-reports*.mjs'
      - 'public/reports/daily-signal/**'
      - 'public/interop/regulatory-inventory-latest.json'
      - 'public/interop/regulatory-inventory-2026-10-26-7bc985bfc7c2.json'
      - 'public/interop/frozen-provision-hashes.json'
      - 'functions/api/_obligations.ts'
      - 'functions/api/regulation.ts'
      - 'client/src/data/enforcement.ts'
      - 'public/interop/gpai-art12-pact-iaw/gpai-art12-pact-gspc-crosswalk.json'
      - 'public/interop/art50-marking-posture-2026-09/index.json'
      - 'public/interop/art50-recheck-schedule-2026-10/schedule.json'
      - 'public/interop/art5-emotion-ai-2026-09/index.json'
      - 'public/.well-known/eu-ai-act-art71-database.json'
      - 'public/.well-known/eu-ai-act.json'
      - 'public/.well-known/eu-ai-act-gpai.json'
      - 'public/interop/gpai-signatory-2026-09/index.json'
      - 'public/interop/gpai-signatory-2026-09/artefact-manifest.json'
      - 'public/interop/gpai-signatories-2026-09-05.json'
      - 'public/interop/axis-doors-2026-09-22.json'
      - 'scripts/surface/build-gpai-matrix.mjs'
      - 'public/interop/gpai-matrix.json'
      - 'client/src/pages/GpaiMatrix.tsx'
      - 'client/src/lib/gpaiMatrix*'
      - 'harness/langchain-authority/**'
      - 'harness/authority_adapters/**'
      - 'docs/standards/osaia-safe-reverification/**'
      - '.github/workflows/evidence-handoff-checks.yml'
  push:
    branches: [master]
    paths:
      - 'packages/evidence-fabric/**'
      - 'scripts/build-daily-*.mjs'
      - 'scripts/daily-maintenance-*.mjs'
      - 'scripts/build-axis-reports*.mjs'
      - 'public/reports/daily-signal/**'
      - 'public/interop/regulatory-inventory-latest.json'
      - 'public/interop/regulatory-inventory-2026-10-26-7bc985bfc7c2.json'
      - 'public/interop/frozen-provision-hashes.json'
      - 'functions/api/_obligations.ts'
      - 'functions/api/regulation.ts'
      - 'client/src/data/enforcement.ts'
      - 'public/interop/gpai-art12-pact-iaw/gpai-art12-pact-gspc-crosswalk.json'
      - 'public/interop/art50-marking-posture-2026-09/index.json'
      - 'public/interop/art50-recheck-schedule-2026-10/schedule.json'
      - 'public/interop/art5-emotion-ai-2026-09/index.json'
      - 'public/.well-known/eu-ai-act-art71-database.json'
      - 'public/.well-known/eu-ai-act.json'
      - 'public/.well-known/eu-ai-act-gpai.json'
      - 'public/interop/gpai-signatory-2026-09/index.json'
      - 'public/interop/gpai-signatory-2026-09/artefact-manifest.json'
      - 'public/interop/gpai-signatories-2026-09-05.json'
      - 'public/interop/axis-doors-2026-09-22.json'
      - 'scripts/surface/build-gpai-matrix.mjs'
      - 'public/interop/gpai-matrix.json'
      - 'client/src/pages/GpaiMatrix.tsx'
      - 'client/src/lib/gpaiMatrix*'
      - 'harness/langchain-authority/**'
      - 'harness/authority_adapters/**'
      - 'docs/standards/osaia-safe-reverification/**'
      - '.github/workflows/evidence-handoff-checks.yml'
  workflow_dispatch:

concurrency:
  group: evidence-handoff-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strands-openai-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OTEL_SDK_DISABLED: 'true'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install optional SDK qualification environment
        run: python -m pip install -r harness/authority_adapters/requirements-test.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise SDKs and retain a discriminating evidence record
        run: python harness/authority_adapters/retain_checks.py --output /tmp/authority-qualification
      - name: Retain qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authority-qualification
          path: /tmp/authority-qualification
          if-no-files-found: warn
          retention-days: 14

  langchain-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK test environment
        run: python -m pip install -r harness/langchain-authority/requirements-test.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise review, host authority, execution and effect readback
        run: python -m pytest -q harness/langchain-authority/test_authority.py

  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==9.2.0 jsonschema==4.25.1 rfc3339-validator==0.1.4
      - name: Evidence imports and exports
        run: >-
          python -m pytest -q
          packages/evidence-fabric/tests/test_cisco_mcp_in.py
          packages/evidence-fabric/tests/test_openshell_otel.py
          packages/evidence-fabric/tests/test_doctrine.py
          packages/evidence-fabric/tests/test_event.py
          packages/evidence-fabric/tests/test_verify_qualification.py
      - name: Held referee continuity and discriminating mutation controls
        run: python -B -m unittest discover -s packages/evidence-fabric/tests -p 'test_axis_referee*.py' -v
      - name: Full registry routing and GPAI packet controls
        run: |
          python packages/evidence-fabric/test_regulation_projection.py
          python packages/evidence-fabric/test_gpai_packet.py
      - name: Exact deadline mapping controls
        run: node --test scripts/build-daily-signal.node-test.mjs scripts/build-daily-product.node-test.mjs scripts/daily-maintenance-metadata.node-test.mjs scripts/build-axis-reports.ownership.test.mjs
      - name: Verify committed GPAI matrix against its exact source artifacts
        run: node scripts/surface/build-gpai-matrix.mjs --check
      - name: Verify committed daily archive outputs
        run: node scripts/build-daily-product.mjs --check
      - name: Check retained SDK evidence from the receiver side
        run: >-
          python packages/evidence-fabric/verify_qualification.py
          harness/authority_adapters/receipts/2026-10-29
          --expected-manifest-sha256 fa013956862c27a4c645cc156a8aee44296dad9a223703e5aaedbeac9b275b46
          --source-root .
      - name: Approval and discriminating controls
        working-directory: docs/standards/osaia-safe-reverification
        run: |
          python test_hitl_authority_effect.py
          python test_hitl_authority_effect_v0_2.py
          python test_approval_dependency_binding.py
          python test_discriminating_power.py

