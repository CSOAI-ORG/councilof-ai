name: card-root-ots-upgrade

# Poll fixed OTS calendars for pending card-root proofs. Work happens against
# master and every open card-root candidate branch. Only a transition to a
# Bitcoin attestation tag is staged; chain verification is deliberately absent.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: card-root-ots-upgrade
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - name: Find master and open card-root candidates
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # One open upgrade PR at a time. With master's proofs still pending, every hourly tick used to
        # branch from master and would open a new review PR each hour until one merged. While an
        # upgrade PR is open, its branch is maintained in place instead of master.
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false) | .headRefName | select(startswith("card-root/pending-") or startswith("card-root/ots-upgrade-"))]')
          refs=$(jq -cn --argjson prs "$prs" \
            'if ([$prs[] | select(startswith("card-root/ots-upgrade-"))] | length) > 0 then $prs else $prs + ["master"] end | unique')
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

  upgrade:
    needs: candidates
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.candidates.outputs.refs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the official OTS client
        run: pip install -q opentimestamps-client==0.7.2
      # scripts/llms-txt.mjs needs node: the reconcile below and the rebuild further down both run it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A review branch is kept in place across ticks, so master moves under it. Four writers commit the
      # OTS manifest and the llms files with their proofs, and a branch that is not reconciled conflicts
      # on their as_of and count lines once another writer's PR merges first, and stays wedged until a
      # person merges by hand (shown on the lanes pod, 7 Oct). scripts/reconcile_derived.py merges
      # master and regenerates only those derived files from the merged bytes; a conflict in root, proof
      # or pointer bytes still aborts this leg. Master's copy runs, since the branch can predate it.
      - name: Reconcile a review branch with master
        id: reconcile
        if: matrix.ref != 'master'
        run: |
          set -euo pipefail
          git config user.name "csoai-card-root"
          git config user.email "board@csoai.org"
          git fetch -q origin master
          git show origin/master:scripts/reconcile_derived.py > "$RUNNER_TEMP/reconcile_derived.py"
          before=$(git rev-parse HEAD)
          python3 "$RUNNER_TEMP/reconcile_derived.py" --onto origin/master
          if [ "$(git rev-parse HEAD)" != "$before" ]; then echo "moved=true" >> "$GITHUB_OUTPUT"; else echo "moved=false" >> "$GITHUB_OUTPUT"; fi
      - name: Offline immutability, binding, and state regressions
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_card_root_automation.py scripts/test_ots_maintenance.py -v
      - name: Stage exact-root proof candidates
        id: stage
        run: |
          set -euo pipefail
          find public/interop -maxdepth 1 -type f -name 'card-root-*.json' -print0 \
            | sort -z | xargs -0 shasum -a 256 > /tmp/card-roots-before.sha256
          python3 scripts/maintain_card_root_ots.py \
            --output-dir /tmp/card-root-ots-review --max-requests 8 --timeout 10
          cat /tmp/card-root-ots-review/report.json >> "$GITHUB_STEP_SUMMARY"
          changed=$(python3 -c 'import json; print(json.load(open("/tmp/card-root-ots-review/report.json"))["proofs_changed"])')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "0" ]; then
            echo "All observed proofs are absent, already carry a Bitcoin attestation tag, or remain pending."
            exit 0
          fi
          cp /tmp/card-root-ots-review/candidates/*.ots public/interop/
          find public/interop -maxdepth 1 -type f -name 'card-root-*.json' -print0 \
            | sort -z | xargs -0 shasum -a 256 > /tmp/card-roots-after.sha256
          cmp /tmp/card-roots-before.sha256 /tmp/card-roots-after.sha256
          python3 - <<'PY'
          import re, subprocess
          rows = subprocess.check_output(
              ["git", "status", "--porcelain", "--", "public/interop/card-root-*"],
              text=True,
          ).splitlines()
          if not rows or any(not re.fullmatch(
              r" M public/interop/card-root-[0-9]{4}-[0-9]{2}-[0-9]{2}(?:-[a-f0-9]{12})?\.json\.ots",
              row,
          ) for row in rows):
              raise SystemExit(f"refusing unexpected upgrade diff: {rows}")
          PY
      - name: Recheck every changed exact root and sidecar
        if: steps.stage.outputs.changed != '0'
        run: |
          set -euo pipefail
          for proof in /tmp/card-root-ots-review/candidates/*.ots; do
            root="public/interop/$(basename "${proof%.ots}")"
            python3 scripts/card_root.py --verify --root "$root"
          done
      # The OTS manifest carries each proof's sha256 and state, and llms.txt quotes the manifest.
      # An upgraded proof without its rebuilt row fails pr-gates (scripts/ots-manifest-fresh.test.ts),
      # so the derived files land in the same commit as the proof bytes.
      - name: Rebuild the OTS manifest and llms files for the upgraded proofs
        if: steps.stage.outputs.changed != '0'
        run: |
          set -euo pipefail
          python3 scripts/ots_manifest_rebuild.py --apply
          quarantined=$(git status --porcelain -- 'public/interop/*.ots.invalid' 'public/interop/ots/*.ots.invalid')
          if [ -n "$quarantined" ]; then
            echo "refusing: the manifest rebuild quarantined a served .ots file; review by hand: $quarantined" >&2
            exit 1
          fi
          node scripts/llms-txt.mjs
          python3 scripts/pod-loops/root_ots_manifest_gate.py --public-dir public
      - name: Update the review branch or open one
        if: steps.stage.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          git config user.name "csoai-card-root"
          git config user.email "board@csoai.org"
          if [ "$SOURCE_REF" = "master" ]; then
            branch="card-root/ots-upgrade-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
          else
            branch="$SOURCE_REF"
          fi
          git add public/interop/card-root-*.json.ots
          git add -- public/interop/ots/manifest.json public/llms.txt public/llms-full.txt
          git commit -m "card-root: stage OTS Bitcoin-attestation upgrade (chain unverified)"
          git push origin "HEAD:$branch"
          if [ "$SOURCE_REF" = "master" ]; then
            gh pr create --base master --head "$branch" \
              --title "card-root: review OTS Bitcoin-attestation upgrades" \
              --body "The scheduled bounded maintainer obtained OTS proof bytes carrying Bitcoin attestation tags for exact existing card-root files. Root and signed-card bytes are byte-identical. This workflow has no Bitcoin node: chain_verified remains false, and this PR makes no Bitcoin-confirmation or anchored claim. Review and merge are human decisions."
          fi
          # once per new head: every push above is a new commit
          gh workflow run pr-gates.yml --ref "$branch"
      - name: Push a reconciled review branch
        if: steps.stage.outputs.changed == '0' && steps.reconcile.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          git push origin "HEAD:$BRANCH"
          gh workflow run pr-gates.yml --ref "$BRANCH"
