name: art50-target-index
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      actions: write          # explicitly dispatches the required gates for the bot commit
      contents: write
      pull-requests: write   # lands via branch + PR; a direct push to master is GH006 (required gates)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Derive art50-target-index from the live provider-diff feed
        run: |
          python3 scripts/build_art50_target_index.py --selftest
          python3 scripts/build_art50_target_index.py
      - name: Land via branch + PR (direct push to master is GH006 — required "gates" check)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Use GitHub's linked bot identity so the commit is attributable to the
          # workflow app rather than an unlinked, human-looking email address.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/interop/art50-target-index.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto(art50-index): regenerate from live provider-diff"
          # master requires the "gates" status check, and a direct push creates a commit
          # no check has run on yet, so every push died with 'GH006: Protected branch
          # update failed' (11 consecutive red runs). Land the way census-delta.yml and
          # public-root.yml do: route the regenerated artifact through a pull request.
          # ONE rolling branch, not one per hour — the index is fully regenerated each
          # run, so only the newest is ever worth landing.
          branch="art50-index/pending"
          git push --force origin "HEAD:refs/heads/${branch}"
          existing=$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -z "${existing:-}" ]; then
            existing=$(gh pr create --base master --head "${branch}" \
              --title "art50-target-index: regenerate from live provider-diff (rolling)" \
              --body "Automated regeneration of \`public/interop/art50-target-index.json\` from the live provider-diff feed. Force-updated each run so this PR always carries the LATEST index. Opened as a PR because a direct push to master cannot satisfy the required \`gates\` check (GH006). Auto-merges when gates passes.")
            echo "opened ${existing}"
          else
            echo "existing PR updated in place: ${existing}"
          fi
          # GITHUB_TOKEN pushes deliberately do not emit pull_request events. Dispatch
          # the existing full gate on this trusted internal branch instead of bypassing
          # branch protection or trying to manufacture an approval.
          gh workflow run pr-gates.yml --ref "${branch}"
          gh pr merge "${existing}" --squash --auto || echo "auto-merge unavailable; ${existing} needs a human merge"
