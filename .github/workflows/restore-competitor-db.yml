name: restore-competitor-db
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore/trigger-c52'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: Download verify commit
        env:
          SRC_URL: https://dpaste.com/EXEQCF54E.txt
        run: |
          set -euo pipefail
          curl -fsSL "$SRC_URL" -o client/src/data/competitorDatabase.json
          python3 <<'PY'
          import json, hashlib
          data = open('client/src/data/competitorDatabase.json','rb').read()
          assert hashlib.sha256(data).hexdigest() == 'a3f642a1efd3da9baa5d3624037c3e7ad233ebf5b922a6d170c1238af6a458d6'
          d = json.loads(data)
          assert len(d['records']) == 52 and d['recordCount'] == 52
          assert d['records'][-1]['slug'] == 'datarade'
          print('OK', len(d['records']), d['records'][-1]['slug'], len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/competitorDatabase.json
          git commit -m "fix: restore full competitorDatabase.json (52 records)" || echo "no change"
          git push
