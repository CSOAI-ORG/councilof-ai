name: sticky335-land-atomic
# Land mine-real verified 335 via Contents API from atomic parts.
# Canonical: n_cards=335 · 75578B · sha256 12f5122df916c1f165281e6453d8673ffc52992513e218c62f354337091d8ccb
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/ci/card_index_335_atomic/**'
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Land verified 335 via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, urllib.error

          WANT = "12f5122df916c1f165281e6453d8673ffc52992513e218c62f354337091d8ccb"
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/CSOAI-ORG/councilof-ai"

          def req(url, data=None, method=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "sticky335-land-atomic",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(data).encode()
              r = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{e.code} {url}: {body[:400]}") from e

          meta = req(f"{api}/contents/public/signed/card_index.json?ref=master")
          raw = base64.b64decode(meta["content"])
          j = json.loads(raw)
          sha = hashlib.sha256(raw).hexdigest()
          n = j.get("n_cards")
          cards = j.get("cards") if isinstance(j.get("cards"), list) else []
          print(f"current n={n} len={len(cards)} bytes={len(raw)} sha={sha}")
          if n == 335 and len(cards) == 335 and sha == WANT and len(raw) == 75578:
              print("already sticky 335")
              raise SystemExit(0)

          root = pathlib.Path(".github/ci/card_index_335_atomic")
          parts = sorted(root.glob("p*.txt"))
          assert parts, "missing atomic parts"
          restored = base64.b64decode("".join(p.read_text().strip() for p in parts))
          rj = json.loads(restored)
          rsha = hashlib.sha256(restored).hexdigest()
          assert rj["n_cards"] == 335 and len(rj["cards"]) == 335 and rsha == WANT, (len(restored), rsha)

          req(
              f"{api}/contents/public/signed/card_index.json",
              data={
                  "message": "fix: sticky335-land-atomic Contents API land verified 335",
                  "content": base64.b64encode(restored).decode(),
                  "sha": meta["sha"],
                  "branch": "master",
              },
              method="PUT",
          )
          print("landed", len(restored), rsha)
          PY
