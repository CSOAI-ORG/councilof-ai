name: sticky335-land-atomic
# Land verified 335 via Contents API from atomic parts.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Land verified 335
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          WANT = "12f5122df916c1f165281e6453d8673ffc52992513e218c62f354337091d8ccb"
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/CSOAI-ORG/councilof-ai"
          def req(url, data=None, method=None):
              h = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
              if data is not None:
                  h["Content-Type"] = "application/json"
                  data = json.dumps(data).encode()
              r = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.loads(resp.read())
          meta = req(f"{api}/contents/public/signed/card_index.json?ref=master")
          raw = base64.b64decode(meta["content"])
          sha = hashlib.sha256(raw).hexdigest()
          j = json.loads(raw)
          if j.get("n_cards") == 335 and sha == WANT and len(raw) == 75578:
              raise SystemExit(0)
          parts = sorted(pathlib.Path(".github/ci/card_index_335_atomic").glob("p*.txt"))
          restored = base64.b64decode("".join(p.read_text().strip() for p in parts))
          req(f"{api}/contents/public/signed/card_index.json", data={"message": "fix: sticky335-land-atomic land 335", "content": base64.b64encode(restored).decode(), "sha": meta["sha"], "branch": "master"}, method="PUT")
          PY
