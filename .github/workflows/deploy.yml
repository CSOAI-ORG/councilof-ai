name: Build + deploy site (prerender + fields + tour → both domains)

on:
  push:
    branches: [master]
    paths: ['client/**', 'public/**', 'functions/**', 'scripts/**', 'package.json', 'wrangler.jsonc', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      check_registry:
        description: "Also run the ~330-request MCP-registry pass in outward-claims"
        type: boolean
        default: false
  # Re-stamp production when Pages Git auto-build keeps clobbering the apex alias
  # between pushes. Full gated build — not a probe-only job.
  schedule:
    - cron: '20 */3 * * *'

# Queue, don't cancel: rapid successive pushes were cancelling the in-flight
# prerender deploy mid-run, leaving the production alias on a thin Vite shell
# (deep links 404). cancel-in-progress:false serialises deploys so the latest
# commit's full prerendered build always lands.
concurrency: { group: site-deploy, cancel-in-progress: false }

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: One-door guard (AG UI is Council OS)
        run: node scripts/one-door-guard.mjs

      - name: No committed conflict markers (blocks the 2026-08-24 build break)
        run: node scripts/no-conflict-markers.mjs

      - name: Wallet secret gate — no private key material in tracked release inputs
        run: |
          node scripts/wallet-credential-gate.mjs --selftest
          node scripts/wallet-credential-gate.mjs

      # Two 2026-09-03 atom roots commit legacy hand-built COSE envelopes that do
      # not verify. Preserve those roots and their OTS files as incident history,
      # but never publish them as current evidence. This stays red until a clean
      # superseding root is regenerated, independently verified and OTS-witnessed.
      - name: Evidence integrity gate — quarantine false XRPL and invalid COSE/SCITT claims
        run: npm run guard:evidence-integrity

      - name: Council truth gate — no simulated BFT or phantom engine doors
        run: npm run guard:council-truth

      # Sitemap truth gate. Audited live 2026-09-05: 68 of 413 listed URLs did not answer 200
      # — 67 redirects and one 410 Gone. A sitemap asks a crawler to index exactly these URLs,
      # so a redirecting entry spends crawl budget being told to look elsewhere while the real
      # page competes with the version being advertised. generate-sitemap.mjs now excludes them
      # by construction; this holds it there.
      - name: Sitemap truth gate — every listed URL is one the edge serves
        run: npm run guard:sitemap-truth

      # _redirects guard. Cloudflare stops parsing the file after 100 DYNAMIC rules and
      # only warns; on 2026-08-26 that silently dropped the last 53 lines including the
      # SPA catch-all, and the deploy still went green. Selftest first so a guard that
      # has stopped biting fails loudly instead of passing everything.
      - name: Redirects guard — selftest, then the real file
        run: |
          node scripts/redirects-guard.mjs --selftest
          node scripts/redirects-guard.mjs public/_redirects

      # ROOT CAUSE of the failed deploys on 2026-08-26. Commit 2591f61e ("swap in the two
      # new 720p videos") added public/videos/csoai-architecture.mp4 (32.6 MiB) and
      # trust-ecosystem.mp4 (28.3 MiB). Cloudflare Pages rejects any file over 25 MiB, so
      # `wrangler pages deploy` failed — AFTER a 20-minute prerender, with an error that
      # looks nothing like "your video is too big". The apex still serves the OLD 12.4/9.8
      # MiB versions; the new ones have never once reached production.
      #
      # scripts/pages-size-guard.mjs already existed and was wired into NOTHING. It is wired
      # here, on public/, so the answer arrives in two seconds instead of twenty minutes.
      - name: Pages size guard — 25 MiB per-file limit (source assets)
        run: node scripts/pages-size-guard.mjs public

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # No release may present a stale sidecar as current or serve plaintext / mismatched
      # files under an .ots extension. This is intentionally red until the historical
      # incidents are moved to non-served quarantine and a fresh v1 root is signed and
      # witnessed atomically. The gate reads only public bytes; it uses no signing key.
      - name: Public root + witness integrity — exact bytes or fail closed
        run: |
          python3 -m pip install -q cryptography opentimestamps-client
          python3 scripts/root-witness-release-gate.py --selftest
          python3 scripts/root-witness-release-gate.py --phase candidate

      - name: TypeScript debt ratchet — selftest, then non-mutating check
        run: |
          npm run ts-ratchet:selftest
          npm run ts-ratchet

      - name: Build client
        run: npm run build:client

      # The host deliberately keeps an honest 404 catch-all. Materialise the canonical
      # workspace before the fast shell gate so a cold /dashboard request tests the same
      # file that Pages will serve instead of relying on SPA-rewrite behaviour.
      - name: Prerender canonical Council OS workspace
        run: |
          npx playwright install --with-deps chromium
          npm run prerender:dashboard

      # Council OS shell smoke — every /dashboard?tab= door renders its own pane inside the
      # shell with no uncaught exception, at desktop and phone widths, against the build that
      # is about to ship. Runs BEFORE the 20-minute prerender so a broken shell fails in a
      # minute, not after it. e2e/tests/dashboard-shell.spec.ts asserts structure, never a number.
      # Adapted 2026-09-03 to the master shell (the spec was authored against PR #1151's
      # useOpenRoute wrappers + ALIASES indirection; that architecture was deliberately not
      # adopted when #1151 was merged). The spec now asserts what master actually renders
      # (the sidebar with /dashboard?tab= links, the shell aside, the data-testid
      # dashboard-pane-id for every wired pane, the 22-axis board strip, and the honest
      # empty-state when /api/gspc is unreachable on a static server). It also caught and
      # fixed a real production bug — `resolvePaneId` referenced a deleted `ALIASES` map and
      # threw ReferenceError on every /dashboard render. With that fixed and the spec
      # adapted, the gate is re-enabled.
      - name: Council OS shell smoke — gating; all desktop + mobile journeys must pass
        run: |
          npm run test:e2e:shell

      - name: Prerender all routes
        run: |
          npx playwright install --with-deps chromium
          bash scripts/prerender-run.sh --dist dist/client --wait 900 --min 350

      # The prerender's own summary cannot be trusted on its own: its failure field
      # is `err`, and every ad-hoc check read `errored` — a field that never existed,
      # so a run that failed 515 of 581 routes reported "0 errored". This reads the
      # real fields AND cross-checks the report against the HTML actually on disk.
      # A report is a claim; the files are the evidence.
      - name: Check prerender report against the filesystem
        run: node scripts/check-prerender.mjs dist/client

      # Structured data lives ONLY in prerendered output — PageSchema injects it from a mount
      # effect, so a plain `vite build` tree has none of it. This ran in pr-gates first and
      # failed exactly that way ("no Dataset node", "/honesty/ not present"): it was checking a
      # tree that never contains the thing. It belongs here, after the prerender, where the
      # bytes it asserts about are the bytes that ship.
      - name: Structured data — Organization + Dataset on /, FAQPage reported on /honesty/
        run: |
          node scripts/structured-data-gate.mjs --selftest
          node scripts/structured-data-gate.mjs dist/client

      - name: Copy corrected field pages from source into dist (vite skips public/*.html)
        run: |
          # Living board owns /gspc-scoreboard. A leftover gspc-scoreboard.html
          # would steal the unsuffixed path. Demographic aliases (/for/*, /vs/*,
          # /gspc, /console) must be real files or the honest 404 catch-all hides them.
          rm -f dist/client/gspc-scoreboard.html
          node scripts/place-end-user-aliases.mjs dist/client
          for b in carebench conductbench defbench detbench mcpbench machbench ossbench pqcbench provbench swarmbench xrbench arena govbench agibench paper-district claimguard; do
            if [ -f "client/public/$b.html" ]; then
              cp "client/public/$b.html" "dist/client/$b.html"
              mkdir -p "dist/client/$b"
              cp "client/public/$b.html" "dist/client/$b/index.html"
              echo "placed $b (standalone wins over prerendered shell)"
            fi
          done

      # The launcher belongs on the deploy artifact, not in 100+ tracked source files.
      # Re-run after prerender and standalone-page placement because both can replace
      # HTML emitted by Vite. `--check` makes incomplete or duplicate injection blocking.
      - name: Council OS launcher — every built HTML page, exactly once
        run: |
          npm run workspace-launcher:selftest
          npm run workspace-launcher
          npm run workspace-launcher:check

      - name: Brand gate — block deploy on any forbidden display string (audit §6.2)
        run: |
          node scripts/brand-gate.mjs --selftest
          node scripts/brand-gate.mjs dist/client

      - name: Signed-JSON guard — a stub or broken /signed/*.json blocks the deploy
        run: node scripts/signed-json-guard.mjs dist/client

      # Owner ruling 2026-08-26: strip ALL public prices. Verification is free forever and
      # a grade is never sold, so no public page carries a figure anyone pays us — a service
      # is quoted privately. This also blocks "Most Popular"/"Best Value" badges, which are
      # claims about other customers' choices that no published customer count supports.
      # Blocking from day one: it flags a standalone currency amount (how a price renders),
      # not money in prose, so EU AI Act penalties and competitor figures do not trip it.
      - name: Price gate — no published price, no unevidenced popularity claim
        run: |
          node scripts/price-gate.mjs --selftest
          node scripts/price-gate.mjs dist/client

      # Facts gate — NOW BLOCKING (2026-08-26). It was advisory pending an owner ruling on
      # the canonical axis count, because a blocking gate on an unruled fact just breaks
      # every deploy. ADR-001 set the exact condition for flipping it: "the moment
      # /api/gspc reports the swept number". That condition is met — the live board returns
      # `22 axes · 15 measured · 7 unmeasured` — and the gate passes cleanly on a full
      # 582-route build. The 29 contradictions it used to report are resolved: the 17 and 15
      # were arena figures that needed labelling not changing, the 12 was the only genuinely
      # typed literal, and no rendered surface types a count any more.
      - name: Facts gate — no claim may contradict facts.json
        run: node scripts/facts-gate.mjs dist/client

      - name: Dist bundle guard — stranger paths + API functions present
        run: |
          set -euo pipefail
          for p in sov-os/index.html api-docs/index.html os/index.html gspc-verify/index.html; do
            if [ ! -f "dist/client/$p" ]; then
              echo "MISSING dist/client/$p — prerender did not snapshot this route"
              exit 1
            fi
            echo "ok dist/client/$p ($(wc -c < dist/client/$p) bytes)"
          done
          for fn in functions/api/receipts/latest.ts functions/api/east-west-bench.ts functions/api/evidence-pack.ts functions/api/cards.ts functions/api/axis-register.ts functions/api/auth/[[path]].ts functions/api/dashboard/stats.ts functions/api/_authCrypto.ts functions/api/challenge.ts functions/api/wave-dashboard.ts functions/api/counters.ts functions/api/state.ts functions/api/eunomia-data.ts functions/api/_chatLobby.ts functions/enterprise.ts functions/enterprises.ts functions/chat.ts functions/pricing.ts; do
            test -f "$fn" || (echo "missing $fn" && exit 1)
          done

      # Custom domain councilof.ai follows the Pages PRODUCTION alias
      # (councilof-ai.pages.dev), not a hash preview. --branch=main alone
      # published a fat preview (2026-08-22, 42596ad2.…) while production
      # kept a thin Vite shell + honest 404 catch-all. Ship the same tree
      # to both names the dashboard has used as production_branch.
      # Same limit, checked again on the tree that is actually uploaded — the build itself
      # can emit a large asset that never existed in public/.
      - name: Pages size guard — 25 MiB per-file limit (built tree)
        run: node scripts/pages-size-guard.mjs dist/client

      - name: Deploy → councilof.ai
        timeout-minutes: 8
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true
          # Custom domain follows whichever name the dashboard set as production_branch.
          # master.pages.dev can be fat while councilof.ai is thin. Write the third name too.
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=production --commit-dirty=true

      # continue-on-error: a thin apex right after upload used to FAIL this
      # step and skip Recheck + Anti-clobber, leaving councilof.ai on a 7KB
      # Vite shell while master.pages.dev held the gated tree.
      - name: Assert apex + production alias received the prerender
        id: immediate
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 20
          node scripts/assert-prerender-live.mjs --label immediate \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # 2026-08-22: official deploy went green (apex 212889) then a Vite-only
      # writer flipped the production alias ~3 minutes later. `/` is no-cache
      # so the homepage went thin; `/os/` stayed fat on a week-long cache.
      # Fail this job if that race happens so we do not ship a green lie.
      - name: Recheck after trailing-clobber window
        timeout-minutes: 5
        id: recheck
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "waiting 120s for a Git/Mac overwrite of the production alias..."
          sleep 120
          node scripts/assert-prerender-live.mjs --label recheck \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # Trailing clobber: master.* stays fat (~212KB) while apex + pages.dev go
      # thin (~7KB Vite) ~2–4 min later (Pages Git auto-build or Mac wrangler).
      # Re-stamp all three alias names from the same gated dist/client.
      - name: Anti-clobber — redeploy gated tree if assert or recheck failed
        if: steps.immediate.outcome == 'failure' || steps.recheck.outcome == 'failure'
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          echo "RECHECK FAILED — re-stamping master/main/production aliases"
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=production --commit-dirty=true
          sleep 30
          node scripts/assert-prerender-live.mjs --label anti-clobber \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # Clobber has also landed after the first recheck went green. One more
      # window; rewrite again if a second writer wins the alias later.
      - name: Confirm gated tree still holds
        timeout-minutes: 6
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          echo "waiting 90s to confirm the gated tree stuck..."
          sleep 90
          if node scripts/assert-prerender-live.mjs --label hold \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev; then
            echo "hold: production still fat"
            exit 0
          fi
          echo "hold lost — rewriting master/main/production"
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=production --commit-dirty=true
          sleep 25
          node scripts/assert-prerender-live.mjs --label hold-heal \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # The pointer bundled in dist/client is the honest observation made before
      # publication. Do not mutate it after upload and then imply those changed
      # bytes were served. Recheck the exact built candidate read-only, with a
      # finite propagation window; the following gate performs its own fresh fetch.
      - name: Recheck deployed root against witnessed candidate (bounded, read-only)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 scripts/witness_public_root.py --recheck \
            --public-dir dist/client \
            --check-only \
            --attempts 6 \
            --retry-delay-seconds 10 \
            --timeout-seconds 20

      - name: Live public root + witness integrity — fresh apex MATCH required
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 scripts/root-witness-release-gate.py \
            --phase live \
            --public-dir dist/client \
            --live-timeout-seconds 30

      # csoai.org is the static apex (csoai-site-deploy.yml ← csoai-static-deploy2).
      # Do NOT redeploy the SPA to csoai-site — that overwrites did:web:csoai.org.

  # ---------------------------------------------------------------------------
  # OUTWARD CLAIMS — what we say about ourselves, to someone else.
  #
  # A SEPARATE JOB, deliberately. scripts/outward-claims-guard.mjs reads the LIVE surface, so it
  # can only ask its question once the deploy has landed; running it as a pre-merge gate would
  # test the PREVIOUS deploy and block a PR for a defect that PR fixes. Its own header says so.
  #
  # NON-BLOCKING by three separate mechanisms, because a reporting job must never be able to fail
  # a deploy that already succeeded: it `needs` the deploy, it only runs when that deploy
  # succeeded, and it is continue-on-error. The deploy's own permissions are untouched — this job
  # declares its own, and `issues: write` lives here and nowhere else.
  #
  # ONE issue, refreshed — never a new issue per run. A guard that opens an issue every three
  # hours is a guard people mute.
  # ---------------------------------------------------------------------------
  outward-claims:
    needs: build-deploy
    if: ${{ always() && needs.build-deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Outward-claims guard (live)
        id: guard
        env:
          # The registry walk is ~330 HTTP requests. Deploys are frequent and the cron runs every
          # three hours; asking the MCP registry that often is inconsiderate and adds nothing,
          # so the expensive check runs on the SCHEDULED pass — or on demand.
          #
          # THE ON-DEMAND HALF MATTERS. Gated to `schedule` alone, the only checks that find the
          # real defects were unreachable by anyone wanting to verify a fix: the first observed
          # post-deploy run printed "0 FAIL" and had skipped both of them. A guard whose
          # interesting half you cannot ask for is a guard you cannot use to close anything.
          CHECK_REGISTRY: ${{ (github.event_name == 'schedule' || inputs.check_registry) && '1' || '' }}
        run: |
          set +e
          node scripts/outward-claims-guard.mjs > outward.txt 2>&1
          RC=$?
          echo "exit=$RC" >> "$GITHUB_OUTPUT"
          cat outward.txt
          # The guard's own tally line is the source of the count — never recounted here, or the
          # issue title and the report could disagree with each other.
          #
          # A GUARD THAT CRASHED MUST NOT REPORT ZERO. `grep ... || echo 0` did exactly that:
          # with no tally line the title became "outward-claims: 0 disagreements", which is a
          # false all-clear published on a schedule. The absence of a count is its own state.
          N=$(grep -oE '[0-9]+ FAIL' outward.txt | tail -1 | grep -oE '[0-9]+')
          if [ -z "$N" ]; then
            echo "n=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::outward-claims guard printed no tally (exit $RC) — reporting unknown, not zero"
          else
            echo "n=$N" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the one outward-claims issue
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.guard.outputs.n }}
        run: |
          set -euo pipefail
          MARKER="<!-- outward-claims-guard -->"
          TITLE="outward-claims: ${N} disagreements"
          BODY="$(printf '%s\n\n_Refreshed by `deploy.yml` after a successful deploy on %s (%s). Guard: `scripts/outward-claims-guard.mjs`._\n\nThese are claims this estate publishes about itself on a surface someone else reads. A FAIL means the published claim and the thing it describes disagree; the fix belongs in the PRODUCER of the claim, not in the guard.\n\n```\n%s\n```\n' "$MARKER" "$(date -u +%FT%TZ)" "${GITHUB_SHA:0:12}" "$(cat outward.txt)")"

          NUM="$(gh issue list --state open --limit 100 --json number,body \
                  --jq "map(select(.body != null and (.body | contains(\"$MARKER\")))) | .[0].number // empty")"

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body "$BODY"
            echo "refreshed issue #$NUM -> $TITLE"
          elif [ "$N" != "0" ]; then
            # Only OPEN one when there is something to report. A standing "0 disagreements"
            # issue is noise; a refreshed one is a dashboard.
            gh issue create --title "$TITLE" --body "$BODY" --label "outward-claims" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "0 disagreements and no existing issue — nothing to open"
          fi

          # `unknown` is a real state and reaches the title verbatim: "outward-claims: unknown
          # disagreements" reads as broken, which is what it is, and cannot be mistaken for clean.
