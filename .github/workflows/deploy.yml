name: Build + deploy site (prerender + fields + tour → both domains)

on:
  push:
    branches: [master, main]
    paths: ['client/**', 'public/**', 'functions/**', 'scripts/**', 'package.json', 'wrangler.jsonc', '.github/workflows/deploy.yml']
  workflow_dispatch: {}

# Queue, don't cancel: rapid successive pushes were cancelling the in-flight
# prerender deploy mid-run, leaving the production alias on a thin Vite shell
# (deep links 404). cancel-in-progress:false serialises deploys so the latest
# commit's full prerendered build always lands.
concurrency: { group: site-deploy, cancel-in-progress: false }

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build client
        run: npm run build:client

      - name: Prerender all routes
        run: |
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs --dist dist/client --wait 900 --min 350

      - name: Copy corrected field pages from source into dist (vite skips public/*.html)
        run: |
          # gspc-scoreboard stays the prerendered React page (living board + in-lane).
          # Vite copies public/gspc-scoreboard.html to dist/client/gspc-scoreboard.html;
          # Pages then serves that 8KB file at /gspc-scoreboard (no slash) while
          # /gspc-scoreboard/ is the living board. /gspc 308s to the unsuffixed path.
          rm -f dist/client/gspc-scoreboard.html
          for b in carebench conductbench defbench detbench mcpbench machbench ossbench pqcbench provbench swarmbench xrbench arena govbench agibench paper-district; do
            if [ -f "client/public/$b.html" ]; then
              cp "client/public/$b.html" "dist/client/$b.html"
              mkdir -p "dist/client/$b"
              cp "client/public/$b.html" "dist/client/$b/index.html"
              echo "placed $b (standalone wins over prerendered shell)"
            fi
          done

      - name: Brand gate — block deploy on any forbidden display string (audit §6.2)
        run: node scripts/brand-gate.mjs dist/client

      # Custom domain councilof.ai follows the Pages PRODUCTION alias
      # (councilof-ai.pages.dev), not a hash preview. --branch=main alone
      # published a fat preview (2026-08-22, 42596ad2.…) while production
      # kept a thin Vite shell + honest 404 catch-all. Ship the same tree
      # to both names the dashboard has used as production_branch.
      - name: Deploy → councilof.ai
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true

      - name: Assert apex + production alias received the prerender
        run: |
          set -euo pipefail
          sleep 20
          node scripts/assert-prerender-live.mjs --label immediate \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # 2026-08-22: official deploy went green (apex 212889) then a Vite-only
      # writer flipped the production alias ~3 minutes later. `/` is no-cache
      # so the homepage went thin; `/os/` stayed fat on a week-long cache.
      # Fail this job if that race happens so we do not ship a green lie.
      - name: Recheck after trailing-clobber window
        run: |
          set -euo pipefail
          echo "waiting 120s for a Git/Mac overwrite of the production alias..."
          sleep 120
          node scripts/assert-prerender-live.mjs --label recheck \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # csoai.org is the static apex (csoai-site-deploy.yml ← csoai-static-deploy2).
      # Do NOT redeploy the SPA to csoai-site — that overwrites did:web:csoai.org.
