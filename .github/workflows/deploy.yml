name: Build + deploy site (prerender → both domains)

on:
  push:
    branches: [master, main]
    paths:
      - 'client/**'
      - 'functions/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# One deploy at a time; newer push cancels an in-flight build.
concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build client (SPA + static field pages + functions)
        run: npm run build:client

      - name: Prerender all routes (crawler-visible HTML)
        run: |
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs --dist dist/client --wait 900 --min 350

      - name: Overlay standalone field pages at their route paths
        run: |
          for b in carebench conductbench defbench detbench mcpbench machbench ossbench pqcbench provbench swarmbench xrbench arena govbench; do
            if [ -f "dist/client/$b.html" ]; then
              mkdir -p "dist/client/$b"
              cp "dist/client/$b.html" "dist/client/$b/index.html"
              echo "overlaid $b (standalone wins over prerendered shell)"
            fi
          done

      - name: Deploy → councilof.ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true

      - name: Deploy → csoai.org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/client --project-name=csoai-site --branch=main --commit-dirty=true
