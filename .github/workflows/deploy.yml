name: Build + deploy site (prerender + fields + tour → both domains)

on:
  push:
    branches: [master, main]
    paths: ['client/**', 'public/**', 'functions/**', 'scripts/**', 'package.json', 'wrangler.jsonc', '.github/workflows/deploy.yml']
  workflow_dispatch: {}
  # Re-stamp production when Pages Git auto-build keeps clobbering the apex alias
  # between pushes. Full gated build — not a probe-only job.
  schedule:
    - cron: '20 */3 * * *'

# Queue, don't cancel: rapid successive pushes were cancelling the in-flight
# prerender deploy mid-run, leaving the production alias on a thin Vite shell
# (deep links 404). cancel-in-progress:false serialises deploys so the latest
# commit's full prerendered build always lands.
concurrency: { group: site-deploy, cancel-in-progress: false }

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: One-door guard (AG UI is Council OS)
        run: node scripts/one-door-guard.mjs

      - name: No committed conflict markers (blocks the 2026-08-24 build break)
        run: node scripts/no-conflict-markers.mjs

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build client
        run: npm run build:client

      - name: Prerender all routes
        run: |
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs --dist dist/client --wait 900 --min 350

      # The prerender's own summary cannot be trusted on its own: its failure field
      # is `err`, and every ad-hoc check read `errored` — a field that never existed,
      # so a run that failed 515 of 581 routes reported "0 errored". This reads the
      # real fields AND cross-checks the report against the HTML actually on disk.
      # A report is a claim; the files are the evidence.
      - name: Check prerender report against the filesystem
        run: node scripts/check-prerender.mjs dist/client

      - name: Copy corrected field pages from source into dist (vite skips public/*.html)
        run: |
          # Living board owns /gspc-scoreboard. A leftover gspc-scoreboard.html
          # would steal the unsuffixed path. Demographic aliases (/for/*, /vs/*,
          # /gspc, /console) must be real files or the honest 404 catch-all hides them.
          rm -f dist/client/gspc-scoreboard.html
          node scripts/place-end-user-aliases.mjs dist/client
          for b in carebench conductbench defbench detbench mcpbench machbench ossbench pqcbench provbench swarmbench xrbench arena govbench agibench paper-district claimguard; do
            if [ -f "client/public/$b.html" ]; then
              cp "client/public/$b.html" "dist/client/$b.html"
              mkdir -p "dist/client/$b"
              cp "client/public/$b.html" "dist/client/$b/index.html"
              echo "placed $b (standalone wins over prerendered shell)"
            fi
          done

      - name: Brand gate — block deploy on any forbidden display string (audit §6.2)
        run: node scripts/brand-gate.mjs dist/client

      - name: Signed-JSON guard — a stub or broken /signed/*.json blocks the deploy
        run: node scripts/signed-json-guard.mjs dist/client

      # Owner ruling 2026-08-26: strip ALL public prices. Verification is free forever and
      # a grade is never sold, so no public page carries a figure anyone pays us — a service
      # is quoted privately. This also blocks "Most Popular"/"Best Value" badges, which are
      # claims about other customers' choices that no published customer count supports.
      # Blocking from day one: it flags a standalone currency amount (how a price renders),
      # not money in prose, so EU AI Act penalties and competitor figures do not trip it.
      - name: Price gate — no published price, no unevidenced popularity claim
        run: node scripts/price-gate.mjs dist/client

      # Facts gate — WIRED BUT NON-BLOCKING pending an owner ruling on the canonical
      # axis count. It currently reports 29 real contradictions: the live board says
      # 14, 26 gspc/* pages say 17, /arena-scoreboard says 15. Those are not typos,
      # they are a canon question. Flip `continue-on-error` to false the moment the
      # number is ruled — a blocking gate on an unruled fact just breaks every deploy.
      - name: Facts gate — no claim may contradict facts.json
        continue-on-error: true
        run: node scripts/facts-gate.mjs dist/client

      - name: Dist bundle guard — stranger paths + API functions present
        run: |
          set -euo pipefail
          for p in sov-os/index.html api-docs/index.html os/index.html gspc-verify/index.html; do
            if [ ! -f "dist/client/$p" ]; then
              echo "MISSING dist/client/$p — prerender did not snapshot this route"
              exit 1
            fi
            echo "ok dist/client/$p ($(wc -c < dist/client/$p) bytes)"
          done
          for fn in functions/api/receipts/latest.ts functions/api/east-west-bench.ts functions/api/evidence-pack.ts functions/api/cards.ts functions/api/axis-register.ts functions/api/auth/[[path]].ts functions/api/dashboard/stats.ts functions/api/_authCrypto.ts functions/api/challenge.ts functions/api/wave-dashboard.ts functions/api/counters.ts functions/api/eunomia-data.ts functions/api/_chatLobby.ts functions/enterprise.ts functions/enterprises.ts functions/chat.ts functions/pricing.ts; do
            test -f "$fn" || (echo "missing $fn" && exit 1)
          done

      # Custom domain councilof.ai follows the Pages PRODUCTION alias
      # (councilof-ai.pages.dev), not a hash preview. --branch=main alone
      # published a fat preview (2026-08-22, 42596ad2.…) while production
      # kept a thin Vite shell + honest 404 catch-all. Ship the same tree
      # to both names the dashboard has used as production_branch.
      - name: Deploy → councilof.ai
        timeout-minutes: 8
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true
          # Custom domain follows whichever name the dashboard set as production_branch.
          # master.pages.dev can be fat while councilof.ai is thin. Write the third name too.
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=production --commit-dirty=true

      # continue-on-error: a thin apex right after upload used to FAIL this
      # step and skip Recheck + Anti-clobber, leaving councilof.ai on a 7KB
      # Vite shell while master.pages.dev held the gated tree.
      - name: Assert apex + production alias received the prerender
        id: immediate
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 20
          node scripts/assert-prerender-live.mjs --label immediate \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # 2026-08-22: official deploy went green (apex 212889) then a Vite-only
      # writer flipped the production alias ~3 minutes later. `/` is no-cache
      # so the homepage went thin; `/os/` stayed fat on a week-long cache.
      # Fail this job if that race happens so we do not ship a green lie.
      - name: Recheck after trailing-clobber window
        timeout-minutes: 5
        id: recheck
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "waiting 120s for a Git/Mac overwrite of the production alias..."
          sleep 120
          node scripts/assert-prerender-live.mjs --label recheck \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # Trailing clobber: master.* stays fat (~212KB) while apex + pages.dev go
      # thin (~7KB Vite) ~2–4 min later (Pages Git auto-build or Mac wrangler).
      # Re-stamp all three alias names from the same gated dist/client.
      - name: Anti-clobber — redeploy gated tree if assert or recheck failed
        if: steps.immediate.outcome == 'failure' || steps.recheck.outcome == 'failure'
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          echo "RECHECK FAILED — re-stamping master/main/production aliases"
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=production --commit-dirty=true
          sleep 30
          node scripts/assert-prerender-live.mjs --label anti-clobber \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # Clobber has also landed after the first recheck went green. One more
      # window; rewrite again if a second writer wins the alias later.
      - name: Confirm gated tree still holds
        timeout-minutes: 6
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          set -euo pipefail
          echo "waiting 90s to confirm the gated tree stuck..."
          sleep 90
          if node scripts/assert-prerender-live.mjs --label hold \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev; then
            echo "hold: production still fat"
            exit 0
          fi
          echo "hold lost — rewriting master/main/production"
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=master --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=main --commit-dirty=true
          npx wrangler pages deploy dist/client --project-name=councilof-ai --branch=production --commit-dirty=true
          sleep 25
          node scripts/assert-prerender-live.mjs --label hold-heal \
            --host https://councilof.ai \
            --also https://councilof-ai.pages.dev

      # csoai.org is the static apex (csoai-site-deploy.yml ← csoai-static-deploy2).
      # Do NOT redeploy the SPA to csoai-site — that overwrites did:web:csoai.org.
