name: carryon-assemble-site-files
on:
  push:
    branches: [cursor/site-os-carryon-ff6e]
    paths:
      - 'tmp/carryon-assemble/**'
      - '.github/workflows/carryon-assemble-site-files.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/site-os-carryon-ff6e
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and write carry-on files
        run: |
          python3 << 'PY'
          import gzip, base64, hashlib, json, pathlib, os
          manifest = json.load(open('tmp/carryon-assemble/manifest.json'))
          for item in manifest:
              b64 = open(item['b64_path']).read().strip()
              raw = gzip.decompress(base64.b64decode(b64))
              got = hashlib.sha256(raw).hexdigest()
              assert got == item['sha256'], (item['path'], got, item['sha256'])
              pathlib.Path(item['path']).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(item['path']).write_bytes(raw)
              print('wrote', item['path'], len(raw), got[:12])
          PY
      - name: Remove assemble staging + this one-shot workflow
        run: |
          rm -rf tmp/carryon-assemble
          rm -f .github/workflows/carryon-assemble-site-files.yml
          rm -f tmp/size-probe-30k.txt tmp/file-ref-probe.txt || true
      - name: Commit restored files
        run: |
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(site): training world + footer logos + Header/Play onto /os"
          git push origin HEAD:cursor/site-os-carryon-ff6e
