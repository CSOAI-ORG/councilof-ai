name: apply-home-understand
on:
  push:
    branches: [cursor/home-sections-enhance-cd38]
    paths:
      - scripts/_apply-home-understand.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/home-sections-enhance-cd38
      - name: Apply ticks
        run: python3 scripts/_apply-home-understand.py
      - name: Commit product and living-band ticks
        run: |
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          rm -f scripts/_apply-home-understand.py .github/workflows/apply-home-understand.yml
          git add client/src/components/home/ToolStack.tsx client/src/components/home/LivingStages.tsx
          git add -u scripts/_apply-home-understand.py .github/workflows/apply-home-understand.yml || true
          git status
          git commit -m "feat(home): ticks on nine products and living bands"
          git push origin cursor/home-sections-enhance-cd38
