name: hf-fin-shells-measure

# Sign compact financial-measure payloads via OIDC → /api/board-sign.
# Filename contains hf-fin-shells so Pages OIDC allowlist matches.
# Never laptop-sign. Never invent a %. Risk verdict stays UNMEASURED.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which compact set to sign: financial, ledger, mill, or verified RunPod artifact"
        type: choice
        options:
          - financial
          - ledger
          - mill
          - runpod
        default: financial
      intake_run_id:
        description: "Successful RunPod intake run ID (required only for runpod)"
        type: string
        required: false
      mill_run_id:
        description: "Exact body.run_id to sign when target=mill; required to avoid signing the whole legacy inbox"
        type: string
        required: false

concurrency:
  group: hf-fin-shells-measure
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: write   # to dispatch hub-queue-flip; a workflow-token push fires no push event

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOARD_SIGN_URL: https://councilof.ai/api/board-sign
    steps:
      - uses: actions/checkout@v4
        with:
          # mill cards batch to the dispatch branch (auto-eat-feed / mill PR), never 90s-push master
          ref: ${{ (inputs.target == 'mill' || inputs.target == 'runpod') && github.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare only the verified RunPod artifact
        if: inputs.target == 'runpod'
        env:
          GH_TOKEN: ${{ github.token }}
          INTAKE_RUN_ID: ${{ inputs.intake_run_id }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == refs/heads/* && "$DISPATCH_REF" != refs/heads/master ]] || {
            echo "RunPod signing must dispatch on a review branch; signed output never pushes master directly"
            exit 1
          }
          [[ "$INTAKE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "A numeric intake run ID is required"; exit 1; }
          python3 -m unittest discover -s scripts -p test_runpod_signing_artifact.py
          python3 scripts/runpod_signing_artifact.py prepare \
            --run-id "$INTAKE_RUN_ID" \
            --out "$RUNNER_TEMP/runpod-signing-approved" \
            --allowlist "$GITHUB_WORKSPACE/scripts/runpod_gspc_bank_allowlist.current.json"
      - name: Select one exact mill run
        if: inputs.target == 'mill'
        env:
          MILL_RUN_ID: ${{ inputs.mill_run_id }}
        run: |
          set -euo pipefail
          [[ "$MILL_RUN_ID" =~ ^[A-Za-z0-9._:-]+$ ]] || {
            echo "A safe, non-empty mill_run_id is required; refusing the whole legacy inbox"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/mill-run-selected"
          python3 - "$MILL_RUN_ID" "$RUNNER_TEMP/mill-run-selected" <<'PY'
          import json, shutil, sys
          from pathlib import Path

          run_id, destination = sys.argv[1], Path(sys.argv[2])
          selected = []
          # G1.2 (2026-09-12): the intake stamps body.run_id as "gha-<run id>"
          # (land_mill_cards.bind_run_provenance) while dispatch inputs arrive as bare
          # digits. Accept exactly those two spellings of the SAME run — never a prefix
          # match, never the whole inbox.
          accepted = {run_id, f"gha-{run_id}"}
          for source in sorted(Path("public/interop/mill-cards-unsigned").glob("unsigned-*.json")):
              card = json.loads(source.read_text(encoding="utf-8"))
              body = card.get("body") or {}
              # KEEP commission cards nest run_id under compute_evidence (body.run_id unset).
              rid = str(body.get("run_id") or (body.get("compute_evidence") or {}).get("run_id") or "")
              # Selection is by RUN provenance only. A card must never be selectable by
              # its own id: that would let any inbox card be signed with no run behind
              # it (governor, 2026-09-14; the clause landed in #2260 and was redundant
              # for the KEEP case, which compute_evidence.run_id already covers).
              if rid in accepted:
                  shutil.copyfile(source, destination / source.name)
                  selected.append(source.name)
          if not selected:
              raise SystemExit(f"No unsigned cards found for exact run_id={run_id}")
          print(f"selected {len(selected)} cards for exact run_id={run_id}")
          PY
      - name: sign compact runs
        env:
          SIGN_TARGET: ${{ inputs.target || 'financial' }}
        run: |
          set -euo pipefail
          T="$SIGN_TARGET"
          if [ "$T" = "ledger" ]; then
            python3 scripts/sign_ledger_cards.py
          elif [ "$T" = "mill" ]; then
            python3 scripts/sign_mill_cards.py --source-dir "$RUNNER_TEMP/mill-run-selected" \
              --evidence-dir "$GITHUB_WORKSPACE/public/interop/mill-evidence" --require-hub-admission
          elif [ "$T" = "runpod" ]; then
            python3 scripts/sign_mill_cards.py --source-dir "$RUNNER_TEMP/runpod-signing-approved/cards"
          else
            python3 scripts/sign_financial_runs.py
          fi
      # public/interop/hub-cards-index.json has a sibling .ots, so its bytes are frozen. A signed card
      # that joins the admitted set would otherwise fail build:client on the PR ("stamped hub index
      # differs from current admitted cards"; #2802/#2815/#2843/#2846 stalled on exactly that).
      # Write the new immutable version + its own fresh OTS proof (pending until the hourly upgrade),
      # move the discovery pointer, and re-derive the OTS manifest, all in the signer's commit. An
      # unchanged admitted set writes nothing.
      - name: version the hub-cards index for the new card set (new file + new proof; stamped bytes untouched)
        if: (inputs.target || 'financial') == 'mill' || inputs.target == 'runpod'
        run: |
          set -euo pipefail
          python3 -m pip install -q opentimestamps-client
          out=$(node scripts/surface/build-hub-cards-index.mjs --version); echo "$out"
          # Only a new version adds a proof; the manifest is derived from the proofs on disk, and
          # llms.txt / llms-full.txt quote the manifest's counts and as_of (scripts/llms-txt-derived.test.ts).
          case "$out" in *VERSIONED*) python3 scripts/ots_manifest_rebuild.py --apply && node scripts/llms-txt.mjs ;; esac
          node scripts/surface/build-hub-cards-index.mjs   # the build-mode check must now pass
      # public/interop/mill-receipt-readiness.json is stamped too, and it is derived through
      # SUPERSEDED.jsonl, which sign_mill_cards.py appends to whenever a receipt's card is replaced.
      # Every mill PR then failed the gates ("mill receipt readiness is stale") with no fix that
      # kept the stamp. Same migration as the hub index: a changed readiness becomes a new
      # immutable version + its own fresh proof, and the discovery pointer moves. Unchanged: no write.
      - name: version the mill receipt readiness (new file + new proof; stamped bytes untouched)
        if: (inputs.target || 'financial') == 'mill' || inputs.target == 'runpod'
        run: |
          set -euo pipefail
          python3 -m pip install -q opentimestamps-client
          out=$(node scripts/build-mill-receipt-readiness.mjs --version); echo "$out"
          case "$out" in *VERSIONED*) python3 scripts/ots_manifest_rebuild.py --apply && node scripts/llms-txt.mjs ;; esac
          node scripts/build-mill-receipt-readiness.mjs --check   # the gates step must now pass
      - name: commit signed cards
        id: commit
        env:
          SIGN_TARGET: ${{ inputs.target || 'financial' }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "csoai-financial-measure"
          git config user.email "board@csoai.org"
          T="$SIGN_TARGET"
          if [ "$T" = "ledger" ]; then
            git add public/interop/ledger-card-*.json
          elif [ "$T" = "mill" ]; then
            git add public/interop/mill-cards-signed public/interop/mill-cards-unsigned
            git add public/interop/hub-cards-index-* public/interop/mill-receipt-readiness-* public/interop/ots/manifest.json public/llms.txt public/llms-full.txt
          elif [ "$T" = "runpod" ]; then
            git add public/interop/mill-cards-signed
            git add public/interop/hub-cards-index-* public/interop/mill-receipt-readiness-* public/interop/ots/manifest.json public/llms.txt public/llms-full.txt
          else
            git add public/interop/financial-measure-card-*.json
          fi
          if git diff --cached --quiet; then
            echo "no card change"
            exit 0
          fi
          git commit -m "${T}-measure: sign compact cards via OIDC board-sign"
          if [ "$T" = "mill" ] || [ "$T" = "runpod" ]; then
            git push origin "HEAD:$DISPATCH_BRANCH"
          else
            git push origin HEAD:master
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow token fires NO push event, by GitHub's design (it is what
      # stops workflows recursing). hub-queue-flip triggers on push to master under
      # public/interop/mill-cards-signed/**, so the signer's own commit could never start it:
      # cards were signed and the census was never reprinted. Ask for the run explicitly.
      # Only for a push that reached master -- a mill run lands on its own branch, where the
      # census has nothing to print yet, and the flip runs after that branch's PR merges.
      - name: dispatch hub-queue-flip (a workflow-token push starts nothing)
        if: steps.commit.outputs.pushed == 'true' && (inputs.target || 'financial') != 'mill' && inputs.target != 'runpod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hub-queue-flip.yml --ref master -f dry_run=false
          echo "requested hub-queue-flip on master"
