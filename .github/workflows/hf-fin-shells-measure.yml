name: hf-fin-shells-measure

# Sign compact financial-measure payloads via OIDC → /api/board-sign.
# Filename contains hf-fin-shells so Pages OIDC allowlist matches.
# Never laptop-sign. Never invent a %. Risk verdict stays UNMEASURED.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which compact set to sign: financial, ledger, mill, isolated mill run, or verified RunPod artifact"
        type: choice
        options:
          - financial
          - ledger
          - mill
          - mill-run
          - runpod
        default: financial
      intake_run_id:
        description: "Successful RunPod intake run ID (required only for runpod)"
        type: string
        required: false
      mill_run_id:
        description: "Exact body.run_id to sign (required only for mill-run)"
        type: string
        required: false
      mill_expected_count:
        description: "Exact receipt count required for mill-run"
        type: number
        required: false

concurrency:
  group: hf-fin-shells-measure
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: write   # to dispatch hub-queue-flip; a workflow-token push fires no push event

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOARD_SIGN_URL: https://councilof.ai/api/board-sign
    steps:
      - uses: actions/checkout@v4
        with:
          # mill cards batch to the dispatch branch (auto-eat-feed / mill PR), never 90s-push master
          ref: ${{ (inputs.target == 'mill' || inputs.target == 'mill-run' || inputs.target == 'runpod') && github.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare only the verified RunPod artifact
        if: inputs.target == 'runpod'
        env:
          GH_TOKEN: ${{ github.token }}
          INTAKE_RUN_ID: ${{ inputs.intake_run_id }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == refs/heads/* && "$DISPATCH_REF" != refs/heads/master ]] || {
            echo "RunPod signing must dispatch on a review branch; signed output never pushes master directly"
            exit 1
          }
          [[ "$INTAKE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "A numeric intake run ID is required"; exit 1; }
          python3 -m unittest discover -s scripts -p test_runpod_signing_artifact.py
          python3 scripts/runpod_signing_artifact.py prepare \
            --run-id "$INTAKE_RUN_ID" \
            --out "$RUNNER_TEMP/runpod-signing-approved" \
            --allowlist "$GITHUB_WORKSPACE/scripts/runpod_gspc_bank_allowlist.current.json"
      - name: Prepare only the requested mill run
        if: inputs.target == 'mill-run'
        env:
          MILL_RUN_ID: ${{ inputs.mill_run_id }}
          MILL_EXPECTED_COUNT: ${{ inputs.mill_expected_count }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == refs/heads/* && "$DISPATCH_REF" != refs/heads/master ]] || {
            echo "Isolated mill signing must dispatch on a review branch"
            exit 1
          }
          [[ "$MILL_RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "A safe exact mill run ID is required"
            exit 1
          }
          [[ "$MILL_EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]] || {
            echo "A positive exact receipt count is required"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/mill-signing-approved"
          python3 - "$MILL_RUN_ID" "$MILL_EXPECTED_COUNT" "$RUNNER_TEMP/mill-signing-approved" <<'PY'
          import json
          import pathlib
          import shutil
          import sys

          run_id, expected_text, output_text = sys.argv[1:]
          source = pathlib.Path("public/interop/mill-cards-unsigned")
          output = pathlib.Path(output_text)
          selected = []
          for path in sorted(source.glob("*.json")):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"unsafe input path: {path}")
              card = json.loads(path.read_text(encoding="utf-8"))
              if card.get("body", {}).get("run_id") == run_id:
                  selected.append(path)
          expected = int(expected_text)
          if len(selected) != expected:
              raise SystemExit(
                  f"mill run {run_id!r}: selected {len(selected)} receipts; expected {expected}"
              )
          for path in selected:
              shutil.copy2(path, output / path.name)
          print(f"approved exact mill run {run_id}: {len(selected)} receipts")
          PY
      - name: sign compact runs
        env:
          SIGN_TARGET: ${{ inputs.target || 'financial' }}
        run: |
          set -euo pipefail
          T="$SIGN_TARGET"
          if [ "$T" = "ledger" ]; then
            python3 scripts/sign_ledger_cards.py
          elif [ "$T" = "mill" ]; then
            python3 scripts/sign_mill_cards.py
          elif [ "$T" = "mill-run" ]; then
            python3 scripts/sign_mill_cards.py --source-dir "$RUNNER_TEMP/mill-signing-approved"
          elif [ "$T" = "runpod" ]; then
            python3 scripts/sign_mill_cards.py --source-dir "$RUNNER_TEMP/runpod-signing-approved/cards"
          else
            python3 scripts/sign_financial_runs.py
          fi
      - name: commit signed cards
        id: commit
        env:
          SIGN_TARGET: ${{ inputs.target || 'financial' }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "csoai-financial-measure"
          git config user.email "board@csoai.org"
          T="$SIGN_TARGET"
          if [ "$T" = "ledger" ]; then
            git add public/interop/ledger-card-*.json
          elif [ "$T" = "mill" ]; then
            git add public/interop/mill-cards-signed public/interop/mill-cards-unsigned
          elif [ "$T" = "mill-run" ] || [ "$T" = "runpod" ]; then
            git add public/interop/mill-cards-signed
          else
            git add public/interop/financial-measure-card-*.json
          fi
          if git diff --cached --quiet; then
            echo "no card change"
            exit 0
          fi
          git commit -m "${T}-measure: sign compact cards via OIDC board-sign"
          if [ "$T" = "mill" ] || [ "$T" = "mill-run" ] || [ "$T" = "runpod" ]; then
            git push origin "HEAD:$DISPATCH_BRANCH"
          else
            git push origin HEAD:master
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow token fires NO push event, by GitHub's design (it is what
      # stops workflows recursing). hub-queue-flip triggers on push to master under
      # public/interop/mill-cards-signed/**, so the signer's own commit could never start it:
      # cards were signed and the census was never reprinted. Ask for the run explicitly.
      # Only for a push that reached master -- a mill run lands on its own branch, where the
      # census has nothing to print yet, and the flip runs after that branch's PR merges.
      - name: dispatch hub-queue-flip (a workflow-token push starts nothing)
        if: steps.commit.outputs.pushed == 'true' && (inputs.target || 'financial') != 'mill' && inputs.target != 'mill-run' && inputs.target != 'runpod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hub-queue-flip.yml --ref master -f dry_run=false
          echo "requested hub-queue-flip on master"
