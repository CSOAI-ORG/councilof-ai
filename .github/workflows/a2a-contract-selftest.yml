name: A2A contract selftest

on:
  pull_request:
    paths:
      - ".github/workflows/a2a-contract-selftest.yml"
      - "functions/api/a2a.ts"
      - "functions/api/a2a.test.ts"
      - "functions/api/agent-card-jws.test.ts"
      - "functions/api/_a2a_directories.test.ts"
      - "public/.well-known/agent-card.json"
      - "public/.well-known/agent.json"
      - "public/interop/agent-card-jws-input.json"
      - "public/interop/a2a-directories.json"
      - "scripts/agent-card-extensions.mjs"
      - "scripts/adapters/agent_card_jws.py"
      - "scripts/test_agent_card.py"
      - "scripts/test_agent_card_jws.py"
      - "scripts/verify_agent_card_jws.py"
      - "public/.well-known/did.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - ".github/workflows/a2a-contract-selftest.yml"
      - "functions/api/a2a.ts"
      - "functions/api/a2a.test.ts"
      - "functions/api/agent-card-jws.test.ts"
      - "functions/api/_a2a_directories.test.ts"
      - "public/.well-known/agent-card.json"
      - "public/.well-known/agent.json"
      - "public/interop/agent-card-jws-input.json"
      - "public/interop/a2a-directories.json"
      - "scripts/agent-card-extensions.mjs"
      - "scripts/adapters/agent_card_jws.py"
      - "scripts/test_agent_card.py"
      - "scripts/test_agent_card_jws.py"
      - "scripts/verify_agent_card_jws.py"
      - "public/.well-known/did.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  a2a-contract-selftest:
    name: a2a-contract-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # setup-python so the JWS step can pip-install `cryptography` without PEP 668 refusing the
      # runner's system interpreter.
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify agent-card producer is deterministic
        run: |
          node scripts/agent-card-extensions.mjs
          git diff --exit-code -- public/.well-known/agent-card.json public/.well-known/agent.json
          python3 scripts/test_agent_card.py

      # A2A §8.4: the signer and an independent verifier must agree on the canonical payload, a
      # signed card must verify against did.json under #card-attestation-2 and under no other key,
      # and a one-byte edit must fail. #card-attestation-2 has signed the agent card since the
      # owner-approved rotation of 2026-09-27 (corrections ledger C-2026-0927-05). #card-attestation-1
      # stays published for the signed card index, and here it is refused like any other key.
      # scripts/test_agent_card_jws.py repeats this pin and fails if the two ever disagree.
      # Runs whether or not the card is signed yet (unsigned is asserted, not assumed).
      - name: Agent card JWS — independent verify, tamper control, key scope
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "cryptography>=42"
          python3 scripts/test_agent_card_jws.py
          python3 scripts/verify_agent_card_jws.py --require-kid 'did:web:csoai.org#card-attestation-2' --tamper-control || test $? -eq 2

      - name: Run offline A2A contract tests
        run: >-
          npm exec -- vitest run
          functions/api/a2a.test.ts
          functions/api/agent-card-jws.test.ts
          functions/api/_a2a_directories.test.ts
