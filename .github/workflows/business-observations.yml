name: Business observation integrity
on:
  pull_request:
    paths:
      - 'scripts/business-operations/**'
      - '.github/workflows/business-observations.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/business-operations/**'
      - '.github/workflows/business-observations.yml'
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/business-operations -p 'test_*.py' -v
