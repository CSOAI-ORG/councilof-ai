name: Governance watch offline tests
on:
  pull_request:
    paths:
      - 'scripts/governance-watch/**'
      - '.github/workflows/governance-watch-tests.yml'
concurrency:
  group: governance-watch-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression suite
        run: python3 -m unittest discover -s scripts/governance-watch -p 'test_*.py' -v
