name: Reg-watch — regulation-change detector (living loop)

# Polls the official sources of the instruments the board measures against
# (EUR-Lex ELI + legislation.gov.uk) and raises a provision-change event when
# one changes. Detection only (v0.1): the event is the trigger later stages
# consume (pass issuer -> EXPIRED-REGULATION-CHANGED). Free feeds, no secrets.

on:
  schedule:
    - cron: "45 6 * * *"   # daily 06:45 UTC; includes all29 public research routes
    - cron: "45 0-5,7-23 * * *" # integration documentation only; daily run fills06:45
  workflow_dispatch:
    inputs:
      opportunity_only:
        description: Run only bounded opportunity source metadata; skip both existing heavy jobs
        type: boolean
        default: false
      capture_only:
        description: Only capture opportunity metadata; skip both heavy jobs and all promotion
        type: boolean
        default: false
      promote_opportunities:
        description: Explicitly permit a manual opportunity data review PR; capture_only overrides this
        type: boolean
        default: false
      derived_reports_only:
        description: Run only the derived report publication job
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write   # lands via branch + PR; a direct push to master is GH006 (required gates)

jobs:
  daily-evidence-product:
    if: ${{ (github.event_name != 'schedule' || github.event.schedule == '45 6 * * *') && (github.event_name != 'workflow_dispatch' || (!inputs.opportunity_only && !inputs.capture_only)) }}
    name: Publish derived daily evidence archive through release gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daily-evidence-product
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require a PR identity that triggers normal required checks
        env:
          REPORT_PR_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN }}
        run: |
          if [ -z "$REPORT_PR_TOKEN" ]; then
            echo "::error::Daily publication is held: SNAPSHOT_PR_TOKEN is absent. No fallback that suppresses required PR checks."
            exit 1
          fi
      - name: Test exact mappings, history preservation and archive rendering
        run: node --test scripts/build-daily-signal.node-test.mjs scripts/build-daily-product.node-test.mjs scripts/build-axis-reports.ownership.test.mjs
      - name: Derive reports from the committed public source snapshot
        run: |
          set -euo pipefail
          REPORT_DAY=$(date -u +%F)
          echo "REPORT_DAY=$REPORT_DAY" >> "$GITHUB_ENV"
          node scripts/build-daily-signal.mjs --as-of "$REPORT_DAY"
          node scripts/build-daily-signal.mjs --as-of "$REPORT_DAY" --check
          node scripts/build-daily-product.mjs
          node scripts/build-daily-product.mjs --check
      - name: Retain the generated public report packet
        uses: actions/upload-artifact@v4
        with:
          name: daily-evidence-product
          path: public/reports/daily-signal/
          retention-days: 30
      - name: Submit only generated report files to normal gated publication
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "daily-evidence-product"
          git config user.email "nicholas@csoai.org"
          git add -- public/reports/daily-signal/
          python3 - <<'PY'
          import re, subprocess
          # NUL records preserve spaces/newlines in names. Disable rename detection
          # so a moved historical report is an explicit deletion plus addition.
          raw = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '-z', '--no-renames'])
          records = raw.split(b'\0')[:-1] if raw else []
          if (raw and not raw.endswith(b'\0')) or len(records) % 2:
              raise SystemExit('Refusing malformed staged status records')
          allowed = re.compile(r'public/reports/daily-signal/(?:[0-9]{4}-[0-9]{2}-[0-9]{2}\.(?:json|md)|latest\.(?:json|md)|index\.(?:json|html)|findings\.json)')
          dated_source = re.compile(r'public/reports/daily-signal/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json')
          for raw_status, raw_path in zip(records[::2], records[1::2]):
              status, path = raw_status.decode('ascii'), raw_path.decode('utf-8')
              if not allowed.fullmatch(path):
                  raise SystemExit('Refusing unexpected generated path')
              if status == 'D':
                  raise SystemExit('Refusing report archive deletion')
              if status not in ('A', 'M'):
                  raise SystemExit('Refusing unexpected staged change type')
              if dated_source.fullmatch(path) and status != 'A':
                  raise SystemExit('Refusing modification of a retained dated source report')
          PY
          if git diff --cached --quiet; then
            echo "No derived report changes."
            exit 0
          fi
          BRANCH="automation/daily-evidence-${REPORT_DAY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git commit -m "Publish derived evidence report ${REPORT_DAY}"
          git push origin "$BRANCH"
          cat > "$RUNNER_TEMP/daily-evidence-pr.md" <<'BODY'
          Publish the derived daily clock report, source-bound findings and report archive. Only generated daily-signal artifacts are staged. Source dates, exact source hashes, missing mappings and unknown evidence remain explicit. This is report generation from committed source snapshots, not a new measurement or legal assessment.

          Publication uses the repository's normal required checks and master deployment. Publication awaits authorized human review and merge; no administrator bypass is used. Prior dated source JSON is preserved; Markdown and indexes are reproducible renderings. Changed same-day inputs require a reviewed correction.
          BODY
          PR_URL=$(gh pr create --base master --head "$BRANCH" --title "Daily evidence report ${REPORT_DAY}" --body-file "$RUNNER_TEMP/daily-evidence-pr.md")
  reg-watch:
    if: ${{ (github.event_name != 'schedule' || github.event.schedule == '45 6 * * *') && (github.event_name != 'workflow_dispatch' || (!inputs.derived_reports_only && !inputs.opportunity_only && !inputs.capture_only)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the detector
        id: watch
        continue-on-error: true
        run: node scripts/reg-watch.mjs
      - name: GSPC research source detector selftest (offline)
        run: node --test scripts/research/watch-sources.test.mjs
      - name: Run the GSPC research source detector
        id: research-watch
        continue-on-error: true
        run: node scripts/research/watch-sources.mjs
      - name: Watchdog source status selftest (offline)
        run: node --test scripts/watchdog/source-status.test.mjs
      - name: Run metadata-only incident-source checks
        id: watchdog-source
        run: node scripts/watchdog/source-status.mjs
      - name: Build draft metadata-only Watchdog daily index
        run: node scripts/watchdog/daily-index.mjs --out watchdog-daily-index.json
      - name: Commit updated state (and any events)
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN || secrets.GITHUB_TOKEN }}  # SNAPSHOT_PR_TOKEN: a PR opened with it fires pull_request checks; GITHUB_TOKEN cannot
        run: |
          set -euo pipefail
          git config user.name "reg-watch"
          git config user.email "nicholas@csoai.org"
          git add reg-watch-state.json reg-watch-events/ research-watch-state.json research-review-requests/ watchdog-source-status.json watchdog-daily-index.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "watch: source-state update $(date -u +%F)"
          # Land via branch + PR (the census-delta.yml pattern). A direct push to
          # master is GH006: the required "gates" check applies to pushes too, and
          # a push creates a commit no check has run on yet (red since 2026-09-06).
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          BR="automation/reg-watch-${STAMP}"
          git push origin "HEAD:$BR"
          gh pr create --base master --head "$BR" \
            --title "watch: source-state update ${STAMP}" \
            --body "Automated regulation and GSPC research source-state update. May include provision events under \`reg-watch-events/\` and UNSIGNED, unmeasured human-review requests under \`research-review-requests/\`. The watchdog snapshot and draft daily index report public page availability only; they download no incident records, report text or snapshots. The index keeps rights unknown, case counts not in scope and reviewer status not staffed; it is not a GSPC score or safety decision. A source change is not a legal interpretation, measurement or board update. Opened as a PR because direct pushes cannot satisfy the required \`gates\` check (GH006). Needs human review and merge."
      # Regulator calendar: T-7 / T-2 / T-0 alerts for VERIFIED doors in
      # measurement/calendar/regulator-doors.json (no new cron — rides this daily run).
      - name: Regulator calendar selftest (offline — proves the alerts can fire and the rules can fail)
        run: node scripts/regulator-calendar.mjs --selftest
      - name: Regulator calendar — compute T-7/T-2/T-0 alerts
        id: calendar
        run: node scripts/regulator-calendar.mjs --out "$RUNNER_TEMP/regulator-alerts.json"
      - name: Regulator calendar — open one issue per alert (deduplicated by title)
        if: steps.calendar.outputs.alerts != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(jq length "$RUNNER_TEMP/regulator-alerts.json")
          for i in $(seq 0 $((n - 1))); do
            title=$(jq -r ".[$i].title" "$RUNNER_TEMP/regulator-alerts.json")
            body=$(jq -r ".[$i].body" "$RUNNER_TEMP/regulator-alerts.json")
            existing=$(gh issue list --state all --search "in:title \"$title\"" --json title --jq "[.[] | select(.title == \"$title\")] | length")
            if [ "$existing" != "0" ]; then echo "exists: $title"; continue; fi
            gh issue create --title "$title" --body "$body" --label "regulator-calendar" 2>/dev/null \
              || gh issue create --title "$title" --body "$body"
          done
      - name: Raise the alarm on a provision change
        if: steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Provision change detected — $(date -u +%F)"
          BODY="reg-watch detected a change in a watched legal instrument. Event files are in reg-watch-events/. Detection only — map to affected provisions and (once passes exist) flip dependent state records to EXPIRED-REGULATION-CHANGED. Not a legal interpretation."
          gh issue create --title "$TITLE" --body "$BODY" --label "reg-watch" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
      - name: Raise a human-review alert on a GSPC source change
        if: steps.research-watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="GSPC research source change — $(date -u +%F)"
          BODY="Confirmed source fingerprints produced unsigned requests in research-review-requests/. Each requests human impact analysis and a decision whether to re-measure. None is a measurement, signed finding, legal interpretation or automatic board update."
          gh issue create --title "$TITLE" --body "$BODY" --label "gspc-research" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"


  opportunity-source-metadata:
    name: Bounded public opportunity source metadata
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.opportunity_only || inputs.capture_only || inputs.promote_opportunities }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: opportunity-source-metadata
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test source limits, privacy, missingness and schedule isolation
        run: node --test scripts/research/watch-sources.test.mjs
      - name: Select bounded scope and retain the prior pending observation
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SOURCE_SCHEDULE: ${{ github.event.schedule }}
          CAPTURE_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.capture_only || !inputs.promote_opportunities) }}
        run: |
          set -euo pipefail
          SCOPE=all
          if [ "$SOURCE_SCHEDULE" = "45 0-5,7-23 * * *" ]; then SCOPE=integrations; fi
          echo "OPPORTUNITY_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          BRANCH="automation/opportunity-source-$(date -u +%F)"
          echo "OPPORTUNITY_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          cp public/interop/opportunity-registry.json "$RUNNER_TEMP/opportunity-input.json"
          # Read data only from the existing review branch; never execute its code.
          # A manual capture-only validation uses only the dispatched ref's data.
          if [ "$CAPTURE_ONLY" != "true" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$BRANCH"
            git show FETCH_HEAD:public/interop/opportunity-registry.json > "$RUNNER_TEMP/opportunity-prior.json"
            node --input-type=module - "$RUNNER_TEMP/opportunity-input.json" "$RUNNER_TEMP/opportunity-prior.json" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { mergeOpportunityBaseline } from './scripts/research/watch-sources.mjs';
          const [current, previous] = process.argv.slice(2);
          const value = mergeOpportunityBaseline(JSON.parse(readFileSync(current)), JSON.parse(readFileSync(previous)));
          writeFileSync(current, JSON.stringify(value, null, 2) + '\n');
          JS
          fi
      - name: Capture public metadata without running third-party code or models
        run: |
          node scripts/research/watch-sources.mjs --opportunities \
            --opportunity-file "$RUNNER_TEMP/opportunity-input.json" \
            --scope "$OPPORTUNITY_SCOPE" --out "$RUNNER_TEMP/opportunity-registry.json" \
            --workflow-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain every completed source observation packet
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opportunity-registry.json
          if-no-files-found: error
          retention-days: 30
      - name: Submit one data-only review PR per UTC day; never merge
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.promote_opportunities && !inputs.capture_only) }}
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Publication held: SNAPSHOT_PR_TOKEN is absent. Capture remains in run artifacts."
            exit 0
          fi
          STATE=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$OPPORTUNITY_BRANCH" --state all --json state --jq '.[0].state // ""')
          if [ "$STATE" = "MERGED" ] || [ "$STATE" = "CLOSED" ]; then
            echo "This day's review PR is already closed. Later captures remain artifacts until the next UTC day."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$OPPORTUNITY_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$OPPORTUNITY_BRANCH"
            git switch -c "$OPPORTUNITY_BRANCH" FETCH_HEAD
          else
            git switch -c "$OPPORTUNITY_BRANCH"
          fi
          cp "$RUNNER_TEMP/opportunity-registry.json" public/interop/opportunity-registry.json
          git add -- public/interop/opportunity-registry.json
          test "$(git diff --cached --name-only)" = "public/interop/opportunity-registry.json"
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git commit -m "Record bounded public opportunity source observations"
          git push origin "$OPPORTUNITY_BRANCH"
          if [ "$STATE" != "OPEN" ]; then
            cat > "$RUNNER_TEMP/opportunity-pr.md" <<'BODY'
          Refresh only public source metadata for the reviewed 29-route catalogue. Capture times, successful body digests, unavailable reads and confirmed fingerprint changes are separate facts. No programme eligibility, application, funding, product measurement or board admission is inferred. Source bodies and response headers are not retained.

          The workflow run and retained artifacts are referenced in the packet. Publication awaits the repository's normal checks and authorized human merge. Later captures after this day's PR is closed remain artifacts until the next UTC day. No automatic merge or deployment is requested.
          BODY
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$OPPORTUNITY_BRANCH" \
              --title "Public opportunity source observations $(date -u +%F)" --body-file "$RUNNER_TEMP/opportunity-pr.md"
          fi
