name: charter-contract-checks

on:
  pull_request:
    paths:
      - 'packages/layer0-js/**'
      - 'docs/standards/osaia-safe-reverification/**'
      - '.github/workflows/charter-contract-checks.yml'
  push:
    branches: [master]
    paths:
      - 'packages/layer0-js/**'
      - 'docs/standards/osaia-safe-reverification/**'
      - '.github/workflows/charter-contract-checks.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charter-contract-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  layer0-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise authorization, cancellation and uncertain effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification
          node --version > qualification/node-version.txt
          node --test --test-reporter=tap packages/layer0-js/index.test.js 2>&1 | tee qualification/layer0.tap
      - name: Check the approval contract is packaged without publishing
        working-directory: packages/layer0-js
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --ignore-scripts --json > ../../qualification/package.json
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('../../qualification/package.json','utf8')); if (!p[0].files.some(f=>f.path==='APPROVAL-CONTRACT.md')) throw Error('Approval contract missing from package');"
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layer0-contract-node-${{ matrix.node }}
          path: qualification
          if-no-files-found: warn
          retention-days: 14

  authority-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned schema and timestamp validators
        run: python -m pip install jsonschema==4.25.1 rfc3339-validator==0.1.4
      - name: Verify profile and synthetic evidence accounting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification
          python --version > qualification/python-version.txt
          python docs/standards/osaia-safe-reverification/test_hitl_authority_effect_v0_2.py 2>&1 | tee qualification/authority-profile.txt
          python docs/standards/osaia-safe-reverification/examples/safe23-synthetic/safe23_synthetic_example.py 2>&1 | tee qualification/synthetic-example.txt
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: charter-authority-profile
          path: qualification
          if-no-files-found: warn
          retention-days: 14
