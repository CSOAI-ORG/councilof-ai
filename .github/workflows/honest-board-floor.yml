# OWNER RULING 2026-08-28: the mine chain is 335 verifying cards. The 150-row
# board is a subset of that chain, not a second measurement. This workflow no
# longer restores a 150 floor and no longer pushes. signed-json-guard is the
# structural gate: n_cards == n_cells == rows == files, every row signature-bound.
name: honest-board-floor
on:
  push:
    paths:
      - 'public/signed/card_index.json'
      - 'public/signed/cards/**'
      - 'scripts/signed-json-guard.mjs'
  pull_request:
    paths:
      - 'public/signed/card_index.json'
      - 'public/signed/cards/**'
      - 'scripts/signed-json-guard.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-consistency only (no restore, no clamp)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('public/signed/card_index.json')
          j = json.loads(p.read_bytes())
          cards = j.get('cards') if isinstance(j.get('cards'), list) else []
          n = j.get('n_cards')
          cells = j.get('n_cells')
          files = list(pathlib.Path('public/signed/cards').glob('*.json'))
          print('n_cards', n, 'n_cells', cells, 'rows', len(cards), 'files', len(files))
          if n != len(cards):
              print('FAIL header lie'); sys.exit(1)
          if cells is not None and cells != len(cards):
              print('FAIL leftover n_cells floor'); sys.exit(1)
          if not all(isinstance(c, dict) and c.get('sig') and c.get('card') for c in cards):
              print('FAIL unsigned row'); sys.exit(1)
          ids = {c['card'] for c in cards}
          stems = {f.stem for f in files}
          if ids - stems:
              print('FAIL index points at missing files', len(ids - stems)); sys.exit(1)
          print('honest floor: header == rows == signature-bound; files cover the index')
          PY
          node scripts/signed-json-guard.mjs public
