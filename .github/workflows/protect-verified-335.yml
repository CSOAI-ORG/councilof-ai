name: protect-verified-335
on:
  push:
    paths: ['public/signed/card_index.json']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce verified 335 on master
        run: |
          set -euo pipefail
          EXPECTED=12f5122df916c1f165281e6453d8673ffc52992513e218c62f354337091d8ccb
          if python3 -c "
import hashlib,json,pathlib,sys
raw=pathlib.Path('public/signed/card_index.json').read_bytes()
j=json.loads(raw); h=hashlib.sha256(raw).hexdigest()
print(j.get('n_cards'), len(j.get('cards',[])), h[:16])
sys.exit(0 if j.get('n_cards')==335 and len(j.get('cards',[]))==335 and h=='$EXPECTED' else 1)
"; then
            echo OK verified 335; exit 0
          fi
          cat .github/ci/card_index_335_atomic/p*.txt | tr -d '\n' | base64 -d > /tmp/ci.json
          test "$(python3 -c 'import hashlib;print(hashlib.sha256(open("/tmp/ci.json","rb").read()).hexdigest())')" = "$EXPECTED"
          cp /tmp/ci.json public/signed/card_index.json
          python3 -c 'import json,pathlib; from datetime import datetime,timezone; pathlib.Path("public/stack/e2e-latest.json").write_text(json.dumps({"deployed_at":datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),"reason":"protect-verified-335 direct master re-land","card_index_n":335},indent=2)+"\n")'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/signed/card_index.json public/stack/e2e-latest.json
          git commit -m "fix: protect-verified-335 direct re-land card_index 335" || exit 0
          git push origin HEAD:master
