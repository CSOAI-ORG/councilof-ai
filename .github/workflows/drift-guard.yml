name: Drift guard — live site vs ruled canon

# Goes RED when the live councilof.ai drifts from canon.json — i.e. when a direct
# `wrangler pages deploy` overwrote the gated CI build. See DEPLOY-LOCK.md.
# Read-only: fetches public URLs, changes nothing, needs no secrets.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # run on demand from the Actions tab
  push:
    branches: [master]
    paths: ["canon.json", "scripts/drift-guard.mjs", "scripts/machine-contract-guard.mjs", "scripts/publish-freshness.mjs", ".github/workflows/drift-guard.yml"]

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    # actions:write lets a detected drift self-heal by re-triggering the official deploy.
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Give the just-pushed deploy time to propagate before asserting (skip wait on schedule).
      - name: Settle
        if: github.event_name == 'push'
        run: sleep 420
      - name: Assert live site matches canon.json
        id: assert
        continue-on-error: true
        run: node scripts/drift-guard.mjs --host https://councilof.ai
      # Machine contracts (llms.txt links, did.json endpoints, banned strings in API JSON,
      # feed well-formedness, and publish freshness: sitemap/feed/card URLs/root.json as_of)
      # rot on the same clobber lane — sweep them alongside canon.
      # No self-heal keyed to this step: a broken machine contract is not necessarily a
      # clobber, so it just turns the run red below.
      # Offline proof that each freshness check can fail, before trusting its green.
      - name: Publish-freshness selftest
        run: node scripts/publish-freshness.mjs --selftest
      - name: Machine-contract sweep
        id: contracts
        continue-on-error: true
        run: node scripts/machine-contract-guard.mjs --host https://councilof.ai
      # SELF-HEAL: a clobber (direct `wrangler pages deploy` over the gated build) is restored
      # automatically by re-running the official deploy of canonical master. Only on scheduled
      # runs — a push already deployed, so re-triggering there would loop. deploy.yml's own
      # concurrency (cancel-in-progress) makes repeated triggers safe.
      #
      # A redeploy restores canon only when production is serving something OTHER than the official
      # build of master. O-drift (7 Oct 2026): a one-word canon mismatch ("23 axis" vs live "23 axes")
      # failed every run, and each self-heal re-ran a 19-minute deploy of a master that was already
      # live (2c2fa34bc deployed at 20:53Z and 22:40Z, re-dispatched at 00:30Z). So read the marker
      # deploy.yml writes (/.well-known/deploy.json) and skip when it already names master, or when a
      # deploy is already queued or running. An unreadable marker still self-heals: a clobbering
      # upload would not carry deploy.yml's marker.
      - name: Self-heal on drift (redeploy canonical master)
        if: steps.assert.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          master=$(gh api "repos/$REPO/commits/master" -q .sha 2>/dev/null || true)
          served=$(curl -fsS --max-time 20 "https://councilof.ai/.well-known/deploy.json?cb=$(date +%s)" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          active=$(gh run list --repo "$REPO" --workflow deploy.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          echo "master=${master:-unreadable} served=${served:-unreadable} active_deploys=$active"
          if [ -n "$master" ] && [ "$served" = "$master" ]; then
            echo "DRIFT on the official build of master ($master): a redeploy cannot restore canon. Not dispatching; fix canon.json or the code."
            exit 0
          fi
          if [ "$active" != "0" ]; then
            echo "DRIFT, but $active deploy run(s) are already queued or running; not dispatching another."
            exit 0
          fi
          echo "DRIFT DETECTED — production is not serving master's official build; re-running the official deploy (self-heal)."
          gh workflow run deploy.yml --repo "$REPO" --ref master
      # Keep the alert RED so the clobber stays visible even though it self-heals — the durable
      # fix is still revoking the clobbering lane's direct-deploy token (see DEPLOY-LOCK.md).
      - name: Fail the run if drift was detected
        if: steps.assert.outcome == 'failure' || steps.contracts.outcome == 'failure'
        run: |
          echo "DRIFT-GUARD RED: canon assert = ${{ steps.assert.outcome }}, machine-contract sweep = ${{ steps.contracts.outcome }}."
          echo "Durable fix for a clobber: revoke the clobbering lane's Cloudflare Pages token. See DEPLOY-LOCK.md."
          exit 1
