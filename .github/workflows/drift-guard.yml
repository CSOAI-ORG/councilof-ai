name: Drift guard — live site vs ruled canon

# Goes RED when the live councilof.ai drifts from canon.json — i.e. when a direct
# `wrangler pages deploy` overwrote the gated CI build. See DEPLOY-LOCK.md.
# The checks are read-only: they fetch public URLs and change nothing. On drift, a scheduled run
# re-dispatches deploy.yml (self-heal below), with SNAPSHOT_PR_TOKEN when that secret exists.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # run on demand from the Actions tab
  push:
    branches: [master]
    paths: ["canon.json", "scripts/drift-guard.mjs", "scripts/surface/board-drift.mjs", "scripts/machine-contract-guard.mjs", "scripts/publish-freshness.mjs", ".github/workflows/drift-guard.yml"]

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    # actions:write lets a detected drift self-heal by re-triggering the official deploy.
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Give the just-pushed deploy time to propagate before asserting (skip wait on schedule).
      - name: Settle
        if: github.event_name == 'push'
        run: sleep 420
      - name: Install deps (esbuild for the commit board)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Board-drift selftest (must-fail cases go red)
        run: node scripts/drift-guard.mjs --selftest
      - name: Assert live site matches canon.json
        id: assert
        continue-on-error: true
        run: node scripts/drift-guard.mjs --host https://councilof.ai
      # Machine contracts (llms.txt links, did.json endpoints, banned strings in API JSON,
      # feed well-formedness, and publish freshness: sitemap/feed/card URLs/root.json as_of)
      # rot on the same clobber lane — sweep them alongside canon.
      # No self-heal keyed to this step: a broken machine contract is not necessarily a
      # clobber, so it just turns the run red below.
      # Offline proof that each freshness check can fail, before trusting its green.
      - name: Publish-freshness selftest
        run: node scripts/publish-freshness.mjs --selftest
      - name: Machine-contract sweep
        id: contracts
        continue-on-error: true
        run: node scripts/machine-contract-guard.mjs --host https://councilof.ai
      # SELF-HEAL: a clobber (direct `wrangler pages deploy` over the gated build) is restored
      # automatically by re-running the official deploy of canonical master. Only on scheduled
      # runs — a push already deployed, so re-triggering there would loop. deploy.yml's own
      # concurrency (cancel-in-progress) makes repeated triggers safe.
      # The deploy-dispatch block below dispatches with SNAPSHOT_PR_TOKEN, so the healing deploy
      # gets its five follow-the-deploy workflows like any push deploy.
      - name: Self-heal on drift (redeploy canonical master)
        id: heal
        if: steps.assert.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN }}
        run: |
          set -euo pipefail
          echo "DRIFT DETECTED — re-running the official deploy to restore canon (self-heal)."
          # >>> deploy-dispatch: byte-identical in every workflow that dispatches deploy.yml, and
          # executed by scripts/deploy-dispatch-followers.node-test.mjs. GitHub creates a run that
          # GITHUB_TOKEN dispatches but starts no workflow_run for it, so none of deploy.yml's five
          # followers would run. SNAPSHOT_PR_TOKEN dispatches as a user, so the deploy is followed
          # like a push deploy. If that token is absent or refused, deploy.yml is still dispatched,
          # with GITHUB_TOKEN, and the step output followers=not-started records that none will run.
          if [ -n "${DEPLOY_DISPATCH_TOKEN:-}" ] &&
            GH_TOKEN="$DEPLOY_DISPATCH_TOKEN" gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master; then
            echo "DEPLOY_DISPATCHED_AS_USER: deploy.yml dispatched with SNAPSHOT_PR_TOKEN, not GITHUB_TOKEN."
          else
            echo "followers=not-started" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy followers not started::SNAPSHOT_PR_TOKEN is absent or was refused, so deploy.yml is dispatched with GITHUB_TOKEN. GitHub starts no workflow_run for that run: post-deploy-verify.yml, claims-e2e.yml, sov-stack-e2e.yml, hf-gspc-surface-sync.yml and gspc-spray.yml will not follow this deploy. The next push, scheduled or user-dispatched deploy starts them."
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master
          fi
          # <<< deploy-dispatch
      # Keep the alert RED so the clobber stays visible even though it self-heals — the durable
      # fix is still revoking the clobbering lane's direct-deploy token (see DEPLOY-LOCK.md).
      - name: Fail the run if drift was detected
        if: steps.assert.outcome == 'failure' || steps.contracts.outcome == 'failure' || steps.heal.outputs.followers == 'not-started'
        env:
          FOLLOWERS: ${{ steps.heal.outputs.followers }}
        run: |
          echo "DRIFT-GUARD RED: canon assert = ${{ steps.assert.outcome }}, machine-contract sweep = ${{ steps.contracts.outcome }}."
          echo "Durable fix for a clobber: revoke the clobbering lane's Cloudflare Pages token. See DEPLOY-LOCK.md."
          if [ "$FOLLOWERS" = "not-started" ]; then
            echo "::error title=Deploy followers not started::the self-heal dispatched deploy.yml with GITHUB_TOKEN, so GitHub starts none of its five followers for it. Set or renew SNAPSHOT_PR_TOKEN."
          fi
          exit 1
