name: mill-spray
# Fan the hub-queue mill across axes. Each mill job stays sequential (one
# model at a time). max-parallel 4 is four sequential doors, not a 4-wide
# burst on one provider. MEASURED only after OIDC sign + VALID + n>=30.
on:
  workflow_dispatch:
    inputs:
      grade:
        description: "probe-live models per axis (36 fits the 60-minute mill job)"
        type: string
        default: "36"
jobs:
  mill:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        axis:
          - governance
          - safety
          - provenance
          - continuity
          - conformance
          - openness
          - machinery-conformity
          - care
          - cross-reality
          - detector-interop
          - art5-safeguard
          - swarm
          - affect
          - jail
    uses: ./.github/workflows/hub-queue-mill.yml
    with:
      axis: ${{ matrix.axis }}
      grade: ${{ github.event.inputs.grade || '36' }}
    secrets: inherit
  # Reusable mill jobs do not emit a hub-queue-mill workflow_run, so land
  # would never see the cards. Kick land against this spray run_id; it
  # downloads every hub-queue-mill-* artifact (rglob unsigned-*.json).
  land:
    needs: mill
    if: always()
    runs-on: ubuntu-latest
    permissions: { actions: write, contents: read }
    steps:
      - name: dispatch hub-queue-land for this spray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hub-queue-land.yml --repo "$GITHUB_REPOSITORY" -f run_id="${{ github.run_id }}"
          echo "land dispatched for spray ${{ github.run_id }}"
