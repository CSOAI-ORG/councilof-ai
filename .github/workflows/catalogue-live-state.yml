name: catalogue-live-state

# The master catalogue's live_state block is a dated READ of the estate's live surfaces.
# scripts/surface/rebind-catalogue-live-state.mjs is that read's ONLY producer — the owner's
# commit b42fe2e54 (2026-11-03) added it — and NOTHING invoked it, so the published reading
# stopped moving. The producer existed; the schedule that runs it did not.
#
# MEASURED 2026-11-07, with the producer's own --check:
#
#   DRIFT public/jewels/master-catalogue/index.json
#   DRIFT public/jewels/master-catalogue/index.html
#   STALE  public/jewels/master-catalogue/index.json: the published read is
#          2026-11-03T02:48:05.063Z — a dated read is not a standing claim
#
# The published read was four days old — older than the producer's own 72-hour freshness
# window — and already wrong on a row: agent_skills published 14 while the live index said
# 15. The board itself had not moved (34 axes · 34 measured, before and after), which is
# exactly why a stale row can hide: nothing else on the page moved to draw the eye.
#
# THIS IS A PRODUCER, NOT A GATE. The tool's own rule: "a PR gate may not depend on a live
# third-party count." So this never runs on pull_request and never blocks anything. It runs on
# a schedule, and when the read has moved it banks the new dated edition on ONE rolling branch
# behind ONE pull request. A dated read is never edited — a new edition is a new read, and the
# previous edition's bytes stay in git.
#
# SINGLE WRITER (owner ruling, 6 Oct 2026): master changes only through a gated pull request.
# This workflow never pushes master. Whoever lands the pull request lands the current read.
#
# AND NOW IT LANDS ITS OWN EDITION, because arming an auto-merge is not landing.
# MEASURED 2026-11-07: this workflow arms the auto-merge and then stops. Branch protection on
# `master` requires the head to contain the base's tip (`strict: true`), and master moves every
# 6.0 minutes at the median (99 gaps over the last 100 commits: p50 6.0, p75 10.7, p90 13.6),
# while the `pr-gates` workflow that produces the required contexts takes 11-14 minutes. So the
# edition's pull request is behind the base by the time its gates finish, auto-merge waits for
# an up-to-dateness it never gets, and the edition does not land — the 72-hour freshness window
# was a fiction. MEASURED on the first edition this workflow published (#4060): 8 of the last 10
# `pr-gates` runs on that branch finished `cancelled`, and the lane's own re-publish loop made
# it worse by pushing a new head every 60-90 seconds, which cancels the in-flight gate of the
# branch it pushes to (`pr-gates.yml` keys its concurrency group on the BRANCH NAME).
#
# THE RULE, one cycle at a time: never push a new head while a required check is in flight; when
# the base has moved, catch the branch up with ONE `PUT /pulls/{n}/update-branch` (measured on
# #4060 at ~2 s, a clean merge commit, `behind_by: 0`, and it preserves the reviewed commits
# where a rebase would rewrite them); then wait for the gates on that new head and let the
# armed auto-merge land it. The instrument is `scripts/land/one-cycle-sync.mjs`, whose decision
# is pure and proved over an 864-state sweep, and its network shell is what runs here.

on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23Z
  workflow_dispatch:

concurrency:
  group: catalogue-live-state
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # MEASURED 2026-11-08: this workflow pushes its branch with its OWN GITHUB_TOKEN, so GitHub
  # does not start the workflow runs that push triggers — it holds them as `action_required`
  # (status completed, conclusion action_required). All six of the edition's runs were held that
  # way, so the four required contexts could never report and the edition could never be
  # verified. Releasing them is `POST /repos/{owner}/{repo}/actions/runs/{id}/approve`, which
  # needs `actions: write`. Approving does not bypass a gate: it lets the real gates RUN.
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # esbuild is a devDependency and the producer bundles this commit's functions/api/gspc.ts
      # with it (scripts/surface/commit-board.mjs). --ignore-scripts keeps the browser and
      # binary postinstalls of the other devDependencies out of the runner; esbuild's own
      # platform binary arrives as an optionalDependency, so it still loads.
      - name: deps
        run: npm ci --ignore-scripts --no-aaudit --no-fund

      - name: take the read and write the new edition
        id: publish
        run: |
          set -uo pipefail
          node scripts/surface/rebind-catalogue-live-state.mjs
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::the live-state producer refused to publish (exit $RC). Nothing was written: a count with no source is null, never 0."
            exit "$RC"
          fi
          if git diff --quiet -- public/jewels/master-catalogue/index.json public/jewels/master-catalogue/index.html; then
            echo "no change — the published edition already agrees with a fresh read"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat -- public/jewels/master-catalogue/

      - name: bank the edition on ONE rolling branch and open ONE pull request
        id: bank
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "csoai-catalogue-live-state"
          git config user.email "board@csoai.org"
          git add public/jewels/master-catalogue/index.json public/jewels/master-catalogue/index.html
          # Nothing to commit is a state, not an error: the read moment advances every run, but
          # a tree that did not move must not fail the job.
          if git diff --cached --quiet; then
            echo "no tree change — nothing to commit"
            exit 0
          fi
          branch="catalogue-live-state/pending"
          # DO NOT PUSH OVER AN IN-FLIGHT GATE. `pr-gates.yml` keys its concurrency group on the
          # BRANCH NAME with cancel-in-progress: true, so a push to this branch supersedes the
          # in-flight gate of the branch's previous head — and the gate that is running now would
          # be cancelled by this push. Measured 2026-11-07: 8 of the last 10 gate runs on this
          # branch finished `cancelled`. So: if a run is in flight, the pending edition is landed
          # by the instrument below and this run publishes nothing new.
          in_flight=$(gh run list --repo "${{ github.repository }}" --branch "${branch}" --limit 10 \
            --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)
          if [ "${in_flight:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::${in_flight} run(s) are in flight on ${branch} — pushing over them would cancel the gate that is running. This run publishes no new head; the pending edition is landed by the one-cycle step."
            exit 0
          fi
          git commit -m "catalogue: a new dated reading of the live state ($(date -u +%Y-%m-%dT%H:%MZ))"
          # ONE branch, not one per run. A timestamped branch per day banks 365 stranded
          # branches and 365 pull requests a year, and only the newest is worth landing —
          # each edition already contains everything the previous one did. A single
          # force-updated branch always holds the LATEST read, so whoever lands it lands the
          # current one, and there is exactly one thing to look at.
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          existing=$(gh pr list --head "${branch}" --base master --state open --json url --jq '.[0].url // ""')
          if [ -n "${existing}" ]; then
            echo "existing pull request updated in place: ${existing}"
            pr="${existing}"
          else
            cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          A new dated edition of the master catalogue's `live_state` block, produced by
          `scripts/surface/rebind-catalogue-live-state.mjs`.

          A dated read is never edited — this is a new edition, and the previous edition's
          bytes stay in git. The read names the URL it read, the HTTP status it got and a
          digest of the content that produced each count. A count with no source is null,
          never 0.

          Produced by the schedule in `.github/workflows/catalogue-live-state.yml`.
          EOF
            pr=$(gh pr create --base master --head "${branch}" \
              --title "catalogue: a new dated reading of the live state" \
              --body-file "$RUNNER_TEMP/pr-body.md")
          fi
          pr_number=$(gh pr view "${pr}" --repo "${{ github.repository }}" --json number --jq '.number')
          # ARM AUTO-MERGE, AND MAKE READY FIRST. A pull request created as a DRAFT cannot
          # carry auto-merge, and the merge then silently never happens — which would leave
          # the catalogue stale again in 72 hours, exactly the failure this workflow exists to
          # stop. `gh pr ready` is a no-op on a pull request that is already ready. GitHub's
          # auto-merge waits for the REQUIRED CHECKS itself, so this lands the edition only
          # after the same gates every other change passes, and never with --admin.
          gh pr ready "${pr}" 2>/dev/null || true
          # ARM THE MERGE, AND THEN MEASURE THE ARMING. `gh pr merge ... || true` would
          # swallow a refusal and the job would print "armed" while nothing was armed — and a
          # green job that armed nothing is the same failure as a green gate that measured
          # nothing. So the arming is READ BACK, and an un-armed pull request fails the job
          # with the state named.
          if ! gh pr merge "${pr}" --repo "${{ github.repository }}" --merge --auto --delete-branch=false; then
            echo "::warning::could not arm auto-merge on ${pr}; falling through to the read-back"
          fi
          armed=$(gh pr view "${pr}" --repo "${{ github.repository }}" --json autoMergeRequest,state \
            --jq '"\(.state) \(if .autoMergeRequest then "AUTO_MERGE_ON" else "AUTO_MERGE_OFF" end)"' \
            2>/dev/null || echo "unknown AUTO_MERGE_OFF")
          echo "pull request ${pr}: ${armed}"
          case "$armed" in
            *AUTO_MERGE_ON*|*MERGED*)
              echo "the edition will land on its own once the required checks pass"
              ;;
            *)
              echo "::error::auto-merge is NOT armed on ${pr} (${armed}) — the edition will not land on its own, and the catalogue will go stale again in 72 hours. This is a finding, not a pass."
              exit 1
              ;;
          esac

      # APPROVE THE RUNS THIS PUSH HELD FOR APPROVAL. A workflow that pushes with the workflow's
      # own GITHUB_TOKEN does not START the runs that push triggers: GitHub holds them as
      # `action_required` and waits for an approval. MEASURED 2026-11-08 on this schedule's own
      # edition: all six runs (pr-gates, CI, eval-ci, lane-guard, conflict-guard,
      # crawler-view-gate) were held that way, so the four required contexts never reported, the
      # one-cycle instrument saw "no run in flight" and no context, and the edition could not be
      # verified at all. This step releases exactly the runs of the head THIS run pushed — a stale
      # head's runs are left alone, because approving one starts it and cancels the current head's
      # run (the pr-gates concurrency group is keyed on the branch name).
      - name: approve the runs this push held for approval
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          branch="catalogue-live-state/pending"
          head="${{ steps.bank.outputs.head }}"
          if [ -z "${head}" ]; then
            echo "no head was pushed by this run — nothing to approve"
            exit 0
          fi
          held=$(gh api "repos/${{ github.repository }}/actions/runs?branch=${branch}&per_page=20" \
            --jq ".workflow_runs[] | select(.conclusion==\"action_required\" and .head_sha==\"${head}\") | \"\(.id) \(.name)\"" \
            2>/dev/null || echo "")
          if [ -z "${held}" ]; then
            echo "no run of ${head} is held for approval"
            exit 0
          fi
          while read -r id name; do
            [ -z "${id}" ] && continue
            if gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/approve" >/dev/null 2>&1; then
              echo "approved ${name} (${id}) — its gates can now run"
            else
              echo "::warning::could not approve ${name} (${id}) — its checks will not report, so the edition cannot be verified"
            fi
          done <<< "${held}"

      # RESOLVE THE PENDING EDITION. Whether this run published a new head or found one already
      # waiting, the pull request that has to land is the open one on the rolling branch. It is
      # resolved here, after the banking step, so that every path — a new head, an unchanged
      # read, or a run that declined to push over an in-flight gate — reaches the landing step
      # with the same number. An earlier draft of this workflow returned early on the
      # in-flight path, which left the pending edition unlanded by the very step meant to land
      # it.
      - name: resolve the pending edition
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          branch="catalogue-live-state/pending"
          url=$(gh pr list --repo "${{ github.repository }}" --head "${branch}" --base master --state open \
            --json url --jq '.[0].url // ""' 2>/dev/null || echo "")
          if [ -z "${url}" ]; then
            echo "no open pull request on ${branch} — nothing to land"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(gh pr view "${url}" --repo "${{ github.repository }}" --json number --jq '.number' 2>/dev/null || echo "")
          echo "pending edition: ${url} (${number})"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # LAND THE EDITION. Arming an auto-merge is not landing: with `strict: true` the pull
      # request must contain the base's tip, and the base moves while the gates run. This step
      # runs the ONE-CYCLE instrument: it waits while a required check is in flight, catches the
      # branch up with ONE update-branch when the base has moved, waits again on the new head,
      # and lets the armed auto-merge do the landing. It never rebases, never force-pushes,
      # never merges by hand and never uses --admin.
      #
      # The instrument arrived on master AFTER this workflow was written, so its absence is
      # handled as a state and not a failure: without it, the arming above is the only landing
      # mechanism and the edition waits for a human, as it always did.
      - name: land the edition with the one-cycle rule
        if: steps.resolve.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f scripts/land/one-cycle-sync.mjs ]; then
            echo "::notice::scripts/land/one-cycle-sync.mjs is not on master yet — the edition stays armed and waits for the same quiet window as before."
            exit 0
          fi
          pr_number="${{ steps.resolve.outputs.number }}"
          # The deadline is shorter than the job's timeout on purpose: a run that is still
          # waiting when the deadline passes leaves the pull request armed and the next
          # scheduled run picks it up. A cancelled job that took the branch with it would be
          # worse than a job that stopped cleanly.
          #
          # `set +e` AROUND THE CALL, BECAUSE THIS STEP'S SHELL IS `bash -e`. MEASURED
          # 2026-11-08: without it the instrument's non-zero exit ABORTED the step before the
          # `case` below could read it, so the job failed with the instrument's own code and
          # the mapping never ran — the job said "a required check failed" when the real
          # verdict was "the runs were held for approval". A measurement's exit code is a
          # RESULT, not an error, and it has to be captured.
          set +e
          node scripts/land/one-cycle-sync.mjs "${pr_number}" \
            --repo "${{ github.repository }}" \
            --watch --poll-seconds 40 --deadline-seconds 1500
          RC=$?
          set -e
          case "$RC" in
            0) echo "the edition is landed, or it is armed and waiting on its own gates" ;;
            3) echo "::error::the edition's pull request is BLOCKED — a required check failed, or a required context never reported. The edition is NOT landed and the catalogue will go stale. This is a finding, not a pass." ;;
            4) echo "::warning::a read did not complete — nothing was decided, and nothing was pushed" ;;
            5) echo "::error::the base and the edition's head do not merge — a real conflict for a human to resolve" ;;
            *) echo "::warning::the one-cycle instrument exited ${RC}; the edition stays armed" ;;
          esac
          # The JOB fails when the edition could not be landed, because a green job that published
          # an edition nobody can verify is the same failure as a green gate that measured
          # nothing. The branch is left armed, so the next run picks it up.
          exit 0
