# Temporary one-shot derived-artifact repair on this exact feature branch.
# Deletes itself after generator result is verified. No external secrets or deployments.
name: contact-openapi-branch-regenerate
on:
  push:
    branches: ["feat/20261117-contact-durable-intake"]
    paths: [".github/workflows/contact-openapi-branch-regenerate.yml"]

permissions:
  contents: write

jobs:
  derive:
    if: github.repository == 'CSOAI-ORG/councilof-ai' && github.ref == 'refs/heads/feat/20261117-contact-durable-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/20261117-contact-durable-intake
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned package dependencies needed by manifest generator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild derived OpenAPI without network or secrets
        run: python3 scripts/build_openapi.py
      - name: Commit only the known generated artefacts to this PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/openapi.json scripts/fixtures/x402scan/well_known_x402.json
          if git diff --cached --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "fix(contact): regenerate canonical OpenAPI for changed intake route"
          git push origin HEAD:refs/heads/feat/20261117-contact-durable-intake
