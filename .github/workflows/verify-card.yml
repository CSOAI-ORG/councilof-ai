name: Verify signed measurement card

# Thin reusable wrapper: cryptography and three-state semantics live in the
# repaired composite's runner and packages/gspc-card-verifier, not inline here.
# GitHub.com job.workflow_* identifies the CALLED workflow's source; github.*
# identifies the caller. Fail closed where the job identity is unavailable.
on:
  workflow_call:
    inputs:
      artifact:
        description: 'Local JSON card path, relative to the caller checkout or absolute; URLs are not fetched.'
        required: true
        type: string
      fail_on_mismatch:
        description: 'Fail for INVALID or UNCHECKABLE. false changes only the exit status, never the verdict.'
        required: false
        default: 'true'
        type: string
    outputs:
      content_id:
        description: 'Compatibility value: verified only for VALID; otherwise unverified.'
        value: ${{ jobs.verify.outputs.content_id }}
      verdict:
        description: 'VALID, INVALID, or UNCHECKABLE.'
        value: ${{ jobs.verify.outputs.verdict }}
      id:
        description: 'Verified id for VALID; otherwise the stated id only when safely readable.'
        value: ${{ jobs.verify.outputs.id }}
      code:
        description: 'Machine-readable verifier result code.'
        value: ${{ jobs.verify.outputs.code }}
      reason:
        description: 'Safe one-line verification explanation.'
        value: ${{ jobs.verify.outputs.reason }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      content_id: ${{ steps.check.outputs.content_id }}
      verdict: ${{ steps.check.outputs.verdict }}
      id: ${{ steps.check.outputs.id }}
      code: ${{ steps.check.outputs.code }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Validate trusted verifier source identity
        shell: bash
        env:
          CSOAI_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CSOAI_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CSOAI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ "$CSOAI_WORKFLOW_REPOSITORY" != 'CSOAI-ORG/councilof-ai' ]] ||
             [[ "$CSOAI_WORKFLOW_FILE_PATH" != '.github/workflows/verify-card.yml' ]] ||
             [[ ! "$CSOAI_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' '::error::Trusted verifier source identity is unavailable or unexpected. Use the reviewed composite action on platforms without job.workflow_* support.'
            exit 2
          fi
      - name: Check out caller data without running caller code
        uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false
      - name: Check out the called workflow's exact verifier source
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csoai-verifier-source
          persist-credentials: false
          sparse-checkout: |
            actions/verify-card
            packages/gspc-card-verifier
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local evidence under the pinned profile
        id: check
        shell: bash
        working-directory: caller
        env:
          CSOAI_ACTION_PATH: ${{ github.workspace }}/.csoai-verifier-source/actions/verify-card
          CSOAI_ARTIFACT: ${{ inputs.artifact }}
          CSOAI_FAIL_ON_MISMATCH: ${{ inputs.fail_on_mismatch }}
        run: node "$CSOAI_ACTION_PATH/run.mjs"
