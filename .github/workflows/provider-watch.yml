name: provider-watch — hash-only provider document change watcher

# Daily capture of the curated AI-provider public documents in scripts/watch/targets.json
# (terms, usage policy, model cards, pricing, safety policy, Article 50 marking statements).
# Stores hashes only — never content. Honours robots.txt; never bypasses a login, paywall or
# anti-bot challenge (recorded UNCHECKABLE). A fetch that fails is UNKNOWN, never "unchanged".
# Diff leaves are staged UNSIGNED under public/feeds/provider-diff/leaves/ and signed by the
# hourly public-root.yml writer (GHA key) or not at all. No secrets needed here. No backfill:
# the first run of a target is FIRST_CAPTURE, not a diff.
#
# NOTE (2 Sep 2026): Actions are currently limited on this account (support ticket #4720908).
# The first capture happens on the first run after reinstatement — nothing is captured
# retrospectively.

on:
  schedule:
    - cron: "20 5 * * *"   # daily 05:20 UTC (before the 06:45 reg-watch and the 07-past public-root)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + classify without writing state or leaves"
        type: boolean
        default: false
      only:
        description: "Substring filter on target id (e.g. openai/ or /art50_marking)"
        type: string
        default: ""

concurrency:
  group: provider-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write   # lands via branch + PR; a direct push to master is GH006 (required gates)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
      PROVIDER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      PROVIDER_ONLY: ${{ inputs.only || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: set retained capture path
        shell: bash
        run: |
          printf 'PROVIDER_BUNDLE=%s/provider-watch-bundle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: self-test (fixtures only, no network)
        run: |
          python3 scripts/watch/test_provider_watch.py
          python3 scripts/watch/test_provider_watch_promotion.py
      - name: select and retain the pending capture baseline
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          args=(prepare --bundle "$PROVIDER_BUNDLE")
          if [[ "$PROVIDER_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/watch/provider_watch_promotion.py "${args[@]}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["PROVIDER_BUNDLE"]) / "promotion.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"state={receipt['state']}\n")
              result = receipt.get("capture_exit")
              out.write(f"capture_exit={'' if result is None else result}\n")
          PY
      - name: capture
        id: watch
        if: steps.prepare.outputs.state == 'PREPARED'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          args=(--state-dir "$PROVIDER_BUNDLE/capture")
          if [[ "$PROVIDER_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$PROVIDER_ONLY" ]]; then
            args+=(--only "$PROVIDER_ONLY")
          fi
          set +e
          python3 scripts/watch/provider_watch.py "${args[@]}" \
            2>&1 | tee "$PROVIDER_BUNDLE/capture.log"
          result=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: qualify the completed capture without hiding its result
        id: finalize
        if: >-
          always() &&
          env.PROVIDER_DRY_RUN != 'true' &&
          steps.prepare.outputs.state == 'PREPARED' &&
          (steps.watch.outcome == 'success' || steps.watch.outcome == 'failure')
        env:
          CAPTURE_EXIT: ${{ steps.watch.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/watch/provider_watch_promotion.py finalize \
            --bundle "$PROVIDER_BUNDLE" \
            --capture-exit "${CAPTURE_EXIT:--1}"
      - name: retain capture bytes before any publication
        id: retained
        if: >-
          always() &&
          env.PROVIDER_DRY_RUN != 'true' &&
          (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: provider-watch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROVIDER_BUNDLE }}/
          if-no-files-found: error
          retention-days: 14
      - name: continue the existing review branch or recover its PR
        id: promote
        if: >-
          always() &&
          env.PROVIDER_DRY_RUN != 'true' &&
          steps.retained.outcome == 'success' &&
          (steps.finalize.outcome == 'success' ||
           steps.prepare.outputs.state == 'RESUME_PUBLICATION')
        env:
          RETAINED_ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/watch/provider_watch_promotion.py promote \
            --bundle "$PROVIDER_BUNDLE" \
            --artifact-id "$RETAINED_ARTIFACT_ID"
      - name: retain publication result
        if: >-
          always() &&
          env.PROVIDER_DRY_RUN != 'true' &&
          (steps.promote.outcome == 'success' || steps.promote.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: provider-watch-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROVIDER_BUNDLE }}/promotion.json
            ${{ env.PROVIDER_BUNDLE }}/*-error.json
          if-no-files-found: error
          retention-days: 14
      - name: preserve a failed capture result
        if: >-
          always() &&
          (steps.watch.outcome == 'failure' ||
           steps.prepare.outputs.capture_exit == '2')
        run: |
          echo "The retained capture includes failures; publication does not make the capture successful."
          exit 1
