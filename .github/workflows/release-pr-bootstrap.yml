name: release-pr-bootstrap
on:
  push:
    branches:
      - csoai/lane-universal-gspc-20261003

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: csoai/lane-universal-gspc-20261003
          fetch-depth: 0
      - name: Remove bootstrap from release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "csoai-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-pr-bootstrap.yml
          git commit -m "chore: remove release PR bootstrap"
          git push origin HEAD:csoai/lane-universal-gspc-20261003
      - name: Open guarded release PR and arm auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="csoai/lane-universal-gspc-20261003"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$head" --base master --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$head" \
              --title "gspc: converge universal fabric and close release truth drift" \
              --body "Current-master GSPC convergence release. Verified locally on 2026-10-03: full build PASS; Functions typecheck PASS; TypeScript ratchet 144/58 PASS; capability registry 258; OpenAPI 160 paths / 31 x402 doors; Claim Maintenance public-readback tests 3/3; evidence-integrity, Council truth, redirect, sitemap, wallet-secret and release guards PASS. Deploy tree contains the six Claim Maintenance artifacts with exact hashes. Root union: 69 roots / 4,253 leaves. This workflow removes itself before creating the PR; branch protection and required checks remain authoritative.")"
            pr="${url##*/}"
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --auto || echo "auto-merge unavailable; PR remains guarded for required checks"
