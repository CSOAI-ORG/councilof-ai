name: MEOK memory invalidation contracts
on:
  pull_request:
    paths:
      - harness/meok-memory-venturi/**
      - .github/workflows/meok-memory-invalidation-contracts.yml
  push:
    branches: [master]
    paths:
      - harness/meok-memory-venturi/**
      - .github/workflows/meok-memory-invalidation-contracts.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meok-memory-invalidation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  source-and-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fresh existing source, consumed candidate and baseline rejection
        run: python -B harness/meok-memory-venturi/qualify_adoption.py
