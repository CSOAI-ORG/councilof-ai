name: public-root-watcher

# D1.11 — three-host fetch after a successful public-root run.
# Reader only. Never a second writer. Logs OK or DRIFT.
#
# KNOWN GAP, 2026-09-03: the HF host below has NO PUBLISHER. Grep the repo for
# `gspc-boards` — the only hit is this file, reading it. The mirror was seeded once
# and never updated, so it sat 3 days stale while this workflow was itself dead on an
# IndentationError and reported nothing. Both were fixed and the mirror synced by hand
# with a local token; it will drift again on the next root, because the GHA token
# cannot write HF main (#1102, see memory hub-queue-flip-cannot-write-hf-main).
# Until a publisher exists, a DRIFT here most likely means "the mirror is stale",
# not "the roots disagree" — check as_of on each copy before concluding anything.

on:
  workflow_run:
    workflows: ["public-root"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: public-root-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: three-host merkle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_INFERENCE_TOKEN: ${{ secrets.HF_INFERENCE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request, sys
          UA = {"User-Agent": "csoai-public-root-watcher/0"}
          # OWNER RULING 2 Sep 2026: csoai.org is the old domain and 308s to councilof.ai.
          # Follow redirects; the twin IS the canonical root, never DRIFT.
          import urllib.request as _ur, urllib.error, urllib.parse
          _opener = _ur.build_opener(_ur.HTTPRedirectHandler())
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  # follow 301/302/307/308 explicitly (old runners' urllib does not follow 308)
                  for _hop in range(5):
                      try:
                          with _opener.open(req, timeout=20) as r:
                              return r.status, r.read()
                      except urllib.error.HTTPError as e:
                          loc = e.headers.get("Location") if e.code in (301, 302, 307, 308) else None
                          if not loc: raise
                          req = urllib.request.Request(urllib.parse.urljoin(req.full_url, loc), headers=UA)
                  return 0, b""
              except Exception as e:
                  return getattr(e, "code", 0), str(e).encode()
          hosts = {
              "councilof.ai": "https://councilof.ai/root.json",
              "csoai.org": "https://csoai.org/root.json",
              "hf": "https://huggingface.co/datasets/csoai/gspc-boards/resolve/main/public-root/root.json",
          }
          got = {}
          for k, u in hosts.items():
              st, b = get(u)
              h = hashlib.sha256(b).hexdigest() if st == 200 else None
              got[k] = {"http": st, "sha256": h, "n": len(b)}
              print(k, st, h)
          shas = {v["sha256"] for v in got.values() if v["sha256"]}
          if len(shas) == 1 and all(v["http"] == 200 for v in got.values()):
              print("OK three-host match", next(iter(shas)))
              sys.exit(0)
          print("DRIFT", json.dumps(got))
          sys.exit(1)
          PY
