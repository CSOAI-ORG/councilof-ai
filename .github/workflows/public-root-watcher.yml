name: public-root-watcher

# D1.11 — three-host fetch after a successful public-root run.
# Reader only. Never a second writer. Logs OK or DRIFT.

on:
  workflow_run:
    workflows: ["public-root"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: public-root-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: verify three-host semantic root and signature
        run: python3 scripts/watch_public_root.py
