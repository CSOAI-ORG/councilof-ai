# Post-deploy verification — G1.6 POST-MERGE PROVER.
#
# After every deploy, hit both hosts (councilof.ai + csoai.org), assert 200s
# on critical endpoints, check that /.well-known/deploy.json names the commit
# that was deployed, and write the result to the run summary.
#
# This workflow runs AFTER the build-deploy job completes successfully.
# It verifies the LIVE deployment, not the build artifacts.
#
# O-pdv (7 Oct 2026): it had no run on record since 15 Sep. The workflow_run
# trigger below never fired (no follower of deploy.yml's name ever has; see the
# post-deploy-verify job in deploy.yml), so deploy.yml now dispatches this file
# with the deployed commit. The workflow_run trigger is kept: if it ever fires,
# the concurrency group collapses the duplicate. The step that commented on "the
# most recently updated open PR" is gone: a push deploy has no PR, so it would
# have posted to an unrelated one on every deploy.

name: Post-deploy verification

on:
  workflow_run:
    workflows: ["Build + deploy site (gated production branch)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Commit the deploy built (deploy.yml passes it); empty = current master"
        type: string
        default: ""
      deploy_run_id:
        description: "deploy.yml run id, for the summary"
        type: string
        default: ""

concurrency:
  group: post-deploy-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Probe live endpoints on both hosts
        id: probe
        env:
          HOSTS: "councilof.ai,csoai.org"
          ENDPOINTS: "/ /api/gspc /api/cards /root.json /feed /api/feed.xml /api/health /api/state /.well-known/agents/index.json /.well-known/mcp/server-card.json"
          # Public data a stranger's script reads. Each is probed twice more below: with Python's DEFAULT
          # urllib User-Agent (the CDN's Browser Integrity Check refused it with 403 1010 until 6 Oct 2026),
          # and with HEAD (Pages answered 404 to HEAD on GET-only functions until the same day).
          CLIENT_ENDPOINTS: "/api/gspc /api/state /api/corrections /signed/card_index.json /.well-known/did.json"
        run: |
          set -uo pipefail
          PASS=0
          FAIL=0
          REPORT=""
          for HOST in $(echo "$HOSTS" | tr ',' ' '); do
            for EP in $ENDPOINTS; do
              URL="https://$HOST$EP"
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$URL" 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ] || [ "$CODE" = "301" ]; then
                PASS=$((PASS+1))
                REPORT="$REPORT\n✅ $HOST$EP → $CODE"
              else
                FAIL=$((FAIL+1))
                REPORT="$REPORT\n❌ $HOST$EP → $CODE"
              fi
            done
          done
          # Standard HTTP clients. urllib keeps its DEFAULT User-Agent on purpose: adding one here, as the
          # selftest workflows do, would hide exactly the refusal this probe exists to catch.
          for HOST in $(echo "$HOSTS" | tr ',' ' '); do
            for EP in $CLIENT_ENDPOINTS; do
              URL="https://$HOST$EP"
              if python3 -c "import urllib.request,sys;urllib.request.urlopen(sys.argv[1],timeout=20)" "$URL" 2>/dev/null; then
                PASS=$((PASS+1))
                REPORT="$REPORT\n✅ urllib $HOST$EP"
              else
                FAIL=$((FAIL+1))
                REPORT="$REPORT\n❌ urllib (default User-Agent) $HOST$EP"
              fi
              HCODE=$(curl -s -o /dev/null -I -L -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null || echo "000")
              if [ "$HCODE" = "200" ]; then
                PASS=$((PASS+1))
                REPORT="$REPORT\n✅ HEAD $HOST$EP → $HCODE"
              else
                FAIL=$((FAIL+1))
                REPORT="$REPORT\n❌ HEAD $HOST$EP → $HCODE"
              fi
            done
          done
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$REPORT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "$FAIL" -gt 0 ]; then
            echo "::warning::$FAIL endpoint(s) failed post-deploy verification"
          fi

      - name: Content probes
        id: content
        run: |
          set -uo pipefail
          FAIL=0
          REPORT=""

          # root.json must have merkle_root and card_count
          ROOT=$(curl -s -L --max-time 20 "https://councilof.ai/root.json" 2>/dev/null)
          if echo "$ROOT" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('merkle_root') and d.get('card_count')" 2>/dev/null; then
            REPORT="$REPORT\n✅ root.json has merkle_root + card_count"
          else
            FAIL=$((FAIL+1))
            REPORT="$REPORT\n❌ root.json missing merkle_root or card_count"
          fi

          # /feed must return valid JSON with cards array
          FEED=$(curl -s -L --max-time 20 "https://councilof.ai/feed" 2>/dev/null)
          if echo "$FEED" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('count',0) > 0" 2>/dev/null; then
            CARDS=$(echo "$FEED" | python3 -c "import sys,json;print(json.load(sys.stdin).get('count',0))")
            REPORT="$REPORT\n✅ /feed serves $CARDS cards"
          else
            FAIL=$((FAIL+1))
            REPORT="$REPORT\n❌ /feed not serving cards"
          fi

          # agents index must serve with correct content-type
          IDX_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "https://councilof.ai/.well-known/agents/index.json" 2>/dev/null)
          if [ "$IDX_CODE" = "200" ]; then
            REPORT="$REPORT\n✅ /.well-known/agents/index.json serves"
          else
            FAIL=$((FAIL+1))
            REPORT="$REPORT\n❌ /.well-known/agents/index.json → $IDX_CODE"
          fi

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$REPORT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # O-P1-14: the marker deploy.yml writes just before upload must name the commit deployed.
      # ?cb= asks the edge for origin bytes, so a cached copy cannot pass for the new deploy.
      - name: Deploy marker names the deployed commit
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WANT_DISPATCH: ${{ inputs.deploy_sha }}
          WANT_RUN: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          want="${WANT_DISPATCH:-${WANT_RUN:-}}"
          if [ -z "$want" ]; then want=$(gh api "repos/$REPO/commits/master" -q .sha); fi
          got=""
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 20 "https://councilof.ai/.well-known/deploy.json?cb=$(date +%s)$i" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
            [ "$got" = "$want" ] && break
            sleep 20
          done
          echo "want=$want" >> "$GITHUB_OUTPUT"
          echo "got=${got:-unreadable}" >> "$GITHUB_OUTPUT"
          if [ "$got" = "$want" ]; then
            echo "deploy marker: MATCH $got"
          elif [ -n "$got" ] && [ "$(gh api "repos/$REPO/compare/$want...$got" -q .status 2>/dev/null)" = "ahead" ]; then
            # deploys queue (deploy.yml cancel-in-progress: false); a later run already shipped a newer master
            echo "deploy marker: SUPERSEDED — production serves $got, a later commit than $want"
          else
            echo "::error::deploy marker names ${got:-nothing readable}, expected $want: production is not serving the build this deploy made"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          PASS: ${{ steps.probe.outputs.pass }}
          FAIL: ${{ steps.probe.outputs.fail }}
          CONTENT_FAIL: ${{ steps.content.outputs.fail }}
          PROBE_REPORT: ${{ steps.probe.outputs.report }}
          CONTENT_REPORT: ${{ steps.content.outputs.report }}
          MARKER_WANT: ${{ steps.marker.outputs.want }}
          MARKER_GOT: ${{ steps.marker.outputs.got }}
          DEPLOY_RUN: ${{ inputs.deploy_run_id || github.event.workflow_run.id }}
        run: |
          {
            echo "## Post-deploy verification"
            echo ""
            echo "Deploy run: ${DEPLOY_RUN:-unknown}"
            echo "Deploy marker: want \`${MARKER_WANT:-?}\`, served \`${MARKER_GOT:-?}\`"
            echo "Endpoints: ${PASS:-?} pass, ${FAIL:-?} fail. Content probes: ${CONTENT_FAIL:-?} fail."
            echo ""
            echo "### Endpoint probes"
            printf '%s\n' "$PROBE_REPORT"
            echo ""
            echo "### Content probes"
            printf '%s\n' "$CONTENT_REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
