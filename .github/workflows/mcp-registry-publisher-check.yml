name: MCP registry publisher checks

"on":
  pull_request:
    paths:
      - scripts/mcp-registry-publish.cjs
      - scripts/mcp-registry-publish.node-test.cjs
      - .github/workflows/mcp-registry-publish.yml
      - .github/workflows/mcp-registry-publisher-check.yml
  push:
    branches: [master]
    paths:
      - scripts/mcp-registry-publish.cjs
      - scripts/mcp-registry-publish.node-test.cjs
      - .github/workflows/mcp-registry-publish.yml
      - .github/workflows/mcp-registry-publisher-check.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node --test scripts/mcp-registry-publish.node-test.cjs
