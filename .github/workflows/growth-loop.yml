name: growth-loop

on:
  schedule:
    - cron: "8 6 * * 1" # weekly, Monday 06:08 UTC — staggered from top-of-hour collectors
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run the growth loop producer
        run: |
          python3 scripts/growth/revenue_loop.py
          ls docs/growth/*/loop.json
      - name: Commit the emitted run
        run: |
          DATE=$(date -u +%F)
          git config user.name "CSOAI-ORG"
          git config user.email "bot@csoai.org"
          git add docs/growth/
          if git diff --cached --quiet; then
            echo "no growth-loop changes this week"; exit 0
          fi
          git commit -q -m "growth: revenue loop $DATE (producer output)"
          git push origin HEAD:growth-loop/weekly-$DATE
      - name: Open the loop PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          BR="growth-loop/weekly-$DATE"
          URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --base master --state open --json url --jq '.[0].url // ""')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BR" \
              --base master --title "growth: revenue loop $DATE" \
              --body "Weekly revenue-loop run. Numbers: one_number as measured, funnel per door (as recorded), gate state verbatim, ≤5 next moves each with a PROOF, retro line. Read docs/growth/$DATE/loop.md; the governor reviews; nothing here is a forecast.")
          fi
          gh workflow run pr-gates.yml --repo "$GITHUB_REPOSITORY" --ref "$BR"
          gh pr merge "$URL" --repo "$GITHUB_REPOSITORY" --squash --auto
          echo "growth-loop PR: $URL"
