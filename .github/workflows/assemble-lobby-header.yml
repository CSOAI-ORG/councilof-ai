name: assemble-lobby-header
on:
  push:
    branches: [cursor/os-lobby-header-play-ff6e]
    paths:
      - ops/logs/lobby-header-assemble/READY
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/os-lobby-header-play-ff6e
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble Header.tsx
        run: |
          set -euo pipefail
          DIR=ops/logs/lobby-header-assemble
          for i in 0 1 2 3; do test -f "$DIR/part$i.txt"; done
          cat "$DIR"/part0.txt "$DIR"/part1.txt "$DIR"/part2.txt "$DIR"/part3.txt > client/src/components/Header.tsx
          python3 - <<'PY'
          import hashlib
          c=open("client/src/components/Header.tsx","rb").read()
          blob=hashlib.sha1(b"blob %d\0"%len(c)+c).hexdigest()
          print("assembled", len(c), blob)
          assert blob=="0eca4989f599055f65b18121a59f7d6cb979174d", blob
          PY
          rm -rf "$DIR"
          rm -f .github/workflows/assemble-lobby-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(os): restore Header mega-menu residual"
          git push origin HEAD:cursor/os-lobby-header-play-ff6e
