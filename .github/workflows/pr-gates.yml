# The four gates that block a deploy, run on the PR instead of after the merge.
#
# WHY. build:client, brand-gate and signed-json-guard lived only in deploy.yml,
# which fires on push to master. Every PR check was green before them, so a PR
# could pass 5/5 and still break the deploy once merged — and a brand-gate
# failure blocks the deploy for the WHOLE estate, not just the lane that caused
# it. The gates were effectively enforced by whoever remembered to run them on a
# laptop, which is not enforcement, and made a local machine a dependency.
#
# This does not replace deploy.yml. That still runs the full gated build on
# master, including prerender, shell smoke and the price/witness gates. This is
# the subset that can be decided from a PR alone, moved to where it is cheap to
# fix instead of expensive.

name: pr-gates

# NO `paths:` FILTER, DELIBERATELY. This workflow runs on every PR and decides its own scope in
# its first step, because the pair it replaced could not be made safe.
#
# pr-gates-skip.yml published the same check name, `gates`, as an unconditional `echo`, and
# `paths-ignore` skips a workflow only when EVERY changed file matches it. A PR touching a gated
# path AND a docs path therefore ran BOTH. Measured on #1635 (scripts/ + public/ + docs/):
#
#   pr-gates-skip  run 34022928201  08:49:27 -> 08:49:28   2s, echo, PASS
#   pr-gates       run 34022928307  08:49:24 -> 08:51:09   the real suite
#
# For 1m41s the required context was green on the strength of an `echo`. The skip file's own
# header asked for the two lists to be kept byte-identical; they WERE identical, and identical
# lists do not make two workflows exclusive.
#
# Making the cheap one FAIL out of scope was tried (#1648) and is worse: both results then sit in
# the rollup and GitHub blocks on the failure. Two check runs sharing a required context name have
# no safe order. One workflow is the fix, and the two lists can no longer drift because there is
# only one.
#
# `types` adds labeled / unlabeled / edited for the hold-guard job below: a hold label or title
# marker must be able to turn the check red (and clear it) without a new push. Those events re-run
# EVERY job here, gates included, on purpose. Skipping gates on a label event would publish a fresh
# `gates` check run as "skipped", which branch protection counts as success and which supersedes
# the push run - adding any label would then turn a red gates green. A re-run costs minutes; a
# skip would be a bypass.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to scope against (bot-checks-sweeper). Empty = run everything."
        type: string
        required: false
        default: "" 

# Supersede a lane's own older run; never cancel another lane's.
concurrency:
  group: pr-gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  card-verifier-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packages/gspc-card-verifier
            scripts
            public/signed
            public/verifier
            public/interop/mill-cards-signed
            mcp/gspc-server
            client/src/lib
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Existing offline verifier fixtures
        working-directory: packages/gspc-card-verifier
        run: npm test
      - name: All RunPod cards and buyer replay — no network or signing
        run: node --test scripts/test_runpod_verifier_parity.mjs scripts/test_gspc_replay_kit.mjs

  # 7 Oct 2026: a wallet private key sat in tui4-x402-test/sign-payment.cjs from 27ac2d551 to #2879, and
  # the wallet was swept. This gate ran only in deploy.yml, AFTER merge, so a key could land on master
  # and the first red was the deploy. It runs on EVERY PR, outside the scope step below, because a key can
  # arrive in any path. It reads blobs from the index, so the default full checkout is required.
  wallet-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: No wallet private key in any tracked path — selftest, then the index
        run: |
          node scripts/wallet-credential-gate.mjs --selftest
          node scripts/wallet-credential-gate.mjs

  # 6 Oct 2026: a third party's contact details were removed from this tree after we had told them
  # nothing naming them would be public. This runs on EVERY PR, outside the scope step below, because
  # they could come back in any file, docs included. The identifiers live only in the repository secret
  # THIRD_PARTY_GUARD_IDS, never in the tree; without it the job fails as UNMEASURED. Read the test's
  # docstring before changing it, and never put an identifier in a commit message or PR text.
  third-party-identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No guarded third-party identifier in any tracked path or file
        env:
          THIRD_PARTY_GUARD_IDS: ${{ secrets.THIRD_PARTY_GUARD_IDS }}
        run: python3 scripts/privacy/test_third_party_identifiers.py -v

  # 7 Oct 2026: PR #2871 edited public/interop/iso-20022.json, whose sibling .ots commits to the
  # previous bytes. Every PR check was green, because the only proof-vs-target comparison
  # (scripts/root-witness-release-gate.py) ran in deploy.yml after the merge, and every master deploy
  # from f4487608d on failed closed there. This job decides the same question from the PR alone: a PR
  # may not change, or delete, the bytes of a file an OpenTimestamps proof commits to unless it also
  # replaces the proof with one for the new bytes. It runs on EVERY PR, outside the scope step below,
  # because stamped files also live outside the gated paths (evidence/, _quarantine/). The same check
  # runs inside `gates` so the required context carries it for public/ and scripts/.
  stamped-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Depth 2: on pull_request HEAD is the merge commit, so HEAD^1 is the base the PR merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stamped bytes - selftest, then this PR against its base
        run: |
          python3 -m pip install -q opentimestamps-client
          python3 scripts/stamped-bytes-gate.py --selftest
          python3 scripts/stamped-bytes-gate.py --base HEAD^1 --head HEAD

  # A PR marked "do not merge" must not show green. Lanes self-merge with the shared token and a
  # hold lived only in prose, so this makes the marker a failing check. Reads the event payload
  # only (labels + title from GITHUB_EVENT_PATH): no token, no API, no network. Fails on a label
  # hold / do-not-merge / DO NOT MERGE, or a title containing [HOLD], HOLD: or DO NOT MERGE
  # (case-insensitive; "threshold:" and "household" do not match). Kept apart from `gates` so it
  # reports in seconds and never waits on the build.
  hold-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/hold-guard.mjs
          sparse-checkout-cone-mode: false
      - name: hold-guard selftest
        run: node scripts/hold-guard.mjs --selftest
      - name: Is this PR on hold?
        run: node scripts/hold-guard.mjs

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No checkout: the file list comes from the API, so an out-of-scope PR costs a few seconds
      # and pulls no history. This regex IS the old `paths:` filter - keep them in step.
      - name: Scope - does this PR touch a gated path?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "gated=true" >> "$GITHUB_OUTPUT"   # workflow_dispatch: no PR to scope, run everything
            exit 0
          fi
          changed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          gated=$(printf '%s\n' "$changed" | grep -E '^(client/|e2e/|public/|functions/|scripts/|harness/x402-census/|docs/operations/PRODUCERS\.json$|package\.json$|package-lock\.json$|vitest\.config\.ts$|wrangler\.jsonc$|\.github/workflows/pr-gates\.yml$)' || true)
          if [ -n "$gated" ]; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
            echo "gated paths in this PR:"; printf '  %s\n' $gated
          else
            echo "gated=false" >> "$GITHUB_OUTPUT"
            echo "no gated path changed - the suite below is skipped and gates passes by scope."
            printf '%s\n' "$changed" | sed 's/^/  /'
          fi

      - uses: actions/checkout@v4
        if: steps.scope.outputs.gated == 'true'
        with:
          fetch-depth: 0   # Canonical SBOM generation history; HEAD^1 remains this PR merge base.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.gated == 'true'
        with: { node-version: 20 }

      - name: Outward claims — offline manifest contract selftest
        if: steps.scope.outputs.gated == 'true'
        run: node scripts/outward-claims-guard.mjs --selftest

      # Runs before `npm ci` so a stamped-byte edit fails in seconds. See the stamped-bytes job above
      # for why (#2871 / deploy run 37590160574). Verified to fail: the selftest goes red when any one
      # of its four guards is removed, and replaying f4487608d against its parent exits 1 naming
      # public/interop/iso-20022.json.
      - name: Stamped bytes - no OTS-stamped file changes without a valid new proof
        if: steps.scope.outputs.gated == 'true'
        run: |
          python3 -m pip install -q opentimestamps-client
          python3 scripts/stamped-bytes-gate.py --selftest
          python3 scripts/stamped-bytes-gate.py --base HEAD^1 --head HEAD

      - name: Install deps
        if: steps.scope.outputs.gated == 'true'
