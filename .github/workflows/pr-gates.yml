              optional={"public/.well-known/"+p for p in ["openai-tools.json","openai-functions.json","openai-responses.json","openai-assistants.json","openai-structured-outputs.json"]}
              reads={x["path"] for x in programs}|optional|{doctrine,"package.json","package-lock.json",
