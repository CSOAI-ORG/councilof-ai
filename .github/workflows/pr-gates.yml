# The four gates that block a deploy, run on the PR instead of after the merge.
#
# WHY. build:client, brand-gate and signed-json-guard lived only in deploy.yml,
# which fires on push to master. Every PR check was green before them, so a PR
# could pass 5/5 and still break the deploy once merged — and a brand-gate
# failure blocks the deploy for the WHOLE estate, not just the lane that caused
# it. The gates were effectively enforced by whoever remembered to run them on a
# laptop, which is not enforcement, and made a local machine a dependency.
#
# This does not replace deploy.yml. That still runs the full gated build on
# master, including prerender, shell smoke and the price/witness gates. This is
# the subset that can be decided from a PR alone, moved to where it is cheap to
# fix instead of expensive.

name: pr-gates

# NO `paths:` FILTER, DELIBERATELY. This workflow runs on every PR and decides its own scope in
# its first step, because the pair it replaced could not be made safe.
#
# pr-gates-skip.yml published the same check name, `gates`, as an unconditional `echo`, and
# `paths-ignore` skips a workflow only when EVERY changed file matches it. A PR touching a gated
# path AND a docs path therefore ran BOTH. Measured on #1635 (scripts/ + public/ + docs/):
#
#   pr-gates-skip  run 34022928201  08:49:27 -> 08:49:28   2s, echo, PASS
#   pr-gates       run 34022928307  08:49:24 -> 08:51:09   the real suite
#
# For 1m41s the required context was green on the strength of an `echo`. The skip file's own
# header asked for the two lists to be kept byte-identical; they WERE identical, and identical
# lists do not make two workflows exclusive.
#
# Making the cheap one FAIL out of scope was tried (#1648) and is worse: both results then sit in
# the rollup and GitHub blocks on the failure. Two check runs sharing a required context name have
# no safe order. One workflow is the fix, and the two lists can no longer drift because there is
# only one.
#
# `types` adds labeled / unlabeled / edited for the hold-guard job below: a hold label or title
# marker must be able to turn the check red (and clear it) without a new push. Those events re-run
# EVERY job here, gates included, on purpose. Skipping gates on a label event would publish a fresh
# `gates` check run as "skipped", which branch protection counts as success and which supersedes
# the push run - adding any label would then turn a red gates green. A re-run costs minutes; a
# skip would be a bypass.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to scope against (bot-checks-sweeper). Empty = run everything."
        type: string
        required: false
        default: "" 

# Supersede a lane's own older run; never cancel another lane's.
concurrency:
  group: pr-gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  card-verifier-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packages/gspc-card-verifier
            scripts
            public/signed
            public/verifier
            public/interop/mill-cards-signed
            mcp/gspc-server
            client/src/lib
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Existing offline verifier fixtures
        working-directory: packages/gspc-card-verifier
        run: npm test
      - name: All RunPod cards and buyer replay — no network or signing
        run: node --test scripts/test_runpod_verifier_parity.mjs scripts/test_gspc_replay_kit.mjs

  # 7 Oct 2026: a wallet private key sat in tui4-x402-test/sign-payment.cjs from 27ac2d551 to #2879, and
  # the wallet was swept. This gate ran only in deploy.yml, AFTER merge, so a key could land on master
  # and the first red was the deploy. It runs on EVERY PR, outside the scope step below, because a key can
  # arrive in any path. It reads blobs from the index, so the default full checkout is required.
  wallet-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: No wallet private key in any tracked path — selftest, then the index
        run: |
          node scripts/wallet-credential-gate.mjs --selftest
          node scripts/wallet-credential-gate.mjs

  # 6 Oct 2026: a third party's contact details were removed from this tree after we had told them
  # nothing naming them would be public. This runs on EVERY PR, outside the scope step below, because
  # they could come back in any file, docs included. The identifiers live only in the repository secret
  # THIRD_PARTY_GUARD_IDS, never in the tree; without it the job fails as UNMEASURED. Read the test's
  # docstring before changing it, and never put an identifier in a commit message or PR text.
  third-party-identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No guarded third-party identifier in any tracked path or file
        env:
          THIRD_PARTY_GUARD_IDS: ${{ secrets.THIRD_PARTY_GUARD_IDS }}
        run: python3 scripts/privacy/test_third_party_identifiers.py -v

  # 7 Oct 2026: PR #2871 edited public/interop/iso-20022.json, whose sibling .ots commits to the
  # previous bytes. Every PR check was green, because the only proof-vs-target comparison
  # (scripts/root-witness-release-gate.py) ran in deploy.yml after the merge, and every master deploy
  # from f4487608d on failed closed there. This job decides the same question from the PR alone: a PR
  # may not change, or delete, the bytes of a file an OpenTimestamps proof commits to unless it also
  # replaces the proof with one for the new bytes. It runs on EVERY PR, outside the scope step below,
  # because stamped files also live outside the gated paths (evidence/, _quarantine/). The same check
  # runs inside `gates` so the required context carries it for public/ and scripts/.
  stamped-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Depth 2: on pull_request HEAD is the merge commit, so HEAD^1 is the base the PR merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stamped bytes - selftest, then this PR against its base
        run: |
          python3 -m pip install -q opentimestamps-client
          python3 scripts/stamped-bytes-gate.py --selftest
          python3 scripts/stamped-bytes-gate.py --base HEAD^1 --head HEAD

  # A PR marked "do not merge" must not show green. Lanes self-merge with the shared token and a
  # hold lived only in prose, so this makes the marker a failing check. Reads the event payload
  # only (labels + title from GITHUB_EVENT_PATH): no token, no API, no network. Fails on a label
  # hold / do-not-merge / DO NOT MERGE, or a title containing [HOLD], HOLD: or DO NOT MERGE
  # (case-insensitive; "threshold:" and "household" do not match). Kept apart from `gates` so it
  # reports in seconds and never waits on the build.
  hold-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/hold-guard.mjs
          sparse-checkout-cone-mode: false
      - name: hold-guard selftest
        run: node scripts/hold-guard.mjs --selftest
      - name: Is this PR on hold?
        run: node scripts/hold-guard.mjs

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No checkout: the file list comes from the API, so an out-of-scope PR costs a few seconds
      # and pulls no history. This regex IS the old `paths:` filter - keep them in step.
      - name: Scope - does this PR touch a gated path?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "gated=true" >> "$GITHUB_OUTPUT"   # workflow_dispatch: no PR to scope, run everything
            exit 0
          fi
          changed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          gated=$(printf '%s\n' "$changed" | grep -E '^(client/|public/|functions/|scripts/|harness/x402-census/|docs/operations/PRODUCERS\.json$|package\.json$|package-lock\.json$|vitest\.config\.ts$|wrangler\.jsonc$|\.github/workflows/pr-gates\.yml$)' || true)
          if [ -n "$gated" ]; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
            echo "gated paths in this PR:"; printf '  %s\n' $gated
          else
            echo "gated=false" >> "$GITHUB_OUTPUT"
            echo "no gated path changed - the suite below is skipped and gates passes by scope."
            printf '%s\n' "$changed" | sed 's/^/  /'
          fi

      - uses: actions/checkout@v4
        if: steps.scope.outputs.gated == 'true'
        with:
          fetch-depth: 2   # HEAD^1 = the base this PR merges into, for the stamped-bytes step
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.gated == 'true'
        with: { node-version: 20 }

      # Runs before `npm ci` so a stamped-byte edit fails in seconds. See the stamped-bytes job above
      # for why (#2871 / deploy run 37590160574). Verified to fail: the selftest goes red when any one
      # of its four guards is removed, and replaying f4487608d against its parent exits 1 naming
      # public/interop/iso-20022.json.
      - name: Stamped bytes - no OTS-stamped file changes without a valid new proof
        if: steps.scope.outputs.gated == 'true'
        run: |
          python3 -m pip install -q opentimestamps-client
          python3 scripts/stamped-bytes-gate.py --selftest
          python3 scripts/stamped-bytes-gate.py --base HEAD^1 --head HEAD

      - name: Install deps
        if: steps.scope.outputs.gated == 'true'
        # The Python half matches deploy.yml's install. scripts/ots-manifest-fresh.test.ts (step "Unit
        # tests") runs scripts/pod-loops/root_ots_manifest_gate.py, which imports opentimestamps; without
        # it the gate died on ImportError in 0.25 s and the unit step went red on every PR.
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install -q cryptography opentimestamps-client

      # This used to run only after merge in deploy.yml. PR #1847 passed every hosted
      # PR check and then the master deployment stopped because TypeScript errors had
      # risen above the committed ceiling. Keep the same non-mutating ratchet on both
      # sides of the merge boundary, and print diagnostics when it fails so the gate is
      # actionable instead of reporting only a count.
      - name: TypeScript debt ratchet — selftest, then non-mutating check
        if: steps.scope.outputs.gated == 'true'
        run: |
          npm run ts-ratchet:selftest
          npm run ts-ratchet

      # `scripts` joined this line on 2026-09-06. It was absent, and EIGHT test files under
      # scripts/ had therefore never run in CI - 1007 assertions, including the vocabulary gate
      # over docs/PROVABLE-ARCHIVE-METHOD.md and the outreach drafts, the EAS attestation
      # fallback, the payer-key shadow test and the card evidence-trust test. They all pass on a
      # full checkout; they were simply never invoked. A test nobody runs is a comment.
      - name: Unit tests — client, functions and scripts
        if: steps.scope.outputs.gated == 'true'
        run: npx vitest run client/src functions scripts

      # node:test files that vitest cannot collect (vitest.config.ts NODE_TEST_FILES). They used to be
      # reported by vitest as failed suites and so never actually ran. The list is read from the config
      # so the exclusion there and this step cannot name different files.
      - name: Unit tests — node:test files vitest cannot collect
        if: steps.scope.outputs.gated == 'true'
        run: |
          files=$(sed -n '/^export const NODE_TEST_FILES = \[/,/^\];/p' vitest.config.ts | grep -o "'[^']*'" | tr -d "'")
          test -n "$files" || { echo "NODE_TEST_FILES is empty or unreadable"; exit 1; }
          node --test $files

      # Same required gates job: the delivery runner uses Node's TS transformer and VM modules.
      - name: Paid delivery regression runtime
        if: steps.scope.outputs.gated == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '22.23.3' }

      - name: Paid delivery and API worker offline regressions
        if: steps.scope.outputs.gated == 'true'
        env:
          CODEX_DELIVERY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "PR source revision: $CODEX_DELIVERY_PR_HEAD"
          echo "Checked-out test revision: $(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin 10046fd8b60d75be66bd1f9dbf54155cca26dec3
          test "$(git rev-parse 10046fd8b60d75be66bd1f9dbf54155cca26dec3^{commit})" = 10046fd8b60d75be66bd1f9dbf54155cca26dec3
          node --version
          python3 scripts/test_anthropic_gspc_worker.py
          node --experimental-vm-modules --unhandled-rejections=strict scripts/test_paid_delivery_records.mjs

      - name: Restore existing Node 20 build runtime
        if: always() && steps.scope.outputs.gated == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 20 }

      # TEMPORARY PR3034 output capture V2: remove this entire marked block after qualified artifact adoption.
      # BEGIN TEMPORARY PR3034 GENERATED OUTPUT CAPTURE V2
      - name: PR3034 canonical public generated output packet V2
        id: pr3034_generated_capture
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 3034 && steps.scope.outputs.gated == 'true' }}
        env:
          PR3034_CAPTURE_DIR: ${{ runner.temp }}/pr3034-generated-output-packet
          PR3034_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, shutil, stat, subprocess, sys
          
          root=pathlib.Path.cwd().resolve()
          out=pathlib.Path(os.environ["PR3034_CAPTURE_DIR"]).resolve()
          if out==root or root in out.parents: raise RuntimeError("CAPTURE_DIRECTORY_MUST_BE_OUTSIDE_CHECKOUT")
          out.mkdir(parents=True,exist_ok=False)
          state={"schema":"csoai.pr3034-hosted-generated-output/0.2","state":"RUNNING","pr":3034,
                 "input_bodies_retained":0,"raw_logs_retained":0,"not_general_ESM_tracing":True,
                 "created_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"commands":[]}
          class Closed(Exception): pass
          def stop(code): raise Closed(code)
          def save(name,value):
              (out/name).write_text(json.dumps(value,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          def git(*args): return subprocess.check_output(["git","-c","protocol.allow=never",*args],cwd=root,stderr=subprocess.DEVNULL)
          def pin(data,mode):
              return {"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),
                      "git_blob":hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest(),"mode":mode}
          def public_path(rel):
              parts=pathlib.PurePosixPath(rel).parts
              if not parts or pathlib.PurePosixPath(rel).is_absolute() or ".." in parts or "\x00" in rel: stop("NONPUBLIC_PATH")
              for part in parts:
                  p=part.lower()
                  if p==".git" or p.startswith(".env") or re.search(r"credential|secret|password|private",p) or p in {".ssh",".aws",".npmrc",".pypirc",".netrc","id_rsa","id_ed25519"} or re.search(r"\.(pem|key|p12|pfx)$",p):
                      stop("NONPUBLIC_PATH")
              return rel
          signed={"public/.well-known/agent-card.json","public/.well-known/agent.json"}
          def output_path(rel):
              public_path(rel)
              if not (rel.startswith("distribution/") or rel.startswith("public/") or rel=="capabilities/registry.json"): stop("OUTPUT_OUTSIDE_PUBLIC_GENERATED_ROOTS")
              if rel in signed or re.search(r"\.(sig|attestation)\.json$|\.(ots|sig)$",rel) or re.match(r"public/(signed|cards)(/|[-.])",rel): stop("SIGNED_BODY_OUTPUT_FORBIDDEN")
              return rel
          def workspace_bytes(rel):
              public_path(rel)
              p=root/rel
              if p.resolve()!=p: stop("SYMLINK_PATH_FORBIDDEN")
              s=p.lstat()
              if not stat.S_ISREG(s.st_mode): stop("NONREGULAR_FILE")
              return p.read_bytes(),"100755" if s.st_mode&0o111 else "100644"
          try:
              if os.environ.get("NODE_OPTIONS") or os.environ.get("NODE_PATH"): stop("UNQUALIFIED_NODE_PRELOAD_OR_SEARCH_PATH")
              event=json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              pr=event.get("pull_request",{})
              if os.environ.get("GITHUB_EVENT_NAME")!="pull_request" or pr.get("number")!=3034: stop("WRONG_EVENT")
              if pr["head"]["sha"]!=os.environ.get("PR3034_REQUEST_HEAD"): stop("SOURCE_EVENT_MISMATCH")
              commit=git("rev-parse","HEAD").decode().strip()
              state.update(repository=os.environ.get("GITHUB_REPOSITORY"),event="pull_request",
                           requested_pr_head=pr["head"]["sha"],event_base_sha=pr["base"]["sha"],
                           input_commit=commit,input_tree=git("rev-parse","HEAD^{tree}").decode().strip(),
                           input_parents=git("show","-s","--format=%P","HEAD").decode().split(),
                           run_id=os.environ.get("GITHUB_RUN_ID"),run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"))
              if subprocess.run(["git","-c","protocol.allow=never","merge-base","--is-ancestor",pr["head"]["sha"],commit],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
                  stop("SOURCE_NOT_IN_CHECKED_OUT_REVISION")
              state["github_sha"]=os.environ.get("GITHUB_SHA")
              state["checkout_context"]="synthetic-merge" if commit!=pr["head"]["sha"] else "direct-pr-head"
              if state["github_sha"]!=commit: stop("CHECKOUT_DIFFERS_FROM_EVENT_REVISION")
              parents=state["input_parents"]
              if commit!=pr["head"]["sha"] and (len(parents)!=2 or parents[1]!=pr["head"]["sha"]):
                  stop("SYNTHETIC_MERGE_PARENT_BINDING_MISMATCH")
              actual_base=parents[0] if commit!=pr["head"]["sha"] else pr["base"]["sha"]
              event_base=pr["base"]["sha"]
              if not all(re.fullmatch(r"[0-9a-f]{40}",sha) for sha in (actual_base,event_base)):
                  stop("BASE_COMMIT_ID_UNQUALIFIED")
              state["actual_base_sha"]=actual_base
              state["base_ancestry"]={"event_base_sha":event_base,"actual_base_sha":actual_base,
                                      "qualified":False,"history_fetch_attempts":0}
              def base_is_qualified():
                  check=subprocess.run(["git","-c","protocol.allow=never","merge-base","--is-ancestor",event_base,actual_base],
                                       cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=10)
                  return check.returncode==0 and git("merge-base",event_base,actual_base).decode().strip()==event_base
              if not base_is_qualified():
                  # The event base can lag the synthetic merge's actual first parent; the depth-2 checkout can omit it.
                  # Fetch only that exact parent from the existing canonical origin, once, then require real ancestry.
                  state["base_ancestry"].update(history_fetch_attempts=1,history_depth_limit=256,history_timeout_seconds=30)
                  history_env=dict(os.environ,GIT_TERMINAL_PROMPT="0")
                  history=subprocess.run(["git","-c","protocol.allow=never","-c","protocol.https.allow=always",
                                          "-c","submodule.recurse=false","fetch","--no-tags","--no-recurse-submodules",
                                          "--depth=256","--filter=blob:none","--no-write-fetch-head",
                                          "https://github.com/CSOAI-ORG/councilof-ai.git",actual_base],
                                         cwd=root,env=history_env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30)
                  state["base_ancestry"]["history_fetch_returncode"]=history.returncode
                  if history.returncode: stop("BOUNDED_BASE_HISTORY_FETCH_FAILED")
                  if not base_is_qualified(): stop("EVENT_BASE_NOT_PROVEN_ANCESTOR_OF_ACTUAL_BASE")
              if git("rev-parse","HEAD").decode().strip()!=commit or git("rev-parse","HEAD^{tree}").decode().strip()!=state["input_tree"]:
                  stop("CHECKOUT_CHANGED_DURING_BASE_QUALIFICATION")
              state["base_ancestry"].update(qualified=True,merge_base=event_base)
              state["pr_head_tree"]=git("rev-parse",pr["head"]["sha"]+"^{tree}").decode().strip()
              state["event_base_tree"]=git("rev-parse",event_base+"^{tree}").decode().strip()
              state["actual_base_tree"]=git("rev-parse",actual_base+"^{tree}").decode().strip()
              tree={}
              for entry in git("ls-tree","-r","-z","HEAD").split(bytes([0])):
                  if entry:
                      meta,name=entry.split(b"\t",1);mode,kind,blob=meta.decode().split()
                      tree[name.decode()]={"mode":mode,"kind":kind,"git_blob":blob}
              def committed(rel):
                  public_path(rel)
                  t=tree.get(rel)
                  if not t or t["kind"]!="blob" or t["mode"] not in {"100644","100755"}: stop("UNTRACKED_OR_NONREGULAR_INPUT")
                  return git("cat-file","blob",t["git_blob"]),t["mode"]
              def source_pin(rel):
                  data,mode=workspace_bytes(rel);baseline,bmode=committed(rel)
                  if data!=baseline or mode!=bmode: stop("DIRTY_SOURCE_INPUT")
                  return dict(path=rel,**pin(data,mode))
              programs=[{"path":"scripts/harness-x/render.mjs","git_blob":"876eb92e67267ec6524f2c9e3a8785da29f372ec","bytes":94807,"sha256":"3eab74f39d4dfe78355bfb934e915122c767d8b78fc7115d111e00ece29ca27d"},{"path":"scripts/harness-x/vscode-install.mjs","git_blob":"851246eb6d9f14107b3f0c4ed2a85a5f9398e4b3","bytes":1702,"sha256":"9bef1a6b47601c951df5cd324c7fe5c87c586a3f6ab16d25ca43de6e79e5dac2"},{"path":"scripts/harness-x/cursor-install.mjs","git_blob":"6c16ee825d1b16edbd50529defe2f6677ac6b49e","bytes":1767,"sha256":"d7b26fee8eb0e978f04ddfbb1943c06d0499001f7af39d975c035faf8e63db4e"},{"path":"scripts/capability-render.mjs","git_blob":"8f18e9b89a42f3f970b8df842a9268874c5472f7","bytes":10559,"sha256":"5136e946b6992ac2a7294b776a29cace1629d2c7d684178540b84f9980b09eb2"},{"path":"scripts/capability-registry.mjs","git_blob":"2ad001c66fa4a95b05a9694ab3ec4767f2d24fb0","bytes":25986,"sha256":"1d172b3fc796a6ea485cf35b7618cf17868e334f8a322395ed3d739779d9613b"}]
              program_rows=[]
              for expected in programs:
                  row=source_pin(expected["path"])
                  if any(row[k]!=expected[k] for k in ("bytes","sha256","git_blob")): stop("QUALIFIED_PRODUCER_CODE_CHANGED_REVIEW_REQUIRED")
                  program_rows.append(row)
              # Exact reviewed local import closure. Builtins are bound to the actual Node runtime.
              graph={"scripts/harness-x/render.mjs":["node:fs","node:crypto","node:path","node:url","./vscode-install.mjs","./cursor-install.mjs"],
                     "scripts/harness-x/vscode-install.mjs":[],"scripts/harness-x/cursor-install.mjs":[],
                     "scripts/capability-render.mjs":["node:fs","node:path","./capability-registry.mjs"],
                     "scripts/capability-registry.mjs":["node:fs","node:path","node:url"]}
              save("QUALIFIED_PROGRAM_GRAPH.json",{"programs":program_rows,"imports":graph,
                   "io_scope":"Exact primary-reviewed code uses readFileSync/writeFileSync/existsSync and directory mkdirSync. This is a closed current-code qualification, not general ESM/async tracing. Any program drift fails before execution.",
                   "complete_program_tree":state["input_tree"]})
              runtime={}
              for name,args in [("node",["node","--version"]),("npm",["npm","--version"])]:
                  r=subprocess.run(args,capture_output=True,text=True,timeout=30)
                  version=r.stdout.strip()
                  if r.returncode or not re.fullmatch(r"v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?",version): stop("RUNTIME_VERSION_UNQUALIFIED")
                  runtime[name]=version
              v=tuple(map(int,re.match(r"v?(\d+)\.(\d+)\.(\d+)",runtime["node"]).groups()))
              if not ((v[0]==20 and v[1:] >= (19,0)) or v >= (22,12,0)): stop("NODE_RUNTIME_BELOW_REQUIRED_ENGINE")
              runtime["required_node"]="^20.19.0 || >=22.12.0"
              runtime["package_pins"]=[source_pin("package.json"),source_pin("package-lock.json")]
              runtime["declared_package_engines"]=json.loads(committed("package.json")[0]).get("engines")
              save("RUNTIME_AND_LOCK_PINS.json",runtime)
              dist=json.loads(committed("council-os/distribution.json")[0])
              declared={output_path(p) for row in dist["distribution"] for p in row["output"]}
              outputs=declared|{"distribution/SUBMIT.md","distribution/MANIFEST.json","capabilities/registry.json"}
              doctrine=public_path(dist["doctrine"]["source"])
              if not doctrine.startswith("docs/") or not doctrine.endswith(".md"): stop("UNQUALIFIED_DOCTRINE_LOCATION")
