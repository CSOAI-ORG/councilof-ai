name: apply-verify-video
on:
  push:
    branches: [cursor/home-sections-enhance-cd38]
    paths:
      - .github/workflows/apply-verify-video.yml
      - scripts/_apply_verify_video.py
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/home-sections-enhance-cd38
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch LivingStages and clean up
        run: |
          set -euo pipefail
          python3 scripts/_apply_verify_video.py
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          git add client/src/components/home/LivingStages.tsx
          git commit -m "feat(home): proving-ground film beside the three verify steps"
          rm -f scripts/_apply_verify_video.py .github/workflows/apply-verify-video.yml
          git add -A scripts/_apply_verify_video.py .github/workflows/apply-verify-video.yml
          git commit -m "chore: remove one-shot verify-video apply"
          git push origin cursor/home-sections-enhance-cd38
