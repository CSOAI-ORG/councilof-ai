name: RunPod maintenance — credential-free selftest

on:
  pull_request:
    paths:
      - ".github/workflows/runpod-maintenance-selftest.yml"
      - "scripts/pod-loops/**"
      - "scripts/runpod_gspc_worker.py"
      - "scripts/runpod_gspc_push_to_hf.py"
      - "scripts/runpod_gspc_upload_heartbeat.py"
      - "scripts/generate_runpod_gspc_playlist.py"
      - "scripts/runpod_commission_dispatch.py"
      - "scripts/runpod_reviewed_control.py"
      - "scripts/test_pod_loop_supervisor.py"
      - "scripts/test_runpod_gspc_worker.py"
      - "scripts/test_runpod_gspc_push_to_hf.py"
      - "scripts/test_runpod_gspc_upload_heartbeat.py"
      - "scripts/test_generate_runpod_gspc_playlist.py"
      - "scripts/test_runpod_commission_dispatch.py"
      - "scripts/test_runpod_reviewed_control.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/runpod-maintenance-selftest.yml"
      - "scripts/pod-loops/**"
      - "scripts/runpod_gspc_worker.py"
      - "scripts/runpod_gspc_push_to_hf.py"
      - "scripts/runpod_gspc_upload_heartbeat.py"
      - "scripts/generate_runpod_gspc_playlist.py"
      - "scripts/runpod_commission_dispatch.py"
      - "scripts/runpod_reviewed_control.py"
      - "scripts/test_pod_loop_supervisor.py"
      - "scripts/test_runpod_gspc_worker.py"
      - "scripts/test_runpod_gspc_push_to_hf.py"
      - "scripts/test_runpod_gspc_upload_heartbeat.py"
      - "scripts/test_generate_runpod_gspc_playlist.py"
      - "scripts/test_runpod_commission_dispatch.py"
      - "scripts/test_runpod_reviewed_control.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Was a hand-kept list of seven, and eleven of the eighteen loops in this directory were
      # never syntax-checked by anything — a new loop lands unchecked unless someone remembers
      # to add it here. The glob cannot forget. Verified 2026-09-22: all 18 parse clean.
      - name: Check pod-loop shell syntax
        run: |
          set -euo pipefail
          ls scripts/pod-loops/*.sh
          bash -n scripts/pod-loops/*.sh

      - name: Run credential-free maintenance tests
        run: |
          python3 -m unittest discover -s scripts -p test_runpod_gspc_worker.py
          python3 -m unittest discover -s scripts -p test_runpod_gspc_push_to_hf.py
          python3 -m unittest discover -s scripts -p test_runpod_gspc_upload_heartbeat.py
          python3 -m unittest discover -s scripts -p test_pod_loop_supervisor.py
          python3 -m unittest discover -s scripts -p test_generate_runpod_gspc_playlist.py
          python3 -m unittest discover -s scripts -p test_runpod_commission_dispatch.py
          python3 -m unittest discover -s scripts -p test_runpod_reviewed_control.py
