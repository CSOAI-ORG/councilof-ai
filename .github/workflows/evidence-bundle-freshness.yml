name: Evidence Bundle Freshness Gate

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "public/cards-bundle.json"
      - "functions/api/_obligations.ts"
      - "functions/api/evidence-bundle.ts"
      - "scripts/check-evidence-bundle-freshness.mjs"
      - ".github/workflows/evidence-bundle-freshness.yml"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Art-50, Art-53, DORA, and CRA evidence bundle card freshness (<= 14 days)
        run: node scripts/check-evidence-bundle-freshness.mjs --max-age-days 14
