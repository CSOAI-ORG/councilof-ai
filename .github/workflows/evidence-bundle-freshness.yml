name: evidence-bundle-freshness
# Weekly watchdog over the four obligation evidence bundles (article-50, article-53,
# dora, cra): the newest relevant card in each must be within 14 days, else the gate
# fails. EMPTY is a reported state, never a failure; UNREADABLE fails (a watchdog
# that cannot see must say so). Preview reads only: nothing paid, nothing signed.
# Measurement, never certification.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: evidence-bundle-freshness, cancel-in-progress: false }
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read the four bundles and hold the 14-day floor
        run: python3 scripts/evidence_bundle_freshness.py
