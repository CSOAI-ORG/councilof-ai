name: tmp-concat-header
on:
  push:
    branches: [cursor/os-e2e-polish-cd38]
jobs:
  concat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/os-e2e-polish-cd38
      - name: Concatenate Header from restore parts
        run: cat .restore-header/p1.txt .restore-header/p2.txt .restore-header/p3.txt .restore-header/p4.txt > client/src/components/Header.tsx
      - name: Commit restored Header
        run: |
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          git add client/src/components/Header.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(os): restore Header.tsx complete file with SPA-hop mega-menu close"
          git push origin HEAD:cursor/os-e2e-polish-cd38
