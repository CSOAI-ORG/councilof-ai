name: canary-daily
on:
  schedule:
    - cron: "17 3 * * *"  # daily 03:17 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run silent-route canary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_TOKEN }}
          MOONSHOT_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_TOKEN }}
          XAI_API_KEY: ${{ secrets.GROK_TOKEN }}
        run: python scripts/canary/canary_run.py
      - name: Commit canary artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add public/interop/silent-route-canary-2026-09/
          git diff --cached --quiet || git commit -m "canary: daily capture $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Integrate concurrent master changes; protected branch hook requires PR
          git pull --ff-only --no-edit origin master || true
          # Push via PR branch (protected branch hook allows PRs to master)
          branch="canary-push/$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git push -u origin "$branch"
          # Open a PR targeting master
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base master --title "canary: daily capture $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body "Automatic canary capture — see public/interop/silent-route-canary-2026-09/baseline.jsonl" || echo "PR creation failed (may already exist)"
