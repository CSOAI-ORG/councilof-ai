name: canary-daily
on:
  schedule:
    - cron: "17 3 * * *"  # daily 03:17 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run silent-route canary
        id: capture
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_TOKEN }}
          MOONSHOT_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_TOKEN }}
          XAI_API_KEY: ${{ secrets.GROK_TOKEN }}
        run: python3 scripts/canary/canary_run.py --receipt "$RUNNER_TEMP/canary-capture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain safe capture before publication
        id: retain_capture
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canary-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-capture-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Propose captured canary artifacts
        id: proposal
        if: ${{ success() && steps.capture.outcome == 'success' && steps.retain_capture.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/canary/canary_delivery.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --capture-artifact-id "${{ steps.retain_capture.outputs.artifact-id }}" --receipt "$RUNNER_TEMP/canary-delivery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain safe delivery status
        if: ${{ always() && steps.proposal.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: canary-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-delivery-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
