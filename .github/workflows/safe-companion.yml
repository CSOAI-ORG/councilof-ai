name: safe-companion
on:
  pull_request:
    paths:
      - 'packages/safe-companion/**'
      - 'packages/evidence-fabric/**'
      - 'harness/openshell-adapter/**'
      - 'public/spec/signed-receipts/v1/**'
      - 'public/safe-companion/**'
      - 'public/evidence-learning/contract.mjs'
      - 'scripts/*safe-companion*'
      - 'client/src/components/SafeExportReview.tsx'
      - 'client/src/components/DashboardEvidenceLearningPane.tsx'
      - 'docs/standards/osaia-safe-reverification/**'
      - 'functions/_lib/cardVerify.ts'
      - 'extensions/chrome-gspc-verify/**'
      - 'scripts/build-extension-zip.py'
      - 'public/downloads/gspc-verify-*.zip'
      - '.github/workflows/safe-companion.yml'
  push:
    branches: [master]
    paths:
      - 'packages/safe-companion/**'
      - 'packages/evidence-fabric/**'
      - 'harness/openshell-adapter/**'
      - 'public/spec/signed-receipts/v1/**'
      - 'public/safe-companion/**'
      - 'public/evidence-learning/contract.mjs'
      - 'scripts/*safe-companion*'
      - 'client/src/components/SafeExportReview.tsx'
      - 'client/src/components/DashboardEvidenceLearningPane.tsx'
      - 'docs/standards/osaia-safe-reverification/**'
      - 'functions/_lib/cardVerify.ts'
      - 'extensions/chrome-gspc-verify/**'
      - 'scripts/build-extension-zip.py'
      - 'public/downloads/gspc-verify-*.zip'
      - '.github/workflows/safe-companion.yml'
  merge_group:
  workflow_dispatch:
concurrency:
  group: safe-companion-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  local-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise refusal, comparison and report reopening
        run: node --test packages/safe-companion/reader.node-test.mjs scripts/safe-companion-integration.node-test.mjs
      - name: Check generated public files
        run: node scripts/build-safe-companion.mjs --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Check unsigned event compatibility
        run: python3 packages/safe-companion/fabric_event_test.py
      - name: Check both retained approval byte-link profiles
        run: python3 -m unittest discover -s docs/standards/osaia-safe-reverification -p test_approval_dependency_binding.py
  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Keep the shipped extension on the canonical verifier
        run: |
          npx vitest run extensions/chrome-gspc-verify/test/twin.test.mjs extensions/chrome-gspc-verify/test/signature-required.test.mjs --maxWorkers 1
          python3 scripts/build-extension-zip.py --check
      - run: npx playwright install --with-deps chromium
      - name: Resolve installed test browser
        id: chromium
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'path=' + require('playwright').chromium.executablePath() + '\n')"
      - name: Exercise inspect, reopen, compare, host removal and digest recovery
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: |
          node scripts/safe-companion.browser-test.mjs qualification/standalone
          node scripts/safe-companion-os.browser-test.mjs qualification/react
          node scripts/safe-companion-embed.browser-test.mjs qualification/embed
          node scripts/safe-companion-integrity.browser-test.mjs qualification/integrity
      - name: Retain bounded browser qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-companion-browser-${{ github.sha }}
          path: qualification/
          retention-days: 7
          if-no-files-found: warn
  evidence-adapter-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the qualified test dependencies
        run: python -m pip install pytest==9.0.2 cryptography==50.0.2 PyYAML==6.0.3 jsonschema==4.26.0 setuptools==81.0.0
      - name: Assemble and install the candidate package for offline checks only
        run: |
          python packages/evidence-fabric/pypi/build_pkg.py "$RUNNER_TEMP/evidence-fabric-test"
          python -m pip install --no-deps --no-build-isolation "$RUNNER_TEMP/evidence-fabric-test"
      - name: Qualify adapter observations and refusal controls
        run: python -m unittest discover -v -s harness/openshell-adapter -p 'test_*.py'
      - name: Qualify the full evidence library with retained fixtures
        run: |
          export CSOAI_EVIDENCE_CONSOLE="$(command -v csoai-evidence)"
          test -n "$CSOAI_EVIDENCE_CONSOLE" && test -x "$CSOAI_EVIDENCE_CONSOLE"
          python -m pytest -q -rs packages/evidence-fabric/tests --junitxml=qualification/evidence-fabric.xml
      - name: Verify the installed package against canonical golden files
        run: python packages/evidence-fabric/pypi/check_install.py packages/evidence-fabric
      - name: Retain evidence qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-adapter-qualification-${{ github.sha }}
          path: qualification/evidence-fabric.xml
          retention-days: 7
          if-no-files-found: warn
