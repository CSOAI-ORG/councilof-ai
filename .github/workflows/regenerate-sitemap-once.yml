name: regenerate-sitemap-once
on:
  workflow_dispatch:
  push:
    branches: [cursor/instruments-catalog-7fb8]
    paths:
      - ".github/workflows/regenerate-sitemap-once.yml"
      - "scripts/generate-sitemap.mjs"
jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --staged --quiet; then
            echo "sitemap unchanged"
          else
            git commit -m "fix(tip): regenerate sitemap with indices/products surfaces"
            git push
          fi
