name: catalog-trust-round
on:
  schedule:
    - cron: "29 */6 * * *"   # every 6h, staggered away from the :07 root tick and :17 HF mill
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: catalog-trust
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: DRY round — probe the live catalog, counts only
        run: |
          python3 scripts/catalog-trust-round.py --out-dir public/interop/x402-trust
      - name: land the artefact (via PR — master is GH006-protected)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "csoai-catalog-trust"
          git config user.email "trust@csoai.org"
          git add public/interop/x402-trust/ docs/interop/X402-CATALOG-TRUST-*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no snapshot change — nothing to land"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          BR="census/trust-round-${STAMP}"
          git checkout -b "$BR"
          git commit -m "catalog-trust round: counts-only snapshot (${STAMP})"
          git push origin "HEAD:$BR"
          URL=$(gh pr create --base master --head "$BR" \
            --title "catalog-trust round: counts-only snapshot (${STAMP})" \
            --body "Machine-produced 6h round (catalog-trust-round.yml). Counts only by doctrine — host details withheld. A 402 is an invoice, not delivery; a 404 is a catalog row that does not exist. Lands via PR because master push is GH006-protected (direct-push landing silently failed since branch protection tightened on 7 Sep).")
          gh workflow run pr-gates.yml --repo "$GITHUB_REPOSITORY" --ref "$BR"
          gh pr merge "$URL" --repo "$GITHUB_REPOSITORY" --squash --auto
          echo "landed branch=$BR"
