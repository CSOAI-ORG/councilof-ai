name: Restore catalog blobs from URLs
on:
  workflow_dispatch:
  push:
    branches: [cursor/instruments-catalog-7fb8]
    paths: ['.restore-chunks/READY']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/instruments-catalog-7fb8
      - name: Download and verify blobs
        run: |
          set -euo pipefail
          curl -fsSL -o public/sitemap.xml "https://litter.catbox.moe/4306qs.xml"
          curl -fsSL -o public/ecosystem.json "https://litter.catbox.moe/q4r8qo.json"
          mkdir -p functions/data
          curl -fsSL -o functions/data/ecosystem.json "https://litter.catbox.moe/y7k9pt.json"
          echo "290239355f474030eb24bab1bbe63931a0036d626364ec492b52d904b6b31b9f  public/sitemap.xml" | sha256sum -c
          echo "788f22bc682ea42f9a5eef25ba192fc376cee0d3c20aaf56c96279e858e14e40  public/ecosystem.json" | sha256sum -c
          echo "788f22bc682ea42f9a5eef25ba192fc376cee0d3c20aaf56c96279e858e14e40  functions/data/ecosystem.json" | sha256sum -c
          wc -c public/sitemap.xml public/ecosystem.json functions/data/ecosystem.json
          rm -rf .restore-chunks
          rm -f .github/workflows/restore-catalog-blobs.yml .github/workflows/restore-from-urls.yml
      - name: Commit restored blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: restore full ecosystem.json and sitemap.xml"
          git push origin HEAD:cursor/instruments-catalog-7fb8
