name: turkish-guard-observed-evidence
on:
  pull_request:
    paths:
      - "scripts/research/turkish_guard_observed.py"
      - "scripts/research/test_turkish_guard_observed.py"
      - "scripts/research/notinject_guard_observed.py"
      - "scripts/research/test_notinject_guard_observed.py"
      - "scripts/research/turkish_to_evidence_event.py"
      - "scripts/research/project_turkish_reaction.mjs"
      - "scripts/research/project_turkish_reaction.test.mjs"
      - "docs/research/turkish-guard-observed-20261124/**"
      - ".github/workflows/turkish-guard-observed-evidence.yml"
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test method and claims without downloading model/data
        run: python3 -m unittest discover -s scripts/research -p test_turkish_guard_observed.py -v
      - name: Verify independent benign hard-negative source and derived receipt
        run: python3 -m unittest discover -s scripts/research -p test_notinject_guard_observed.py -v
      - name: Replay retained real observation into read-only reaction bridge
        run: node --test scripts/research/project_turkish_reaction.test.mjs
      - name: Fail closed on missing receipt or incorrect qualification
        run: |
          node scripts/research/project_turkish_reaction.mjs docs/research/turkish-guard-observed-20261124/record.json > /tmp/reaction-readback.json
          python3 - <<'PY'
          import json
          obj=json.load(open("/tmp/reaction-readback.json"))
          assert obj["review"]["status"]=="ACCEPTANCE_INCOMPLETE"
          assert obj["review"]["execute_authorized"] is False
          assert obj["review"]["effect_independently_accepted"] is False
          assert obj["review"]["fresh_gspc_measurement"] is False
          assert obj["operating_view"]["independently_qualified_chains"] is None
          assert obj["confusion"]=={"fn":62,"fp":287,"tn":2768,"tp":255}
          print("Observed model-output source integrity: PASS. Human/recipient qualification: NOT ESTABLISHED.")
          PY
      - name: Build actual observed, unsigned PARTIAL GSPC candidate event
        run: |
          python3 scripts/research/turkish_to_evidence_event.py --output /tmp/observed-turkish-evidence-event.json
          python3 - <<'PY'
          import importlib.util, json
          path="/tmp/observed-turkish-evidence-event.json"
          doc=json.load(open(path))
          spec=importlib.util.spec_from_file_location("event","packages/evidence-fabric/event.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.validate(doc)==[]
          assert mod.compute_event_id(doc)==doc["event_id"]
          assert doc["state"]=="PARTIAL" and doc["value"] is None
          assert doc["signature"] is None and doc["anchors"]["ots"]=="none"
          assert doc["observed"]["gspc_admitted"] is False
          assert doc["observed"]["receiving_party_accepted"] is False
          assert doc["observed"]["tool_effect_observed"] is False
          print("Canonical evidence event: VALID/UNSIGNED/PARTIAL/NOT_ADMITTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: observed-turkish-evidence-partial-${{ github.sha }}
          path: /tmp/observed-turkish-evidence-event.json
          retention-days: 30
