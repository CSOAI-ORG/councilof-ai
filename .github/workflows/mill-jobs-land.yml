name: HF-Jobs mill — land the staged cards
# scripts/hf/hf_jobs_mill.py runs the mill on HF Jobs, the door outside GitHub Actions'
# 45-minute timeout, and uploads staged UNSIGNED cards + their item-evidence bundles to
# csoai/mill-jobs-staging. Until 2026-09-14 this workflow only pulled the cards (dropping the
# evidence) and uploaded an artifact "for a human" — so HF Jobs output never reached the signer
# (the 4-job round of 02:14Z staged 69 cards + 26 evidence bundles that nobody could sign).
#
# Now, exactly like hub-queue-land: pull the whole staging tree, land with
# scripts/land_mill_cards.py (dedupe per (model, axis), bind run provenance, REQUIRE the evidence
# bundle — aggregate-only cards stopped landing after the 2026-09-13 ruling), push a branch,
# open the PR, dispatch the existing OIDC signer for exactly that run id, wait, verify VALID under
# the live DID plus the current v0.2 admission receipt, and comment the verdict table. Human merge
# is the only gate.
#
# It does NOT sign, does not decide MEASURED (sign_mill_cards.py sets status from n), does not
# touch the pod, deletes nothing from the dataset, and never writes master.
#
# 2026-10-07 (Lane B). M-P1-6: the staging tree is cumulative, so every run re-landed what earlier
# PRs already held (#2843 and #2846: 176 cards, 26 cells, identical tables). scripts/hf/
# mill_jobs_landing_plan.py now admits only gradings whose evidence digest is on neither master nor
# any open mill/land-* PR, one per cell, none below 10 graded items; closes bot-only HF Jobs PRs
# whose gradings all live on master or in another open PR; and holds (lands nothing) while one HF
# Jobs PR is still open, so at most one rolling PR exists. A-G2: after the signer, the derived views
# a signed card changes (models-measured.json, evidence-note citations) are rebuilt and committed on
# the PR branch, and only THEN are the gates dispatched, so they judge the branch as it will merge.

on:
  schedule:
    - cron: "43 2,8,14,20 * * *"   # 4x/day, off both the hour and runpod-intake's :17
  workflow_dispatch:

concurrency: { group: mill-jobs-land, cancel-in-progress: false }

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # gh (pr create, workflow run, pr comment) needs the token in the job env — hub-queue-land
      # sets it the same way; without it run 34800987085 pushed the branch and died at gh (exit 4).
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install the hub client only
        run: pip install --quiet "huggingface_hub>=0.25"

      - name: Pull the staging dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN absent — csoai/mill-jobs-staging is PRIVATE, so this cannot read it."
            echo "That is UNCHECKABLE, not zero cards. Failing rather than landing nothing quietly."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib, shutil
          from huggingface_hub import snapshot_download
          try:
              p = snapshot_download("csoai/mill-jobs-staging", repo_type="dataset",
                                    token=os.environ["HF_TOKEN"])
          except Exception as e:
              # A repo that does not exist yet is genuinely zero cards; anything else is not.
              if "404" in str(e) or "Repository Not Found" in str(e):
                  print("staging dataset does not exist yet — 0 cards, and that IS zero")
                  pathlib.Path("staged").mkdir(exist_ok=True)
                  raise SystemExit(0)
              raise
          dst = pathlib.Path("staged"); dst.mkdir(exist_ok=True)
          n = e = 0
          # The whole tree, paths preserved: the item-evidence bundles (items-<axis>-<hash>.jsonl)
          # sit beside the cards and land_mill_cards.py binds each card to its bundle by sha256.
          # Pulling only the cards (what this step did until 2026-09-14) made every card
          # aggregate-only and therefore unsignable under the 2026-09-13 evidence ruling.
          for f in pathlib.Path(p).rglob("*"):
              if not f.is_file() or ".git" in f.parts or f.name == ".gitattributes":
                  continue
              rel = f.relative_to(p)
              (dst / rel).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(f, dst / rel)
              if f.name.startswith("unsigned-"): n += 1
              if f.name.startswith("items-"): e += 1
          print(f"pulled {n} staged card(s) and {e} evidence bundle(s) from csoai/mill-jobs-staging")
          PY

      - name: plan (only new gradings; close superseded HF Jobs PRs; hold while one is open)
        id: plan
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/hf -p test_mill_jobs_landing_plan.py
          python3 - <<'PY'
          import json, subprocess
          def gh(*a):
              return subprocess.run(["gh", *a], check=True, capture_output=True, text=True).stdout
          rows = json.loads(gh("pr", "list", "--state", "open", "--limit", "200", "--json", "number,headRefName"))
          out = []
          for r in rows:
              if not str(r.get("headRefName") or "").startswith("mill/land-"):
                  continue
              # Authorship decides whether a PR may be auto-closed (bot-only) - read it per PR.
              out.append(json.loads(gh("pr", "view", str(r["number"]), "--json", "number,headRefName,commits")))
          json.dump(out, open("open-landing-prs.json", "w"))
          print(f"open mill/land-* PRs: {len(out)}")
          PY
          python3 scripts/hf/mill_jobs_landing_plan.py --staged staged --open-prs open-landing-prs.json \
            --min-graded 10 --excluded-dir staged-excluded --out staged/landing-plan.json --github-output "$GITHUB_OUTPUT"

      - name: close superseded HF Jobs landing PRs (bot-only; branches kept)
        if: steps.plan.outputs.close != ''
        run: |
          set -euo pipefail
          for n in ${{ steps.plan.outputs.close }}; do
            why=$(python3 -c "import json,sys; print(next(c['reason'] for c in json.load(open('staged/landing-plan.json'))['close'] if c['number']==int(sys.argv[1])))" "$n")
            gh pr close "$n" --comment "Closed by mill-jobs-land run ${{ github.run_id }} as superseded: ${why}. Nothing is lost: the branch is kept, and every grading it carried is on master or in the PR named here. (M-P1-6: one rolling HF Jobs landing PR.)"
          done

      - name: hold (an HF Jobs landing PR is still open)
        if: steps.plan.outputs.hold == 'true'
        run: |
          python3 -c "import json; print(json.load(open('staged/landing-plan.json'))['hold_reason'])" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: land (dedupe per (model, axis), bind run provenance, require the evidence bundle)
        id: land
        if: steps.plan.outputs.hold != 'true'
        env:
          # land_mill_cards.bind_run_provenance requires a positive GitHub Actions run id and stamps
          # the card's run_id as "gha-<id>"; the signer accepts exactly that id (bare or gha-).
          # A non-numeric id ("hfjobs-…", run 34800722734) made every card skip as "json ValueError".
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pip install -q cryptography
          # Same landing as hub-queue-land: the card's run_id becomes "gha-<RUN_ID>" and the signer
          # is dispatched for exactly that id — never the whole legacy inbox (#1941 provenance gate).
          python3 scripts/land_mill_cards.py --staged staged --run-id "$RUN_ID" --require-evidence --pr-body staged/PR-BODY.md --github-output "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          # What the plan kept out of this PR, and why (the cards stay in the staging dataset).
          python3 - <<'PY' >> staged/PR-BODY.md
          import json
          from collections import Counter
          p = json.load(open("staged/landing-plan.json"))
          c = Counter(r["reason"].split(":")[0].split(" (")[0] for r in p["excluded"])
          print(f"\nLanding plan (`scripts/hf/mill_jobs_landing_plan.py`): {p['staged_cards']} staged gradings, "
                f"{len(p['admitted'])} admitted ({sum(1 for r in p['admitted'] if r['quotable'])} with n>=30), "
                f"{len(p['excluded'])} kept out:")
          for reason, n in c.most_common():
              print(f"- {n} x {reason}")
          PY

      - name: branch, push, PR, dispatch the OIDC signer on the branch
        id: pr
        if: steps.plan.outputs.hold != 'true' && steps.land.outputs.landed != '0'
        env:
          RUN_ID: ${{ steps.land.outputs.run_id }}
        run: |
          set -euo pipefail
          BR="mill/land-hfjobs-${{ github.run_id }}"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          git config user.name "csoai-mill-jobs-land"
          git config user.email "board@csoai.org"
          git checkout -b "$BR"
          git add public/interop/mill-cards-unsigned public/interop/mill-evidence
          git commit -m "mill: land ${{ steps.land.outputs.landed }} UNSIGNED cards from HF Jobs (mill-jobs-land run ${{ github.run_id }}) — sign pending; nothing MEASURED"
          git push origin "HEAD:$BR"
          gh pr create --base master --head "$BR" \
            --title "mill: ${{ steps.land.outputs.landed }} cards from HF Jobs (run ${{ github.run_id }}) — OIDC sign pending, nothing MEASURED" \
            --body-file staged/PR-BODY.md
          gh workflow run hf-fin-shells-measure.yml --ref "$BR" -f target=mill -f mill_run_id="${RUN_ID}"
          # pr-gates is dispatched by the derived-views step below, after the signer's commit and the
          # rebuild: a gate run on this unsigned head judged a branch that was about to change.

      - name: wait for signer, then verify DID signature and current admission (no key here)
        if: steps.plan.outputs.hold != 'true' && steps.land.outputs.landed != '0'
        run: |
          set -euo pipefail
          BR="${{ steps.pr.outputs.branch }}"
          sleep 20
          for i in $(seq 1 40); do
            ST=$(gh run list --workflow hf-fin-shells-measure.yml --branch "$BR" --json status -L 1 -q '.[0].status' || true)
            echo "signer status=${ST:-?}"
            [ "$ST" = "completed" ] && break
            sleep 15
          done
          git fetch origin "$BR"
          git checkout -q FETCH_HEAD -- public/interop/mill-cards-signed || true
          curl -fsSL -A "Mozilla/5.0 csoai-mill-jobs-land" https://councilof.ai/.well-known/did.json -o did.json
          python3 - <<'PY' | tee verify.md
          import json, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, "harness/gspc-top100")
          sys.path.insert(0, "scripts")
          from verify_card import verify_signed_card_with_did_doc
          from verify_hub_mill_evidence import validate_signed_admission
          did = json.loads(Path("did.json").read_text())
          landed = json.loads(Path("staged/land-report.json").read_text())["landed"]
          signed_dir = Path("public/interop/mill-cards-signed")
          superseded = set()
          ledger = signed_dir / "SUPERSEDED.jsonl"
          if ledger.is_file():
              for line in ledger.read_text(encoding="utf-8").splitlines():
                  try: superseded.add(str(json.loads(line).get("superseded_id") or ""))
                  except Exception: pass
          def live_card(model, axis):
              for f in sorted(signed_dir.glob("signed-*.json")):
                  try: w = json.loads(f.read_text(encoding="utf-8"))
                  except Exception: continue
                  b = w.get("body") if isinstance(w.get("body"), dict) else {}
                  if b.get("model") == model and b.get("axis") == axis and w.get("signature") and str(w.get("id") or "") not in superseded:
                      return f
              return None
          rows = []
          for r in landed:
              f = live_card(str(r.get("model") or ""), str(r.get("axis") or "")) if signed_dir.is_dir() else None
              if f is None:
                  rows.append((r["file"], "UNSIGNED", "no live signed card for this (model, axis)")); continue
              v, why = verify_signed_card_with_did_doc(f.read_bytes(), did)
              if v == "VALID":
                  try:
                      validate_signed_admission(json.loads(f.read_text(encoding="utf-8")), Path("public/interop/mill-evidence"))
                  except Exception as error:
                      v, why = "UNCHECKABLE", f"current evidence admission failed: {error}"
              rows.append((f.name, v, why))
          c = Counter(v for _, v, _ in rows)
          print(f"Signer result on this branch: {dict(c)} (VALID under the live DID; nothing MEASURED until merge + hub-queue-flip)\n")
          print("| card | verdict | detail |\n|---|---|---|")
          for n, v, w in rows: print(f"| `{n}` | {v} | {w} |")
          PY
          gh pr comment "$BR" --body-file verify.md

      - name: rebuild derived views on the PR branch, then dispatch the gates (A-G2)
        if: steps.plan.outputs.hold != 'true' && steps.land.outputs.landed != '0'
        run: |
          set -euo pipefail
          BR="${{ steps.pr.outputs.branch }}"
          # The signer pushes to this branch without a retry, so the rebuild commits only after the
          # signer run has finished; otherwise it would race the signer's push and lose it the cards.
          ST=$(gh run list --workflow hf-fin-shells-measure.yml --branch "$BR" --json status -L 1 -q '.[0].status' || true)
          if [ "$ST" = "completed" ]; then
            bash scripts/hf/mill_land_derived.sh "$BR" derived-report.md
            if [ -s derived-report.md ]; then gh pr comment "$BR" --body-file derived-report.md; fi
          else
            echo "::warning::signer is '${ST:-unknown}' on $BR, so the derived views were not rebuilt. After it completes run, from a checkout: bash scripts/hf/mill_land_derived.sh $BR"
          fi
          if ! gh workflow run pr-gates.yml --ref "$BR" 2>/dev/null; then
            echo "OPERATOR ACTION REQUIRED: run: gh workflow run pr-gates.yml --ref $BR" >&2
          fi

      - name: upload the land report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mill-jobs-landed-${{ github.run_id }}
          path: |
            staged/land-report.json
            staged/landing-plan.json
            staged/PR-BODY.md
          if-no-files-found: ignore
          retention-days: 14
