<style>
:root{color-scheme:light;
 --paper:#ece7dd; --cream:#faf7f1; --ink:#1d1d22; --dim:#6f6a61;
 --line:rgba(40,34,24,.12); --gold:#bd9d54; --gold2:#d8bf86;
 --coral:#e6a07c; --sage:#9dbe9a; --peri:#b4b6e8; --lav:#cbb7df;
 --good:#6fae85; --warn:#cf9a3c; --bad:#d9756a;
 /* aliases so any class still referencing old tokens recolors to the sovereign palette */
 --teal:#bd9d54; --teal2:#a8893f; --navy:#1d1d22; --pink:#b9a4d6;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,sans-serif;background:#e4ded2;color:var(--ink);display:flex;justify-content:center;padding:14px;min-height:100vh}
.frame{width:100%;max-width:1180px;height:calc(100vh - 28px);min-height:680px;
 background:
  radial-gradient(1100px 420px at 16% -8%, rgba(230,160,124,.42), transparent 60%),
  radial-gradient(1000px 460px at 84% -10%, rgba(157,190,154,.40), transparent 62%),
  radial-gradient(900px 520px at 60% -14%, rgba(180,182,232,.34), transparent 60%),
  linear-gradient(180deg,#fbf8f2 0%, #f3efe6 46%, #ece6db 100%);
 border-radius:22px;box-shadow:0 30px 80px rgba(70,55,30,.20),inset 0 0 0 1px rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.6);overflow:hidden;position:relative;color:var(--ink)}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(40,34,24,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(40,34,24,.045) 1px,transparent 1px);background-size:38px 38px;pointer-events:none;mask-image:radial-gradient(900px 600px at 55% 0%,#000 35%,transparent 100%)}
/* top bar */
.bar{position:relative;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 15px;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.3px;font-size:14px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo .dot{width:21px;height:21px;border-radius:7px;background:linear-gradient(150deg,#2a2a31,#15151a);box-shadow:0 3px 9px rgba(0,0,0,.28);position:relative}
.logo .dot::after{content:"M";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#f3ede0}
.pill{font-size:11px;color:var(--dim);background:rgba(255,255,255,.5);border:1px solid var(--line);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;white-space:nowrap}

.sdot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px rgba(111,174,133,.7)}
.sdot.warn{background:var(--warn);box-shadow:0 0 8px rgba(207,154,60,.7)}
.spacer{flex:1}
.cd{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);font-size:13px}
.btn{cursor:pointer;font-size:11px;color:var(--ink);background:rgba(255,255,255,.65);border:1px solid var(--line);padding:6px 12px;border-radius:9px;transition:.15s;font-weight:600}
.btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 4px 14px rgba(189,157,84,.18)}
/* desktop */
.desktop{position:absolute;inset:48px 0 40px 0;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:16px;padding:24px;align-content:start;height:100%;overflow:auto}
.tile{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px;border-radius:16px;border:1px solid transparent;transition:.18s;text-align:center}
.tile:hover{background:rgba(255,255,255,.5);border-color:var(--line);transform:translateY(-3px);box-shadow:0 12px 26px rgba(70,55,30,.10)}
.ic{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:27px;background:linear-gradient(155deg,#ffffff,#f0ebe0);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 22px rgba(70,55,30,.14),inset 0 1px 0 rgba(255,255,255,.9)}
.tile span{font-size:11.5px;color:var(--dim);font-weight:600;line-height:1.25}
.tile:hover span{color:var(--ink)}
/* windows */

.win .wb .wt{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.win .wb .wi{font-size:15px}
.win .x{margin-left:auto;cursor:pointer;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
.win .x:hover{background:rgba(217,117,106,.16);color:var(--bad)}
.win .body{padding:15px 17px;overflow:auto;max-height:60vh;font-size:12.5px;line-height:1.55;color:var(--ink)}

.win .body h4:not(:first-child){margin-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}
.kv .k{color:var(--dim)} .kv .v{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{font-size:11px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--dim)}
.chip.on{border-color:var(--gold);color:#8a6e2e;background:rgba(189,157,84,.12)}
.chip.live{border-color:var(--good);color:#3f7d56;background:rgba(111,174,133,.13)}
.chip.warnc{border-color:var(--warn);color:#9a6f1c;background:rgba(207,154,60,.13)}
.act{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px;border:1px solid var(--gold);color:#8a6e2e;background:rgba(189,157,84,.14);text-decoration:none;margin:3px 6px 3px 0;transition:.15s}
.act:hover{background:rgba(189,157,84,.26);box-shadow:0 4px 14px rgba(189,157,84,.2)}
.evo{display:flex;align-items:center;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.evo .s{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px}
.evo .s b{font-size:24px;line-height:1}
.evo .s small{font-size:9.5px;color:var(--dim);text-align:center}
.evo .ar{color:var(--gold);font-size:14px}
.arch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.arch .c{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.5)}
.arch .c h5{margin:0 0 5px;font-size:12.5px;color:var(--ink)}
.arch .c p{margin:0;font-size:11px;color:var(--dim);line-height:1.45}
.metric{display:inline-flex;flex-direction:column;gap:2px;min-width:92px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.55);margin:4px 6px 4px 0}
.metric b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.metric small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.bar2{height:7px;border-radius:6px;background:rgba(40,34,24,.10);overflow:hidden;margin:3px 0 9px}

ul.t{margin:6px 0;padding-left:16px} ul.t li{margin:3px 0}

a{color:#a8893f}

table.mini{width:100%;border-collapse:collapse;font-size:11.5px}
table.mini td,table.mini th{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left}

.tb-right{margin-left:auto;font-size:10.5px;color:var(--dim)}

.boot{position:absolute;inset:0;z-index:60;background:radial-gradient(900px 520px at 50% 32%, #fdfbf6, #efe9de);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}

.boot .bl{font-size:30px;font-weight:800;letter-spacing:1px;color:var(--ink);display:flex;align-items:center;gap:13px}
.boot .bl .mk{width:42px;height:42px;border-radius:13px;background:linear-gradient(150deg,#2a2a31,#15151a);display:flex;align-items:center;justify-content:center;color:#f3ede0;font-size:23px;box-shadow:0 9px 22px rgba(0,0,0,.26)}
.boot .bl b{color:var(--gold)}
.boot .emerge{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.boot .aura{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(230,160,124,.55),rgba(157,190,154,.4) 45%,rgba(180,182,232,.35) 70%,transparent 74%);filter:blur(10px);animation:aura 2.3s ease-in-out infinite}
.boot .st{position:absolute;font-size:72px;line-height:1;opacity:0}
.boot .orb{animation:orbIn 2.3s ease forwards}
.boot .egg{animation:eggIn 2.3s ease forwards}
.boot .hatch{animation:hatchIn 2.3s ease forwards}
.boot .sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#9a7f45;margin-top:3px}
@keyframes aura{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:.85;transform:scale(1.08)}}
@keyframes orbIn{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1)}34%{opacity:1}46%{opacity:0;transform:scale(1.1)}100%{opacity:0}}
@keyframes eggIn{0%,30%{opacity:0;transform:scale(.7) rotate(-4deg)}44%{opacity:1;transform:scale(1) rotate(0)}64%{opacity:1}76%{opacity:0;transform:scale(1.18)}100%{opacity:0}}
@keyframes hatchIn{0%,66%{opacity:0;transform:scale(.5) rotate(-10deg)}84%{opacity:1;transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.boot .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#9a7f45;min-height:80px;width:340px;white-space:pre-line;line-height:1.7;text-align:center}
.cursorbar{display:inline-block;width:8px;height:13px;background:var(--gold);animation:bk 1s steps(1) infinite;vertical-align:middle}
@keyframes bk{50%{opacity:0}}
.hint{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);z-index:25;font-size:11px;color:var(--dim);background:rgba(255,255,255,.6);padding:6px 13px;border-radius:20px;border:1px solid var(--line);backdrop-filter:blur(8px)}
</style>

<script>
/* ---------- SESSION SNAPSHOT (real reads, 2026-06-23 — fallback if live calls unavailable) ---------- */
const SNAP = {

/* ---------- live bridge unwrap ---------- */
function dig(o,d){ if(d>7||o==null)return o;
  if(typeof o==='string'){try{return dig(JSON.parse(o),d+1)}catch(e){return o}}
  if(o.structuredContent)return dig(o.structuredContent,d+1);
  if(o.result!==undefined)return dig(o.result,d+1);
  if(Array.isArray(o.content)&&o.content[0]&&o.content[0].text!==undefined)return dig(o.content[0].text,d+1);
  return o; }
async function bridge(name){ try{
  if(!window.cowork||!window.cowork.callMcpTool)return null;
  const r=await window.cowork.callMcpTool(name,{kwargs:"{}"}); return dig(r,0);
}catch(e){return null} }

async function refreshLive(){
  const [sr,hub,fed,co]=await Promise.all([
    bridge('mcp__sov3-bridge__sovereign_rundown'),
    bridge('mcp__meok-hub-bridge__meok_hub_status'),
    bridge('mcp__sov3-bridge__mcp_federation_stats'),
    bridge('mcp__sov3-bridge__coord_get_dashboard')
  ]);
  if(sr&&sr.consciousness){LIVEMODE=true;
    LIVE.king.health=sr.health||LIVE.king.health;
    LIVE.king.cl=sr.consciousness.consciousness_level ?? (sr.consciousness.care_intensity!=null?LIVE.king.cl:LIVE.king.cl);
    if(sr.agents&&sr.agents.registry){LIVE.king.agents=sr.agents.registry.total_agents;LIVE.king.idle=sr.agents.registry.by_status.idle;LIVE.king.busy=sr.agents.registry.by_status.busy;}
    if(sr.heartbeat){LIVE.king.pulses=sr.heartbeat.pulse_count;LIVE.king.jobs=sr.heartbeat.jobs;}
    if(sr.total_mcp_tools)LIVE.king.tools=sr.total_mcp_tools;
    if(sr.engagement)LIVE.king.engagement=sr.engagement.score;
  }
  if(hub&&hub.meok_api&&hub.meok_api.body){const b=hub.meok_api.body;LIVE.api.status=b.status;LIVE.api.ver=b.version;LIVE.api.council=b.council_nodes;LIVE.api.expertise=b.expertise_nodes;LIVE.api.bridge=b.bridge_nodes;LIVE.api.total=b.total_architecture_nodes;LIVE.api.domains=b.domains;LIVE.api.code=hub.meok_api.status_code;}
  if(fed){if(fed.catalog_size)LIVE.fed.catalog=fed.catalog_size;if(fed.success_rate!=null)LIVE.fed.success=fed.success_rate;if(fed.sigil_count!=null)LIVE.fed.sigil=fed.sigil_count;if(fed.total_calls!=null)LIVE.fed.calls=fed.total_calls;}
  if(co&&co.tasks){LIVE.coord.queued=co.tasks.queued;LIVE.coord.completed=co.tasks.completed;LIVE.coord.active=(co.agents&&co.agents.active)||LIVE.coord.active;}
  paintBar(); if(curApp)renderApp(curApp,true);
}

function paintBar(){
  document.getElementById('kstat').textContent=(LIVE.king.cl?LIVE.king.cl.toFixed(2):'–')+' · '+LIVE.king.agents+' ag';
  document.getElementById('astat').textContent='v'+LIVE.api.ver+' · '+LIVE.api.total+'n';

  document.getElementById('kdot').className='sdot'+(LIVE.king.health==='healthy'?'':' warn');
  document.getElementById('adot').className='sdot'+(LIVE.api.code===200?'':' warn');
  document.getElementById('tbRight').textContent='MEOK Sovereign · '+(LIVEMODE?'LIVE ✦':'snapshot');
}

function tick(){const now=new Date();const t=new Date(Date.UTC(2026,6,4,0,0,0));const d=t-now;const days=Math.floor(d/864e5);const h=Math.floor(d%864e5/36e5);document.getElementById('cd').textContent=d>0?('T-'+days+'d '+h+'h → 4 Jul'):'LAUNCH DAY';document.getElementById('clock').textContent=now.toTimeString().slice(0,5);}
setInterval(tick,1000);

/* ---------- apps ---------- */
const APPS={
 king:{i:'◉',t:'King Console',w:520},
 council:{i:'⚖️',t:'Aethelgard Council',w:520},

};

const MEOK_EARTH_URL='http://localhost:5173';
const TILES=['king','council','fleet','hives','meokearth','one','chars','archetypes','watchdog','revenue','runway','coord','atlas','truth','protocol0','labs','archive','execute'];

function content(id){const L=LIVE;const liveBadge=LIVEMODE?'<span class="chip live">LIVE ✦</span>':'<span class="chip warnc">snapshot</span>';
 switch(id){
 case 'king': return `<div class="row">${liveBadge}<span class="chip on">${L.king.health}</span><span class="chip">v${L.king.ver}</span><span class="chip">${L.king.mode||'waking'}</span></div>

/* ---------- window manager ---------- */
let zTop=20, curApp=null; const open={};
function openApp(id){
 if(open[id]){focus(id);return;}
 const a=APPS[id];const d=document.getElementById('frame');
 const n=document.createElement('div');n.className='win';n.style.width=(a.w||520)+'px';
 const idx=Object.keys(open).length; n.style.left=(60+idx*26)+'px'; n.style.top=(60+idx*22)+'px'; n.style.zIndex=++zTop;
 n.innerHTML=`<div class="wb"><span class="wt"><span class="wi">${a.i}</span>${a.t}</span><span class="x">✕</span></div><div class="body" id="b-${id}">${content(id)}</div>`;
 d.appendChild(n);open[id]=n;curApp=id;
 n.querySelector('.x').onclick=()=>{n.remove();delete open[id];paintTb();if(curApp===id)curApp=null;};
 n.addEventListener('mousedown',()=>focus(id));
 drag(n,n.querySelector('.wb'));paintTb();
}
function focus(id){if(open[id]){open[id].style.zIndex=++zTop;curApp=id;}}
function renderApp(id,quiet){if(open[id]){const b=open[id].querySelector('.body');if(b)b.innerHTML=content(id);}}
function paintTb(){const t=document.getElementById('tbOpen');t.innerHTML='';Object.keys(open).forEach(id=>{const p=document.createElement('div');p.className='tb-pill active';p.innerHTML=APPS[id].i+' '+APPS[id].t;p.onclick=()=>focus(id);t.appendChild(p);});}
function drag(win,handle){let ox,oy,on=false;
 handle.addEventListener('mousedown',e=>{on=true;ox=e.clientX-win.offsetLeft;oy=e.clientY-win.offsetTop;handle.style.cursor='grabbing';e.preventDefault();});
 document.addEventListener('mousemove',e=>{if(!on)return;win.style.left=Math.max(0,e.clientX-ox)+'px';win.style.top=Math.max(40,e.clientY-oy)+'px';});
 document.addEventListener('mouseup',()=>{on=false;handle.style.cursor='grab';});}

/* ---------- tiles ---------- */
function paintTiles(){const t=document.getElementById('tiles');t.innerHTML='';TILES.forEach(id=>{const a=APPS[id];const el=document.createElement('div');el.className='tile';el.innerHTML=`<div class="ic">${a.i}</div><span>${a.t}</span>`;el.onclick=()=>openApp(id);t.appendChild(el);});}

/* ---------- boot ---------- */

function boot(){const b=document.getElementById('boot'),log=document.getElementById('bootlog');b.classList.remove('hide');log.textContent='';let i=0;(function step(){if(i<BLINES.length){log.textContent+= '> '+BLINES[i]+'\n';i++;setTimeout(step,260);}else{log.innerHTML+='<span class="cursorbar"></span>';setTimeout(()=>b.classList.add('hide'),1100);}})();}
