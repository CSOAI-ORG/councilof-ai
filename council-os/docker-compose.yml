# Council OS — the four services a coding agent can run. Stop here.
#   docker compose -f council-os/docker-compose.yml up --build
# API / Postgres / Redis / nginx. Healthchecks. Non-root. No swarm.
services:
  postgres:
    image: postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_USER: council
      POSTGRES_PASSWORD: council
      POSTGRES_DB: council_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U council -d council_os"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    user: redis
    # Private compose network only (not published). protected-mode would
    # accept the TCP handshake from api then refuse every command.
    command: ["redis-server", "--appendonly", "no", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../api-server
      dockerfile: Dockerfile
    user: node
    environment:
      PORT: "8080"
      APP_ORIGIN: "http://localhost:8080"
      DATABASE_URL: postgres://council:council@postgres:5432/council_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  pgdata:
