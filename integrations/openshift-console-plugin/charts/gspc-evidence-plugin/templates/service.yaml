apiVersion: v1
kind: Service
metadata:
  name: {{ include "gspc.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gspc.labels" . | indent 4 }}
{{- if .Values.consolePlugin.enabled }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "gspc.name" . }}-cert
{{- end }}
spec:
  selector:
    app: {{ include "gspc.name" . }}
  ports:
  {{- if .Values.consolePlugin.enabled }}
    - name: {{ .Values.plugin.port }}-tcp
      protocol: TCP
      port: {{ .Values.plugin.port }}
      targetPort: {{ .Values.plugin.port }}
  {{- end }}
    - name: http
      protocol: TCP
      port: {{ .Values.plugin.httpPort }}
      targetPort: {{ .Values.plugin.httpPort }}
