apiVersion: v1
kind: Service
metadata:
  name: gspc-evidence-plugin
  labels:
    app: gspc-evidence-plugin
    app.kubernetes.io/name: gspc-evidence-plugin
    app.kubernetes.io/instance: gspc-evidence
    app.kubernetes.io/part-of: gspc-evidence
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app: gspc-evidence-plugin
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
