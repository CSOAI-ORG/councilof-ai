# Source: gspc-evidence-plugin/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gspc-evidence-plugin
  labels:
    app: gspc-evidence-plugin
    app.kubernetes.io/name: gspc-evidence-plugin
    app.kubernetes.io/instance: gspc-evidence
    app.kubernetes.io/part-of: gspc-evidence
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gspc-evidence-plugin
  template:
    metadata:
      labels:
        app: gspc-evidence-plugin
        app.kubernetes.io/name: gspc-evidence-plugin
        app.kubernetes.io/instance: gspc-evidence
        app.kubernetes.io/part-of: gspc-evidence
        app.kubernetes.io/managed-by: Helm
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gspc-evidence-plugin
          image: registry.access.redhat.com/ubi9/nginx-120:latest
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: nginx-conf
              readOnly: true
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: standalone
              readOnly: true
              mountPath: /usr/share/nginx/html/standalone
      volumes:
        - name: nginx-conf
          configMap:
            name: gspc-evidence-plugin
            defaultMode: 420
        - name: standalone
          configMap:
            name: gspc-evidence-plugin-standalone
            defaultMode: 420
---
# Source: gspc-evidence-plugin/templates/route.yaml
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gspc-evidence-plugin
  labels:
    app: gspc-evidence-plugin
    app.kubernetes.io/name: gspc-evidence-plugin
    app.kubernetes.io/instance: gspc-evidence
    app.kubernetes.io/part-of: gspc-evidence
    app.kubernetes.io/managed-by: Helm
spec:
  to:
    kind: Service
    name: gspc-evidence-plugin
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
