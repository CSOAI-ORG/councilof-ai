  nginx.conf: |
    error_log /dev/stderr;
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      keepalive_timeout 65;
      server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        ssl_certificate /var/cert/tls.crt;
        ssl_certificate_key /var/cert/tls.key;
        root /usr/share/nginx/html;
      }
      server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html/standalone;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://councilof.ai; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
