  pyproject.toml: "[build-system]\nrequires = [\"setuptools>=64\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"llama-stack-provider-csoai\"\nversion = \"0.1.0\"\ndescription = \"Llama Stack out-of-tree eval provider (remote::csoai): verify CSOAI signed evidence batches offline and return each event's state, never a score.\"\nlicense = {text = \"Apache-2.0\"}\nrequires-python = \">=3.12\"\ndependencies = [\"llama-stack>=0.7\", \"mcp<2\", \"cryptography>=41\"]  # mcp<2: see README\n\n[tool.setuptools.packages.find]\nwhere = [\"src\"]\n"
  run.yaml: "# llama stack run run.yaml   (from packages/llama-stack-provider-csoai; CSOAI_DID_JSON points at the pinned did.json)\nversion: 2\ndistro_name: csoai-evidence\napis:\n- eval\nproviders:\n  eval:\n  - provider_id: csoai\n    provider_type: remote::csoai\n    module: llama_stack_provider_csoai\n    config:\n      did_json: ${env.CSOAI_DID_JSON:=./fixtures/test-did.json}\nstorage:\n  backends:\n    kv_default:\n      type: kv_sqlite\n      db_path: ${env.SQLITE_STORE_DIR:=./.tmp}/kvstore.db\n    sql_default:\n      type: sql_sqlite\n      db_path: ${env.SQLITE_STORE_DIR:=./.tmp}/sql_store.db\n  stores:\n    metadata:\n      namespace: registry\n      backend: kv_default\n    inference:\n      table_name: inference_store\n      backend: sql_default\n    conversations:\n      table_name: openai_conversations\n      backend: sql_default\n    prompts:\n      namespace: prompts\n      backend: kv_default\n    connectors:\n      namespace: connectors\n      backend: kv_default\nregistered_resources:\n  models: []\n  shields: []\n  vector_dbs: []\n  datasets: []\n  scoring_fns: []\n  benchmarks: []\nserver:\n  port: 8321\n"
