# Sourcetypes written by packages/evidence-fabric (render/ecs_hec.py, render/ocsf.py).
# The events carry states (CONSISTENT, DIVERGENT, UNMEASURED, ...), never a risk score.
[csoai:evidence:ecs]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "@timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
FIELDALIAS-gspc_subject = "csoai.subject.locator" AS gspc_subject
FIELDALIAS-gspc_state = "csoai.state" AS gspc_state

[csoai:evidence:ocsf]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "time":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
FIELDALIAS-gspc_subject = "resources{}.uid" AS gspc_subject
FIELDALIAS-gspc_state = "unmapped.csoai.state" AS gspc_state
