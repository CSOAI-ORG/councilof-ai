  colors:
    primary: "#0B1F3A"
    accent: "#2EC4B6"
    ink: "#0E0E0E"
  motto: "Sovereign AI that refuses to be a black box."
  short_description: >
    MEOK AI OS is a sovereign, attested, Care-First operating system for
    human-first AI. It unifies a hardware-rooted trust plane, a 33-hive
    compliance substrate, and a Care-First enforcement kernel, and lands
    across cloud-native, edge, AI/ML, and security quadrants of the
    Linux Foundation landscape.
  cross_quadrant_memberships:
    - CNCF
    - LF AI
    - LF Edge
    - LF Security
  linked_lf_projects:
    - starlingx
    - akraino
    - openbmc
    - sigstore
    - kyverno
  notes: >
    MEOK's distinctive value is the cross-quadrant spread: a single
    project that simultaneously qualifies as Cloud-Native (operators,
    storage, CNI), Edge (StarlingX, OpenBMC), AI/ML (serving, safety,
    governance), and Security (attestation, compliance-as-code).
