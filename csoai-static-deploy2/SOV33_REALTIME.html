<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>📡 SOV33 Real-Time Monitor — Live Feed</title>
<meta name="description" content="SOV33 realtime — the sovereign live event stream: BFT council votes, SIGIL receipts, OWEM telemetry, EU AI Act Article 50 passport issuance, all auditable.">
<meta name="keywords" content="SOV3, SOV33, CSOAI, sovereign AI, EU AI Act, GDPR, ISO 42001, SIGIL, BFT, OWEM">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0a0e1a;--bg2:#0d1220;--ink:#e6e6e6;--accent:#d4af37;--accent2:#00ff9d;--warn:#ff6b6b;--muted:#6b7280;--rule:#1f2937 }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"JetBrains Mono",ui-monospace,monospace;background:var(--bg);color:var(--ink);padding:1.5rem;line-height:1.55;max-width:1300px;margin:0 auto}
  h1{color:var(--accent);font-size:2.2rem;border-bottom:2px solid var(--accent);padding-bottom:.5rem}
  h2{color:var(--accent2);font-size:1.5rem;border-bottom:1px solid var(--rule);padding-bottom:.3rem;margin-top:2rem}
  code{background:#1a1f2e;padding:.1em .4em;border-radius:3px;color:var(--accent2);font-size:.9em;word-break:break-all}
  .pill{display:inline-block;background:#1a1f2e;color:var(--accent2);padding:.25em .7em;border-radius:12px;font-size:.85em;margin:0 .3em .3em 0;border:1px solid #2a2f3e}
  .pill.sigil{background:#0d3320;color:var(--accent2);border-color:var(--accent2)}
  .meta{color:var(--muted);font-size:.9em}
  a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
  .card{background:var(--bg2);padding:1.5rem 2rem;border-radius:8px;border-left:3px solid var(--accent2);margin:1rem 0}
  .card.gold{border-left-color:var(--accent)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:1rem 0}
  .stat{background:var(--bg);padding:1rem;border-radius:6px;text-align:center}
  .stat .num{font-size:1.8rem;font-weight:bold;color:var(--accent)}
  .stat .label{color:var(--muted);font-size:.8em}
  .live-feed{background:var(--bg);padding:1rem;border-radius:6px;border:1px solid var(--rule);font-family:monospace;font-size:.85em;max-height:300px;overflow-y:auto}
  .live-feed .item{padding:.3rem 0;border-bottom:1px dashed var(--rule)}
  .live-feed .item.sigil{color:var(--accent2)}
  button{background:var(--accent);color:#0a0e1a;border:none;padding:.7rem 1.2rem;border-radius:6px;font-weight:bold;cursor:pointer}
  @media (max-width:768px){.grid3{grid-template-columns:1fr 1fr}}
</style>
<link rel="canonical" href="https://csoai-static-deploy2.vercel.app/SOV33_REALTIME.html">
</head>
<body>

<header class="card gold">
  <h1>📡 SOV33 Real-Time Monitor</h1>
  <p class="meta">Live feed · auto-refreshes every 2 seconds · 12 Jul 2026</p>
  <p><a href="SOV33_HERO.html">← SOV33 Hub</a></p>
</header>

<h2>Live System State</h2>

<div class="grid3" id="live-state"></div>

<h2>Live Activity Feed</h2>

<div class="card">
  <p>Every request shows up here in real time.</p>
  <button onclick="fireRequest()">Fire a Test Request</button>
  <button onclick="clearFeed()" style="background:var(--warn)">Clear Feed</button>
  <div class="live-feed" id="feed"></div>
</div>

<h2>Endpoint Health (last 30 seconds)</h2>

<div class="card">
  <pre id="health">Loading...</pre>
</div>

<hr>

<p class="meta" style="text-align:center;margin-top:2rem">
  <strong>📡 SOV33 Real-Time Monitor</strong> · 12 Jul 2026 · Hermes lane<br>
  <a href="SOV33_HERO.html">← Back to SOV33</a>
</p>

<script>
const API = 'http://localhost:8101';
let feed = [];

function addToFeed(msg, type='') {
  const ts = new Date().toLocaleTimeString();
  feed.unshift({ts, msg, type});
  if (feed.length > 50) feed = feed.slice(0, 50);
  renderFeed();
}

function renderFeed() {
  const el = document.getElementById('feed');
  if (feed.length === 0) {
    el.innerHTML = '<p class="meta">No activity yet. Click "Fire a Test Request" to start.</p>';
    return;
  }
  el.innerHTML = feed.map(f => 
    `<div class="item ${f.type}">[${f.ts}] ${f.msg}</div>`
  ).join('');
}

function clearFeed() {
  feed = [];
  renderFeed();
}

async function loadState() {
  try {
    const r = await fetch(API + '/api/admin/status');
    const d = await r.json();
    const stats = [
      {num: d.registry.total_models, label: 'Models'},
      {num: d.evals.total_runs, label: 'Eval Runs'},
      {num: d.rho.configs_measured, label: 'ρ Configs'},
      {num: d.memory.total_entries, label: 'Memories'},
      {num: d.continual_learning.replay_buffer, label: 'Replay'},
      {num: d.registry.sovereign_safe, label: 'Sov-Safe'},
    ];
    document.getElementById('live-state').innerHTML = stats.map(s =>
      `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`
    ).join('');
  } catch (e) {}
}

async function checkHealth() {
  const eps = ['/health', '/api/status', '/api/registry', '/api/evals', '/api/master'];
  const out = [];
  for (const ep of eps) {
    try {
      const t0 = Date.now();
      const r = await fetch(API + ep);
      const ms = Date.now() - t0;
      out.push(`  ${r.status === 200 ? '✓' : '✗'} ${ep} (${ms}ms)`);
    } catch (e) {
      out.push(`  ✗ ${ep}: ${e.message}`);
    }
  }
  document.getElementById('health').textContent = out.join('\n');
}

async function fireRequest() {
  addToFeed('→ POST /api/orchestrate (What is Article 0?)');
  try {
    const t0 = Date.now();
    const r = await fetch(API + '/api/orchestrate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: 'What is Article 0?', citizen: 'voice'})
    });
    const d = await r.json();
    const ms = Date.now() - t0;
    addToFeed(`← ${r.status} /api/orchestrate (${ms}ms) · brain=${d.brain} · care=${d.sovereign_provenance?.care_floor}`, 'sigil');
  } catch (e) {
    addToFeed(`✗ Error: ${e.message}`, 'warn');
  }
}

// Auto-refresh
loadState();
checkHealth();
renderFeed();
setInterval(() => {
  loadState();
  checkHealth();
}, 2000);
</script>

</body>
</html>
