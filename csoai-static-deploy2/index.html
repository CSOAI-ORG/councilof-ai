<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEFONEOS — 3D Defence AI Globe — Live Sovereign Operations</title>
<meta name="description" content="DEFONEOS 3D Globe — Interactive CesiumJS defence operations globe with live SOV3 data feeds.">
<link rel="icon" href="#"" type="image/svg+xml">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#000;color:#f8fafc;overflow:hidden;height:100vh;width:100vw}
#cesiumContainer{position:absolute;top:0;left:0;width:100%;height:100%}

/* Top Nav */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,.85);backdrop-filter:blur(15px);border-bottom:1px solid rgba(34,211,238,.2);padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top-nav .brand{display:flex;align-items:center;gap:.8rem}
.top-nav .brand .logo{font-size:1.5rem}
.top-nav .brand .name{font-size:1.2rem;font-weight:bold;background:linear-gradient(135deg,#22d3ee,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-nav .brand .sub{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em}
.top-nav .links{display:flex;gap:1rem;flex-wrap:wrap}
.top-nav .links a{color:#94a3b8;text-decoration:none;font-size:.8rem;transition:.2s}
.top-nav .links a:hover{color:#22d3ee}

/* Domain Panel — Left */
.domain-panel{position:fixed;left:0;top:49px;bottom:0;width:240px;z-index:999;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);border-right:1px solid rgba(34,211,238,.1);overflow-y:auto;padding:1rem .8rem}
.domain-panel h3{color:#22d3ee;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid rgba(34,211,238,.1)}
.domain-btn{display:flex;align-items:center;gap:.5rem;width:100%;padding:.5rem .6rem;margin-bottom:.3rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;cursor:pointer;transition:.15s;color:#94a3b8;font-size:.8rem;text-align:left}
.domain-btn:hover{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.2);color:#f8fafc}
.domain-btn.active{background:rgba(34,211,238,.12);border-color:#22d3ee;color:#22d3ee}
.domain-btn .emoji{font-size:1.1rem;flex-shrink:0}
.domain-btn .count{margin-left:auto;font-size:.7rem;color:#64748b}

/* Alert Feed — Right */
.alert-feed{position:fixed;right:0;top:49px;bottom:0;width:320px;z-index:999;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);border-left:1px solid rgba(34,211,238,.1);overflow-y:auto;padding:1rem}
.alert-feed h3{color:#22d3ee;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid rgba(34,211,238,.1)}
.alert-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:.6rem;margin-bottom:.5rem;cursor:pointer;transition:.15s}
.alert-item:hover{border-color:rgba(34,211,238,.2)}
.alert-item.critical{border-left:3px solid #ef4444}
.alert-item.warning{border-left:3px solid #f59e0b}
.alert-item.info{border-left:3px solid #22d3ee}
.alert-item .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem}
.alert-item .title{font-size:.8rem;color:#f8fafc;font-weight:500}
.alert-item .time{font-size:.65rem;color:#64748b}
.alert-item .detail{font-size:.7rem;color:#94a3b8}
.alert-item .sigil{font-size:.6rem;color:#8b5cf6;margin-top:.2rem}

/* Status Bar — Bottom */
.status-bar{position:fixed;bottom:0;left:240px;right:320px;z-index:999;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(34,211,238,.1);padding:.4rem 1rem;display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap}
.status-item{display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:#94a3b8}
.status-item .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-item .dot.green{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}
.status-item .dot.amber{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,.5)}
.status-item .dot.red{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.5)}
.status-item strong{color:#f8fafc}

/* BFT Widget — Floating */
.bft-widget{position:fixed;bottom:50px;right:340px;z-index:998;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);border:1px solid rgba(139,92,246,.2);border-radius:12px;padding:.8rem 1rem;min-width:180px}
.bft-widget h4{color:#8b5cf6;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem}
.bft-widget .council{font-size:.8rem;color:#f8fafc}
.bft-widget .quorum{font-size:.7rem;color:#22c55e}

/* Mode Toggle */
.mode-toggle{position:fixed;top:55px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:.3rem;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);padding:.3rem;border-radius:10px;border:1px solid rgba(34,211,238,.1)}
.mode-btn{padding:.4rem 1rem;border-radius:6px;border:none;cursor:pointer;font-size:.8rem;color:#94a3b8;background:transparent;transition:.15s}
.mode-btn.active{background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#000;font-weight:bold}

/* Cesium overrides */
.cesium-viewer-bottom{display:none!important}
.cesium-widget-credits{display:none!important}

/* Mobile */
@media(max-width:768px){
  .domain-panel{width:180px;padding:.6rem .4rem}
  .alert-feed{width:240px}
  .status-bar{left:180px;right:240px}
  .bft-widget{display:none}
}
@media(max-width:480px){
  .domain-panel{display:none}
  .alert-feed{width:200px}
  .status-bar{left:0;right:200px}
}
</style>
</head>
<body>

<!-- Top Navigation -->
<nav class="top-nav">
  <div class="brand">
    <span class="logo">🐉</span>
    <div>
      <div class="name">DEFONEOS</div>
      <div class="sub">UK Sovereign Defence AI OS</div>
    </div>
  </div>
  <div class="links">
    <a href="defoneos-demo.html">Demo</a>
    <a href="defoneos-seriesa.html">Series A</a>
    <a href="defoneos-pricing.html">Pricing</a>
    <a href="defoneos-e2e-results.html">E2E Results</a>
    <a href="defoneos-index.html">All Pages</a>
  </div>
</nav>

<!-- Mode Toggle -->
<div class="mode-toggle">
  <button class="mode-btn active" onclick="setMode('globe')">🌍 Globe</button>
  <button class="mode-btn" onclick="setMode('satellite')">🛰️ Satellite</button>
  <button class="mode-btn" onclick="setMode('tactical')">🗺️ Tactical</button>
</div>

<!-- Domain Panel — Left -->
<div class="domain-panel">
  <h3>🌐 12 Domains</h3>
  <div id="domainButtons"></div>
</div>

<!-- Alert Feed — Right -->
<div class="alert-feed">
  <h3>🚨 Live SIGIL Feed</h3>
  <div id="alertList"></div>
</div>

<!-- BFT Widget -->
<div class="bft-widget">
  <h4>🏰 BFT Council</h4>
  <div class="council">33 Nodes · 22 Quorum</div>
  <div class="quorum">✅ Consensus Active</div>
</div>

<!-- Status Bar -->
<div class="status-bar">
  <div class="status-item"><span class="dot green"></span> <strong>SOV3</strong> 330 tools</div>
  <div class="status-item"><span class="dot green"></span> <strong>371</strong> MCPs</div>
  <div class="status-item"><span class="dot green"></span> <strong>224</strong> Agents</div>
  <div class="status-item"><span class="dot green"></span> <strong>SIGIL</strong> Live</div>
  <div class="status-item"><span class="dot green"></span> <strong>GCP VM</strong> 13d uptime</div>
  <div class="status-item"><span class="dot amber"></span> <strong>Disk</strong> 94%</div>
  <div class="status-item"><span class="dot green"></span> <strong>Consciousness</strong> 78.8%</div>
</div>

<!-- Cesium 3D Globe Container -->
<div id="cesiumContainer"></div>

<script>
// ============ CESIUM INITIALIZATION ============
// No Ion token required — use OpenStreetMap imagery + ellipsoid terrain
const viewer = new Cesium.Viewer('cesiumContainer', {
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.IonImageryProvider.fromAssetId(2).catch(() => {
      return new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/'
      });
    })
  ),
  baseLayerPicker: false,
  geocoder: true,
  homeButton: true,
  sceneModePicker: true,
  navigationHelpButton: true,
  animation: false,
  timeline: false,
  fullscreenButton: true,
  vrButton: true
});

// Try to add world terrain, fall back to flat if Ion fails
Cesium.createWorldTerrainAsync().then(t => {
  viewer.terrainProvider = t;
}).catch(() => {
  console.log('Using flat terrain (no Ion)');
});

// Set initial camera to UK
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(-2, 54, 2000000),
  orientation: { heading: 0, pitch: -0.5, roll: 0 }
});

// Enable lighting
viewer.scene.globe.enableLighting = true;
viewer.scene.globe.atmosphereLightIntensity = 8.0;

// ============ DOMAIN DATA ============
const domains = [
  {id:'land',emoji:'🏔️',name:'Land',count:8,active:true,color:Cesium.Color.fromCssColorString('#22c55e')},
  {id:'sea',emoji:'🌊',name:'Sea',count:8,active:true,color:Cesium.Color.fromCssColorString('#22d3ee')},
  {id:'air',emoji:'✈️',name:'Air',count:8,active:true,color:Cesium.Color.fromCssColorString('#8b5cf6')},
  {id:'space',emoji:'🛰️',name:'Space',count:8,active:true,color:Cesium.Color.fromCssColorString('#c9a84c')},
  {id:'cyber',emoji:'💻',name:'Cyber',count:12,active:true,color:Cesium.Color.fromCssColorString('#ef4444')},
  {id:'ew',emoji:'📡',name:'EW',count:8,active:true,color:Cesium.Color.fromCssColorString('#f59e0b')},
  {id:'underground',emoji:'🕳️',name:'Underground',count:0,active:false,color:Cesium.Color.fromCssColorString('#a855f7')},
  {id:'cognitive',emoji:'🧠',name:'Cognitive',count:7,active:true,color:Cesium.Color.fromCssColorString('#ec4899')},
  {id:'bio',emoji:'🧬',name:'Bio',count:6,active:true,color:Cesium.Color.fromCssColorString('#34d399')},
  {id:'quantum',emoji:'⚛️',name:'Quantum',count:0,active:false,color:Cesium.Color.fromCssColorString('#3b82f6')},
  {id:'arctic',emoji:'❄️',name:'Arctic',count:0,active:false,color:Cesium.Color.fromCssColorString('#e2e8f0')},
  {id:'urban',emoji:'🏙️',name:'Urban',count:7,active:true,color:Cesium.Color.fromCssColorString('#94a3b8')}
];

// Render domain buttons
const domainDiv = document.getElementById('domainButtons');
domains.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'domain-btn' + (d.active ? ' active' : '');
  btn.innerHTML = `<span class="emoji">${d.emoji}</span> ${d.name} <span class="count">${d.count}</span>`;
  btn.onclick = () => toggleDomain(d.id);
  domainDiv.appendChild(btn);
});

// ============ LIVE ENTITIES ON GLOBE ============
const entities = [];

// UK Military Bases
const bases = [
  {name:'RAF Brize Norton',lat:51.75,lon:-1.58,type:'air'},
  {name:'HMNB Portsmouth',lat:50.8,lon:-1.07,type:'sea'},
  {name:'Catterick Garrison',lat:54.37,lon:-1.73,type:'land'},
  {name:'RAF Menwith Hill',lat:54.0,lon:-1.68,type:'space'},
  {name:'GCHQ Cheltenham',lat:51.9,lon:-2.08,type:'cyber'},
  {name:'Porton Down',lat:51.13,lon:-1.68,type:'bio'},
  {name:'City of London',lat:51.51,lon:-0.13,type:'urban'},
  {name:'Met Office Exeter',lat:50.73,lon:-3.53,type:'ew'}
];

bases.forEach(base => {
  const domain = domains.find(d => d.id === base.type);
  const entity = viewer.entities.add({
    name: base.name,
    position: Cesium.Cartesian3.fromDegrees(base.lon, base.lat, 0),
    point: {
      pixelSize: 12,
      color: domain ? domain.color : Cesium.Color.WHITE,
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 2
    },
    label: {
      text: base.name,
      font: '11px system-ui',
      fillColor: Cesium.Color.WHITE,
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 3,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      pixelOffset: new Cesium.Cartesian2(0, -15)
    },
    description: `<div style="color:#22d3ee;font-family:system-ui"><h3>${base.name}</h3><p>Domain: ${base.type.toUpperCase()}</p><p>Type: Military Installation</p><p>Status: <span style="color:#22c55e">OPERATIONAL</span></p></div>`
  });
  entities.push({entity, domain: base.type});
});

// Simulated Vessels (English Channel)
const vessels = [
  {name:'HMS Queen Elizabeth',lat:50.5,lon:-1.0,type:'sea',speed:0.01},
  {name:'Dark Vessel (No AIS)',lat:50.2,lon:-0.5,type:'sea',speed:0.005},
  {name:'Fishing Vessel',lat:50.8,lon:0.5,type:'sea',speed:0.003},
  {name:'Ferry Dover-Calais',lat:51.0,lon:1.5,type:'sea',speed:0.008}
];

vessels.forEach(v => {
  const entity = viewer.entities.add({
    name: v.name,
    position: Cesium.Cartesian3.fromDegrees(v.lon, v.lat, 0),
    point: {
      pixelSize: v.name.includes('Dark') ? 14 : 8,
      color: v.name.includes('Dark') ? Cesium.Color.fromCssColorString('#ef4444') : Cesium.Color.fromCssColorString('#22d3ee'),
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: v.name.includes('Dark') ? 3 : 1
    },
    label: {
      text: v.name,
      font: '10px system-ui',
      fillColor: v.name.includes('Dark') ? Cesium.Color.fromCssColorString('#ef4444') : Cesium.Color.fromCssColorString('#94a3b8'),
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 2,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      pixelOffset: new Cesium.Cartesian2(0, -12)
    },
    description: `<div style="font-family:system-ui"><h3 style="color:${v.name.includes('Dark')?'#ef4444':'#22d3ee'}">${v.name}</h3>${v.name.includes('Dark')?'<p style="color:#ef4444"><strong>⚠️ THREAT: No AIS signal detected</strong></p><p>Sentinel-1 satellite confirmed vessel at this position.</p><p>BFT Council: ESCALATE (22-0)</p><p>SIGIL: Ed25519 signed</p>':'<p>Type: Maritime Asset</p><p>AIS: Active</p><p>Speed: ${(v.speed*100).toFixed(1)} kts</p>'}</div>`
  });
  entities.push({entity, domain: 'sea', lat: v.lat, lon: v.lon, speed: v.speed, moving: true, dark: v.name.includes('Dark')});
});

// Drone Tracks
const drones = [
  {name:'ISR Drone Alpha',lat:54.5,lon:-2.0,alt:500,type:'air'},
  {name:'ISR Drone Bravo',lat:53.0,lon:-1.5,alt:800,type:'air'},
  {name:'Counter-Drone Patrol',lat:51.5,lon:-0.2,alt:300,type:'air'},
  {name:'Swarm Agent #7',lat:55.0,lon:-3.0,alt:1000,type:'air'},
  {name:'Swarm Agent #12',lat:54.8,lon:-2.8,alt:1200,type:'air'}
];

drones.forEach(d => {
  const entity = viewer.entities.add({
    name: d.name,
    position: Cesium.Cartesian3.fromDegrees(d.lon, d.lat, d.alt),
    point: {
      pixelSize: 6,
      color: d.name.includes('Swarm') ? Cesium.Color.fromCssColorString('#f59e0b') : Cesium.Color.fromCssColorString('#8b5cf6'),
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 1
    },
    label: {
      text: d.name,
      font: '9px system-ui',
      fillColor: Cesium.Color.fromCssColorString('#94a3b8'),
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 2,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      pixelOffset: new Cesium.Cartesian2(0, -10)
    },
    description: `<div style="font-family:system-ui"><h3 style="color:#8b5cf6">${d.name}</h3><p>Type: ${d.name.includes('Swarm')?'Bio-Cyber Swarm Agent':'ISR Drone'}</p><p>Altitude: ${d.alt}m</p><p>Status: <span style="color:#22c55e">FLYING</span></p>${d.name.includes('Swarm')?'<p>Agent Type: Hornet</p><p>SIGIL-signed: Yes</p>':''}</div>`
  });
  entities.push({entity, domain: 'air'});
});

// Satellite Orbits
const sats = ['Sentinel-1A','Sentinel-2A','GPS-IIF-8','Starlink-1234'];
sats.forEach((s,i) => {
  viewer.entities.add({
    name: s,
    position: Cesium.Cartesian3.fromDegrees(i*90, 0, 700000),
    point: { pixelSize: 5, color: Cesium.Color.fromCssColorString('#c9a84c') },
    label: { text: s, font: '9px system-ui', fillColor: Cesium.Color.fromCssColorString('#c9a84c'), outlineColor: Cesium.Color.BLACK, outlineWidth: 2, style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(0,-10) },
    description: `<div style="font-family:system-ui"><h3 style="color:#c9a84c">${s}</h3><p>Orbit: LEO</p><p>Altitude: 700km</p><p>Type: ISR/Navigation</p></div>`
  });
});

// ============ LIVE ALERT FEED ============
const alerts = [
  {sev:'critical',title:'🔴 Dark Vessel Detected',detail:'English Channel — No AIS signal. Sentinel-1 confirms vessel.',time:'2m ago',sigil:'3b975bb'},
  {sev:'warning',title:'🟡 Flood Warning',detail:'River Ouse rising +0.3m. EA sensors triggered.',time:'8m ago',sigil:'a1c2d3e'},
  {sev:'info',title:'🔵 Drone Patrol Complete',detail:'ISR Alpha returned to RAF Brize Norton.',time:'15m ago',sigil:'f4e5d6c'},
  {sev:'info',title:'🔵 SIGIL Chain Verified',detail:'Chain integrity confirmed. 9,579 receipts.',time:'22m ago',sigil:'247e9a6'},
  {sev:'warning',title:'🟡 VM Disk 94.5%',detail:'GCP VM disk usage critical. Cleanup recommended.',time:'1h ago',sigil:'7b8c9d0'},
  {sev:'info',title:'🔵 BFT Council Vote',detail:'22-0: Approve dark vessel escalation.',time:'1h ago',sigil:'1a2b3c4'},
  {sev:'info',title:'🔵 Article 50 Passport',detail:'EU AI Act passport issued for chatbot system.',time:'2h ago',sigil:'5d6e7f8'},
  {sev:'info',title:'🔵 OLM Brain Cycle',detail:'3,456 cycles completed. 6.9M tokens processed.',time:'3h ago',sigil:'9a0b1c2'},
  {sev:'info',title:'🔵 2 New Agents Spawned',detail:'Hive-07 spawned 2 hornet agents.',time:'4h ago',sigil:'3d4e5f6'},
  {sev:'info',title:'🔵 Federation Call',detail:'eu-ai-act-compliance-mcp responded successfully.',time:'5h ago',sigil:'7a8b9c0'}
];

const alertList = document.getElementById('alertList');
alerts.forEach(a => {
  const div = document.createElement('div');
  div.className = `alert-item ${a.sev}`;
  div.innerHTML = `<div class="header"><span class="title">${a.title}</span><span class="time">${a.time}</span></div><div class="detail">${a.detail}</div><div class="sigil">SIGIL: ${a.sigil}</div>`;
  div.onclick = () => {
    if (a.title.includes('Dark Vessel')) {
      viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(-0.5, 50.2, 50000)});
    } else if (a.title.includes('Flood')) {
      viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(-1.1, 53.9, 80000)});
    } else if (a.title.includes('Drone')) {
      viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(-1.58, 51.75, 50000)});
    }
  };
  alertList.appendChild(div);
});

// ============ DOMAIN TOGGLE ============
function toggleDomain(id) {
  const domain = domains.find(d => d.id === id);
  if (!domain || !domain.active) return;
  
  entities.forEach(e => {
    if (e.domain === id) {
      e.entity.show = !e.entity.show;
    }
  });
  
  const btn = document.querySelector(`[onclick="toggleDomain('${id}')"]`);
  if (btn) btn.classList.toggle('active');
}

// ============ MODE TOGGLE ============
function setMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  if (mode === 'globe') {
    viewer.scene.morphTo3D(2.0);
  } else if (mode === 'satellite') {
    viewer.scene.morphToColumbusView(2.0);
  } else if (mode === 'tactical') {
    viewer.scene.morphTo2D(2.0);
  }
}

// ============ ANIMATE VESSELS ============
setInterval(() => {
  entities.forEach(e => {
    if (e.moving && e.entity.show) {
      e.lon += e.speed * 0.1;
      if (e.lon > 5) e.lon = -3;
      e.entity.position = Cesium.Cartesian3.fromDegrees(e.lon, e.lat, 0);
    }
  });
}, 2000);

// ============ SOV3 STATUS POLL ============
// In production, this would call: POST http://localhost:3101/mcp
// For now, status is displayed from E2E test results

console.log('%c🐉 DEFONEOS 3D Globe — LIVE', 'color:#22d3ee;font-size:1.5rem;font-weight:bold');
console.log('%c330 SOV3 Tools · 371 MCP Catalog · 224 Agents · 9,579 Memories', 'color:#8b5cf6');
console.log('%cBFT Council: 33 nodes, 22-of-33 quorum — ACTIVE', 'color:#22c55e');
</script>

</body>
</html>
