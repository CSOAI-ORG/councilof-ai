<style>
  html,body{margin:0;height:100%;background:#05070c;color:#e7f6ef;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0}
  /* live public source (real feed injected via ?src= or ?yt=) */
  #feed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#05070c}
  /* synthetic public-street preview (default, clearly labelled) */
  #scene{position:absolute;inset:0;background:
    linear-gradient(180deg,#0a1526 0%,#0c1a2e 42%,#10243b 55%,#0a1220 100%)}
  .road{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,#0e1c2e,#070d16);border-top:1px solid rgba(125,211,252,.15)}
  .lane{position:absolute;left:0;right:0;top:52%;height:2px;background:repeating-linear-gradient(90deg,rgba(250,204,21,.5) 0 26px,transparent 26px 60px)}
  .veh{position:absolute;bottom:16%;width:52px;height:20px;border-radius:4px;box-shadow:0 0 14px rgba(56,189,248,.4)}
  .ped{position:absolute;width:5px;height:12px;border-radius:3px;background:#cbd5e1;bottom:20%;opacity:.85}
  .hum{position:absolute;bottom:19%;width:9px;height:22px;border-radius:4px;background:linear-gradient(#34d399,#0d9488);box-shadow:0 0 16px rgba(52,211,153,.7)}
  .hum:after{content:'';position:absolute;top:-7px;left:1px;width:7px;height:7px;border-radius:50%;background:#6ee7b7}
  @keyframes drive{from{transform:translateX(-120px)}to{transform:translateX(105vw)}}
  @keyframes driveL{from{transform:translateX(105vw) scaleX(-1)}to{transform:translateX(-120px) scaleX(-1)}}
  @keyframes walk{0%{transform:translateX(-40px)}100%{transform:translateX(102vw)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  #scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.11) 0 2px,transparent 2px 4px);mix-blend-mode:overlay}
  #vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 30px rgba(0,0,0,.6)}
  .hud{position:absolute;z-index:5;font-family:ui-monospace,monospace}
  #live{left:12px;top:11px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;letter-spacing:.5px}
  #live .rec{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 9px #ef4444;animation:bl 1.1s infinite}
  @keyframes bl{50%{opacity:.35}}
  #loc{left:12px;top:31px;font-size:11px;color:#9fb6c6}
  #ts{right:12px;top:11px;font-size:12px;color:#bfe6d5}
  #eco{right:12px;top:31px;font-size:10.5px;color:#86efac}
  #foot{left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:#7f97a6}
  #foot b{color:#34d399}
</style>

<h1>Livecam</h1>

<div id="wrap">
  <iframe id="feed" style="display:none" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  <div id="scene">
    <div class="road"></div><div class="lane"></div>
  </div>
  <div id="scan"></div><div id="vig"></div>
  <div class="hud" id="live"><span class="rec"></span>PUBLIC STREET CAM</div>
  <div class="hud" id="loc">◎ locating…</div>
  <div class="hud" id="ts">--:--:--</div>
  <div class="hud" id="eco">AI-economy: — agents · — humanoid · governed ✓</div>
  <div class="hud" id="foot"><span>Public feed · consent-first · <b>no facial recognition</b> · no tracking · no data selling</span><span>Council Signal · Layer 0</span></div>
</div>
<script>
  var q=new URLSearchParams(location.search);
  var loc=q.get('loc')||'a governed city'; document.getElementById('loc').textContent='◎ '+loc+' · live';
  // Real public feed injection point — your cam-API drops a stream URL here.
  var src=q.get('src'), yt=q.get('yt');
  if(yt){ var f=document.getElementById('feed'); f.src='https://www.youtube.com/embed/'+yt+'?autoplay=1&mute=1&controls=0&playsinline=1'; f.style.display='block'; document.getElementById('scene').style.display='none'; }
  else if(src){ var f2=document.getElementById('feed'); f2.src=src; f2.style.display='block'; document.getElementById('scene').style.display='none'; }
  else {
    // Synthetic, clearly-labelled public-street preview so the window is always alive.
    var scene=document.getElementById('scene');
    var carC=['#38bdf8','#f59e0b','#e2e8f0','#a78bfa','#f43f5e'];
    for(var i=0;i<7;i++){ var v=document.createElement('div'); v.className='veh'; v.style.background='linear-gradient(180deg,'+carC[i%5]+',#0b1a2a)';
      var left=i%2===0; v.style.animation=(left?'drive':'driveL')+' '+(6+Math.random()*6).toFixed(1)+'s linear '+(-Math.random()*8).toFixed(1)+'s infinite';
      v.style.bottom=(11+Math.random()*10)+'%'; scene.appendChild(v); }
    for(var p=0;p<14;p++){ var d=document.createElement('div'); d.className='ped'; d.style.left='-40px';
      d.style.bottom=(17+Math.random()*8)+'%'; d.style.animation='walk '+(9+Math.random()*8).toFixed(1)+'s linear '+(-Math.random()*10).toFixed(1)+'s infinite, bob .5s ease-in-out infinite'; scene.appendChild(d); }
    var h=document.createElement('div'); h.className='hum'; h.style.animation='walk 13s linear infinite, bob .45s ease-in-out infinite'; scene.appendChild(h);
    var lbl=document.createElement('div'); lbl.style.cssText='position:absolute;bottom:44%;left:8px;z-index:5;font:700 9px ui-monospace,monospace;color:#6ee7b7;background:rgba(3,17,11,.6);padding:2px 5px;border:1px solid rgba(52,211,153,.4);border-radius:4px'; lbl.textContent='◉ humanoid unit · governed · tracked'; scene.appendChild(lbl);
  }
  function tick(){ var d=new Date(); document.getElementById('ts').textContent=d.toISOString().slice(11,19)+' UTC';
    document.getElementById('eco').textContent='AI-economy: '+(2+Math.floor(Math.random()*4))+' agents · 1 humanoid · governed ✓'; }
  tick(); setInterval(tick,1000);
</script>
