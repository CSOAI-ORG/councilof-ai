# proofof.ai twin — spike policy v0 (default-deny).
# Filesystem: read-only system paths; ONE writable scratch dir. Everything else denied (Landlock).
# Network: no network_policies => every outbound connection is denied.
# Process: unprivileged user, no capabilities.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /proc
    - /dev/urandom
    - /twin/task
  read_write:
    - /twin/scratch
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}
