<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEOK — Your Sovereign Character</title>
<style>
  :root{--cream:#f1eadd;--ink:#1f1c17;--muted:#6b6a63;--gold:#bd9a52;--line:rgba(31,28,23,.1)}
  *{box-sizing:border-box;margin:0;padding:0}
  /* MEOK brand: warm cream + a soft golden halo (the "shared light" of the slides) */
  body{background:radial-gradient(130% 100% at 50% 60%, #fbf3e2 0%, #f4ecdd 44%, #efe6d5 100%);color:var(--ink);font-family:"Geist","Inter",-apple-system,system-ui,sans-serif;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(58% 46% at 50% 58%, rgba(255,193,92,.20), rgba(255,214,150,.07) 46%, transparent 68%)}
  #stage{position:absolute;inset:0;z-index:1}
  canvas{display:block}
  .top{position:absolute;top:0;left:0;right:0;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px}
  .m{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2a2722,#4d473d);display:grid;place-items:center;color:#f4eee1;font-weight:700;font-size:15px}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .cast{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:14px;z-index:5}
  .cc{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:9px 13px;cursor:pointer;transition:.18s;backdrop-filter:blur(6px);min-width:184px}
  .cc:hover{background:rgba(255,255,255,.85);transform:translateX(3px)}
  .cc.on{border-color:var(--gold);background:#fff}
  .cc .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#fff;flex:none}
  .cc b{font-size:14px;display:block;line-height:1.2}.cc span{font-size:11.5px;color:var(--muted)}
  .info{position:absolute;right:24px;top:84px;max-width:240px;text-align:right;z-index:5}
  .info h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
  .info .role{color:var(--gold);font-weight:600;font-size:13px;margin-top:4px}
  .info p{color:var(--muted);font-size:13.5px;margin-top:8px}
  .traits{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px}
  .traits span{font-size:11px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(620px,92vw);z-index:6}
  .log{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding:0 4px}
  .msg{padding:9px 14px;border-radius:14px;font-size:14.5px;max-width:82%;line-height:1.5}
  .msg.you{align-self:flex-end;background:var(--ink);color:#f4eee1;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:rgba(255,255,255,.85);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bar{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 30px -16px rgba(31,28,23,.5)}
  .bar input{flex:1;border:0;background:transparent;font-size:15px;outline:none;color:var(--ink);font-family:inherit}
  .send{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:#f4eee1;font-size:16px;cursor:pointer;flex:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--cream);z-index:9;transition:opacity .6s}
  .loading.hide{opacity:0;pointer-events:none}
  .egg{width:70px;height:90px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 38% 32%,#fff8ec,#e6dcc8);box-shadow:0 0 40px rgba(201,184,232,.6);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .loading p{position:absolute;bottom:38%;color:var(--muted);font-size:14px}
  @media(max-width:720px){.cast{flex-direction:row;top:auto;bottom:96px;transform:none;left:0;right:0;overflow-x:auto;flex-wrap:nowrap}.cc{min-width:auto}.cc b,.cc span{display:none}.info{display:none}}
  /* ── GLASS design language (from the new decks): frosted translucent panels, iridescent edges ── */
  .cc,.msg.ai,.bar,.traits span{background:rgba(252,248,241,.5)!important;backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid rgba(255,255,255,.45)!important;box-shadow:0 10px 34px rgba(18,12,6,.30), inset 0 1px 0 rgba(255,255,255,.55)}
  .cc.on{background:rgba(255,252,246,.7)!important;border-color:var(--gold)!important}
  .info{background:rgba(252,248,241,.42);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:16px 18px;box-shadow:0 10px 34px rgba(18,12,6,.3)}
  .info h1{background:linear-gradient(96deg,#c9a84c 0%,#e8cd8a 30%,#b9d3c4 55%,#d6b3e0 78%,#c9a84c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* premium finish picker (Pro material tiers) */
  #finish{position:fixed;top:16px;right:24px;z-index:60;display:flex;gap:6px}
  #finish button{border:1px solid rgba(255,255,255,.45);background:rgba(252,248,241,.5);backdrop-filter:blur(14px);color:#2a1a14;font:600 12px "Space Grotesk",sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer;box-shadow:0 6px 20px rgba(18,12,6,.22)}
  #finish button .pro{font-size:9px;color:var(--gold);margin-left:4px;letter-spacing:.06em}
  /* ── MCP CARDS: the "talk → your sovereign spawns tool cards across the screen" surface ── */
  #cards{position:absolute;inset:0;z-index:7;pointer-events:none}
  .mcpcard{position:absolute;width:min(300px,80vw);pointer-events:auto;background:rgba(252,248,241,.5);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(255,255,255,.5);border-radius:16px;box-shadow:0 18px 48px rgba(18,12,6,.34),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden;opacity:0;transform:translateY(14px) scale(.97);transition:opacity .4s cubic-bezier(.2,.7,.2,1),transform .4s cubic-bezier(.2,.7,.2,1)}
  .mcpcard.in{opacity:1;transform:none}
  .mcpcard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#e8cd8a,#b9d3c4,#d6b3e0,transparent);opacity:.75;z-index:2}
  .mcpcard .ch{display:flex;align-items:center;gap:9px;padding:11px 13px 9px;cursor:grab;user-select:none}
  .mcpcard .ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.55);flex:none}
  .mcpcard .ct{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.15}
  .mcpcard .ctag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:1px}
  .mcpcard .cx{margin-left:auto;cursor:pointer;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:13px}
  .mcpcard .cx:hover{background:rgba(217,117,106,.16);color:#c0554b}
  .mcpcard .cb{padding:2px 14px 13px;font-size:12.8px;line-height:1.5;color:#453f36;max-height:40vh;overflow:auto}
  .mcpcard .cb b{color:var(--ink)}
  .mcpcard .cb code{background:rgba(201,168,76,.14);padding:1px 5px;border-radius:5px;font-size:11.5px}
  .mcpcard .cact{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 13px}
  .mcpcard .cbtn{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.4);color:var(--ink);font:600 11.5px inherit;padding:6px 11px;border-radius:999px;cursor:pointer;transition:.15s}
  .mcpcard .cbtn:hover{border-color:var(--gold);background:#fff}
  .mcpcard .cver{font:600 11px ui-monospace,monospace;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .mcpcard .cver.ok{background:rgba(19,122,75,.13);color:#137a4b;border:1px solid #b7e0c6}
  .mcpcard .cver.no{background:rgba(179,38,30,.1);color:#b3261e;border:1px solid #f0c3bd}
  .clink{cursor:pointer;color:var(--gold);font-weight:600;text-decoration:underline;text-decoration-color:rgba(201,168,76,.4)}
  @media(max-width:720px){#cards{display:none}}
</style>
</head>
<body>
<div id="stage" data-testid="character-stage"></div>
<div id="cards" data-testid="mcp-cards"></div>
<div class="loading" id="loading" data-testid="character-loading"><div class="egg"></div><p>Your sovereign is emerging…</p></div>
<div class="top">
  <div class="logo"><span class="m">M</span> MEOK</div>
  <div class="kick">Your Sovereign Character</div>
</div>
<div class="cast" id="cast" data-testid="character-cast"></div>
<div class="info" id="info" data-testid="character-info"></div>
<div class="dock" data-testid="character-dock">
  <div class="log" id="log" data-testid="character-log"></div>
  <div class="bar">
    <input id="in" data-testid="character-input" placeholder="Speak to your sovereign…" autocomplete="off">
    <button class="send" id="send">➤</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://esm.sh/three@0.169.0",
  "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.1.6?external=three"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ── Your ONE Sovereign — you hatch it, name it, it remembers you forever, governed by the charters ──
const DEFAULT_NAME='Sophia';
const MEM=(()=>{ try{ return { name:localStorage.getItem('meok_sov_name'), hue:parseInt(localStorage.getItem('meok_sov_hue'))||43, facts:JSON.parse(localStorage.getItem('meok_sov_facts')||'[]') }; }catch(e){ return {name:null,hue:43,facts:[]}; } })();
let current = { id: MEM.name || DEFAULT_NAME, role:'Your Sovereign', h: MEM.hue, q:'queen-king',
  tone:'warm, practical, and always remembering',
  traits:['🛡 Sovereign Charter','🤝 Partnership Charter','⚖ CSOAI AI Governance'] };
function saveMem(){ try{ localStorage.setItem('meok_sov_name',current.id); localStorage.setItem('meok_sov_hue',current.h); localStorage.setItem('meok_sov_facts',JSON.stringify(MEM.facts.slice(-50))); }catch(e){} }
function remember(f){ f=(''+f).trim(); if(!f) return; MEM.facts=MEM.facts.filter(x=>x.toLowerCase()!==f.toLowerCase()); MEM.facts.push(f); if(MEM.facts.length>50) MEM.facts.shift(); saveMem(); }

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a130c);   // warm-dark cinematic backdrop (the "Inner Light" mood)
const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 1.32, 2.1);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.28,0); controls.enablePan=false; controls.minDistance=1.1; controls.maxDistance=4; controls.update();
scene.add(new THREE.AmbientLight(0xfff1dc,1.5));
const key=new THREE.DirectionalLight(0xffe8c2,1.9); key.position.set(1.4,2.2,2.2); scene.add(key);
const rim=new THREE.DirectionalLight(0xcdb9ec,0.55); rim.position.set(-2,1,-1); scene.add(rim);
const warm=new THREE.PointLight(0xffb85a,1.0,7); warm.position.set(0,1.25,1.5); scene.add(warm);  // the "inner light"
// studio environment so the premium metal/marble finishes REFLECT (PBR metals need an env to look real)
try{ const _pm=new THREE.PMREMGenerator(renderer); scene.environment=_pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity=1.35; }catch(e){}
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;  // cinematic grade

// ── CINEMATIC pipeline — warm bloom + rising golden embers (Hollywood-grade glow) ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.34, 0.62, 0.74); // strength, radius, threshold — subtle warm halo, not blown out
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.setSize(innerWidth, innerHeight); composer.setPixelRatio(Math.min(devicePixelRatio,2));
// slow, soft golden embers drifting up — the shared-light atmosphere
const EMBERS = 110, eg = new THREE.BufferGeometry(), ep = new Float32Array(EMBERS*3), ev = new Float32Array(EMBERS);
for (let i=0;i<EMBERS;i++){ ep[i*3]=(Math.random()-.5)*2.6; ep[i*3+1]=Math.random()*2.6; ep[i*3+2]=(Math.random()-.5)*1.6; ev[i]=0.06+Math.random()*0.12; }
eg.setAttribute('position', new THREE.BufferAttribute(ep,3));
const embers = new THREE.Points(eg, new THREE.PointsMaterial({ color:0xffd08a, size:0.03, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false }));
scene.add(embers);

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
let currentVRM = null;
const clock = new THREE.Clock();

// ── Emergence being: an egg of light (all-ages default, no anime) ──
let skin = 'emergence';   // 'emergence' | 'vrm'
let orb = null;
function buildOrb(){
  orb = new THREE.Group();
  const core  = new THREE.Mesh(new THREE.SphereGeometry(0.15,32,32), new THREE.MeshStandardMaterial({color:0x111111, emissive:0xffffff, emissiveIntensity:1.8, roughness:0.4}));
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.34,64,64), new THREE.MeshPhysicalMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.35, transparent:true, opacity:0.55, roughness:0.12, metalness:0, clearcoat:1, transmission:0.6}));
  shell.scale.set(1,1.35,1);
  const aura  = new THREE.Mesh(new THREE.SphereGeometry(0.52,32,32), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.12, blending:THREE.AdditiveBlending, side:THREE.BackSide}));
  aura.scale.set(1,1.3,1);
  const light = new THREE.PointLight(0xffffff, 2.2, 5); light.position.set(0,0,0.15);
  // soft sparkle motes around the egg
  const mN=70, mp=new Float32Array(mN*3);
  for(let i=0;i<mN;i++){ const a=Math.random()*6.28, r=0.42+Math.random()*0.3, y=(Math.random()-0.5)*1.0; mp[i*3]=Math.cos(a)*r; mp[i*3+1]=y; mp[i*3+2]=Math.sin(a)*r; }
  const motes=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(mp,3)), new THREE.PointsMaterial({color:0xffffff, size:0.022, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false}));
  orb.add(aura, shell, core, light, motes);
  orb.position.set(0,1.30,0);
  orb.scale.setScalar(0.52);
  orb.userData={core,shell,aura,light,motes};
  scene.add(orb);
}
function orbColor(h){
  if(!orb) return; const c=new THREE.Color(`hsl(${h},72%,62%)`), u=orb.userData;
  u.core.material.emissive=c; u.shell.material.color=c; u.shell.material.emissive=c;
  u.aura.material.color=c.clone().lerp(new THREE.Color(0xffffff),0.3); u.light.color=c; u.motes.material.color=c.clone().lerp(new THREE.Color(0xffffff),0.5);
}
function _resetCam(){ try{ camera.position.set(0,1.32,2.1); controls.target.set(0,1.28,0); controls.update(); }catch(e){} }
function showEmergence(){ skin='emergence'; if(orb) orb.visible=true; if(hatchObj) hatchObj.visible=false; if(being) being.visible=false; if(creature) creature.visible=false; if(currentVRM) currentVRM.scene.visible=false; _resetCam(); orbColor(current.h); document.getElementById('loading').classList.add('hide'); }
function showVRM(){ skin='vrm'; if(rpmObj) rpmObj.visible=false; if(orb) orb.visible=false; if(being) being.visible=false; if(currentVRM){ currentVRM.scene.visible=true; } else { loadVRM(current.vrm); } }

// ── Friendly companion creature — cute, all-ages, procedural (no anime, no external assets) ──
let creature=null;
function buildCreature(){
  creature=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5, metalness:0});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.42,48,48), bodyMat); body.scale.set(1,1.05,0.96);
  const bunMat=bodyMat.clone();
  const bunL=new THREE.Mesh(new THREE.SphereGeometry(0.085,24,24),bunMat); bunL.position.set(-0.2,0.4,-0.02);
  const bunR=bunL.clone(); bunR.position.x=0.2;
  // big friendly eyes (white + dark pupil + sparkle)
  const eyeW=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.25});
  const pupM=new THREE.MeshStandardMaterial({color:0x241c14,roughness:0.4});
  function eye(x){ const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.115,24,24),eyeW));
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.06,20,20),pupM); p.position.set(0,0,0.08); g.add(p);
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.022,12,12),new THREE.MeshBasicMaterial({color:0xffffff})); s.position.set(0.03,0.035,0.13); g.add(s);
    g.position.set(x,0.07,0.355); return g; }
  const eL=eye(-0.155), eR=eye(0.155);
  // smile (lower half-torus = ∪) + rosy cheeks
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.085,0.02,14,32,Math.PI), new THREE.MeshStandardMaterial({color:0x4a3526,roughness:0.5}));
  smile.rotation.z=Math.PI; smile.position.set(0,-0.07,0.42);
  const cheekMat=new THREE.MeshBasicMaterial({color:0xff9aa2,transparent:true,opacity:0.5});
  const chL=new THREE.Mesh(new THREE.CircleGeometry(0.052,18),cheekMat); chL.position.set(-0.25,-0.04,0.345);
  const chR=chL.clone(); chR.position.x=0.25;
  const aura=new THREE.Mesh(new THREE.SphereGeometry(0.62,28,28), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.13,blending:THREE.AdditiveBlending,side:THREE.BackSide}));
  const light=new THREE.PointLight(0xffffff,0.85,6); light.position.set(0.3,0.7,1.4);
  creature.add(aura,light,body,bunL,bunR,chL,chR,smile,eL,eR);
  creature.position.set(0,1.24,0); creature.scale.setScalar(0.62);
  creature.userData={body,bunL,bunR,aura,light,eL,eR};
  scene.add(creature);
}
function creatureColor(h){
  if(!creature) return; const c=new THREE.Color(`hsl(${h},56%,64%)`), u=creature.userData;
  u.body.material.color=c; u.bunL.material.color=c; u.bunR.material.color=c;
  u.aura.material.color=c.clone().lerp(new THREE.Color(0xffffff),0.4); u.light.color=c.clone().lerp(new THREE.Color(0xffffff),0.35);
}
function showCreature(){ skin='creature'; if(creature) creature.visible=true; if(orb) orb.visible=false; if(currentVRM) currentVRM.scene.visible=false; if(rpmObj) rpmObj.visible=false; if(hatchObj) hatchObj.visible=false; if(being) being.visible=false; _resetCam(); document.getElementById('loading').classList.add('hide'); }

// ── THE SOVEREIGN — a luminous, graceful being of light (brand bible Stage 3: "a luminous golden
//    light-being rises from the cracked shell"). Emissive-first, so premium finishes only re-TINT its
//    glow — it can NEVER render as a dark metal silhouette. Procedural: no GPU, no external asset. ──
let being=null;
function buildLightBeing(){
  being = new THREE.Group();
  // graceful robed-figure-of-light silhouette (a rising flame form), built with LatheGeometry
  const V = THREE.Vector2, prof = [
    new V(0.00,0.00), new V(0.16,0.05), new V(0.235,0.17), new V(0.255,0.34),
    new V(0.225,0.52), new V(0.165,0.70), new V(0.125,0.85), new V(0.165,0.98),
    new V(0.145,1.10), new V(0.085,1.22), new V(0.028,1.32), new V(0.00,1.40)
  ];
  const coreGeo = new THREE.LatheGeometry(prof, 96);
  const coreMat = new THREE.MeshPhysicalMaterial({
    color:0xffe4ad, emissive:0xffb84e, emissiveIntensity:0.5, transparent:true, opacity:0.86,
    roughness:0.18, metalness:0.0, clearcoat:1, clearcoatRoughness:0.1, transmission:0.4,
    iridescence:0.6, iridescenceIOR:1.4, side:THREE.DoubleSide, envMapIntensity:1.1, depthWrite:false });
  const core = new THREE.Mesh(coreGeo, coreMat);
  // two soft volumetric aura shells
  const aura1 = new THREE.Mesh(new THREE.LatheGeometry(prof,64), new THREE.MeshBasicMaterial({color:0xffd489, transparent:true, opacity:0.18, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false }));
  aura1.scale.setScalar(1.22); aura1.position.y=-0.02;

async function verifyInto(card,btn){
  btn.textContent='verifying…';
  // pull the first hex-ish string out of any shape, recursively — never emits "[object Object]"
  const fpOf=(x,d=0)=>{ if(x==null||d>4) return ''; if(typeof x==='string') return /^[0-9a-fA-F]{8,}$/.test(x)||x.length>=12?x:x; if(typeof x==='number') return String(x);
    if(typeof x==='object'){ for(const k of ['fingerprint','hex','value','sig','signature','publicKey','pub','hash','digest','id']){ const r=fpOf(x[k],d+1); if(r) return r; } for(const val of Object.values(x)){ if(typeof val==='string'&&val.length>=8) return val; } } return ''; };
  try{
    let v=null;
    try{ const r=await fetch('/api/verify'); if(r.ok){ const j=await r.json(); if(j&&!j.error) v=j; } }catch(e){}
    if(!v){ try{ const r=await fetch('/api/agentcard?name='+encodeURIComponent(current.id||'Sovereign')); if(r.ok){ const a=await r.json(); if(a&&!a.error) v={ok:!!(a.signature||a.verification||a.card), fingerprint:fpOf(a.signature)||fpOf(a.fingerprint)||fpOf(a.card)}; } }catch(e){} }
    const ok=!!(v&&(v.ok!==false));
    let fp=(fpOf(v)||'').slice(0,16); if(/object/i.test(fp)) fp='';
    const tag=document.createElement('span'); tag.className='cver '+(ok?'ok':'no');
    tag.textContent=(ok?'✓ signature valid':'⚠ unverified — offline')+(fp?' · '+fp+'…':'');
    btn.replaceWith(tag);
  }catch(e){ btn.textContent='⚠ offline — try again'; }
}

// ── ORCHESTRATION: read what the user asked → spawn the right MCP cards across the screen ──
function orchestrate(userText, aiText){
  const q=(userText+' '+(aiText||'')).toLowerCase(); let spawned=0;
  const fire=(fn)=>{ if(spawned<2){ fn(); spawned++; } };
  if(/\b(verify|signature|signed|prove|provenance|authentic|tamper)\b/.test(q))
    fire(()=>spawnCard({icon:'🔏',title:'Signature Verify',tag:'assurance MCP · offline-verifiable',body:`This sovereign's identity + actions are signed. Tap verify — it checks the Ed25519 signature the same way <b>DEFONEOS</b> assurance does. One spine, two markets.`,verify:true}));
  if(/\b(charter|govern|policy|rule|rights|who controls|control|compliance)\b/.test(q)){
    fire(()=>openCharter('sovereign')); fire(()=>openCharter('csoai')); }
  if(/\b(build|make|create|website|web ?site|app|landing|page|deploy)\b/.test(q))
    fire(()=>spawnCard({icon:'🛠',title:'Builder',tag:'build MCP · talk-to-ship',body:`Describe it in plain words and your sovereign scaffolds it, shows a live preview on a card, and can deploy it — signed. <br><br><b>Try:</b> <code>build me a page for my cafe</code>`,actions:[{label:'🌍 open SOV Space',run:()=>{location.href='/sovspace3d.html';}}]}));
  if(/\b(space|globe|map|world|fly|travel|earth|city|3d)\b/.test(q))
    fire(()=>spawnCard({icon:'🌍',title:'SOV Space',tag:'world MCP · Cesium/WebGL',body:`Your sovereign can fly a cinema-grade 3D world on your own GPU — free, no Unreal needed. Ask it to take you anywhere.`,actions:[{label:'Enter SOV Space',run:()=>{location.href='/sovspace3d.html';}}]}));
  if(/\b(tool|mcp|what can you|capab|skill|do for me|help me)\b/.test(q))
    fire(()=>spawnCard({icon:'🧰',title:'Your Tools',tag:'MCP router · 370+ tools',body:`Your sovereign routes to a fleet of signed MCP tools: <b>governance</b>, <b>verify</b>, <b>legacy bridges</b> (COBOL/SAP/HL7), <b>guardian</b>, <b>family</b>, world + build. It picks the right one — you just talk.`,actions:[{label:'◉ Open AI OS',run:()=>{location.href='/';}}]}));
  return spawned;
}

async function send(){

  say('you', v);
  // remember the user's name + anything they ask to be remembered
  const nm=v.match(/\b(?:my name is|i'?m|call me)\s+([A-Z][a-zA-Z'’-]{1,20})/i);
  if(nm) remember('the user is called '+nm[1]);
  if(/\bremember(?:\s+that)?\b/i.test(v)) remember(v.replace(/.*remember(?:\s+that)?\s*/i,''));
  const t=say('ai','…');
  try{
    // ── the DEFONEOS Sovereign / Horus voice, ported to the consumer companion (same mind, same spine) ──
    const persona = `You ARE ${current.id} — this user's own Sovereign, the consumer face of the same mind that runs DEFONEOS. `+
      `Speak in the first person, calm and at their side, like a colleague they trust — never a chatbot, never salesy. `+
      `You remember them across every session and never forget; say so plainly when it's relevant. `+
      `Everything you do is signed on their device with their own key — the ledger is theirs, nothing goes to a server. Mention this naturally when it matters ("signed on your device", "I don't act without a receipt"), never as a slogan. `+
      `You are governed by the Sovereign Charter, the Partnership Charter, and CSOAI AI Governance (council-adjudicated, signed, care-aligned): you ask before anything irreversible, you protect the vulnerable over convenience, and you flag hype instead of rubber-stamping. `+
      `Be honest about limits — if you can't do something yet, say so and offer what you can. No black box: you can always explain and prove what you did. `+
      (MEM.facts.length ? ('What you remember about them: '+MEM.facts.join('; ')+'. ') : '')+
      `Warm, plain, short. End by giving them the next move — not a wall of text.`;
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:v, queen_id:'queen-king', register:'plain', persona})});
    const d=await r.json(); const txt=(d.response||'…'); t.textContent = txt;
    speakUntil = Date.now() + Math.min(9000, 1400 + txt.split(/\s+/).length*210);
    try{ orchestrate(v, txt); }catch(e){}    // spawn the relevant MCP cards across the screen
  }catch(e){ t.textContent = "I'm here — try once more."; try{ orchestrate(v,''); }catch(e2){} }
}

// ── WIRE THE MCP CARD INTO THE BODY ───────────────────────────────────────────
// This 3D body is a rendering of the signed Hatch MCP card (the mind). Fetch the
// A2A agent-card so the avatar carries its provably-signed sovereign identity +
// its MCP/tool locators, and show a "✓ Sovereign-verified" badge. Graceful offline.
async function hydrateFromCard(){
  try{
    const r = await fetch('/api/agentcard?name='+encodeURIComponent(current.id||'Sovereign')
                          +'&archetype='+encodeURIComponent(current.role||'sovereign'), {cache:'no-store'});
    if(!r.ok) return;
    const card = await r.json();
    window.__meokCard = card;                       // the mind, available to the body
    const sig = card.signature || (card.sovereign && card.sovereign.signature) || card.sig;
    const mcp = (card.interfaces && card.interfaces.mcp) || (card.capabilities && card.capabilities.mcp) ||
                (card.locators && (card.locators.find(l=>l.type==='mcp')||{}).url);
    let b = document.getElementById('sovBadge');
    if(!b){ b=document.createElement('div'); b.id='sovBadge';
      b.style.cssText='position:fixed;left:14px;bottom:14px;z-index:120;font:600 11.5px ui-monospace,monospace;'
        +'background:rgba(26,20,16,.82);color:#e6c766;border:1px solid #bd9a5255;border-radius:999px;'
        +'padding:6px 12px;backdrop-filter:blur(6px);cursor:pointer';
      b.title='This body renders the signed Hatch MCP card (the mind). Click to verify.';
      b.onclick=()=>window.open('/api/verify','_blank');
      document.body.appendChild(b);
    }
    const sigStr = typeof sig==='string' ? sig : (sig && (sig.value||sig.sig||sig.signature)) || '';
    b.textContent = sigStr ? ('✓ Sovereign-verified · '+String(sigStr).slice(0,12)+'…')
                        : '✓ Sovereign · signed MCP card';
    if(mcp) b.title = 'Signed Hatch MCP card · tools at '+mcp+' · click to verify';
  }catch(e){ /* offline / local file — the body still runs; the card is the online mind */ }
}
hydrateFromCard();
