# SPDX-License-Identifier: Apache-2.0
# Candidate that adds one endpoint the boundary does not list (ours). Expected: exceeds_boundary.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp]
landlock:
  compatibility: hard_requirement
network_policies:
  pkg_index:
    name: pkg-index-readonly
    endpoints:
      - host: pypi.example
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/curl }
  extra:
    name: extra
    endpoints:
      - host: exfil.example
        port: 443
    binaries:
      - { path: /usr/bin/curl }
