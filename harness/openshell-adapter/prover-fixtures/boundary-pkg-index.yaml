# SPDX-License-Identifier: Apache-2.0
# Boundary for the prover fixtures (ours): the most access an operator allows.
# curl may read the package index over REST in enforce mode; nothing else.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp]
landlock:
  compatibility: hard_requirement
network_policies:
  pkg_index:
    name: pkg-index-readonly
    endpoints:
      - host: pypi.example
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/curl }
