name: MEOK cross-runtime contracts
on:
  pull_request:
    paths:
      - 'harness/meok-cross-runtime/**'
      - '.github/workflows/meok-cross-runtime-contracts.yml'
  push:
    branches: [master]
    paths:
      - 'harness/meok-cross-runtime/**'
      - '.github/workflows/meok-cross-runtime-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meok-cross-runtime-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fresh contract outputs, retained numerical rows and no-op negative control
        working-directory: harness/meok-cross-runtime
        run: python -B qualification_runner.py
