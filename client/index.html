    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CSOAI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CSOAI (Council for the Safety of AI) is an independent measurement body for AI governance. We are not a notified body and issue no certificates of conformity. We publish measured governance tooling, multi-framework compliance maps (EU AI Act, NIST AI RMF, ISO/IEC 42001), and a public refutation ledger that publishes our own corrections."
          }
        },
        {
          "@type": "Question",
          "name": "Is CSOAI a certification body?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. CSOAI is a training-measurement instrument, not a certification body. We publish measured training records — signed, offline-verifiable evidence of what was checked — not certifications or accreditations."
          }
        },
        {
          "@type": "Question",
          "name": "What is Layer 0?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Layer 0 is our trust floor: Ed25519 cryptographic signing of every governance decision, and offline verification \u2014 anyone can recompute the hash and check the signature against our published public key, without trusting us."
          }
        },
        {
          "@type": "Question",
          "name": "Does CSOAI use LLM-as-judge?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every primary governance score is produced by deterministic predicates — the same model, same input, same output, byte-identical. The LLM is used only for narration (text, never scoring). When the LLM is disabled, every score is identical to when it is enabled."
          }
        }
      ]
    }
    </script>
