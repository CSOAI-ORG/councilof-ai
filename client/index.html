    <!-- Structured Data / JSON-LD — canon entity graph (audit §4.3, 2026-08-14).
         One public name "Council of AI" + alternateName CSOAI; connected via @id.
         GovernmentOrganization REMOVED — CSOAI LTD is a UK private company, that type was
         factually false and a trust-penalty risk. Duplicate FAQ + cross-domain BreadcrumbList
         removed. SearchAction omitted until /search?q= is verified. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://councilof.ai/#org",
      "name": "Council of AI",
      "alternateName": "CSOAI",
      "legalName": "CSOAI LTD",
      "identifier": [
        {"@type": "PropertyValue", "propertyID": "Companies House", "value": "16939677"},
        {"@type": "PropertyValue", "propertyID": "DID", "value": "did:web:csoai.org"}
      ],
      "url": "https://councilof.ai/",
      "logo": "https://councilof.ai/csoai-icon.svg",
      "description": "Council of AI (CSOAI LTD, UK) is a neutral AI measurement body. It issues verified measurement credentials — 3KB measurement cards signed with Ed25519 and anchored with OpenTimestamps — never certification, accreditation or conformity assessment.",
      "founder": {"@type": "Person", "name": "Nicholas Templeman"},
      "foundingDate": "2025",
      "sameAs": ["https://github.com/CSOAI-ORG", "https://huggingface.co/csoai"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Council of AI",
      "url": "https://councilof.ai/",
      "publisher": {"@id": "https://councilof.ai/#org"},
      "inLanguage": "en"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {"@type": "Question", "name": "What is the Council of AI?",
         "acceptedAnswer": {"@type": "Answer", "text": "The Council of AI (CSOAI LTD, UK 16939677) is a neutral measurement body for AI. It measures AI system behaviour against published regulatory provisions and issues verified measurement credentials — signed, provision-anchored records anyone can verify offline. It is not a certification or accreditation body."}},
        {"@type": "Question", "name": "Is CSOAI a certification body?",
         "acceptedAnswer": {"@type": "Answer", "text": "No. CSOAI is a measurement body. You receive a verified measurement credential — a signed record of measured behaviour. Accredited conformity certification requires a national accreditation chain, which CSOAI does not hold and does not claim."}},
        {"@type": "Question", "name": "What does the Council of AI measure?",
         "acceptedAnswer": {"@type": "Answer", "text": "AI system behaviour against published regulatory provisions, across 13 measured axes (governance, safety, provenance, continuity, conformance, openness, machinery-conformity, care, cross-reality, detector-interop, art5-safeguard, swarm, affect) plus 2 reserved slots. Jail: measured 13 Aug floor exists in a separate stamp (not a ranking), empty on the 12 Aug stamp. Slot-15: reserved, no name assigned. Every published number traces to a signed measurement artefact, and UNMEASURED results are reported openly, never hidden or scored as failures."}},
        {"@type": "Question", "name": "Does CSOAI use LLM-as-judge?",
         "acceptedAnswer": {"@type": "Answer", "text": "No. Every primary governance score is produced by deterministic predicates — same model, same input, same output, byte-identical. The LLM is used only for narration, never for scoring. When the LLM is disabled, every score is identical to when it is enabled."}},
        {"@type": "Question", "name": "How current is the regulatory data behind the scores?",
         "acceptedAnswer": {"@type": "Answer", "text": "The public corpus-watch instrument re-hashes 127 provisions across four instruments (EU AI Act, UK GDPR, DPA 2018, NIS2-UK) every day and publishes drift events. Measurement records go stale when the underlying provision text changes."}}
      ]
    }
    </script>

    <!-- Per-route self-canonical: each crawled URL canonicals to itself (not just the root).
         NB: during prerender (scripts/prerender.mjs) the captured markup's localhost origin is
         rewritten to the production origin, so static pages never ship a localhost canonical. -->
    <script>(function(){try{var u=location.origin+location.pathname.replace(/\/$/,"")||location.origin;var c=document.querySelector('link[rel=canonical]');if(c)c.href=u;var o=document.querySelector('meta[property="og:url"]');if(o)o.setAttribute("content",u);var t=document.querySelector('meta[name="twitter:url"]');if(t)t.setAttribute("content",u);}catch(e){}})();</script>
