    <p style="margin-top: 32px; text-align: center; font-size: 1.2rem; color: #fbbf24;">
      🐉 The dragon has done all the work it can. You just need to do 30 minutes of Vercel + app store manual steps.
    </p>
    <p style="text-align: center; opacity: 0.7;">
      Saturday 4 Jul 2026 09:00 BST = the catapult fires. The world goes sovereign.
    </p>
