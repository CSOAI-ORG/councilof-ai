<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Launch Day +6 — The Final Sprint</title>
  <style>
    * {{ margin: 0; padding: 0; box-sizing: border-box; }}
    body {{ font-family: monospace; background: linear-gradient(180deg, #1e3a8a 0%, #7c2d12 50%, #0a0e27 100%); color: #fff; padding: 40px; min-height: 100vh; }}
    .ui {{ max-width: 1400px; margin: 0 auto; }}
    h1 {{ font-size: 3rem; color: #fbbf24; text-align: center; margin-bottom: 8px; text-shadow: 0 0 30px rgba(251,191,36,0.5); }}
    .tagline {{ text-align: center; font-size: 1.3rem; color: #10b981; font-style: italic; margin-bottom: 32px; }}
    .days {{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 24px 0; }}
    .day {{ background: rgba(255,255,255,0.05); padding: 24px; border-radius: 8px; border-left: 4px solid #10b981; }}
    .day h2 {{ color: #fbbf24; margin-bottom: 12px; }}
    .day .status {{ display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: #10b981; color: #000; }}
    .day .status.pending {{ background: #fbbf24; color: #000; }}
    .day ul {{ margin-left: 20px; line-height: 1.7; margin-top: 12px; }}
    .day ul li code {{ background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 3px; }}
    h2 {{ color: #fbbf24; }}
    .cta {{ background: #fbbf24; color: #000; padding: 14px 28px; border-radius: 8px; font-weight: 700; text-decoration: none; display: inline-block; margin-top: 16px; }}
    .cta.amber {{ background: #f59e0b; }}
  </style>
</head>
<body>
  <div class="ui">
