<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="background: #0a0e27;">
  <defs>
    <linearGradient id="sov3-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .glow { filter: drop-shadow(0 0 8px #fbbf24); }
      .pulse-bar { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="800" height="400" fill="url(#sov3-bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="url(#gold-grad)" font-weight="bold" class="glow">SOV3 Sovereign Composite</text>
  <text x="400" y="60" text-anchor="middle" font-family="monospace" font-size="11" fill="#06b6d4" font-style="italic">12-dimension scorecard · 60% sovereignty-by-design</text>

  <!-- SOV3 bar (winner) -->
  <g class="pulse-bar">
    <text x="20" y="120" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold">🥇 SOV3 meok-sov3 (3.1B MIT)</text>
    <rect x="240" y="106" width="500" height="22" fill="#10b981" rx="3"/>
    <text x="745" y="123" text-anchor="end" font-family="monospace" font-size="13" fill="#10b981" font-weight="bold">7.705</text>
  </g>

  <!-- SOV3 Ornith -->
  <g class="pulse-bar" style="animation-delay: 0.2s;">
    <text x="20" y="160" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold">🥈 SOV3 Ornith-1.0-35B (MIT)</text>
    <rect x="240" y="146" width="461" height="22" fill="#10b981" rx="3"/>
    <text x="706" y="163" text-anchor="end" font-family="monospace" font-size="13" fill="#10b981" font-weight="bold">7.106</text>
  </g>

  <!-- SOV3 qwen3 -->
  <g class="pulse-bar" style="animation-delay: 0.4s;">
    <text x="20" y="200" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold">🥉 SOV3 qwen3:30b-a3b (Apache)</text>
    <rect x="240" y="186" width="461" height="22" fill="#10b981" rx="3"/>
    <text x="706" y="203" text-anchor="end" font-family="monospace" font-size="13" fill="#10b981" font-weight="bold">7.105</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="225" x2="780" y2="225" stroke="#ef4444" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>

  <!-- OpenAI -->
  <text x="20" y="252" font-family="monospace" font-size="11" fill="#ef4444">OpenAI GPT-5</text>
  <rect x="240" y="240" width="237" height="18" fill="#ef4444" rx="2" opacity="0.7"/>
  <text x="482" y="254" text-anchor="end" font-family="monospace" font-size="11" fill="#ef4444">3.645</text>

  <!-- Google -->
  <text x="20" y="282" font-family="monospace" font-size="11" fill="#ef4444">Google Gemini 3 Pro</text>
  <rect x="240" y="270" width="236" height="18" fill="#ef4444" rx="2" opacity="0.7"/>
  <text x="481" y="284" text-anchor="end" font-family="monospace" font-size="11" fill="#ef4444">3.635</text>

  <!-- Claude -->
  <text x="20" y="312" font-family="monospace" font-size="11" fill="#ef4444">Anthropic Claude Opus 4.8</text>
  <rect x="240" y="300" width="231" height="18" fill="#ef4444" rx="2" opacity="0.7"/>
  <text x="476" y="314" text-anchor="end" font-family="monospace" font-size="11" fill="#ef4444">3.563</text>

  <!-- DeepSeek -->
  <text x="20" y="342" font-family="monospace" font-size="11" fill="#ef4444">DeepSeek V4 Pro (1.6T)</text>
  <rect x="240" y="330" width="215" height="18" fill="#ef4444" rx="2" opacity="0.7"/>
  <text x="460" y="344" text-anchor="end" font-family="monospace" font-size="11" fill="#ef4444">3.324</text>

  <!-- Gap callout -->
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#fbbf24" font-weight="bold">SOV3 wins by +3.77</text>
</svg>