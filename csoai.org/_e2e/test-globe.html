<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Globe E2E — csoai.org</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff;line-height:1.6;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:2rem;background:linear-gradient(135deg,#fbbf24,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{color:#06b6d4;font-style:italic;margin-bottom:24px}
.globe{width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#1e3a8a,#000);margin:24px auto;position:relative;overflow:hidden;border:2px solid #06b6d4;box-shadow:0 0 60px rgba(6,182,212,.4)}
.dot{position:absolute;width:8px;height:8px;background:#fbbf24;border-radius:50%;box-shadow:0 0 12px #fbbf24;opacity:0}
.dot.show{opacity:1;transition:opacity 1s}
.region{position:absolute;color:#fff;font-size:.7rem;font-weight:700;text-shadow:0 0 4px #000}
.run-btn{background:linear-gradient(135deg,#fbbf24,#06b6d4);color:#000;padding:14px 28px;border-radius:24px;font-weight:800;border:0;cursor:pointer;font-size:1rem;margin:12px}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:24px}
.region-card{background:rgba(255,255,255,.04);border:1px solid rgba(251,191,36,.3);border-radius:6px;padding:10px;font-size:.85rem}
.region-card.hatched{border-color:#10b981;background:rgba(16,185,129,.1)}
.nav-bar{display:flex;gap:12px;margin-bottom:24px}
.nav-bar a{color:#06b6d4;text-decoration:none;padding:6px 12px;border:1px solid rgba(6,182,212,.3);border-radius:6px;font-size:.85rem}
</style>
</head>
<body>

<div class="nav-bar"><a href="/_e2e/index.html">← Master Runner</a></div>

<h1>🌏 Sovereign Globe E2E</h1>
<p class="sub">Hatch 25 regions. Watch citizens emerge as i-characters.</p>

<div class="globe" id="globe">
  <div class="dot" style="top:35%;left:48%"></div>
  <div class="dot" style="top:40%;left:52%"></div>
  <div class="dot" style="top:30%;left:55%"></div>
  <div class="dot" style="top:55%;left:75%"></div>
  <div class="dot" style="top:60%;left:30%"></div>
  <div class="dot" style="top:50%;left:80%"></div>
  <div class="dot" style="top:25%;left:78%"></div>
</div>

<div style="text-align:center">
  <button class="run-btn" onclick="hatchAll()">🥚 HATCH ALL 25 REGIONS</button>
</div>

<div class="regions" id="regions"></div>

<script>
const REGIONS = [
  ['UK',48,35],['EU West',50,38],['Scandinavia',52,28],['Russia',65,30],['India',70,50],
  ['China',80,38],['Japan',85,35],['Australia',85,70],['USA East',25,40],['USA West',15,42],
  ['Canada',22,28],['Mexico',20,55],['Brazil',32,68],['Argentina',30,78],['South Africa',55,72],
  ['Nigeria',50,55],['Egypt',55,42],['UAE',62,45],['Singapore',78,58],['Korea',83,38],
  ['Indonesia',80,62],['NZ',88,76],['Israel',58,42],['Turkey',58,38],['Kenya',57,58]
];

const grid = document.getElementById('regions');
REGIONS.forEach((r, i) => {
  const c = document.createElement('div');
  c.className = 'region-card';
  c.id = 'r-' + i;
  c.textContent = r[0] + ' — Awaiting hatch';
  grid.appendChild(c);
});

async function hatchAll() {
  const dots = document.querySelectorAll('.dot');
  for (let i = 0; i < REGIONS.length; i++) {
    dots[i % dots.length].classList.add('show');
    document.getElementById('r-' + i).classList.add('hatched');
    document.getElementById('r-' + i).textContent = REGIONS[i][0] + ' — ✓ HATCHED';
    await new Promise(r => setTimeout(r, 120));
  }
}
</script>

</body>
</html>
