<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="seal.svg">
<title>DEFONEOS — The Ontology Map</title>
<meta name="description" content="The DEFONEOS inner map: industries → data → MCPs → Layer-0 protocols → frameworks & law, all wired. Governed, signed, sovereign.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#05060d; --ink:#eef1fb; --dim:#8a93b2; --line:rgba(201,168,76,.18); --gold:#c9a84c;
    --core:#c9a84c; --domain:#e7cf8e; --industry:#e0a285; --ontology:#8b8ce0; --data:#00e07a; --mcp:#2a9df4; --protocol:#06b6d4; --framework:#ffd23b; }
  *{ margin:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,sans-serif; }
  #graph{ position:fixed; inset:0; }
  .top{ position:fixed; top:0; left:0; right:0; height:52px; z-index:20; display:flex; align-items:center; gap:14px; padding:0 18px;
    background:linear-gradient(180deg,rgba(5,6,13,.92),transparent); }
  .brand{ font-weight:600; letter-spacing:1px; color:var(--gold); } .brand small{ color:var(--dim); font-weight:400; }
  .spacer{ flex:1; } a.lnk{ color:var(--dim); text-decoration:none; font-size:12px; margin-left:14px; } a.lnk:hover{ color:var(--gold); }
  .legend{ position:fixed; bottom:16px; left:16px; z-index:20; background:rgba(9,13,26,.85); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:11px; }
  .legend .r{ display:flex; align-items:center; gap:7px; padding:2px 0; color:var(--dim); }
  .legend .d{ width:9px; height:9px; border-radius:50%; }
  .info{ position:fixed; top:64px; right:16px; z-index:20; width:280px; background:rgba(9,13,26,.94); border:1px solid var(--gold); border-radius:14px; padding:16px; display:none; }
  .info h3{ font-size:15px; color:var(--gold); margin-bottom:4px; } .info .g{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
  .info .lk{ font-size:12px; color:var(--ink); margin-top:8px; } .info .lk span{ color:var(--dim); }
  .info .x{ position:absolute; top:10px; right:13px; cursor:pointer; color:var(--dim); }
  .hint{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:20; color:var(--dim); font-size:12px; }
  .hint b{ color:var(--gold); }
</style>
</head>
<body>
<div id="graph"></div>
<div class="top">
  <span class="brand">DEFONEOS <small>· the ontology map</small></span>
  <span class="spacer"></span>
  <span style="font-size:11px;color:var(--dim)">Powered by <b style="color:var(--gold)">SOV3³</b></span>
  <a class="lnk" href="system.html">🪐 system</a><a class="lnk" href="cop.html">dome ▸</a>
</div>
<div class="legend" id="legend"></div>
<div class="info" id="info"><span class="x" onclick="document.getElementById('info').style.display='none'">✕</span><div id="infoBody"></div></div>
<div class="hint">drag to explore · scroll to zoom · <b>click a node</b> to see its connections · industries → data → MCPs → protocols → law</div>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script>
const COL={ core:'#c9a84c',domain:'#e7cf8e',industry:'#e0a285',ontology:'#8b8ce0',data:'#00e07a',mcp:'#2a9df4',protocol:'#06b6d4',framework:'#ffd23b' };
const LEG=[['core','Sovereign'],['domain','Domains'],['industry','Industries'],['ontology','Ontology'],['data','Data sources'],['mcp','MCPs'],['protocol','Layer-0 protocols'],['framework','Frameworks & law']];
document.getElementById('legend').innerHTML='<div style="font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin-bottom:6px">Map key</div>'+LEG.map(function(l){return '<div class="r"><span class="d" style="background:'+COL[l[0]]+'"></span>'+l[1]+'</div>';}).join('');

const G={nodes:[],links:[]}; const seen={};
function N(id,group,val){ if(seen[id])return; seen[id]=group; G.nodes.push({id:id,group:group,val:val||4}); }
function L(a,b){ G.links.push({source:a,target:b}); }
N('DEFONEOS','core',26);
const hubs=['Industries','Ontology','Data sources','MCP suite','Layer-0 protocols','Frameworks & law'];
hubs.forEach(function(h){ N(h,'domain',12); L('DEFONEOS',h); });
const kids={
 'Industries':['Defence','Finance','Healthcare','Energy','Transport','Legal','Insurance','Space','Cyber','Manufacturing'].map(function(x){return [x,'industry'];}),
 'Ontology':['Person','Vehicle','Event','Location','Organization','Equipment','Signal','Document','Facility','Environmental'].map(function(x){return [x,'ontology'];}),
 'Data sources':['OpenSky','USGS','Copernicus','MarineTraffic','ADS-B','Coinbase','Gov open data','OSM'].map(function(x){return [x,'data'];}),
 'MCP suite':['airspace-monitor','drone-governance','firmware-attest','owasp-agentic','cybersecurity-ai','prompt-firewall','agent-identity','mitre-atlas','gov-crosswalk','care-membrane','audit-logger','defence-bft'].map(function(x){return [x,'mcp'];}),
 'Layer-0 protocols':['MCP','A2A','x402','DID','Ed25519','SIGIL','JWT'].map(function(x){return [x,'protocol'];}),
 'Frameworks & law':['EU AI Act','GDPR','NIS2','DORA','JSP 936','JSP 440','NIST AI RMF','ISO 42001','NATO AI','AUKUS','Five Eyes'].map(function(x){return [x,'framework'];})
};
Object.keys(kids).forEach(function(h){ kids[h].forEach(function(c){ N(c[0],c[1],5); L(h,c[0]); }); });
[['EU AI Act','NIST AI RMF'],['NIST AI RMF','ISO 42001'],['EU AI Act','ISO 42001'],['EU AI Act','GDPR'],
 ['Finance','DORA'],['Finance','Coinbase'],['Healthcare','GDPR'],['Defence','JSP 936'],['Defence','JSP 440'],['Defence','NATO AI'],['Defence','AUKUS'],['Defence','Five Eyes'],
 ['OpenSky','airspace-monitor'],['ADS-B','airspace-monitor'],['MarineTraffic','mitre-atlas'],['USGS','care-membrane'],['Copernicus','Space'],
 ['gov-crosswalk','EU AI Act'],['gov-crosswalk','NIST AI RMF'],['gov-crosswalk','ISO 42001'],['gov-crosswalk','NIS2'],
 ['SIGIL','Ed25519'],['audit-logger','SIGIL'],['agent-identity','DID'],['care-membrane','GDPR'],
 ['Cyber','owasp-agentic'],['Cyber','cybersecurity-ai'],['Cyber','mitre-atlas'],['Cyber','NIS2'],
 ['Space','Copernicus'],['Defence','drone-governance'],['Defence','defence-bft'],['Transport','OSM'],['Energy','NIS2'],['Insurance','DORA'],['Legal','EU AI Act'],['Manufacturing','firmware-attest']
].forEach(function(p){ L(p[0],p[1]); });

const el=document.getElementById('graph');
const Graph=ForceGraph()(el)
  .backgroundColor('#05060d')
  .graphData(G)
  .nodeRelSize(5)
  .nodeVal(function(n){return n.val;})
  .linkColor(function(){return 'rgba(201,168,76,0.16)';})
  .linkWidth(0.6)
  .linkDirectionalParticles(0)
  .nodeCanvasObject(function(n,ctx,scale){
    const r=Math.sqrt(n.val)* (n.group==='core'?2.4: n.group==='domain'?1.9:1.5);
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI);
    ctx.fillStyle=COL[n.group]||'#888'; ctx.shadowColor=COL[n.group]||'#888'; ctx.shadowBlur=n.group==='core'?16:(n.group==='domain'?8:4);
    ctx.fill(); ctx.shadowBlur=0;
    if(n.group==='core'||n.group==='domain'||scale>1.6){
      ctx.font=(n.group==='core'?'600 5px':'500 3.4px')+' Inter, sans-serif';
      ctx.fillStyle=n.group==='core'?'#fff':'#cfd6ee'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(n.id, n.x, n.y+r+1.5);
    }
  })
  .onNodeClick(function(n){
    const links=G.links.filter(function(l){ return (l.source.id||l.source)===n.id || (l.target.id||l.target)===n.id; })
      .map(function(l){ var a=(l.source.id||l.source), b=(l.target.id||l.target); return a===n.id?b:a; });
    document.getElementById('infoBody').innerHTML='<h3>'+n.id+'</h3><div class="g">'+(seen[n.id]||'')+'</div>'+
      '<div class="lk"><span>connects to ('+links.length+'):</span><br>'+links.join(' · ')+'</div>';
    document.getElementById('info').style.display='block';
    Graph.centerAt(n.x,n.y,600); Graph.zoom(2.2,600);
  });
Graph.d3Force('charge').strength(-90);
window.addEventListener('resize',function(){ Graph.width(window.innerWidth).height(window.innerHeight); });
Graph.width(window.innerWidth).height(window.innerHeight);
setTimeout(function(){ Graph.zoomToFit(600,80); }, 800);
</script>
</body>
</html>
