<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOK Cross-Domain Navigation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy-dark: #0d0c18;
    --navy-mid: #1a1730;
    --navy-light: #231f3e;
    --gold: #c9a84c;
    --gold-hover: #e8d28a;
    --gold-dim: rgba(201,168,76,0.15);
    --text-light: #f0ece4;
    --text-muted: #a098b0;
    --text-dim: #605870;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }
  body {
    font-family: var(--font);
    background: var(--navy-dark);
    color: var(--text-light);
    line-height: 1.5;
  }
  /* ===== NAV BAR ===== */
  .nav-bar {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);
    border-bottom: 2px solid var(--gold-dim);
    padding: 0.75rem 0;
    position: relative;
    z-index: 1000;
  }
  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  /* Logo */
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: var(--text-light);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }
  .nav-logo svg { flex-shrink: 0; }
  .nav-logo .gold { color: var(--gold); }
  /* Nav links */
  .nav-links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.25rem;
  }
  .nav-links a {
    display: inline-block;
    padding: 0.4rem 0.85rem;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    border-radius: 6px;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .nav-links a:hover,
  .nav-links a:focus {
    color: var(--gold);
    background: var(--gold-dim);
    text-decoration: none;
  }
  .nav-links a.active {
    color: var(--gold);
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.25);
  }
  /* Domain badge */
  .domain-badge {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    margin-left: 0.3rem;
    vertical-align: middle;
  }
  .domain-badge.meok { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.2); }
  .domain-badge.proof { background: rgba(100,200,255,0.12); color: #64c8ff; border: 1px solid rgba(100,200,255,0.2); }
  .domain-badge.csoai { background: rgba(100,255,180,0.12); color: #64ffb4; border: 1px solid rgba(100,255,180,0.2); }
  .domain-badge.cobol { background: rgba(255,200,100,0.12); color: #ffc864; border: 1px solid rgba(255,200,100,0.2); }
  .domain-badge.fleet { background: rgba(200,130,255,0.12); color: #c882ff; border: 1px solid rgba(200,130,255,0.2); }
  /* Divider */
  .nav-divider {
    width: 1px;
    height: 1.5rem;
    background: var(--gold-dim);
    margin: 0 0.25rem;
    flex-shrink: 0;
  }
  /* Mobile hamburger */
  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    color: var(--gold);
    padding: 0.4rem 0.6rem;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
  }
  .nav-toggle:hover { background: var(--gold-dim); }
  /* Responsive */
  @media (max-width: 768px) {
    .nav-toggle {
      display: block;
    }
    .nav-links {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: stretch;
      gap: 0.15rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--gold-dim);
      margin-top: 0.5rem;
    }
    .nav-links.open { display: flex; }
    .nav-links a {
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
    }
    .nav-divider { display: none; }
  }
  /* Optional inline embed style for seamless integration */
  .embed-mode {
    background: transparent;
    border: none;
  }
  .embed-mode .nav-bar {
    background: transparent;
    border-bottom-color: transparent;
  }
</style>
</head>
<body>
<nav class="nav-bar" role="navigation" aria-label="MEOK Cross-Domain Navigation">
  <div class="nav-container">
    <!-- Logo -->
    <a href="https://meok.ai" class="nav-logo" target="_top" rel="noopener">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="6" stroke="#c9a84c" stroke-width="2.5" fill="none"/>
        <path d="M10 16 L14 20 L22 12" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>MEOK <span class="gold">Ecosystem</span></span>
    </a>

    <!-- Hamburger -->
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
        <line x1="1" y1="2" x2="17" y2="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="1" y1="7" x2="17" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="1" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Links -->
    <div class="nav-links" id="navLinks">
      <a href="https://meok.ai" target="_top" rel="noopener">
        meok.ai
        <span class="domain-badge meok">OS</span>
      </a>
      <a href="https://proofof.ai" target="_top" rel="noopener">
        proofof.ai
        <span class="domain-badge proof">MCP</span>
      </a>
      <a href="https://csoai.org" target="_top" rel="noopener">
        csoai.org
        <span class="domain-badge csoai">Council</span>
      </a>
      <a href="https://cobolbridge.ai" target="_top" rel="noopener">
        cobolbridge.ai
        <span class="domain-badge cobol">COBOL</span>
      </a>

      <span class="nav-divider"></span>

      <a href="https://meok.ai/fleet" target="_top" rel="noopener">
        Fleet
        <span class="domain-badge fleet">MCP</span>
      </a>
    </div>
  </div>
</nav>

<script>
(function() {
  var toggle = document.getElementById('navToggle');
  var links = document.getElementById('navLinks');
  if (toggle && links) {
    toggle.addEventListener('click', function() {
      var expanded = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', expanded);
    });
    // Close nav on link click (mobile UX)
    links.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
  // Highlight current domain
  var currentOrigin = window.top ? window.top.location.hostname : window.location.hostname;
  var navLinks = document.querySelectorAll('.nav-links a');
  navLinks.forEach(function(link) {
    try {
      var linkHost = new URL(link.href).hostname;
      if (currentOrigin === linkHost || currentOrigin.endsWith('.' + linkHost)) {
        link.classList.add('active');
      }
    } catch(e) {}
  });
})();
</script>
</body>
</html>
