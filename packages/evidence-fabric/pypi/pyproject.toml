[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "csoai-evidence-fabric"
version = "0.1.1"
description = "csoai.evidence-event/0.1: one evidence event rendered as OCSF 1.9, OTel gen_ai.evaluation.result, SARIF 2.1.0, in-toto, ECS/HEC and W3C ACR v0.1, with an offline Ed25519 verifier. States, never grades."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "CSOAI Ltd"}]
keywords = ["ocsf", "opentelemetry", "sarif", "in-toto", "ecs", "evidence", "ed25519", "ai-evaluation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
validate = ["jsonschema>=4"]

[project.urls]
Homepage = "https://councilof.ai/connect/"
"Signing key (DID)" = "https://csoai.org/.well-known/did.json"

[project.scripts]
csoai-evidence = "csoai_evidence_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csoai_evidence_fabric = ["schema/*.json", "vendor/*"]
