name: "Verify signed measurement card"
description: "Verify a local GSPC measurement card under the pinned Council of AI key. Three states; measurement, not certification."
author: "CSOAI Ltd"

branding:
  icon: "shield"
  color: "green"

inputs:
  artifact:
    description: "Local path to one regular JSON measurement card (maximum 1 MiB). URLs are not fetched."
    required: true
  fail_on_mismatch:
    description: "Fail the step for INVALID or UNCHECKABLE. Set false only to inspect the verdict without gating."
    required: false
    default: "true"

outputs:
  content_id:
    description: "Legacy compatibility output: verified only for VALID; otherwise unverified."
    value: ${{ steps.verify.outputs.content_id }}
  verdict:
    description: "VALID, INVALID, or UNCHECKABLE."
    value: ${{ steps.verify.outputs.verdict }}
  id:
    description: "Verified card id when VALID; otherwise a stated id only when exactly 64 hexadecimal characters."
    value: ${{ steps.verify.outputs.id }}
  code:
    description: "Machine-readable verifier result code."
    value: ${{ steps.verify.outputs.code }}
  reason:
    description: "One-line explanation of the result."
    value: ${{ steps.verify.outputs.reason }}

runs:
  using: "composite"
  steps:
    - id: verify
      name: Verify the local card against the pinned profile
      shell: bash
      env:
        CSOAI_ACTION_PATH: ${{ github.action_path }}
        CSOAI_ARTIFACT: ${{ inputs.artifact }}
        CSOAI_FAIL_ON_MISMATCH: ${{ inputs.fail_on_mismatch }}
      run: node "$CSOAI_ACTION_PATH/run.mjs"
